 下雨與否, 衣服濕透與否, 對我而言又有何分別呢 ?\"", "他拿出那準備好的莎麗, 問道: \"您如何知道我早已準備好這莎麗呢 ?\"", "我回答道 : 心中有愛時, 你就知道所有的事. 愛給你眼睛、耳朵, 和所有的力量(power).", "註一: sanyasi 指印度婆羅門中, 已到達最後階段的修行者(托缽者). 他們將不再輪迴, 而是要回到大梵. 註二: 在印度, 人們只會給 sanyasi 或是婆羅門東西, 而不會從這兩種人那裡拿任何東西. 註三: 1984-08-14。"]}, {"num": "10-3", "catTitle": "心輪", "catNum": 10, "title": "如何表達同情心及慈悲關愛之心", "paragraphs": ["練習者問：當其他的練習者有困難時，我們應該如何表達我們的同情心 (sympathy)及慈悲關愛之心 (compassion, 註一) ?", "Shri Mataji : 假如你的朋友的丈夫去世了，她哭得很傷心。妳去看她，陪伴在一旁哭，甚至哭得比她還大聲。不明瞭的人可能會問：\"是妳還是她的丈夫去世呢？ \"，妳答道：\"我只是表達我的同情心! \"，這種同情只是\"嘴巴同情\"或\"眼淚同情\"罷了！", "如何才是感同身受的同情(heartfelt sympathy)呢？你不應該伴哭，你應該發出相反的力量，來使你的朋友脱離這悲傷的情懷。你應該說：\"人有生必有死，這就是人生。夫妻兩人也很少一同過世，你先生只不過是先走而已。假如妳哭得這麼傷心，妳先生是不會平靜的，他可能在此徘徊不肯離去，或堅持等妳一起走，所以妳哭對他並没有好處\"，妳應該對妳先生說：\"我很好，不要擔心我，我已得到自覺，你應該去獲得你的自覺，如同我一般。\"------這才是真正對朋友有助益的。", "至於慈悲關愛之心則完全不同。它不需要說什麼，它只是流動。......慈悲關愛之心就這樣安撫你、療癒你，這是同情心無法所及的。慈悲關愛之心是一種温柔、美麗的安撫------來自愛的觸摸，也是一種保護------來自神聖的力量(Divine)的保護。這種慈悲關愛之心你也可以做到！當另一個練習者遭遇困難時，你如何幫他呢？你知道練習者的問題只有兩種：一種來自左脈，另一種來自右脈。若他的問題來自右邊，你就幫他鞋打。若是來自左邊，你就給他一個靈體保護，或是用燒紙法幫他。你不需要去看他，也不用講什麼，更不用告訴他你做了什麼。這慈悲關愛的力量自然就會這樣流動，自然而然去達成它的功效。所以最好的幫助並非直接的，而是間接去做，只要把你的注意力(attention)放在那裏即可。你的注意力是非常活潑有力的，它是你自覺之後所擁有的能力(power)。帶著關心，將注意力靜靜地放在你想幫助的人，而不用去介入，你只是一個靜觀者(witness)，這就是所謂真正的慈悲關愛之心！這絕對會有成效的。", "但是最重要的是你要潔淨清理你的注意力。假如你的注意力十分鬆散，你和神聖的力量(Divine)的連結又不是很好，那麼就不會有什麼作用。", "註一：Shri Mataji 常用的compassion 是指一種慈悲關愛之心。 註二: 1987-04-08。"]}, {"num": "10-4", "catTitle": "心輪", "catNum": 10, "title": "對家人的愛", "paragraphs": ["觀眾問：我參加(上次的)介紹講座，我感受到一種無以倫比的覺知與成長，我也感到我對我家人巨大的愛，但我也同時感覺到似乎我將和他們分開，好像我會逐漸地離他們而去。(譯者：這位觀眾覺得她似乎跨進了另一領域，好像會因此和家人疏離)", "Shri Mataji 答：不，一點都不會，妳不會和他們分離，妳(永遠)是你家庭的一部分，但是妳(再也)不會陷溺在家庭的關係之中，這是重點！事實上，許多家庭反而因為有成員學習了霎哈嘉靜坐而重歸和好。在英國有一些練習者在參加了霎哈嘉之前是嬉皮，學習了靜坐之後又重新回到他們父母親的身邊，原本他們都不和父母往來的，甚至他們也帶父母來學靜坐。所以妳不必因為有這些體驗而有不必要的擔心。例如我們有一位原本是嬉皮的練習者，在得到自覺之後變得一切都很正常，也變成一位很好的人。他(重新)回去以前的家庭，他的父親成天喝酒，他擔心他父親將因酗酒而喪命，他勸他父親：\"不要再喝了！最好你來學靜坐，一旦你的昆達里尼升起來，你就不會再喝酒了。\"，他的父親答道：\"但是我喜歡喝酒啊！\"，所以他趁他父親出外喝酒時，將家中所有的酒瓶、酒杯全都打破，當他父親返家看到這一切時非常生氣，這位練習者不動聲色，只是笑笑地說：\"(你想喝的話)，可以去外面買啊！\"，但他的父親已醉得無力外出買酒了！就這樣逐漸地，他父親也覺察到來自家庭的抗議，也了解家人不喜歡他飲酒的習慣。最終他戒酒了，也變成一位霎哈嘉練習者。", "所以你必須去糾正(你的家人)，但是若你陷入家庭的關係之中，你可能不願意去糾正(其他的家人)，因為你害怕失去自己的小孩、親人。這種並不是愛，愛(一個人)必須去修剪他，愛(一個人)必須去糾正他，但是當然以一種不要太過強制、侵犯的方式去做，而是以一個簡單的方式。前面提到的那位父親，假如你不去糾正，他會因酗酒而喪命，所以真正的愛是不去縱容(你的家人)，而是將他當成一個原原本本的人，你可以看著他逐漸地變好，你可以去享受這過程中的點點滴滴。但是假如你陷溺在家人的關係之中，你可能變得自私，或只是表現出自己的佔有慾而已。但假如你不陷溺在家庭的觀念之下，你可以更看清楚自己、更看清楚家人，如此你對家人的愛反而會更多。家人之間必須有一些距離，如此真正的愛才可以運作流通。", "當你可以從家庭的關係中抽離出來(detached)，你可以很清楚看到全貌，你也可以更享受家人的愛，因為在此狀態下你才可以看清楚愛，否則你是無法看清楚愛。當你陷溺於其中，你是很難看清楚的。", "假如你陷在家庭的關係之中，(而不去做必要的糾正)，你的家人會沈淪，你也會跟著完蛋。所以你得到自覺是非常好，你可以用更好的方式來愛你的家人，以一種更有意義、更正確的方式來愛你的家人。愛應該是滋養對方，而不是毀滅對方。我們在社會上看到的所謂愛小孩，往往只是溺愛他們、寵壞他們。假如你愛你太太超過一個界限，那她會變成一個潑婦。假如你愛你先生超過限度，那他可能變成酒鬼。正確的愛絕對會去糾正對方的。像在英國有的婦女說：\"因為我愛我的丈夫，所以我讓他去做他喜歡的。假如他想有個情婦，那就讓他有個情婦，因為我是愛他的！\"，這種以愛為名，而没有任何自尊的行為，其實是非常荒謬的。", "註一： 1985-03-17。"]}, {"num": "10-5", "catTitle": "心輪", "catNum": 10, "title": "心的四條經脈，神的知識，涅盤(上)", "paragraphs": ["心(heart)是靈(Spirit)的住所，靈就是住在我們内裏的濕婆神(Shiva)，我們必須多知道一些有關心的種種，這是非常重要的。", "我們内在的精微系統有左、右、中三脈，但在心有四條經脈(nadis)。這四條脈通往四個地方，當你超越了你的分際(maryadas)時，你就會走向毀滅。所以在這四個方向，已埋藏了可能的毀滅。這就為什麼有人也把濕婆神稱為毀滅者。其實是人自己走向毀滅的，是人自己尋求毀滅而獲致毀滅的。", "心的四條脈之一是走向根輪(Mooladara, 譯者：Shri Mataji 此處是指\"性\")，假如人超越了性應該有的分際，那麼就會走進地獄。我們如何避免因性而走向毀滅呢？濕婆神的一個特質即是\"純真\"，祂就如小孩子一般純真。所以我們可以將肉體的慾望溶化在純真之中、在純真的海洋之中。純真是讓我們欣賞、理解與享受的。你看，動物是純真的，小孩子是純真的，花朶也是純真的。我們應該將我們的注意力轉移到這些純真的小孩子及動植物，這就為什麼我說走路時，你的目光應在三呎高之下，在這三呎高之下，你可以看到美麗的花朶、草地及可愛的小孩，你不需去看三呎高之上的人們，目光在三呎高之下，你只會看到大人的腿，而不會看到他們不純真的眼神。", "克里希納(Shri Krishna)有一萬六千零五個妻子，但他在性方面卻是完全純真的(請看註一，本譯文不再重述此故事)。所以我們住在這世上，不論你是妻子或丈夫，不論是否結婚，你可以是純真，在根輪保持完全純真，這純真是你純潔的一個表徵。", "心的第二條脈是通往欲望(desire)，這欲望也可能把你帶向毀滅，這就是為什麼佛陀(Buddha)說人要無欲。欲望表示 \"我要這個東西\" ，欲望也不只針對物質的東西，它也包括心智上的佔有，如 \"我要擁有這個女人\"、\"我要擁有這個小孩\"。想擁有許多東西是來自你的欲望，當你擁有更多的東西，你並不會因此感到快樂或滿足，因為這些欲望都不是純潔的欲望。這欲望是可能走到極端，就像海珊(Saddem Hussein), 或希特勒(Hitler)，他們就是人的欲望走到超越極限的例子。", "對於人的欲望，我們可以做什麼呢？我們可以將對物質的欲望轉移到美麗的物品，即我們來擁有真正有美感的東西。正是濕婆神賜予萬物以美感，濕婆神的工作就是祂美化了梵天婆羅摩(Bramadeva)所創造的、毗濕奴(Vishnu)所演化的萬物。是濕婆神來做這賦予美感的精微工作，使萬物更美麗，更令人賞心悅目，這正是濕婆神的特質。所以當你有欲望，希望擁有某樣東西，你可以去尋找有美感、手工製作的產品。逐漸地你會發覺你最終是找到有能量(vibrations)的物品，因為所有有美感的物品都是有能量的。你必須有純潔的欲望才可能追尋到有能量的物品。若你如此做，那些令你瘋狂的物欲會逐漸變成純潔的欲望，你會開始只希望買有能量的東西，你不再買沒有能量的東西，甚至你不想和一個没有能量的人談話。 假如你繼續追求你那些不純潔的欲望，那你最終是走入毀滅，但說濕婆神是毀滅者只是講對了一半(註二)，祂也給你能力(power)去追求能量(vibration)。", "註一：請看克里希納(Shri Krishna)完整的故事譯文：11-3\"一個有關完全抽離、不沾染 (detachment) 的故事\"。 註二：此談話中，Shri Mataji 亦談到：濕婆神代表毀滅者是有另一個含義，花朶被摧毀了，是為了果實的到來。在霎哈嘉中，你的制約、自我、種族偏見、教義狂熱等等都會被摧毀，這是為了那美麗的成果(譯者：即自覺)的到來。 註三：由於文長，所以分成上下。1991-02-16。"]}, {"num": "10-6", "catTitle": "心輪", "catNum": 10, "title": "心的四條經脈，神的知識，涅盤(下)", "paragraphs": ["連接心的第三條脈會讓人感到執着(attachment)，即對某人有執着之心，例如 \"這是我的小孩\" 、\"這是我的丈夫\" 、\"這是我的家人\" 等等。即對周遭親人，我們有一種特別眷戀執着的心理。許多剛來到霎哈嘉的練習者也是一樣，他們談到的、關心的都是他們的家人。這些都是有限制的愛(limited love)，有限制的愛會導致毀滅，如只溺愛自己小孩的父母最終寵壞了自己的小孩，發覺自己的小孩變成冥頑不靈的魔鬼。我常用大自然的例子來說明這個道理：假如樹汁只集中供應樹木的一小部份，如其上的一朶花，那麼不只這朶花無法負荷，整棵樹木也會死亡。", "什麼是避免因執着的愛而走向毀滅的答案？即是無所限制的愛(unlimited love, 譯者：指不執着於少數親人的愛)。愛代表藉著糾正你、滋養你，來帶給你福祉。濕婆神正是希望帶給你福祉，所以當你以愛來照顧他人的福祉時，你的整個生命都會改變，你會真正去享受它，因為你和許多人合而為一。你關心許多人、許多家庭、許多事物，你感覺到你與眾人成為一體。當你把有限的執着溶入這無限的愛的海洋之中，你才可能與眾人合而為一。", "第四條連接心的經脈是最重要的一條，它從心往上，經左喉輪到寬恕輪。寬恕輪有四瓣，當這四瓣打開時，你就進入turya的狀態，即無思慮的覺知狀態。除非這四瓣打開，不然人會再下墜，或去做不應該做的事，因為他們還不了解上帝是什麼。當你没有思慮時，你必須是純真的，你必須是有能量(vibration)，你也不可能執着在任何人。當這四瓣打開時，你會擁有真正的知識(true knowledge)、純粹的知識(pure knowledge)。這不是有關輪穴的知識，也不是有關能量或昆達里尼的知識。而是有關全能上帝(Almighty God)的知識，即你知道上帝是什麼。你知道全能的上帝知道一切、做所有的一切、也享受萬事萬物，你再也不用去懷疑任何事、不用去分析任何事。這種理解並不是從頭腦而來，而是從你的心(heart)開始，然後再覆蓋到你的頭腦(brain)。我們可以說來自你(的心)對喜樂的經驗的種種覆蓋了頭腦，你的頭腦再也無法否定它，或說猶如你的虔信(bhakti)的香膏完全覆蓋了你的頭腦。這過程並不是從頭腦開始再到你的心。所以我為什麼時常說你們要打開你們的心，因為這是從心開始的。", "當你處在此一狀態時，你會知道有關上帝的知識，你知道祂是愛，祂是真理，祂知道一切，這種理解完全變成你的一部分，此時你就達到涅盤(Nirvana)的境界。 在其他的普祭，我們唸誦許多贊頌(mantras)，又做這個那個。但是在濕婆神的普祭，我們只是要知道這個知識-----即有關神的知識。當你知道神是什麼，這本身就是一項很大的成就。當你知道什麼是全能的上帝，這會帶給你美妙的順服，在順服裏，你處在愛的大海之中，你有十足的安全感。我希望你們都可以到達這個境界。", "註一：由於文長，所以分成上下，請先看(上)。1991-02-16。"]}, {"num": "10-7", "catTitle": "心輪", "catNum": 10, "title": "明辨力與心輪(之四)", "paragraphs": ["每一個人都把\"愛\"掛在嘴邊，愛這個、愛那個，尤其在西方世界(在印度就不會這樣)，但是其實没有任何愛。但是對錢財、對權位，人們倒是愛不釋手，這些都不是純粹的愛(Nirvaj, 即 pure love)。", "我是你的導師，(在求道的路上)你必須以個人的身份來面對導師，而不是將你的家人、叔叔阿姨、甚至祖父母等等所有的親戚都帶到霎哈嘉來。當你面對你的導師時，你必須有這個明辨力，這在霎哈嘉是非常重要的。 (譯者：將家人親戚帶進來霎哈嘉(尤其指希望霎哈嘉解決親人的問題)，在許多人看來是愛(心輪)的自然表現，但Shri Mataji 認為過度這樣做其實會帶給霎哈嘉很大的困擾，也表示你無法走出家庭的執着，所以是沒有明辨力的行為。)", "假如經由你的心輪，你被某些人所吸引，或所謂的魅力或其他有的沒有的(譯者：指儀表、容貌等)吸引了你，這都表示你被某些非常表面的(superficial)東西所抓住，那些表面的東西其實没有任何重要的本質(gravity)在裏面。所以心輪的明辨力應該是：你和任何人的關係都是一種抽離的、没有執着(detached)，如此你的愛就可以滋養萬事萬物。(譯者：即不會因某人的某些表面的特質而被吸引，以致於特別喜歡他。)", "有些人的愛執着在丈夫，有些人執着於小孩，有些人只關愛狗，或只是植物，這些都是非常没有明辨力的！你應該將你的關愛均分到萬物。或許應如此說：你應該如此地没有任何執着，以致於你對每一個人的關愛都是完全相同的。没有執着(detachment)表示你靜觀萬物，但你和任何人(或物)都沒有特別的牽扯，你是抽離在外。你只是靜靜地看著，你是一個旁觀者(witness)。假如你對每一個人都有此種的愛，那麼你將會因此種特質而大大地被祝福。", "註一： 1991-04-28。"]}, {"num": "11-1", "catTitle": "喉輪", "catNum": 11, "title": "錫呂瑪塔吉談如何改善左喉輪", "paragraphs": ["你必須要靠你自己來改善左喉輪(Lelf Vishuddhi) ，這件事情是我無法幫忙的。左喉輪阻塞是一個很難處理的狀況，因為這種人會變得十分敏感，你給他忠告、想幫助他，他反而變得愧疚感(guilty)更深，阻塞更嚴重，所以我已不再這樣做了。", "首先，當你犯錯時，要面對這錯誤，而不是如同過去一般只感到愧疚---只是逃避到愧疚感的安樂窩。感到愧疚只是一種很廉價的逃避，並不是真正的面對自己的過錯，那只是會使左喉輪阻塞更嚴重而已！不要感到愧疚，而是告訴自己絕不再犯相同的過錯，並給自己一個懲罰。即你必須發揮 Vishnumaya 如閃電一樣的力量( power)，給自己一個震撼(shock)。你必須懲罰自己，罰自己不能做一件自己喜歡的事。例如喜歡吃的人可以行一天的禁食來懲罰自己。你必須要嚴厲對待自己，如此才可能改善你的左喉輪。", "第二個方法即是靜坐。左手向相片，右手貼地來清潔你的左脈。也可以對左喉輪做靈体保護(bandhan)，或用燭火來清潔左喉輪也會有幫助。但是你必須從你的內心深處真誠來做，否則這些只是一種儀式而已。先面對自己的錯誤，再來做這些。", "你們要處在中脈，不要離開中間跑到左邊的愧疚感。觀看自己、面對自己，必要時給自己一個震撼來改善自己。只有能如此做的練習者才會昇進。", "註一: 1985-09-01."]}, {"num": "11-2", "catTitle": "喉輪", "catNum": 11, "title": "錫呂瑪塔吉談 Vishnumaya 及左喉輪", "paragraphs": ["Vishnumaya 是克里希納（Krishna）的姊妹，衪代表的是家庭之中姊妹的力量。Vishnumaya 是主掌左喉輪(Left Vishuddhi ) 的神祇， Vishnumaya 的力量則是用來保護人們的純潔高尚（chastity，見註一）的特質。純真(innocence)是一種內在的特質、一種內在的力量；經由純真而表現在外的品格特質即是＂純潔高尚＂(chastity)。這純潔高尚正是一切正法（Dharma）的基礎，沒有這根基，一切的正法都沒有存在的可能。", "正是這個純潔高尚的特質告訴我們行為應該有的分際（maryadas），是它劃定了我們行事的界限。我們可以說 Vishnumaya 是一種限制的力量，衪控制我們的自我(ego)及非我(superego) ，使人的行為在一個正常的規範之內。在西方世界，由於弗洛依德(Frued)及一些奇怪人物的錯誤理論挑戰了 Vishnumaya，使得人與人之間的正常關係與規範受到破壞，換言之，Vishnumaya 完全生病了，所以才會衍生出許多奇怪的現象（註二）。當人失去了純潔高尚的特質時，他的左喉輪就阻塞了。即使表面上他認為他沒有做錯任何事，但內心最深處他知道這是不對的，於是愧疚感(guilty)就產生了。例如一個人去偷東西，那當下他會知道這是錯的，這即是無所不在的力量(unconscious)經由 Vishnumaya 發出來的一種如閃電般的衝擊(shock) ，讓他知道這是錯的，此時他的左喉輪就阻塞了。", "一旦你的左喉輪有阻塞，所有左邊的輪穴都會變弱，因為這＂純潔高尚＂正是所有輪穴的基礎。", "當你發現左喉輪有阻塞，除了知道自己有愧疚感外，更應該去深究自己是犯了什麼錯誤？是跨越了那些界限？觸犯那些道德規範？或有那些行為抵觸了上天？一個真正的霎哈嘉練習者是不能有左喉輪的問題，這阻塞會妨礙你的昇進。", "人犯錯後最重要是面對它，承認自己錯了，說對不起；而不是嘗試去解釋、去辨白。一旦你開始為自己辨白脫罪，你的左喉輪就會更膨脹為一大團，此時就很難去清除、去治療了！有句名言：犯錯的是凡人，能寬恕的是聖人(To err is human and to forgive, divine.) 。所以做為人類，犯錯並非什麼見不得人的事，但是你一旦為自己的過錯辨白解釋，就表示你不了解這最基本的道理：上天知道所有的事情。你如何能挑戰事實呢？如何能把黑的講成白的呢？當你繼續犯錯、繼續解釋，有一天 Vishnumaya 再也無法忍受你的愚蠢時，衪就會將這一切揭發曝露出來。很多公眾人物突然醜聞曝光，瞬間名譽掃地，這就是 Vishnumaya 展現其威力，將一切都曝露出來。", "其實人類的某些行為也正因為他有很嚴重的左喉輪阻塞。如愛現(show-off) 、愛搗蛋、高傲的個性、愛眨抑他人、喜歡譏諷他人等等，這些都來自左喉輪的阻塞。只因為他想克服他內在的愧疚感，所以他表現出這些行為，但是這些行為又讓他有更大的愧疚感，讓他左喉輪的阻塞更嚴重。", "註一：Chaste (chastity)不只是指 \"貞潔\"而已，它有 \"潔淨無瑕、純正、高尚\" 的涵義，譯者認為用 \"純潔高尚\" 既包含 \"貞潔\"，也較接近此次談話所指的涵意，也較易了解全文。 註二：Shri Mataji 是指西方世界混亂的男女關係、性開放、變態性行為。 註三: 1985-09-01."]}, {"num": "11-3", "catTitle": "喉輪", "catNum": 11, "title": "一個有關完全抽離、不沾染(detachment)的故事", "paragraphs": ["有一天, 對岸的村莊來了一位知名的導師(Guru). 克里希納(Shri Krishna) 的皇后及嬪妃們(註一)想去向這位大師致意, 錫呂克里希納說: 妳們就去啊! 可是妻眾們走到河邊, 發現河水暴漲, 根本無法渡河, 於是返回向克里希納報告. 克里希納答道: 這個簡單! 妳們只要向河水說: \"假如克里希納是Yogeshwara(瑜伽之主), 他是一個獨身未婚者, 那麼就請河水退下! \" 妻眾們相視而笑, 滿臉盡是荒謬的表情. 克里希納但說道: 妳們就去試試看吧! 妻眾們到河邊, 半信半疑向河水重述了這個說詞, 那知瞬間河水就下降了! 妻眾們到達對岸向大師致意, 並服侍他許多美食. 吃罷, 談話畢. 她們向導師告辭, 走到河邊, 發現河水又已氾濫到岸邊, 只好回去問導師應如何. 那導師就問道: 早上妳們是如何渡河呢? 她們就將之前的故事, 一五一十重述一次. 這位導師笑道: 這個不難! 妳們只要向河水說: \"假如這位導師今天什麼都沒吃, 那麼就請河水退下! \" 妻眾們滿臉疑惑回到河邊, 重複大師的說詞, 但見河水又即刻退下. 當她們走過河床回首一看, 那位導師正站在對岸大笑道:", "**\" 這就是瑜伽之主全然不沾染的功夫! \"**", "錫呂瑪塔吉：到達這種境界的人，甚至他們吃東西時，他們也如同未吃，甚至他們是已婚有配偶，也如同單身未婚一般，因為他們已達完全抽離、完全不沾染的狀態。到達這種狀態的人，對於他們的行事與生活完全没有任何的依戀與執着。", "我無法說你們如何到達這種境界，但是在昆達里尼的幫助，及你自己靜坐的努力，及你的昆達里尼修補得更強大後，你就可以達到此境界。當你達到此境界，你會驚訝到自己對外物是如此地超然、不執著，你會驚訝到你從事任何工作時，也不覺得自己正在(費力)做此事，你可以處理很多事而又不覺得疲累。這是一種狀態，是你們必須去達成的。", "*說明一: 克里希納主掌喉輪, 祂是三大神祇之壹的毗濕奴(Vishnu)的降世. 喉輪的特性之一即是抽離、不沾染 (detachment), 這也是克里希納降世想給人類提昇的意識. 錫呂瑪塔吉多次以此故事來闡釋抽離、不沾染的狀態. 克里希納有眾多妻子, 但對祂而言, 祂卻仍然可保持猶如未婚的超然, 正如那位導師未曾沉溺在美食, 雖吃卻猶如未吃，即他們完全不執着在食、色的慾望上。*", "*說明二: 抽離、不沾染的相對即是執著、牽掛 (attachment). 錫呂瑪塔吉曾說許多霎哈嘉練習者結婚之後, 開口閉口都是\"我的小孩\", \"我的家庭\", 這就是執著、牽掛, 從此之後, 他們就迷失了.(見1988/08/06談話)*", "註一: 克里希納共有一萬六千零五位妻子, 五位是五大元素的化身, 一萬六千則是祂的16000力量(power)的轉世. 註二: 1982/08/15, 1984/08/18, 1988/08/06, 1993/12/11(即故事的部份)。文中後段則是來自1993-12-11。"]}, {"num": "11-4", "catTitle": "喉輪", "catNum": 11, "title": "明辨力與喉輪(之五)", "paragraphs": ["喉輪的明辨力是非常重要的。有一天有一個人來看我，她的右手都僵固了。我問她：\"你從事什麼工作？\"，她答道：\"我做秘書的工作，我需要打字，要打很多字！\" ，我說妳用霎哈嘉的方法，在妳打字之前，妳對妳的工作說 \"Namaskar\"(註一)，然後就好像妳並未工作一般，妳開始來工作。妳只是打字而已，就這樣，其實妳没有做什麼。", "常有人對我說：\"Shri Mataji！您飛行這麼多國家，(一定很辛苦！)\" ，其實我没有飛行，有時候我是坐著，有時候是走路，我没有飛行，是飛机在飛行，我只是坐在飛機上而已，我並非像超人一樣飛行，我只是舒適地坐在飛机上，我那有飛行呢？", "假如一開始我就認為：\"我必須飛行這麼多(國家)，我必須做這個、做那個\"。那麼有人會說：\"Shri Mataji，(您很辛苦)，您做好多事！\"，其實我什麼都沒有做！真的，我沒有做什麼事！", "現在我正在(對你們)演說，我只是說出來而已，並不是我在做這演講，這些話就(自然)從我的嘴巴出來，我就像收音機一樣。你們會說收音機正在做事、正在演說嗎？ 實際上我没有做什麼事。因為我没有做什麼事，所以我不會覺得疲倦，也不會耗損。", "正是這個感覺：\"我正在做此事、那事\"，在你的裏面產生出你的自我，這自我是一個麻煩，我們必須將明辨力置於自我之上，用明辨力將自己的自我压下來。假如一個人有太大的自我，那麼這個人的明辨力就會喪失。自我很大的人會認為：\"我完成了此事、完成了那事\"，那天他摔倒爬不起來，他才會突然省悟：\"我過去怎麼會這麼笨？有這麼大的自我？\"", "當你容許你的昆達里尼升起、從頂輪出來，此時你就完全抽離出來(detached)，並和大梵連接上，所有的事情就由大梵來負責成就，而你不用去做任何事。當你從做任何事、贊美任何事、貶低任何事、批判任何事等等抽離出來，你就在這花花世界中處於完全靜觀的狀態。", "註一：指我向你致敬、向你頂禮膜拜的意思，發音：那媽斯ㄎㄚˋ。 註二： 1991-04-28。"]}, {"num": "11-5", "catTitle": "喉輪", "catNum": 11, "title": "錫呂克里希納與無執", "paragraphs": ["關於無執着的狀態(detachment)，你隨時需要注意的是：你(每天)用\"我\"多少次？-------\"我\"看到這個、\"我\"享受這個、\"我\"這個、\"我\"那個、這是\"我\"的小孩、這是\"我\"的房子.......。當你用\"我\"太多時，就表示你不是處在無執着的抽離(detached)狀態。要試著去自己省察看看，你說多少的\"我\"------\"我\"必須將此工作做完、\"我\"必須做這個、\"我\"必須達成這個人生的目標.......，這些都是迷思。一旦你抽離出來，會是一種不同的境界。我指的是一種狀態，而不是你刻意去做倒立或什麼動作就可以達到此狀態，而是必須逐步成長來達到這種狀態。", "錫呂克里希納(Shri Krishna)的一生可以說是完全的無執與抽離，甚至當祂和亞周那(Arjuna)去打仗時也是如此，祂說：\"我只是幫你駕駛馬車，我不使用武器\"。在薄迦梵歌(Gita)中有記錄他們之間很有名的對話，戰爭即將進行，而祂卻對亞周那談哲學，我們是很難想像祂的抽離與無執。亞周那問他：\"我怎能去殺戮呢？對方都是我的親戚、我的老師、我的朋友，我如何能去殺他們呢？\"，錫呂克里希納答道：\"他們都已經(早就)死了！任何生命終就會死亡，所以你必須上戰場殺死他們！\"。錫呂克里希納並非在鼓勵暴力殺戮，而是說那些人是違反正法，他們是殘暴的人，他們已犯了許多罪，他們是需要被懲罰的，不論你殺不殺他，他們是猶如已死，並不是你殺人，而是上天要殺他們。", "亞周那接著問：\"假如是如此，為什麼你要我去上戰場，去造這些業(karma)呢？\"，錫呂克里希納用一個很善巧的方式來回答他：\"你去做你該做的事，而將你的業都放在我的蓮足(My Feet)之前\"。其實這是不可能的，只要你知道是你在做此事，不論是來自\"自我\"或其他，只要有這個\"我\"存在你之内，那麼你就造了業，是不可能將\"業\"放在錫呂克里希納的蓮足之前，由祂來承擔。正如一個謀殺犯殺了人，然後說：\"我將這一切放在神的蓮足之前\"，這當然不可能免去其惡業。其實錫呂克里希納的說法必須在你得到自覺後，你才可能明瞭。當你真正感覺到你没有在做任何事，此時你的行事作為變成\"不造業\"(akharma)，即是如同你没有做任何事，雖然你做了某事，但你不覺得你去做此事。例如有一次我要一位練習者去給某人自覺，他回來說：\"Shri Mataji，靈量上不來，這輪穴有阻塞，那邊有問題，所以靈量上不來\"。他就像一個第三者在講此事，雖然他是用他的手去提升那個人的靈量，但他不是說：\"我去提升他的靈量，但他的靈量上不來。\"(註一)", "註一：Shri Mataji在不同的談話提過這個例子多次，其大意是：雖然你是用你的手去提升某人的靈量，但其實不是你在做，是無所不在的力量經由你來提升他人的靈量，所以做此事時要儘可能保持抽離的態度，不要講：我提升了某人的靈量。 註二： 1993-12-11。"]}, {"num": "11-6", "catTitle": "喉輪", "catNum": 11, "title": "享受(Joy)與快樂(Happiness)", "paragraphs": ["錫呂克里希納(Shri Krishna)談到享受( joy，註一)，祂從未談到自我克制的苦行，祂從未說過你要拋棄你的家庭、抛棄你的小孩、拋棄所有的一切擁有，從未如此說過！祂說的是：你必須去享受！以抽離、無執的心來享受(enjoy with detachment)！對一般人而言，這是很難去理解，如何可以做到以抽離的心來享受呢？關鍵是：若你有種種的牽掛、執著(attachment)，那你是無法想去享受的。假如你對某人某物有任何的牽掛，那麼你是無法完全來享受他。我來舉一個簡單的例子，若你對你的小孩有種種牽掛，那你就會擔心他應該如此或不應該如此，你可能會不允許他外出或和某人交談等等，會有種種的規定限制，(如此不只你無法享受小孩的相伴與成長)，也不會帶給他任何的喜樂。但是假如你真正有上天的明辨力(Divine Discretion)，那麼你會知道你的小孩應該和誰交談、去那邊、做什麼娛樂等等，而且你也會看到他去享受這些。任何的牽掛與執著無法讓你看到人或物的全貌，假若你可以抽離出來，你就可以從一個較高的角度來看事物。而且當你抽離時，你也會變成無思慮的靜觀狀態(thoughtless awareness)。", "如我常說的例子，這些漂亮的地毯在我面前，假如它是我的，我會隨時擔心是否有人會弄髒它，或是有不好的事情發生，因為我是處在牽掛的狀態；但假如我放下這些牽掛執著，我只是看著這地毯，我會看到什麼呢？我將只是一種享受，享受這位藝術家傾注在這作品上的喜樂，這喜樂也會試圖反映在我身上，這享受會進入我裡面。當我們和人、物之間有牽掛執著時，(在順利的時候)從其中得到的將是快樂(happiness)，而不是一種享受，因為享受是單一的(single)，而快樂則是兩面的(double)，會有快樂的時候，也會有不快樂的時候。甚至當你試圖去享受，你仍然會想：是不是仍有一些不好的問題在哪邊？(這些牽掛會讓你無法來享受。)至於享受則是隨時存在的，它沒有任何限制，你只是融入這享受的海洋！這就是錫呂克里希納以前提出的想法，要來去除這些限制。", "註一：Shri Mataji用的\"joy\"這個字，並非慣用翻譯的\"喜樂\"，Shri Mataji常說 joy 和happiness (快樂)是完全不同的，但在中文含義中，喜樂和快樂並沒有太大的差異。依譯者的理解，Shri Mataji所稱的 \"joy'' 指的是：1.一種\"享受的心態\"(即是動名詞)，或是2. 這種心態下平靜舒服的感受(即是名詞)。不論是遇到困境或是順境，不論是碰到喜歡或是不喜歡的，都可以去欣賞眼前的這一齣戲，這種心態即是所謂的 joy，翻成\"享受\"是比較貼切。所以\"joy\"是單一的，任何狀況皆可享受，但是快樂與否則是依外境的順逆而定，是兩面的。 2001-04-07談話中的這一段亦表達此概念：''來享受一切的心態(sense of enjoyment) 會使你遠離所有種種的憂慮、所有麻煩的課題、所有你看到的困苦，所以一旦你學會如何來享受一切，你的生命可以變得十分有趣。而這個享受(enjoyment)的心態就是經由你的靈(Spirit) 來到你身上的。'' 註二： 1999-09-05。"]}, {"num": "11-7", "catTitle": "喉輪", "catNum": 11, "title": "宇宙大我(一)", "paragraphs": ["一旦你進入宇宙大我(Virata)，你所有的分離或差別的想法都會消失。你不再有任何種族、國籍、屬於那個城市或村莊等的觀念。在這個階段，你不屬於任一地方，你是屬於所有的地方。當你不再追求某一種特別的食物，當你不再特別喜歡某一種人，當你可以調適自己來融入各種處境、各種家庭、各種人群時，你就處在宇宙大我的狀態。你可以和酒醉的人相處，你可以和各式各樣的人相處，没有任何人或物會困擾你、會讓你感到不快，因為你已經處在宇宙大我的狀態，因為所有一切(稜角與污穢)都被宇宙大我吸收，以致於你沒有感覺到什麼。是宇宙大我忍受這一切苦楚，而不是你來承受。這是最佳的狀態，我希望你們都可以達到此境地。在這裡你變成全然的自由，再也沒有什麼可以吸引你、可以影響你。你擁有你的自尊，且理解到：你是一個霎哈嘉瑜伽士，你是和上天的大能相聯結，你是上帝國度中的一員。", "處在宇宙大我的狀態時，你再也沒有任何疑惑，因為你已是整體的一部分，而且你可以影響任何地方。這樣子的人不只到處都可以被人感覺到(他的獨特)，而且在任何地方也是最有影響力的人。", "要達到宇宙大我的狀態，每一個人應該要慢慢地、逐步地試著說、不斷地(對自己)說：", "這不是我的姊妹，這不是我的兄弟，所有人都是我的兄弟姊妹。我愛所有人如同愛我自己的兄弟姊妹。這不是我的家庭，整個的霎哈嘉才是我的家庭。這個東西不是僅屬於我而已，它屬於每一個人，每一個人都有權利(來使用它)。", "你的整個注意力必須像是如此，當你的想法及觀念開始如此成長，就是梵文所謂的\"vestiti tu sumestiti\"，即\"從個人到集體\"(from individual to collective)。擁有如此特質的人會是各種集體工作中最有效力、最有影響力的人。", "註一： 1992-08-16。"]}, {"num": "11-8", "catTitle": "喉輪", "catNum": 11, "title": "從錫呂克里希納談聰明與智慧", "paragraphs": ["人類最大的敵人是他的聰明才智（intelligence 或intellect，註一），因為人類的智力是如此有限，它又被極端地制約，而且它很自大，又十分盲目。至於智慧（wisdom，註二）則完全不同，你無法從學校或大學裏去獲得智慧。從何處可以獲得智慧呢？是經由你的靈（Spirit），你的靈會告訴你什麼是對、什麼是錯的完整概念。人的智力往往會接受錯誤的想法、觀念，往往是如此。人的智力並不是智慧，人們必須知道這一點，智力和智慧是兩樣不同的東西。", "錫呂克里希納以祂的外交機智著名，祂有神聖的外交手腕（divine diplomacy），這表示什麼呢？這說明祂非常聰明。若没有聰明才智，你無法做許多事。所以錫呂克里希納就是用祂的聰明才智(去做許多事)，祂是非常有力量，没有什麼東西可以主宰祂，甚至連祂的聰明才智也無法主宰祂，聰明才智是為祂所用。所以你們應該要(學習)去使用你的聰明才智，而非被你的聰明才智所主宰。人類往往是變成他的聰明才智的奴役，但錫呂克里希納則是祂的聰明才智的主人，祂用祂的智力來解決許多問題，祂為人所稱道的靈活外交手腕，正是利用祂的才智來為上天（Divine）服務。而祂內在的神性也無時不刻來幫助祂使用其才智，所以可以說祂是祂的聰明才智的主人。不只如此，祂也是祂的制約、情緒及身體的主人，及其他一切的主人。當你主宰你的智力時，你可以很明白看清楚你的腦袋及智力(所告訴你的一切)。你的腦袋有可能告訴你一些讓你感覺良好的想法，如 \"你是全世界最偉大的人\"；或它也可能告訴你 \"你是一個完全無用的人\"。這個腦袋會騎在你上面來欺騙你，但是你現在已是一個霎哈嘉瑜伽士，你可以不再讓你的腦袋來引導你，而是要由你的智慧來引導你。你有一個很好的工具來判斷，即經由生命能量（vibration）來分辨什麼是(對你)好，什麼是不好的。", "人的聰明才智是從何而來呢？我們需要從更精微的層面來探討。人的聰明是來自他的大腦變得較快速且活躍，我看過一些非常聰明的小孩，可是他們没有一點智慧，可以說他的大腦發展得較好，可能他有一個很聰明的母親及父親，他獲得很好的遺傳基因；也有可能是環境因素，例如從小讀很多書，在美國、英國即如此，他們讀很多書，什麼都讀，所以他們知道這個、那個，知道許多。你問他電腦，他也知道，有關機械的知識他也知道，政治事務也知道。這些都不是有關真理的知識，但因為他們知道很多，他們以為自己非常聰明。利用這些知識及活躍的腦袋，他們開始產生出一些聰明的構想，在美國尤其顯著，這些構想都指向如何從別人的口袋挖錢出來，如他們設計有生日的玩偶、為玩偶舉辦生日宴會、給寵物生曰禮物等等。", "此外，像好萊塢的影片工業，那些令人膽顫心驚的電影也都是這些聰明心智的產物。西方世界創造出來的商標、名牌及流行服飾等亦是相同的產物。這些人自以為聰明，為自己賺了許多錢，但這些創造對消費者、對社會都没有什麼好處。去追求流行、炫耀名牌的人，往往以為自己聰明、跟得上潮流，其實這都是被人牽著鼻子走、最没有智慧的行為。(註三)", "註一：譯者：intelligence 或intellect指的是人的才智、聰明，Shri Mataji 用此字表示的是我們俗稱的聰明、智力、頭腦，或腦袋、大腦等想出來的想法、構想。在此譯文中，譯者為行文流暢達意，交互使用上述幾個詞彙。 註二：Shri Mataji 談話中的wisdom (智慧)並非指比聰明更上一層、能談一點人生道理的聰慧，而是有特別的意思，是專指能知道什麼是對自己好的或不好(對的或錯的)的判斷力，而且其好壞的判定標準是針對自己的靈性，並非對自己的身體、自我或家人。例如去追求金錢、身份地位、名牌或尋歡作樂的人，以為這是對自己好，其實這只是滿足欲望、虚榮、非我或自我而已，這是没有智慧的行為，因為它們對你的靈性没有幫助，你的靈不會喜歡這些東西。 註三：最後這一段是譯者綜合Shri Mataji後段數十分鐘的談話，選其和前面談及智慧相關的文字濃縮翻譯而成的。 註四： 1994-08-28。"]}, {"num": "11-9", "catTitle": "喉輪", "catNum": 11, "title": "錫呂克里希納與正法及懲罰", "paragraphs": ["錫呂克里希納(Shri Krishna)是我們内裏非常重要的神祇，因為祂是毗濕奴(Vishnu)(的轉世)，毗濕奴是駐在幻海(Void)、臍輪(Nabhi)，正是祂(譯者：應該是指錫呂毗濕奴)產生我們内裏的正法(dharma)。假如錫呂毗濕奴被喚醒，祂會帶給你光，去除你的無明，去除你的黑暗面，你會開始看清楚任何帶給你毀滅的行為，就是這樣來建立(你内在的)正法。當然正法也是由十大導師(Ten Gurus)所建立，十大導師是以先知的身份來到地球，來教人們正法。所以錫呂毗濕奴加上十大導師，就是來建立人們内在的正法。", "但是當正法衰敗時，錫呂克里希納就降世在地球，來毀滅那些造成正法衰敗的人們，這就為什麼祂說：\"當正法沒落時，我就降世地球\"。祂也說：\"我保護聖人，而且我殺掉所有的魔鬼、撒旦及所有帶來毀滅的人\"，這些可以説是祂以錫呂克里希納的身份，在遠古以前所做的承諾。做為毗濕奴時，祂主要是扮演正法的給予者，但是祂的所有潛在特質，是在祂以錫呂克里希納的身份降世時才真正表現出來。", "錫呂克里希納的前半生是張顯出祂美麗的特質，即祂說你要像一個靜觀者(witness)來看外在世界的這齣戲(drama)。但是接下來，祂也殺掉那些壞人---那些試圖帶給上帝快樂子女麻煩的壞人，祂確定是一個會保護(好人)及殺掉邪惡力量的神祇。在祂當上國王之後，祂甚至殺掉祂的親舅舅，因為他舅舅是一個很壞的人。所以祂並不相信\"寬恕\"，基督及許多聖人都說要寬恕，錫呂克里希納是唯一說：\"我必須要懲罰(壞人)\"。", "濕婆神(Shiva)在過去甚至出於祂的純真，而給予惡魔(rakshasas)愛，給予他們祝福。但是錫呂克里希納一點都不相信寬恕，因為這也是重要的，必須有一個嚴苛的角色，有著嚴苛與堅決的信念，來主張：魔鬼就是魔鬼！魔鬼必須被殺掉！", "錫呂克里希納的一生殺了許多人，但這並不表示人們有權力去殺其他人。祂是錫呂克里希納，我們並不是，做為人類的我們必須去寬恕。一旦我們(選擇)寬恕，那麼我們的憤怒及報復的心態都交給了錫呂克里希納，祂會接手去處理。一旦你說：\"我原諒\"，那麼祂就接手了！因為祂不會原諒，所以假如確實應該去懲罰，祂就會接手處罰那些迫害聖人、毀滅正法的人。", "註一： 1993-08-15。"]}, {"num": "11-10", "catTitle": "喉輪", "catNum": 11, "title": "霎哈嘉瑜伽的政治學觀點", "paragraphs": ["人類在政治上也發展出兩種不同的理論，一種是偏向左邊的，另一種是偏向右邊的。偏向左邊的是民主政治。在民主体制下，個人(individual)是較重要的，每一個人可以做他喜歡的事，他有完全的自由去追求他所喜歡的，而且別人也不應該去阻止。所以結果就演變成個人可以割自己的鼻子、割自己的眼睛，大家忙著把自己的根基(root)割除. 因為個人就是至高無上，在此理念之下，集體(collective)完全喪失了。民主主義(democracy)變成了魔鬼主義(demonocracy)，每一個人都是魔鬼(demon)。", "和民主相對的則是比較有紀律、比較有侵略性、有較多的控制、比較右脈，我們叫它是共產主義。在這之下，個人受到較多的控制，因為強調集體(指國家、民族)，所以個人必須犧牲。在這種情形之下，個人反而變得比較脆弱(weak)。個人比較脆弱，那麼集體也不可能強壯。舉例來說，你看那些共產國家或回教國家出來的個人，一旦他們來到西方世界，一旦他們没有這些控制，他們反而比西方人喝更多的酒。他們在原來的社會只是因為恐懼，而偏向比較有紀律的右邊，但是他並不是真的較有紀律，他的内在並没有被轉化。他並不是真正如此，他並没有能力控制他自己。一旦有機會，他就會陷入其中(如酒醉)而摔倒。這就爲什麼我説共產世界的個人比較脆弱。", "強調個人主義、你可以盡情地做你喜歡的民主社會最終會走向頹廢墮落，因為個人並無能力去承擔這麼多的自由、權力與金錢。他們甚至無法承受愛與仁慈，他們也無法了解内在真正的平靜(peace)，因為他們只是一個個人-----與集體分離的個人。", "在霎哈嘉裏，人經由中脈而昇進，個人變成集體的一部分。當個人變成集體時，他會給集體帶來更大的力量，集體也反過來照顧、保護與引導這個個人。這就是霎哈嘉的政治學。個人必須在霎哈嘉裏變成集體的人格。當你行事如集體的一分子，你就與神聖的力量(Divine)合而為一。此時太陽也會照顧你，月亮也會照顧你，母親大地及所有的基本元素都會照顧你。祂們都會為你工作，你也會被完全保護與祝福，讓你能完全去享受這喜樂。", "註一： 1988-04-03。."]}, {"num": "11-11", "catTitle": "喉輪", "catNum": 11, "title": "喉輪與眼睛、舌頭、喉嚨", "paragraphs": ["眼睛(的能量)也是由喉輪(Vishuddhi Chakra)所供應，所以當你注視某物時，應該是要以非常純潔的目光。目光越純潔，則越能享受一切。假如你的目光不純潔，而是到處飄移，從這裡又到那裡，從那裡又轉到另一處，那麼你是違反你的正法(Dharma)，也違反你的演化流程(註一)。久而久之，有一天你可能會失明，你可能會有白內障，你可能會產生多種眼疾。對此，你們是要非常注意。", "喉輪也連結到舌頭(tongue)，舌頭是被喉輪照顧的。有些人有一種很不好的習慣，如突然間講一些不好聽的話、用一些不好的言語、用很不好的字眼來批評他人等等，這些行為對舌頭都非常不好，這些都是錫呂克里希納(Shri Krishna)不喜歡的。假如你用你的舌頭來對別人說嚴厲的話、冷嘲熱諷、用辱罵性的字眼等等，有一天你的舌頭會有一些狀況，我也不知道它會如何，它可能會變厚、可能會無法移動、可能會往內縮等等，這只有神知道(會發生什麼後果)。", "上述的問題都是生理方面，但是也可能會有精神方面的惡果，如你會不知道你在講什麼，或是你想如此說但卻講成其他的，這些都可能發生在你的舌頭，也極可能你會無法講話。假如你用你的舌頭來做這些壞事，用在錯誤的目的，任何惡果都可能發生。舌頭並不是要用來侮辱他人及種種的壞事。另外有一些人會試圖表現得特別親切、和善，又是這個那個的，而只是為了達成一些目的，這種行徑對舌頭而言也是非常危險的，你的舌頭可能會產生水泡，這些人和那些講嚴苛話語的人都可能導致癌症。", "有些人認為忍受一切就是好的，其實這是不好的！假如有人試圖欺压你，絕對不要隱忍，必須將它踢開，因為如果你忍受一切，你可能會跑到左脈，如此可能會得到可怕的疾病，如癌症。這樣子的人是可能得到癌症的！那些咄咄逼人、有攻擊性的人(當然)也會產生一些疾病，但是這些過度忍受型的人也會有麻煩的。", "所以你應該是處在中間平衡的狀態，不要去接受這些(压制)，假如有人辱罵你，你只要保持安靜，靜靜地看著對方，只要這樣就好。你知道他是一個笨蛋，但不必去接受這些責罵。假如你接受了，又成天在那邊為此哭泣流淚，那麼你是可能癌症上身的。面對這種人、這種辱罵，你應該要知道對方是一個傻瓜，你只需遠離他，那麼就不會有任何不好的事發生在你身上。", "喉嚨(throat)是非常重要的，我們應該要照顧它。那些大吼、嘶喊的人最終可能會失去說話的能力，可能因為喉嚨的問題而變得狂亂。喉嚨尤其會造成一些可怕的疾病，如脖子腫脹讓你難以呼吸的疾病。", "當你對人講話時，應該用一種甜美的方式清晰地講出來，不要對人吼叫，絕對不要！也不要在你話語中表現出你的怒氣，假如你動怒，那麼癌症就可能悄悄地開始發展。所以這兩方面你都要小心。做為一個霎哈嘉練習者，你必須有這方面的知識，你不要去忍受任何荒謬的批評或責駡，即你不必去接受這些。有人要講這些，那沒有什麼大不了，但是有時候你也要駁斥他：\"你所說的並不正確\"。最重要的是不要去忍受，或因此受苦，你不是耶穌基督，你沒有祂的大能。假如你去忍受，你是可能癌症上身的。", "所以試著去處在中脈，靜觀外在的一切。不必因他人的咄咄逼人，就委屈退讓；但也不要去壓迫他人、折磨他人、坐在他人的頭上，這些對你的喉嚨都非常危險，你的喉嚨可能會因此招致很可怕的疾病。", "說明：在此談話的後半段，Shri Mataji 談到喉輪和眼、舌、喉、鼻、耳等的關連，可能是因為時間的關係，她只對眼、舌、喉談得比較多，本譯文就翻譯這部分。 註一：譯者：Shri Mataji指這是不好的。 註二： 2001-07-29。"]}, {"num": "12-1", "catTitle": "額輪", "catNum": 12, "title": "基督與復活(Christ and Resurrection)", "paragraphs": ["耶穌基督的復活對所有霎哈嘉練習者是有很大的意義。我們必須了解因為祂的復活，所以我們才可能再重生。耶穌這一生所要傳達的訊息是祂的復活，而不是祂的十字架。祂已為我們背負十子架，我們不必再承擔這十字架了！但是背負十字架的戲碼卻持續不斷，許多人以為背負這十字架就表示他們繼續在做耶穌的工作，好似耶穌仍有未完成的工作，留待給這些人來繼續演這齣劇碼。其實在復活節重現背負十字架的戲碼只是欺騙你自己，也欺騙他人。去重現耶穌背負十字架的痛苦，這是完全没有任何意義。耶穌這一生並不是藉著祂的痛苦來讓你感動哭泣。祂的受苦是希望你能享受上帝的國，所以你應該高興，你應該過一個完全受祝福的人生，且對上帝充滿感激之情的人生。上帝從未希望你不快樂，一個父親怎麼可能希望他的孩子不快樂呢？", "耶穌來地球的一生帶來的訊息是\"復活\"------重生。假如祂没有死後再復活，那麼我們霎哈嘉的工作也不可能開展。祂不止在祂身上顯現了復活，祂也讓你們重生。現在則輪到你們來給别人重生。你們可以給其他人重生，經由我或經由你的昆達里尼(Kundalini)，你們是擁有這個能力。", "註一： 1988-04-03。"]}, {"num": "12-2", "catTitle": "額輪", "catNum": 12, "title": "耶穌基督(一)", "paragraphs": ["我們必須了解耶穌基督(所帶來)的訊息，但是在這個世上總是有一些人，他們宣稱自己是理性主義者，而且他們有權利憑自己的喜好，來給耶穌一些評斷，像我今天早上看的報紙，我很驚訝他們的言論，他們說：\"我們無法接受有關耶穌的這些部分，即祂是非受孕而來的胎兒(Immaculate Conception，註一)，及祂從死裏再復活(resurrection)，及......等等。\"。這些人以為他們是誰！他們如何有權利這樣說？只因為他們有寫字的本領？或許他們以為自己是學者，或讀了很多的書，或認為自己很有本領可以談任何話題，所以可以依自己的好惡來談論耶穌的種種。但是有關靈性的課題，並非人人都有能力去談，尤其是那些尚未得到自覺的人。", "耶穌的一生是一個非常神聖的生命，是一個完全不同(於世俗人類)的生命，這並不是一般(普通的)人類心智可以了解的領域，可以說是超越人類的心智，甚至詩人及藝術家也是一樣，除非他們是自覺的靈，否則他們也無法正確看待耶穌的一生。", "耶穌是以一個人類的身軀來到世上，但祂不是人類，祂是神聖的(divine)，完全是屬於神聖的。其實祂只是\"唵\"(Omkara，註二)，這就是為什麼(聖經上記載)祂可以在水上行走，因為没有任何的物質成分在祂身上，或說祂身上没有物質(matter)。假如祂身上有任何物質，祂就無法在水上行走。假如人類將這些事實都抛棄，不接受祂的(無受孕)誕生，不接受祂在水上行走及種種的奇蹟，那麼耶穌基督還剩下什麼呢？我實在無法理解這些人。", "在耶穌的年代，没有飛機、汽車，但祂(不辭勞苦地)走過許多地方，對人們談靈性的生命。當時的人尚未演化、成熟到那個程度，所以祂無法給他們自覺，但祂對他們談什麼是符合正法的生活(dharmic life)。祂甚至把十戒講到極致，即人不只不應該有通姦的行為，連淫穢的目光都不可以。", "其他的降世神祇在人間時，舉止行為都像人類，例如錫呂羅摩(Shri Rama)也常哭，錫呂克里希納(Shri Krishna)也娶了許多老婆，但是耶穌則完全不一樣，祂的行為舉止從未像人類，祂未結婚，也從未哭泣，除了對天父禱告時例外。祂在人世間的特質顯示出祂的神聖特質(divine personality)，不只活出神聖的特質，面臨死亡時也像神聖的特質。當人們對抹大拉瑪麗亞(Mary Magdalene，註三)丢石頭時，祂站出來、站在她前面對大家說：你們没有犯任何罪的人可以對她丢石頭！這個勇氣與自信正顯示出祂的神聖的特質。", "耶穌基督接受祂的死亡與復活，這對祂是一件自然的事，因為祂對此完全了解，而且在死亡與再復活的過程祂也没有任何變化，即祂不必去轉換(transform)，復活之後的祂是和死去之前的祂是完全一樣，因為祂其實是不需要復活重生的，祂只是藉著祂的復活重生來告訴人類：人是可以得到自覺，因自覺而獲得復活重生。", "祂要傳遞的訊息並不是十字架，而是這個復活重生。假如霎哈嘉練習者了解這一點，那麼你應該知道自己已從一般普通人(的階段)重生到神聖的階段。", "註一：Immaculate Conception大多是指: \"聖母瑪利亞及耶穌基督成胎時未沾染原罪\"，但譯者認為Shri Mataji用此詞時指的是virgin birth，即聖母瑪利亞是處女懷胎，耶穌基督並未有人類的父親，這懷孕是來自上天的大能。 註二：即 Aum ，符號是ॐ。唵是太初之母(Adi Shakti)從至高濕婆神(Sadashiva )分裂出來時，產生的第一個聲音，錫呂格涅沙(Shri Ganesha)即是唵的具體化(1990-12-25)。唵也是無所不在的神聖力量(Divine Power, Chaitanya, Vibration)。 註三：約翰福音此處只提到一個淫婦，但並未指她是Mary Magdalene，Mary Magdalene出現在聖經其他章節時是其他的故事。關於Mary Magdalene到底是那一個人，還是有好幾位不同的人，一直有很多爭議。還好這無關重點。Shri Mataji 在許多談話中都提過耶穌基督和Mary Magdalene 沒有任何關係，那些在瞎掰他們是夫妻，甚至有生下小孩的傳聞，是非常無知且可笑。 註四： 1994-04-03。"]}, {"num": "12-3", "catTitle": "額輪", "catNum": 12, "title": "耶穌基督(二)", "paragraphs": ["今天我們來慶祝耶穌基督的復活，復活是耶穌基督一生最大的訊息，而不是被釘十字架。任何人都可能被釘十字架，而被殺死，但是基督死去的肉體卻從死亡中復活，即死亡本身也死掉了！即基督戰勝了死亡！對一般人而言，這絕對是一個奇蹟，但對基督卻不是，因為祂是一個屬於神聖(Divine)的人，祂是錫呂格涅沙(Shri Ganesha)(的轉世)，祂即是\"唵\"(Omkara，註一)本身，所以祂可以在水上行走，地心引力並無法將他往下拉，而且祂可以復活，因為死亡並無法影響祂。祂是專門為人類(的進化)而創造的，祂擁有如此神聖的特質，所以人類應該要認出祂。", "但是人類不只無法認出祂，甚至用一個非常粗暴的方式殺死祂，甚至在今日，人們因為基督死在十字架上，而認為十字架是一個偉大的東西。這種去尊敬十字架的想法，是人類的一個很殘忍的觀念，它背後代表什麼？代表人們喜歡種種加諸祂身上的殘暴。十字架(其實)是代表祂的死亡 ，代表祂曾如此殘暴地被折磨。", "所以當祂被釘十字架時，是非常令人傷心的，但當祂從死裡復活，那則是最令人高興、最吉祥、最美麗的時刻 。基督的復活對霎哈嘉瑜伽是非常有象徵意義的，假如基督可以死裡復活，那麼人類也可以重生復活。因為擁有非凡能力的祂是以一個人的身軀來到這個世上，祂為人類開創了復活的道路，這復活的道路即是我們在霎哈嘉瑜伽中所遵循的。(這其中)最偉大之處即是(祂)穿越額輪(Agnya Chakra)，這額輪在許多靈性的經文中都有被提到，它們描述這是一個金色的門，像一個蓋子一樣，沒有人可以穿過，即這個額輪的窄門是如此的狹小緊縮。但是基督做到了，祂穿過了額輪，祂的穿越正是幫助我們今天可以打開額輪，若沒有打開額輪，你是不可能抵達頂輪的。而你可以輕易地穿越額輪，正是因為基督經歷了種種的折磨及殘暴，並且跨越過了這一切(苦難)。我們欠祂多少感謝呢？是沒有任何字眼足以形容的！正是祂指引人們：\"你們要追尋、追尋，就可以得到\"，祂又說：\"你們必須來敲這個門\"，這確實在你們身上都如此發生，你們升到額輪，然後你們穿過額輪而上。穿越額輪對你們一點都不困難，雖然你的種種來自思考、制約及對未來計畫等的觀念，這些是猶如一個很大、很大的烏雲，這些烏雲就盤旋在額輪之上，這些觀念想法強過你 ，以至於你以前無法穿越被烏雲完全覆蓋的額輪，但是(經由霎哈嘉)你做到了，你甚至沒有感知到你如此輕易地穿越額輪。我們首先都應該感基督為我們打開額輪，對祂而言，所有的折磨及兇殘經歷並不值得一提，因為祂這一生的目的、祂的來到、祂降世的目的就是為了打開額輪。", "註一：即 Aum，符號是ॐ。唵是太初之母(Adi Shakti)從至高濕婆神(Sadashiva )分裂出來時，產生的第一個聲音，錫呂格涅沙(Shri Ganesha)即是唵的具體化(1990-12-25)。唵也是無所不在的神聖力量(Divine Power, Chaitanya, Vibration)。 註二：請亦參考：12-2耶穌基督(一) 註三： 1998-04-19。"]}, {"num": "12-4", "catTitle": "額輪", "catNum": 12, "title": "自我( Ego )", "paragraphs": ["為什麼西方世界的人有很大的自我？因為在西方文化之下，小孩子的自我是一路被餵養長大。西方的父母幾乎是不太負責任，假如小孩子自己忙自己的事，父母是非常高興。他們很少去指正小孩，他們很少對小孩講：\"不要做這個、不要做那個！\" 在這種環境下小孩子就走在自己選擇的路上，父母也不太去擔心。我觀察到在霎哈嘉中心(ashrams) 若有人指正別人的小孩，孩子的父母馬上跳出來反對，在這一點他們非常敏感，但是這麼做是非常不好，這樣小孩子的自我會變得很大。相反地，在印度小孩子就不會有自我，因為在印度文化之下，婦女負起責任，甚至其他的長輩也會糾正小孩子的不良行為。在這種環境下成長，没有人會因被指正而覺得不舒服，這就為什麼印度人不易掉入西方人的自我陷阱中，因為他們的自我從未被允許長大！印度的政治是最糟的，經濟也不行，但是印度人知道每一個人都可以指正我，我應該把此當成好事，我應因此感謝神。在這一點上印度是世界第一流的。 假如父母有太強烈的這是\"我\"的小孩的觀念，從小就不允許他人去指正他的小孩，那麼這些小孩的自我就没有機會被打破，小孩子就會發展出很強的自我中心，他們無法從別人的角度來看事情，因為父母從未給他們机會走出他們的自我！縱使在得到自覺之後，他們的自我仍舊在那裏，因為他的腦袋塞滿了父母在成長過程不斷地告訴他 \"你非常特別、非常棒\" 的自我！", "自我只會讓人變得十分愚蠢，不論是龐克族或奇裝異服皆只是自我的表現。至於流行風尚則只是商人利用你的自我來騙你的鈔票。更不用提那些滿口 \"為什麼不可以\" 的種種毀滅自己的行為，這些皆是自我讓人變得十分愚笨的例子。", "做為一個霎哈嘉練習者，你要注意你的自我，隨時要探索内在的自己(soul-searching)。你要隨時問自己：為什麼我(喜歡)做此事？為什麼我有這樣的行為？這背後的原因是什麼？ 假如你常如此省思，那麼你的自我就會慢慢變小。", "註一： 1990-09-21."]}, {"num": "12-5", "catTitle": "額輪", "catNum": 12, "title": "錫呂瑪塔吉談自我", "paragraphs": ["西方國家是已經非常開發的國家，西方人也發展出相當程度的\"自我\"(ego)，他們應當來看看他們有什麼問題。自我是來自某些特定的意識(consciousness)，如你曾經有某些非凡的成就、你是這個(部長)、又是那個(主席)；或你的父母很偉大；或你的房子很富麗堂皇；或是你的職位很高等等。這自我的概念可以來自(你的)任何意識，但這些意識並不是真實的，它們和你的覺知(awareness)是相抵觸的，(真實的)你並不是外在這些身份地位所塑造的模樣，而是由你的內在的覺知所形成的。這個覺知必須要成長，從何處來成長呢？即要從了解你的自我是如何形成的、是由何處而來的。", "你可以觀察到，在自我的遊戲中，它阻止了你更進一步的昇進。當人沉溺在自我裡面，他只會迷失，因為沉浸在自我的人不是走向左邊，就是走向右邊。而且他們可以非常偏到左邊或右邊，可以到達左右兩邊非常極端的境地。", "所以首先我們必須來糾正我們的自我。針對這個自我，我們應該做什麼呢？我們應該要去觀察自己和嘲笑自己，看看自己有那些自我、什麼樣的自我？我們是人類，但(在自覺之後)已變得神聖了，上天的力量已經在我們裡面，我們的內在也有光，我們必須去體悟到我們已經是上天的一部分，如同愛的海洋中的一滴水一般。假如你可以減少你的自我，假如你可以回到你的存有的真實面，那麼一切都會運作得比較好。我發覺西方人的自我是非常非常的強大，不論他們做錯了什麼事，他們都會認為自己是對的，因為他們的自我無論如何都會支持他們。相反的，那些發展中國家的人，那些不是那麼開發的國家的人則不一樣，他們的問題不在自我，而是\"非我\" (superego，或譯\"超我\")，這些非我比較容易被糾正，但是自我則是你自己創造出來的敵人，所以你必須(自己)去抵抗反擊它，必須自己去觀察它是從何處而來。它可能是屬於國家方面的或家庭方面的，自我可能來自各方面。假如你想要進入頂輪，首先你必須小心你的自我。", "人們有時候可能會因為這個自我而發狂，所以重點是要去注意且靜觀你的自我，看它如何運作，看它如何弄壞你的脾氣，看它如何破壞你的人際關係，看它如何把你變得很愚笨。自我對你所做的第一件事，就是讓你變得十分愚蠢，你荒誕可笑的行為舉止會令他人想：\"哇！他是世界上有史以來最大最蠢的笨蛋！\"。", "自我是非常有侷限性的，它會讓你的視野狹隘，讓你看不見你生命的目的，你會不知道你為什麼變成自覺的靈，你只會陷在你自己的事務、你的家庭、你的小孩，陷在你認為重要的私事，但其實是完全不重要的事。", "註一： 2002-05-05。"]}, {"num": "12-6", "catTitle": "額輪", "catNum": 12, "title": "暴力與自我", "paragraphs": ["暴力行為正在快速增長，我想暴力是這些施暴者用來表達、張顯他們自己的唯一武器。當某地發生一些事，在另一個地方就有人引爆炸彈(來報復)，殺死了許多無辜的人，這種殺無辜者的暴力行為是非常罪過的事，甚至連很小很小的暴力都是一種罪過，在錫呂克里希納(Shri Krishna)的眼中，這種暴力行為必然會被重重地懲罰。這些暴力行為都是經由\"自我\"(ego)而來的，你認為因為你屬於某一個部族黨派，你就可以殺掉另外一個部族，可說是一種荒謬的想法進入人類的腦袋裡，然後你就認為你有權利殺死另一個人。或許有人會說這是來自仇恨，但是仇恨是從\"自我\"發展出來的，當自我開始活躍起來，它就會收集這些東西，如仇恨、擁有權、憤怒、暴力等，這些都來自\"自我\"，正是這個自我使人盲目，就只因為自我的出現，你變得盲目，完全看不見根本不需要用暴力、不需要去仇恨他人、不需要去殺人的簡單道理。", "有人會問：\"Shri Mataji，這自我是如何累積形成的呢？\"， 當然大部分是來自\"反應\" (reaction)， 此外也因為種種的制約(conditioning)。假如一個人從孩童時期就被灌輸：\"你應該去恨那些人，他們(本來就)應該被仇恨的。他們是不對的人，他們是壞人\" ，這些小孩子就會開始如此想，當他們長大時，他們心中的仇恨猶如一顆長得很大的仙人掌，而這些仙人掌的刺會去刺死人，他們表現出來就像這個樣子。", "人類的這種暴力行為完全是沒有正當性，假如他們是人類，他們必須有人類的一些(高尚的)品質，而唯一的方法即是要學習如何只是去當一個靜觀者，而不要去對外事外物做出反應。", "註一： 1998-08-16。"]}, {"num": "12-7", "catTitle": "額輪", "catNum": 12, "title": "順服(上)------捨棄制約", "paragraphs": ["許多霎哈嘉練習者欠缺的就是順服(surrendering，註一)，這是現代的霎哈嘉瑜伽的唯一條件。即你必須真正的順服，假如你開始用你的頭腦，或開始想用其他的方法(試圖)去了解霎哈嘉瑜伽，那麼你是無法深入霎哈嘉。假如做不到順服，那麼没有人可以進入上帝的國。", "順服並不是你應捨棄你的家庭、小孩、房子及財產。此處所講的順服，只是首先要放下你的自我(ego)，然後再拋棄你的種種制約(conditionings)。舉例來說，有一次我碰到一位男士，他遭受許多折磨，我問他：\"誰是你的導師？\"，他告訴我他的導師的名字，我說：\"那位導師對你的所做所為並非是對你好，你是否願意放棄他？\"，他答道：\"好 ! 明天。\"，我說：\"為什麼不能今天呢？\"，他答道：\" 好，今天 ! 但是我必須將他的全部東西丢掉，所以明天早上我會去做。我應該丢掉那些東西呢？\"，我回答：\"所有你用來崇拜他的東西全部都要丢掉！\"。他檢視房子内的東西，找出所有用來崇特他以前的導師的東西，集中起來全部都扔到大海，並對大海說：\"對不起，我因為這個人而遭受了許多痛苦，希望你不要因為這些東西而受苦。\"", "所以假如你没有這般聰明的才智，那麼你是無法做到捨棄的。一般人(很容易)就陷在這些習慣與制約裏，我知道許多人，他們就是非常難以去除他們的制約，比起去除自我來得更困難。人有許多世俗的制約，人生下來的第一個制約就是你的出生地所帶來的制約，如生在印度或英國，你就會有當地的制約。經過霎哈嘉的洗禮，我看到大多數人突然間開始看見自己國家的問題、人民的問題、宗教的問題及自己所讀的書的問題，立即地他們清楚地看到這其中有那些錯誤，並開始以此來開玩笑。我看到全世界的練習者再也不會因為自己是英國人(或俄國人)而說自己是最優秀的民族。你會看到自己國家、社會的制約，你會厭惡這些錯誤不好的制約，你不會認同它。", "在順服之中，事實上你發展出一種狀態，即你從内在變成一個修行者(sanyasi，註二)，即再也没有什麼可以主宰掌控你，sanyasi 的意思正是指一個人可以超越任何(制約)，没有什麼可以纏住他。他就只是(單純地)看著外物，他就知道它的本質，或許他没有說出來，但是他知道一切。他也不會去做任何不對的事。他是如此地抽離與無執(detached)，所以他可以看見他自己的制約，他可以看見他自己的家人的問題，他可以看見週遭的問題，而他不會去認同它們。", "註一：surrendering 原意是指：臣服、投降、放棄、交托，此處尤指放下自己的自我(ego)及制約(conditionings)。 註二：sanyasi 指印度婆羅門中，已到達最後階段的修行者(托缽者)。他們將不再輪迴，而是要回到大梵。 註三： 1994-03-14。"]}, {"num": "12-8", "catTitle": "額輪", "catNum": 12, "title": "順服(下)------放下自我", "paragraphs": ["在制約的另一邊則是\"自我\"(ego)，自我是人類(發展出來)很幽微的東西，人類累積了一個自我，其中有一些人甚至有一個很容易受騙的自我，只要一件很微小的事就足以讓他的自我爆炸。他們會因很小的事而大發脾氣，或找到一個可以宰制的人，他們也會去控制那個人。假如你開始可以看到自己有這種自我，你會開始嘲笑自己，心中想我是出了什麼問題，(怎麼會有這種自我？)", "自我是不同於制約，制約是來自外界，而自我是來自内裏。人類可以因各式各樣的荒謬事物而產生出自我。有一次我碰到一位女士，她有一種非常高傲的態度，甚至都没有笑容，我說：\"她倒底是怎麼樣了？她是誰呢？\"，他們告訴我：\"她會做洋娃娃，這就是為什麼她十分自傲\"，\"什麼？因為會做洋娃娃，所以十分驕傲？每一個人都會做洋娃娃，這有什麼偉大之處呢？\"，\"但是她認為她非常了不起，因為她會做洋娃娃！\"。", "當人變得十分愚笨時，就表示他的自我很大，這可以說是自我大的人的第一個標記。這種人會笨到令人十分驚訝，好似一個丑角在你面前免費演出，演出各式各樣的丑劇。他會在你面前炫耀說：\"我做這個，我是......，我......，我......，我......\"，他會毫無羞恥地說那些不應該說的話。然後他們甚至更進一步跨入罪惡的生活型態，他們喜歡女人、喜歡喝酒，喜歡做這個、做那個，然後開始誇耀：\"我那天喝了多少酒.....，有五個女人圍在我身邊......\"。對一個自我很大的人而言，完全没有羞恥心這一回事，他會不斷地說他的荒誕事跡。", "這些自我很大的人更會為自己的行為辯護，有一次我對一位男士說：\"你有過心肌梗塞，為什麼你現在還喝酒呢？為什麼你不戒酒？\"，他說：\"那位叫 Kirloskar 的老人已九十幾歲，他也(天天)喝酒\"，我說：\"你不是他，而且縱使他喝酒，他也沒有從酒獲得什麼益處\"，\"不，不，你看他如此棒，因為他喝酒，而且他如此成功\"，\"難道他是因為喝酒而成功嗎？\"，你看，他們連普通的推理判斷力都没有！", "在現代，這個自我又更進一步擴展，人們開始說：\"我喜歡這個，我不喜歡那個\"，\"什麼？你不喜歡什麼？\"，\"我不喜歡這種莎麗，我不喜歡這種衣服，我不喜歡這個\"，但是你有没有想過：你是誰？並不是你來看你的衣服，你的衣服是給別人看的，所以你喜不喜歡並不重要！現代的年輕人開口閉口即是：\"我喜歡\"，這是完全毀滅的一個訊号，因為自我不只讓你變笨，自我更會帶你走向：\"只要我喜歡，有什麼不可以\"，所以我們可以發現那些人(譯者：指如龐克族等)穿着十分奇怪，他們變得非常非常愚笨！所有這些愚笨的行為都是因為這個自我在做祟。只有得到自覺之後，人們才會看到：這是我的\"自我\"在講話、在搞怪，(這不是我！)之後，他們會開始嘲笑自己、開自己的玩笑，說：這是我的自我！", "當我們談到昇進時，我們是在談一個更高層的生命。我們必須變成一個修行者(sanyasi)，就像蓮花從池塘中冒出，但是没有任何水滴附着在其上，甚至蓮花的葉子上也没有任何水滴，我們必須就像這樣子。當然我們不必去穿修行人的衣服，而是要從内裏發展出一種抽離、無執(detached)的注意力，藉著這種注意力，我們可以立即看清楚自己内内外外的問題。..........要獲致這個，我們必須從内裏變成濕婆神(Shiva)，即變成無執與抽離。濕婆神是完全的無執與抽離，你也必須如此。而且這種無執與抽離將帶給你和濕婆神相同的智慧。至高濕婆神(Sadashiva)只是靜觀太初之母(Adi Shakti)的工作，祂從未有任何的驕傲，祂也不會發展出任何自我。", "順服並不是放棄任何外在的東西，而是完全清潔你自己，變成完全的無執與抽離，這種無執與抽離是帶給你昇進的唯一方法。", "註一： 1994-03-14."]}, {"num": "12-9", "catTitle": "額輪", "catNum": 12, "title": "明辨力與額輪(之六)", "paragraphs": ["在額輪，我們可以說所有這些明辨的力量都內建在你裡面。它們都是自然而然的，你只需要藉著靜坐、藉著隨時省察你自己是否處於享受的狀態，如此這些明辨力量就會成長。所有整個(額輪的)明辨力全看這一點：你能享受霎哈嘉瑜伽到什麼程度。", "霎哈嘉形式的生活其實是有無比的樂趣，像昨天我和各式各樣的人見面，有些練習者覺得我浪費太多的精力來應付這些不相關的人，其實一點都不會，我是很享受他們所有的人。來到霎哈嘉會讓你變成一個笑看人間世事的享受者，譬如一個人來到你面前，你和他談話聊天，每一個人背後都有不同的故事，你可以去發現他有什麼精彩的故事。你其實不需要去電影院看電影，每一個(你所碰到的)人的特質與際遇都是一部電影，假如你可以仔細去看、去了解，那是非常令人享受的。", "唯一痛苦的部分是我是一個導師的角色，我必須去告訴他們這一點不好、那一點不對。這是在看這戲劇的過程中唯一不舒服的部分。我希望我可以避開這一部分，但這是不可能的，因為你們必須從黑暗走出來，回到陽光底下，而你是抓著我的手，所以我必須告訴你要小心，這是一條很狹窄的道路，一不小心你可能就掉到左脈或右脈去。所以(你)要緊握我的手，我們必須前進再前進，不要去看左邊或是右邊，只需要把握這重點。當你有足夠的明辨力將你的手交給你的導師，你所需要做的只是這些。", "你不需要做任何事，你只需要去觀看、去了解(碰到的)每一個人，唯一你要去做的只是去享受這一切。去做任何事或不去做並不是重點，而是你要處在享受的狀態，完完全全享受的狀態(the state of enjoyment)。這個狀態是你們必須去達到的，你們應該變成那個狀態的存在體。......", "在穿越額輪時，你需要的明辨力是知道你要追求升進，而不是其他任何的目標。只需藉著了解什麼是享受、什麼能帶給你真正的喜樂，穿越額輪就會自然而然地發生。假如你讓這自然而然的力量來進行，這其實並不是那麼困難。但是常有練習者告訴我：\"我們必須做這個，必須做那個，這些要如何做呢？\"，在這個(穿越額輪的)關鍵點，其實只需要放下一切，這一切都會自然地發生完成。並不是你要去做什麼努力，而是無所不在的神聖力量以無比的效率，來為你做所有的工作。", "註一：在這個很長的談話中，Shri Mataji從根輪逐一談各個輪穴的明辨力，最後額輪的部分講的比較簡短。關於談話中提到的重點\"享受\"，或許在另外一個談話中的片段有助於大家了解，譯者將之附在下面： 一個很有音樂素養的人來到濕婆神前面唱歌，祂欣然接受；一個魯莽的人在祂前面亂唱，祂也不介意。對祂而言這些都無所謂，祂不是那種音樂應是如何、每個音符都要正確、小心翼翼的那種人，祂不介意唱對或唱錯，祂是超越這些，祂是超越這些人類慣有的種種型式。祂是超越的，祂就是靈性(spirituality)本身，他是超越這些(表面的)東西。不論你是否是音樂家或藝術家或其他的人，祂都享受你的表演，祂是一個享受者。只要單純的、來自內心的演出，祂都會去享受，祂不是一個有制約的人，認為表演必須是現代的或應如何等等，祂沒有任何這些制約，祂不像那些注重型式細節、小心翼翼翼的人們。 ..... 你們看濕婆神(的穿著)有什麼流行的形式嗎？你給祂什麼東西，祂都很高興。你給祂什麼，祂就吃什麼。祂是滿懷感激地接受一切，因為祂的特徵就是享受，祂代表的就是平安與喜樂。......祂正是享受(enjoyment)的化身，祂代表享受(enjoyment)及喜樂(joy)的完全型式。所以濕婆神的崇拜者的另外另一個特質應是享受，面對任何碰到的人或事，你應該都是充滿喜樂，如何做得到呢？唯一的方法即是要放棄人類愛批評的特質。...... 那些視野狹隘的人才會有一大堆的喜歡與不喜歡。你們應該學習如何去欣賞及感激一切，你有多大的能耐來欣賞外在的一切，正說明你的靈性是有多高！摘自\"濕婆神與濕婆神的崇拜者(下)\" 註二： 1991-04-28。"]}, {"num": "12-10", "catTitle": "額輪", "catNum": 12, "title": "額輪的問題", "paragraphs": ["今天雖然你的額輪打開了，但是你仍會有許多額輪的問題，即霎哈嘉練習者仍然會在額輪出狀況。我們應如何經由反省來看看自己有什麼問題呢？ 舉例來說，有些人來到霎哈嘉，就認為他們應該來掌控一切、負責這個、負責那個、掌控所有的練習者，此時他們的行為就開始不像一個霎哈嘉練習者應有的樣子。我看過這種人，我很訝異他們那種相信自己的情狀、那種炫耀他們是總管一切的負責人的樣子。", "霎哈嘉瑜珈不是你想的那麼容易，因為有許多的誘惑。假如我認命某人為某地的負責人，那人(就可能)變成掌控的心態，即他沉醉在權力之中，當他是如此時，他便開始支配其他人，也開始炫耀他是何等的重要特別，所以他必須來指揮其餘的人。然後他會製造一種令人害怕的氣氛，首先我看到的是他們會開始偽稱說：\"Shri Mataji講過了這個， Shri Mataji如此說，這是Shri Mataji的想法\"，其實我沒有對他說過任何事，但他會一直如此宣稱，以致於周遭的人們變得害怕。他可能也如此說來恐嚇你：\"我會告訴Shri Mataji， Shri Mataji會相信我所說的，她會處罰你\"。對於這種人，我是十分訝異，因為我從未如此說過我會處罰某人、我會將誰逐出霎哈嘉，從來沒有類似如此的事。這種人想到的都是他自己，他或許是一個負責人，或許不是，或許在霎哈嘉什麼也不是，但是他就會如此說，用一種十分可笑的方式說這些，根本不像是一個霎哈嘉練習者。然後他可能更進一步將自己想成非常特殊、偉大，好像他是被特別揀選出來要昇進到很高很高的人。", "當我聽到這種事情，我是真的非常訝異，人們如何能經常如此自我欺騙，而有這種行為呢？在霎哈嘉之中，首先就是要謙虛，假如你不是一個謙虛的人，那你不能是一個霎哈嘉瑜伽士。這種到處下命令、講起話來像他是希特勒的人，或試圖控制一切、指揮一切的人，他的這些特質只是展現他沒有在霎哈嘉學到什麼！首先最重要的是要來享受謙虛，(他連這一點都做不到)。我看過不少這種人，他們總是要坐在第一排，總是坐在你們能看到他的地方。看到這情形我往往會笑，我知道他們只是在炫耀，他們心中想的都是自己，這就是為什麼他們坐在那裡的原因。但是他們自己都是正在往下掉，他們內在並不快樂，這就是為什麼他們會做(前述)那些把戲，會想去掌控他人。", "註一： 1998-04-19"]}, {"num": "12-11", "catTitle": "額輪", "catNum": 12, "title": "照鏡子、自戀與真我", "paragraphs": ["某些人有一種成天照鏡子的習慣，這是非常不好的，因為這種習慣會帶給你一種奇怪可笑的自我(funny ego)。看錫呂克里希納的相片，是遠比看你自己的臉孔來得更好，如此你的面貌會變成像錫呂克里希納。經神科医生將自戀(narcissism)視為一種疾病，這是很正確的。", "每天常在鏡子前觀看自己的臉孔，這是非常危險的，它會養成一種奇怪的人格特質。這種人會開始告訴自己：\"喔！我(像)是拿破崙！\"，然後他變成了一個拿破崙，開始行事像一個拿破崙。有一天，我們就會看到從浴室(照完鏡子)走出來一個拿破崙！", "所以一個人必須很小心，不要放太多注意力在自己身上(self)，或以為自己很重要，而是要將注意力放在你的真我(Self)。這真我是在你的内裏，它就是你的靈(Spirit)。當你照顧你的真我這一面，很多意想不到的事，就會以很優美的方式在你的身上發生。", "註一： 1992-08-16."]}, {"num": "12-12", "catTitle": "額輪", "catNum": 12, "title": "瘋子和婆羅門的顫抖", "paragraphs": ["***前言：**這是一個霎哈嘉早年發生的故事，Shri Mataji 後來多次提到，但是每次都只約略提到一點點，但在1997兩次的談話中講得較詳細，所以翻譯出來讓大家了解故事的全貌。*", "**譯文：**", "我曾經在Pune 有一個公開演講，他們安排了一個演講廳，但這個廳的所有人是一些婆羅門。他們說：\"我們無法讓她在此處演講，因為她不是一個婆羅門。\"，一些比較鬼靈精的練習者就對他們說：\"好！我們會將上述的話告訴報紙，說因為她不是一個婆羅門，所以........。\"，\"不！不！不要這樣做！我們就讓你們在這裡舉行演講！\"。當我到演講廳時，這群婆羅門就坐在講台正對面的座位，他們是來抗議或是監督或是什麼我也不知道，我當時甚至也不知道之前發生過不讓我演講的插曲。但只見這群人雙手開始顫抖，即雙手在胸前大幅顫抖(註一)，我對自己說：\"發生了什麼事？\"，", "他們說：\"母親請停止！我們知道你是力量(Shakti)，但請停止這顫抖，我們受不了！\"", "我說：\"我沒有做什麼啊！那你們做了什麼呢？\"", "\"我們並沒有做什麼，我們只是之前說過這是一個婆羅門的場所，所以我們想妳不適合在此演講。\"", "\"真的？就只是這樣？\"", "\"對！就只是這樣。妳看，那邊另外一群人也因為妳的力量而顫抖！\"", "我就問那邊那一群人：\"你們也是婆羅門嗎？\"", "\"不！不！我們是來自Thana精神病院的瘋子。\"", "\"那你們為何在這裏呢？\"", "\"因為妳曾經治好我們院裏的一個病患，所以我們的長官就帶我們到這裡來。\"", "我就對那群婆羅門說：\"你們看，你們顫抖，那群人也顫抖，現在你們和他們相當一致，你們是有什麼狀況呢？\"", "\"難道我們也瘋了嗎？\"", "\"你們是有一些不對勁的地方！\"", "因為他們認為婆羅門是最高等的族群(註二)，這些都是荒謬的觀念。婆羅門(Brahmin)原來是指知道Brahma(大梵)的人，是指知道無所不在的上天大能的人。當然這群婆羅門後來都明瞭了，因為他們都變成霎哈嘉練習者了。", "註一：Shri Mataji 在談話中有模仿他們雙手的抖動 ，即手指來回抖動的幅度有5公分之多。 註二：婆羅門是印度教的祭司貴族，是印度種姓制度下最高等的人。 註三：譯者綜合翻譯自兩次談話的共同片段1997-03-21、1997-04-06 。"]}, {"num": "12-13", "catTitle": "額輪", "catNum": 12, "title": "從 \"這是我的\" 到 \"物質主義\" 的陷阱", "paragraphs": ["在你得到自覺之後，你仍然要十分小心，因為外在的負面力量是非常強大，隨時都會把你往下拖。", "因為人是從物質(matter)演化而來(註一)，所以很容易再走向物質、走向物質主義(materialism)，或受到一些物質化概念的影響。一旦受物質力量的牽引，人很容易被帶回未進化前的原始的狀態。即你一旦走回物質主義，則所有人的文化及美麗的特質都會失去。", "當一切都只能用錢來衡量時(物質主義的特色)，人心中就没有任何空間留給神，也没有空間留給愛、美麗及所有高雅的特質。錢應該是給人使用的，聽人召喚命令的，而不是人受錢的指揮。人怎麼可以因為錢而放棄尊貴與神聖呢？ 物質主義往往以一種不易被察覺、非常精微的方式來進到你心裏。當你開始說：\"我；我的；這是我的\"，你就逐漸落入物質主義的陷阱。除非你體悟到你只是這羣体的一部分，你才可以走出物質主義的掌控。人原本即是屬於羣体的一部分，而不是一個單獨的個体，是物質(外界的種種東西)讓你和其他人產生分別與疏離。當你了解到你不是外物(物質)的奴隸，外物才應是供人使喚的工具，這時你才不會受一切物質的掌控，至此你才可以感受到愛。", "註一：譯者以為Shri Mataji 此處並非贊同唯物主義所宣稱的：\"人\"只是\"物質\"而已；此句的涵義是:人的進化過程(整個歷程)最初也是從物質開始。Shri Mataji 一向強調：人其實是個\"靈\"。 註二: 1987-04-08。"]}, {"num": "12-14", "catTitle": "額輪", "catNum": 12, "title": "自由意志(Free Will)與真正的自由(Freedom)", "paragraphs": ["現在西方世界流行所謂的自由意志，從龐克族、奇裝異服、嬉皮，到各種尋找刺激的冒險活動，或甚至毒品、飲酒狂歡，他們認為現代人可以有完全的自由，去做他們喜歡的事情，這才是\"自由意志\"的體現。其實這些行為只是他們的自我(ego)或非我(superego)的體現罷了！這並不是真正的自由，因為他們並没有處在中脈。當你處在中脈時，你所擁有的正是\"自由\"------完全的自由，而不是所謂的自由意志。此時没有任何來自\"自我\"的意志，也没有任何屬於\"非我\"(制約、潛意識、社會規範、亡魂等等)的操控。換言之，此刻的自由是没有任何外力的影響與覊絆，是一條自由的康莊大道。處在這種中脈的自由中，你有全然的知識(knowledge)，亦是愛(love)的本身，也是一種完全的\"選擇的自由\"(discretion)。只有當你處在此種狀態，你才知道上帝其實是給每一個人完全的自由。", "註一： 1986-08-23 。"]}, {"num": "13-1", "catTitle": "疾病，治療", "catNum": 13, "title": "靈性的升進與身體的改善", "paragraphs": ["當昆達里尼( Kundalini )上升時，第一件發生在你身上的就是你的健康改善了，這是因為副交感神經系統的完滿(parasympathetic fulfillment)。副交感神經系統( 譯者：即指中脈) 給你自覺與光(enlightenment)，然後會流到交感神經系統，所以你的健康改善了。..........", "昆達里尼會幫助治療大部份的疾病，少數的例外是因為有外來人為因素的干擾。例如霎哈嘉瑜伽毫無疑問是可以治療腎臟病，但是若這位病人已使用機器( on the machine, 譯者猜：指已洗腎)，我們已試過，我們發覺他的腎臟病是無法被治癒，霎哈嘉瑜伽只能延長患者的生命，而無法治癒他。.........", "霎哈嘉練習者的身體為什麼會變好呢？因為假如(你内在的)耶穌必須被喚醒，假如神必須來到這個身體，那麼這個身體就必須先被潔淨，這個工作是由昆達里尼來完成，你身體健康的改善就是這過程的一個副產品。", "在你的升進中有一個很大的關卡(hurdle)，即你的身體的因素( Vyadhi, 即 bodily element)。你不應該被身體的狀況或問題纏住，或甚至往下拖累太多。每一個身體都有一些問題，你應該忘記它，隨著你的升進，這些問題會逐漸改善，當然某些人需要花比較長的時間。但最主要是你的靈性的升進，(而非身體的改善)，所以不要總是纏著我說：\" 請治療我，請治療我 !\" ，你應該說：\" 請給我靈性的生命(spiritual life)\" ，如此你(的身體)將自動地被治療。或許某些人要花一些時間，但這没有什麼關係。", "註一： 1979-12-10."]}, {"num": "13-2", "catTitle": "疾病，治療", "catNum": 13, "title": "錫呂瑪塔吉對西方醫學的看法", "paragraphs": ["西方醫學遺漏了(很重要的)一點，那即是在他們的醫學科學中，將人當成一個非常獨立的個體，而這個個體並沒有和整體(whole)有連結(註一)。其實人類是和整體有連結的，也因為如此，人類所有的問題、疾病也和整體有關連。我們不能只認為某病人只是有某一個疾病的人。這個有某一種疾病的人，其實很可能有很多其他的問題，但西方醫學中並未去探究其他很多的關連。譬如有一個(生理上)病得很嚴重的患者，他們(西方醫生)並不去探究這個病人的心理(mental，註二)狀態是否有問題，並不去了解病人是否只是單純的身體問題。", "事實上，人的疾病大部分是來自身心都出問題(psychosomatic)，像癌症及愛滋病都是，它們都被(西方醫學)認為很困難、很難以治癒的疾病，它們都是因為和外界的關連，即和左脈(潛意識)世界的關連而產生的。", "西方醫學只知道右脈的醫學知識，而且探究到非常細微的部分，但這是不必要的。(其實)西方醫學應該去了解人的左脈，但是他們目前對此部分是完全無知的。假如患者在左脈有一個毛病，那麼身心病的狀況就會產生。若患者只是斷了手，或其他單純的身體疾病，那麼西方醫學是可以應付。但是假如是一個複雜的、(同時涉及左右脈的)身心毛病，那麼西方醫生是無法治癒病人的。抱歉我只能說實話，因為西方醫學不知道另一側(譯者：指左脈)，不知道(左脈的問題)如何來影響病人，而使病人產生癌症。癌症在霎哈嘉是可以治癒的，假如是初期的癌症更是非常容易治癒的。縱使並非初期也可以治癒的，血癌尤其是確定可以治癒的。這些(西方醫學)無法醫治的疾病，往往就是左右兩脈毛病的組合才產生的。", "左脈是屬於人的過去，換言之那些未來取向的人是不會有來自左脈的感染，但是那些活在左脈世界的人、有種種左脈擔憂的人、時常為自己難過的人，他們都容易有來自左脈的感染。或許你會驚訝到我如下所說的：那些偏左脈的人其實是被附身的(possessed)，被一些死去的亡魂(dead spirit)所附身。這可能發生在任何悲傷的人，或陷入左脈情緒狀態的人。此外，去找假導師(false gurus)的人亦可能如此，那些假導師會用所控制的亡魂來催眠人。左脈的毛病是和西方醫藥無關，但若西方醫生沒有這方面的知識，則是無法做任何治療的，或許他可以診斷，但他無法治癒那些身心病的患者。當代西方醫療的問題，即是他們無法治療身心病。", "許多現代西方醫學無法治療的疾病都是來自左脈，西方醫學能治癒右脈的毛病。但是像癌症，他們只是將病症拖延而已，他們會開刀切除，但是癌症會擴散......，手術切除絕對不是徹底療癒的方法。假如你是一個霎哈嘉的專家，你不必做手術，你可以在一夕之間治癒癌症病人。相信我，你是有非常有能力做此事。", "註一：譯者：Shri Mataji的意思應是指後文中提到的：人是和\"外界\"有關連。 註二：譯者：Shri Mataji的意思可能指左脈。 註三： Shri Mataji 對印度的西方醫生的說明2002-04-02，只翻譯談話中談及此話題的部分。"]}, {"num": "13-3", "catTitle": "疾病，治療", "catNum": 13, "title": "霎哈嘉瑜伽無法醫治那些人", "paragraphs": ["一個自覺的靈會有一種超越常人的能力, 他不需藉由目前醫學的方法, 或任何化驗室的檢驗, 他可以從指尖知道另外一個人那一個能量中心有問題. 例如一個人在心臟病發作之前, 我們就可以事先從指尖知道他左心輪(心臟)有毛病. 這是一種第四向度(the fourth dimension)的意識能力. 一個自覺的靈不只可以診斷疾病, 也可以治療疾病. 不只包括身體方面的疾病, 也包括情緒心理方面的疾病, 或身心交錯的疾病. 這些疾病都可以用霎哈嘉的方法來加以療癒. 但是如果一個病體已沉重到難以修補的狀況, 或整個系統已完全失序, 那麼霎哈嘉也無能為力. 在這種情形, 我們會建議這個人(靈魂)再投胎, 從新開始. 另外, 若一個病人有人工物品植入其體內, 霎哈嘉並無法作用在沒有生命的物品上面, 霎哈嘉只作用在活生生的生物體上面. 若人體某一器官已死去, 霎哈嘉也無法治療它.", "這些治療大約對八成的人有效, 至於那些不起作用 20% 的人, 是因為他們沒有做為人類(human being)的一個根基, 他們的整個取向比較像動物, 甚至比動物還更糟, 可以說已變成惡魔一般(a devil or a satanic person). 這種人是無法昇進到第四向度, 因為昇進到第四向度並不是一個機械式的過程, 而是一種活生生的向上昇進, 昇進到更高階的存有(being)的演化過程. 所以那些 20% 的人連人類的根基都沒有, 自然是不能往上昇進到第四向度, 這個第四向度的治療力量也無法作用在他們身上. 霎哈嘉可以醫治動物, 也可以醫治人類, 但無法治療一個欺騙自己、欺騙他人、對他人殘暴的人, 譬如像希特勒的人. 霎哈嘉無法醫治那些已經不正常、已失去人類的根基的惡魔.", "註一: 這是 Shri Mataji 對醫生的演講. 本文只摘譯談及霎哈嘉瑜伽無法醫治那些人的片段. 註二: 1984-07-26 ."]}, {"num": "13-4", "catTitle": "疾病，治療", "catNum": 13, "title": "Shri Chakra 和 Lalita Chakra", "paragraphs": ["Shri Chakra 在右側(肩膀)，Lalita Chakra 在左側(肩膀)(註一)。在得到自覺之後，我們用手來從事的所有的工作( 指清潔、保護.......)皆是經由這兩個輪穴來達成。它是如何作用則是一個非常複雜的機制。但是我們不必去擔心，只要我們把手放在某人身上，這兩個輪穴知道如何去完成工作。它自己會去達成，它就像一個内建在体内的裝置，它知道應該給這個人什麼能量(vibration)來達成一個特殊的目的。假如這個人有一個特別的毛病，它們知道要發出什麼能量來達成治療的效果。所以霎哈嘉練習者得到自覺後不只喚醒昆達里尼(Kundalini)，這兩個輪穴也同時被昆達里尼喚醒。", "但是假如你有喉輪的問題，那麼你的手會比較僵硬不敏感，你可能無法感覺來自神聖力量(Divine)的指引，因為當你用手時你感覺不到能量，所以你無法得知有什麼效果、發生了什麼。", "這是一個非常複雜的作用過程，爲了這作用，這個工具已完美被建構。這個工具配備所有必須的知識，如你們所稱的回饋機制，或我們可以稱為一個完全的程式在裏面。所以當你把手放在某人身上，這個程式就自動開始去運作成就。因為這個程式是由全能的上帝( God Almighty )所造，它絶對不可能出錯，它不會模擬兩可，而是精確地發揮效用。", "註一：Shri Chakra 及Lalita Chakra是兩個副輪穴，在左右肩膀。 註二： 1990-12-21 ."]}, {"num": "13-5", "catTitle": "疾病，治療", "catNum": 13, "title": "血癌(Leukemia)的形成---霎哈嘉的觀點", "paragraphs": ["血癌的根本原因在於身體的速度計---脾臟---出現問題. 當人處在危急緊張或匆忙的狀況, 人體的脾臟及造血機能就會製造更多的血球, 來應付身體的需求. 現代人經常成天處於這種狀態, 而不知放慢腳步, 適時休息放鬆. 例如吃早餐時一面看意外及恐怖新聞連篇的報紙, 開車時又一面吞食餐點, 這些行為皆增加更多的緊張(這些人士往往是偏右脈的), 也帶給脾臟更多的負荷, 逐漸地脾臟也愈來愈疲弱. 但要從疲弱的脾臟到最終的瘋狂製造血球(即血癌)的狀況仍須要另一個導火線.", "Shri Mataji 說她從來沒有碰過一個癌症病人是偏右脈的. 全部的患者在癌症暴發時都是偏左脈的. 當人陷入偏左脈的狀態, 即處在一種容易被攻擊的脆弱狀態, 此時來自左邊集體潛意識的一些惡性力量(註一)就有可能成為癌症的誘發因子. 一旦遭受到這種攻擊, 此時原本疲弱的脾臟(代表主管的腹輪阻塞嚴重, 其能量已衰竭)及造血機能就陷入完全和整體分離的失去控制的瘋狂狀態(註二), 而拼命製造血球, 這就是血癌.", "那些情境及事件會使人陷入這種脆弱危險的左脈狀態呢? 一. 成天哭泣抱怨. 二. 受假導師或黑巫術的宰制. 三. 接受催眠. 四. 接觸通靈, 玩碟仙或接觸起乩的乩童. 五. 受亡魂的入侵(如去墳墓). 六. 練習遙視(clairvoyant), 第六感(extrasensory perception), 超心理學(parapsychology). 七. 酒精及某些毒品.", "總結: 疲弱的脾臟, 再加上因陷入左脈時遭受一些惡性力量的攻擊, 就會誘發血癌. 這種過程就是一個非常典型的癌症成因, 右脈的人因過度的行動(action)造成腹輪的衰竭, 當他有一天陷入左脈時, 又不幸受到攻擊, 就引爆可怕的癌症.", "註一: \"惡性力量\"指那些在過去演化過程被淘汰的一些生物(存有), 它們就住在集體潛意識界. Shri Mataji 說科學家發現的一些引起癌症的蛋白質52號及58號等即是屬於此種亡魂(dead soul). 註二: Shri Mataji 說癌症乃是某一個輪穴能量完全衰竭, 如電池沒有電, 原本受此輪穴控制的器官(或細胞)便出現不受指揮而失控的狀態. 註三: 1980-04-24, 1980-10-10, 1983-03-09, 1983-03-23, 1983-09-05."]}, {"num": "13-6", "catTitle": "疾病，治療", "catNum": 13, "title": "陷入左脈是非常危險", "paragraphs": ["我已告訴過你們有關處理偏左脈的方法，你們必須確實去實行。絕對不可讓偏左脈的情況繼續滋長，因為陷在左脈之中是非常危險。所有這些可怕的疾病都是來自過度偏左脈-----如癲癇症(epilepsy)、各種精神錯亂(mental derangements)、癌症、所有的身心症(psychosomatic)及脊髓炎(myelitis)及愛滋病(AIDS)等。這些疾病都只攻擊偏左脈的人(註一)。如果你陷入左脈的情況，要立即去除它。陷入右脈時，你會表現在外(如生氣、罵人)，所以周遭的人都會知道，當事人亦會知道，所以你容易去糾正它；但是陷入左脈時就不是這麼明顯，所以要特別小心，絕對不要沈溺在左脈的情緒之中，那是非常危險的。", "要如何避免跑到左脈去呢？不要和精神錯亂的人在一起，也不要去精神病院，不要嘗試治療偏左脈的人(註二)，這些人都可以被我的相片療癒。假如有人開始告訴你他的種種不幸，你必須立即關上你的耳朵。所有左脈的問題都是來自一種自我沈溺(放縱)的情緒(self-indulgence)，如你開始想：我是如何的可憐、如何的不快樂、如何一無是處等等。右脈的人是過分有自信，左脈則是相反。當陷入左脈之中時，各種病毒都可能發動攻擊，就是這些病毒帶來上述各種難以治療的疾病。", "註一：譯者說明：Shri Mataji 認為許多疾病的導火線皆是因為太偏左脈，此時人會處在一種容易被攻擊的狀態。固然有些疾病的根源是過度使用右脈造成輪穴能量的耗竭，此時一旦因為某些情境或事件造成擺向左脈，疾病可能就爆發了。 註二：字面上翻譯是如此，但譯者以為Shri Mataji 較可能是指上述精神錯亂的人。 註三： 1990-03-20."]}, {"num": "13-7", "catTitle": "疾病，治療", "catNum": 13, "title": "氣喘(Asthma)--霎哈嘉瑜伽的觀點（非談話）", "paragraphs": ["在Shri Mataji 的演講中曾提到氣喘的病因，總計不下七八十次。從霎哈嘉瑜伽的觀點，氣喘的原因有如下數種：", "A.來自右心輪(right heart)的問題，即\"與父親的關係\"。若和父親的關係不佳，或有一個不好的父親(如太過嚴厲，或虐待子女)，或自幼喪父，或父親的亡魂徘徊不去，或本身就是一個不好的父親，或未盡到父親的責任，則皆有可能造成右心輪的阻塞，而產生氣喘的毛病。 B.來自過熱的肝。這原因可能是脾氣不好，或太過右脈(即行動、思考或計劃未來太多)。一旦肝太熱(肝臟在腹輪及臍輪的右側)，這熱氣可能上升影響右心輪。在此種情形下，則右腹輪、右臍輪及右心輪都會阻塞。 C.來自心輪的没有安全感，如父母離婚，或父母常在孩子面前吵架，或自幼喪失父母，或從小就没有愛的感覺，皆有可能造成缺乏安全感，進而引起氣喘。(見1982-04-02) D.來自左脈的問題。這是因左脈而產生的過敏性氣喘(left sided asthma-allergy，見1986-11-04, 譯者註：過敏是來自左臍輪的問題)。前述的A及B兩種則是右脈造成的氣喘。", "若以Shri Mataji 演講中談到氣喘的原因的次數來看，A 、B各約有數十次，C、D則只有數次，似乎A及B是較常見的原因。但氣喘也可能是數種原因的綜合。", "如何治療呢？首先若有肝過熱的問題(即B), 必須用冰及能量化的鹽(vibrated salt)來敷肝臟，也可以多吃糖、少吃鹽，及喝能量化的水(vibrated water)。至於D種的過敏性氣喘則可用Gheru(或拼成Geeru，印度的一種土)及鈣質(calcium)。若是亡魂附身的氣喘，可以對亡魂說: 你已得到自覺,可以照顧自己, 請亡魂離去，不用再擔心。當然不論那一種原因，針對阻塞的輪穴來清除，絕對是最重要的。Shri Mataji 談到氣喘時皆強調霎哈嘉靜坐可以完全療癒氣喘，也唯有通過自覺及三脈七輪的平衡及清潔，才可能完全根除氣喘。", "註一:綜合摘譯自Shri Mataji 的談話，數目太多故不附上演講的時間。"]}, {"num": "14-1", "catTitle": "新人", "catNum": 14, "title": "在霎哈嘉你會碰到各式各樣的人", "paragraphs": ["***前言：**如何在霎哈嘉自處，如何看待在霎哈嘉碰到的人，這是初學者的功課之一。霎哈嘉對所有人開放，又對成員極其包容，這也造成一些初學者會因某些練習者的行為，得到錯誤的印象，從而誤判霎哈嘉。其實那些有問題的人並不能代表霎哈嘉，Shri Mataji 在談話中常提醒這一點，這譯文只是其中之一。*", "**譯文：**", "來到霎哈嘉的人有許多不同的種類。其中有些人只是想獲得健康，一旦健康改善了，他們就消失了。若他們身體又出現毛病，他們又會回來。霎哈嘉對他們而言，只是為了身體的健康。我們很難幫助這類型的人，因為他們的願望太有限、太渺小了。", "另外有一些人則是來霎哈嘉展現他們的自我、滿足他們的存在感、展示他們的重要性，\"你看，我是這個、那個\"。他們也會試圖拉攏同黨、組小團體。和這非常類似的、也十分常見的，即有人來霎哈嘉搞政治，他們試圖去找負責人的麻煩、反對這個那個，說：\"負責人有這個問題、那個問題\" 等等。", "第三種人(偶而)會出現在霎哈嘉的聚會、活動，但是他們並不定期來中心，他們和集體保持一種疏遠的關係，一段時間後，他們就流失了。一旦他們有麻煩、有疾病，他們則又回來。", "另外有一種人來霎哈嘉只是想撈錢，這邊撈一些，那邊撈一些。他們仍未走出他們的貪婪。", "不論你心中仍有貪婪，或是怨恨，或是一種自傲，或是一種疏離感，這些都表示你仍必須改進，必須要去處理這些問題。或是你仍會生大氣，或是你對某些人、事非常執着、依戀，如有些練習者仍十分依戀他們的小孩，這些都表示你仍必須(好好)反省。", "在霎哈嘉裏，你(就是)會碰到各式各樣的人，(如同上面講的種種)，但你需要重視、注目的應該是你自己的昇進，你最需要擔心的是如何糾正、改進自己。", "註一：請也參考相關譯文：14-2''最重要的是看顧自己''。 註二： 1996-03-10。"]}, {"num": "14-2", "catTitle": "新人", "catNum": 14, "title": "最重要的是看顧自己", "paragraphs": ["對霎哈嘉練習者來講，最重要的是看顧(watch)自己，而不是注意到別人是如何，尤其當你還沒有昇進到某一個程度。霎哈嘉的大門是對所有人開放，所以一些有負面能量的人也會進來，他們可能仍然在霎哈嘉的邊緣遊走。當你看到這種人，你可能會想：\"這怎麼可能？霎哈嘉裏面怎麼會有這種人？這個人的行為是如此如此，他怎麼會是一個霎哈嘉練習者呢？\"。其實當你看到一個霎哈嘉練習者的行為達不到標準，或他的行事和一般世俗大眾無異，或甚至更糟糕，這時只有一點是確定的，那即是：他並不是一個霎哈嘉練習者！他的行為舉止是和霎哈嘉無關！", "但是他是他，你是你，你必須當一個霎哈嘉練習者。不要以這些人的行為來衡量、來論斷霎哈嘉！你應該以你自己的昇進、以你自己的自覺(enlightment)來衡量霎哈嘉。當你内在沒有光、還没有自覺時，你無法看清楚外界的種種。甚至當你内在只有一絲絲光，但並未完全自覺時，你只會看見別人的問題。你應該看顧自己，而不是去看顧別人。你來霎哈嘉是為了你自己的昇進，而不是為了別人的昇進。當你學會看顧自己，你會慢慢變得更有覺知、更清醒。當這覺知更進一步成長，真理就會如其所如地呈現在你的眼前。", "這些只注意到別人的練習者，其實他們的注意力是有問題的。他們的注意力放在這裏、那裏，他們試圖發現出什麼，然後他們就開始論東論西。他們會結成一個小羣体，他們講的都是一些流言(gossip)，他們正是耶穌基督講的成日東家長西家短的靈魂(murmuring souls)。這些人不只在集體内會造成一些問題，他們也會樂於毀滅你的自覺，因為這是他們無法達到的。有時他們也會以一種方式來和你談話，造成你開始懷疑自己、懷疑霎哈嘉。或是他們對别人談論你，從而給你製造一些麻煩。這就是為什麼耶穌基督兩千年前就警告我們：\" 小心這些東家長西家短的靈魂(Beware of the murmuring souls !)\".", "註一： 1988-07-27."]}, {"num": "14-3", "catTitle": "新人", "catNum": 14, "title": "學習所有霎哈嘉瑜伽的知識", "paragraphs": ["當你内在錫呂格涅沙( Shri Ganesha )的特性被喚醒後，如小孩子一般的特質就會逐漸在你身上展現出來。小孩子的特質之一即是他們正在成長，他們對很多事情都很好奇，而且他們有很強的能力去學習新東西。正因為他們認為自己所知甚少，所以他們有很強的學習意願及學習容量。", "你們剛踏入霎哈嘉的領域，在這屬靈、屬於根本知識的領域中，你們正猶如小孩子一般。你們應如小孩子一樣謙虛，知道自己所知有限，如此才會去努力學習新知識，才能昇進。若你自以為所知甚多，或懶得去學習更多的霎哈嘉知識，這對你的昇進是非常危險的。", "我看到許多人來到霎哈嘉，自稱是霎哈嘉練習者，可是對霎哈嘉的知識所知甚少，這個現象是讓我十分吃驚。到霎哈嘉絕對不是只是唱歌而已！你必須去了解霎哈嘉的所有的知識，包括各種疾病是因為那一個輪穴出問題？應如何治療？什麼是左脈(心理)的毛病？心理學講的是什麼？各輪穴的特性、神祇、阻塞原因及治療方法等等。此外關於無所不在的神聖力量( Divine Power ) 本身及其如何運作，你都必須去了解。", "註一： 1985-12-31。Shri Mataji在1980年代對練習者的談話時常提到此一課題。"]}, {"num": "14-4", "catTitle": "新人", "catNum": 14, "title": "不要當一個平庸的瑜伽士", "paragraphs": ["你們也可以去讀其他(非霎哈嘉)的書，奥地利的練習者在這方面做得很好。他們目前在研究可蘭經，他們去了解可蘭經及聖經在講什麼，那些内容有問題？是誰編篡聖經？為什麼那些錯誤的内容會被放入聖經？等等.......。霎哈嘉的練習者必須像學者一樣，且是真正讀書的學者。", "你們不應該是平庸的人，無論你從事什麼職業，你就應該成為這方面的專家，而不是一個平凡普通的人。假如你在你的工作領域只是一個平庸者，那麼你這個霎哈嘉練習者有什麼特殊呢？你們都可以有非凡的表現，因為你們都有能力做到，因為你們(的内在)都已被喚醒了。你有許多的能量流向你，你越常使用這個能量，你就獲得越多的能量，那麼爲什麼不在工作上表現得更好呢？", "在霎哈嘉的領域也一樣，你們要讀更多的書，必須去了解這些知識，你們應該有一些擁有足夠的霎哈嘉知識的知識份子，可以向外人解釋霎哈嘉，若只有一二人可以說明解釋霎哈嘉，而其他人都不行，那並不恰當。", "在霎哈嘉裏變成基本教義派固然是不對，但是成為不成長、安靜不動的團體也是不對的。我們固然在霎哈嘉裏享受，但我們也必須成長。我們必須學更多、了解更多、思考更多。有許多事要去做，譬如你們有多少人天天看報紙呢？每一個人都必須看報紙，了解世界各地發生的各種問題。你的注意力放在任何一個地方，那裏的問題就會獲得解決。這就爲什麼我看報紙，注意現在以色列發生了什麼事等等。", "同樣地你也應該好好準備，你應該知道各地發生了什麼事。但不用去讀那些醜聞的報導，那些是没有任何意義的。而是要去讀一些實際的東西，看報紙主筆室(編輯室)的評論、社論及專家評論等等。此外，你們也需要讀書，我們需要一些所謂的知識分子，能面對外在的世界，告訴他們什麼是霎哈嘉。但是不要因為有一些知識就去炫耀，有些人就是有此種習慣------喜歡上台去炫耀他們知道這個、知道那個。不是這樣的，而是要在你自己的内在有一層更深的了解。所有你在書上看到的、學到，你必須將之轉化成霎哈嘉的形式，以霎哈嘉的方式表達出來，或從霎哈嘉的觀點來看這些。在中心(ashram)你們應該有一些書(譯者：由前後文看，很明顯並非指霎哈嘉的書而已)，你們應該要讀書，並彼此間來共同討論這些書。", "註一： 1992-02-27."]}, {"num": "14-5", "catTitle": "新人", "catNum": 14, "title": "有關相片的一些談話(之一)----我的相片是有能量的", "paragraphs": ["一位聽衆問：聽說你們靜坐時要用相片？", "Shri Mataji 如是回答： .........重點是我的相片是有能量(vibration)的，不只它有巨大的能量，而且可以用它來治療病人。有一次一對夫妻專程來找我，那時我正在印度一個偏遠的村莊，他們希望我能幫他小孩，那個小男孩人在美國，罹患了可怕的血癌。我找人通知一位住在紐約的霎哈嘉靜坐練習者去看他。她只用我的相片就治好了他的血癌。你可以說這相片就像盤尼西林一樣神奇的藥，那你會不去用它嗎？其實我也不知道當代的相機是如此的神奇，相機是比人(眼睛)更敏銳，事實上相機可以捕捉(拍到)許多人眼睛無法看到的。例如有一次我在一個村落公開演講，那裏以前住了一位自覺的靈( 譯者：指聖人)。我在演講時，連續六次有一片光芒灑在我頭上的，當時正好有人用相機拍攝我，將這景象都拍攝下來，但是在場人們的眼睛都未看到那光柱。(我知道是那位聖人來向我打招呼)，第七次時我用我的手在頭上揮揮，那光柱才不見。我不知道他們是否有帶來這相片，若有，你們可以自己去看看。相機是如此地敏鋭、深入且忠實地把全貌都拍攝下來。另外一次，有人用相機拍我的腳趾，當時我正告訴聽衆我的兩個輪穴在努力清潔一些阻塞。在相片上可以看到有一道光柱從一個腳趾射出來，另一光柱則從手指出來，那腳趾及手指所對應的正是我講到有阻塞的輪穴。", "(既然我相片是如此)，我應該是有一些特別吧！最好你自己去體驗，我常告訴這些霎哈嘉靜坐練習者不要對初學者談太多相片的事----雖然我今天也說了----因為我不希望惹怒了初學者。有些初學者可能會想：\"你看！她要用相片來掌控我們！\"。當代的人都很有控制欲，他們尤其不喜歡被掌控的感覺。但是，是否有人是如此地愛你，以致連她的相片也可以散發出愛你的光芒？可能是如此吧！或許這是你們所無法理解的。或許有人就是愛的化身，以致這相片也有滿滿的愛在裏面。如果你願意，你可以使用這相片。", "在我之前沒有人(譯者：指降世神祇或聖人)有留下相片，耶穌没有照過相，佛陀也没有，穆罕默德也没有。近代人類發明了這神奇的相機，所以才有我的相片。 另一次，有一位負責香港某電視台的女士，她感受到我身上的能量，她告訴我：\"錫呂瑪塔吉，為什麼不試試將妳放到電視螢幕上？\"，我說：\"這個建議不錯！\"，於是她讓我上螢幕三分鐘，同時要求觀眾將雙手朝向電視中的我。結果有許多感到涼風的觀眾寫信來，也因此我們建立了香港的靜坐中心。", "對某些人而言，接受我的相片是相當困難，因為某些宗教不容許崇拜偶象(相片)。但這種說法是在相片出現之前。相片其實是一個很能反映真實的工具，你自行可以試試看，一旦你試驗後，你將會接受並喜歡上它。", "1980也有類似的問題，觀眾問：你的相片是如何能幫我們呢？ Shri Mataji 答：相片是一很可以正確反映又可靠(authentic)的工具，所有被認為有能量的聖物(如某些石頭)並不是這麼可靠。因為有強大的能量流通經過我，而我的相片也散發相同的能量。當我發現此一事實(即相片也有能量)時，我是有難以言喻的驚訝與喜悦。假如你們願意用我的相片，那你一定可以成就( 譯者：指提升靈量、得到自覺)；假如你不願意用我的相片，那麼恐怕就無法順利開始。假如你可以來聽我的演講，爲什麼無法使用我的相片呢？", "聽眾再問：我們現在是否正獲取妳的能量？", "Shri Mataji 答道：是的，但是你回家後用我的相片，你會更進一步深入，因為這相片一直在你身旁。你只需試試我今天跟你講的，你就試試看，到時候你就會知道我並未從你身上獲得什麼。", "假如你家裏放一張有神聖力量的人的相片，那麼一切都會很平安。這是為你好，我並沒有因為你用我的相片而獲得什麼好處。", "註一： 1982-04-14(前段)及1980-02-08(後段).另外在1977-03-22, 1978-01-31, 1980-05-18, 1982-04-28, 1985-07-04, 1995-10-01 Shri Mataji 皆強調過\"我的相片是有能量的\"."]}, {"num": "14-6", "catTitle": "新人", "catNum": 14, "title": "有關相片的一些談話(之二)----為什麼用妳的相片？", "paragraphs": ["不要去想太多！這是開始學霎哈嘉靜坐的一個重點。首先你就是嘗試看看，再試試看。因為假如你心中有太多的懷疑，那麼你的進展將會很緩慢。你應該像一個科學家一樣，(先把我所講的當成一個假說)，就先去試試看，然後再一步步地去接受它。光是去做看看，你也不必付我任何錢，你也不必(辛苦)去做一些如特技表演的瑜伽動作。但是對對初學者而言，他們就會卡在一些小問題，如我的相片就是常見的一個。他們會問：為什麼是用你的相片？ 我說：那就用你自己的相片試試。但是我可以告訴你那是不會有作用的。假如用別人的相片會有所幫助，那麼我是會非常高與的！問題是別人的相片都沒有作用，只有我的相片可以幫助你，那麼要怎麼辦呢？縱使你不喜歡，你也只能用我的相片來試試看。就是這麼簡單！我並没有因你用我的相片而獲得什麼。我也不希望從你身上獲取什麼，事實上你也無法給我什麼！你學了這靜坐之後，你只會更享受，你會享受我的愛。我做這一切完全為了你，為了你自己的享受！ (1983-03-13)", "觀眾問：靜坐時用相片是什麼用途？ Shri Mataji：假如你可以不用相片來學霎哈嘉靜坐，那麼當然是非常好，問題是並無法這樣。開始學霎哈嘉靜坐時你需要一些幫助，這就為什麼初學者使用相片。你若不需要相片，那是OK的，但你將會發現你是需要相片的。", "觀眾再問：請問您如何喚醒昆達里尼(Kundalini)？ Shri Mataji：這原本就是我的工作(譯者：Shri Mataji的意思是：我生來就會)。就像母親大地讓種了發芽，她是如何做到的？這個能力天生就内建在母親大地之内，這就是她的能力(power)。(2000-06-01)", "觀眾問：是您的相片的象徵(symbol)散發出能量，或是其他？ Shri Mataji：我的相片有一些特別的係數(coefficience)，所以它可發出能量。其實我比較希望有一些古代聖人的相片可以取代我的相片，但是看來是没有，沒有任何一個降世神祗或聖人曾經拍攝相片(因為那時候没有相機)，甚至在世時也没有留下任何寫真畫像。假如你知道他們的一生，你就知道為什麼，因為他們在世時，幾乎都被迫害，有太多人追在背後試圖迫害他們。........(1990-08-11)", "你可以使用我的相片，因為它有能量。但是人們往往會質問為何使用我的相片。其實近代是人類史上第一次可以拍攝相片，克里希納(Shri Krishna)没有相片，羅摩(Shri Rama)也没有相片，耶穌也没有，穆罕默德也没有，只有近代才有相片。我們可以說相機的發明來的正是時候，如此才可能有大規模的自覺。許多人已經藉由相片得到自覺，那你為什麼不試試呢？假如你可以從相片獲得一些助益，為什麼你不做呢？ 另外有些人會問為什麼你要做這些事(即教靜坐給自覺)？我要說的是：假如你能做，那麼我會是世界上最高興的人，因為我可以休息了！(1982-04-28)", "註一：1983-03-13, 2001-06-01, 1990-08-11, 1982-04-28."]}];

// ---------- Highlights ----------
function loadHighlights(){
  try{ return JSON.parse(localStorage.getItem(HIGHLIGHT_KEY) || '{}'); }
  catch(e){ return {}; }
}
function saveHighlights(obj){
  localStorage.setItem(HIGHLIGHT_KEY, JSON.stringify(obj));
}
function getHighlightsFor(sectionIdx, key){
  const all = loadHighlights();
  const sec = all[sectionIdx];
  if(!sec || !sec[key]) return [];
  return sec[key].slice().sort((a,b) => a.start - b.start);
}
function addHighlight(sectionIdx, key, start, end, color){
  const all = loadHighlights();
  if(!all[sectionIdx]) all[sectionIdx] = {};
  if(!all[sectionIdx][key]) all[sectionIdx][key] = [];
  let list = all[sectionIdx][key];
  list.push({ id: 'h' + Date.now() + Math.floor(Math.random()*1000), start, end, color: color || '#f4cf6b' });
  list.sort((a,b) => a.start - b.start);
  const merged = [];
  list.forEach(h => {
    const last = merged[merged.length - 1];
    if(last && h.start <= last.end){
      last.end = Math.max(last.end, h.end);
      last.color = h.color; // newest color wins for merged range
    } else {
      merged.push(Object.assign({}, h));
    }
  });
  all[sectionIdx][key] = merged;
  saveHighlights(all);
}
function removeHighlight(sectionIdx, key, id){
  const all = loadHighlights();
  if(!all[sectionIdx] || !all[sectionIdx][key]) return;
  all[sectionIdx][key] = all[sectionIdx][key].filter(h => h.id !== id);
  if(all[sectionIdx][key].length === 0) delete all[sectionIdx][key];
  if(Object.keys(all[sectionIdx]).length === 0) delete all[sectionIdx];
  saveHighlights(all);
}
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderParaText(pEl, text, key){
  pEl.setAttribute('data-key', key);
  const hls = getHighlightsFor(currentSection, key);
  if(!hls.length){ pEl.textContent = text; return; }
  let html = '';
  let pos = 0;
  hls.forEach(h => {
    const s = Math.max(0, Math.min(text.length, h.start));
    const e = Math.max(s, Math.min(text.length, h.end));
    const color = h.color || '#f4cf6b';
    html += escapeHtml(text.slice(pos, s));
    html += `<mark class="user-hl" data-hl-id="${h.id}" style="background:${color}">${escapeHtml(text.slice(s, e))}</mark>`;
    pos = e;
  });
  html += escapeHtml(text.slice(pos));
  pEl.innerHTML = html;
}

let currentSection = 0;
let fontSize = parseInt(localStorage.getItem(FONT_KEY) || '17', 10);

const tocList = document.getElementById('tocList');
const screenToc = document.getElementById('screen-toc');
const screenReader = document.getElementById('screen-reader');
const screenMynotes = document.getElementById('screen-mynotes');
const screenFavorites = document.getElementById('screen-favorites');

function renderToc(){
  const chapCount = new Set(sections.map(s => s.catNum)).size;
  const coverStatsEl = document.getElementById('coverStats');
  if(coverStatsEl) coverStatsEl.textContent = `${chapCount}章・${sections.length}篇`;
  tocList.innerHTML = '';
  // group sections by chapter (catNum/catTitle), preserving order
  const chapterGroups = [];
  let currentGroup = null;
  sections.forEach((s, i) => {
    if(!currentGroup || currentGroup.catNum !== s.catNum){
      currentGroup = { catNum: s.catNum, catTitle: s.catTitle, items: [] };
      chapterGroups.push(currentGroup);
    }
    currentGroup.items.push({ s, i });
  });

  chapterGroups.forEach(group => {
    const chapEl = document.createElement('div');
    chapEl.className = 'toc-chapter';
    chapEl.innerHTML = `
      <div class="toc-chapter-head">
        <div class="toc-chapter-num">${String(group.catNum).padStart(2,'0')}</div>
        <div>
          <div class="toc-chapter-title">${group.catTitle}</div>
          <div class="toc-chapter-count">${group.items.length} 篇</div>
        </div>
        <div class="toc-chapter-chevron">▾</div>
      </div>
      <div class="toc-chapter-body"></div>
    `;
    const head = chapEl.querySelector('.toc-chapter-head');
    const body = chapEl.querySelector('.toc-chapter-body');
    group.items.forEach(({ s, i }) => {
      const row = document.createElement('div');
      row.className = 'toc-article-row';
      row.innerHTML = `<div class="toc-num">${s.num}</div>
        <div class="toc-title">${escapeHtml(s.title.replace(s.num + ' ', ''))}</div>
        <div class="toc-arrow">▸</div>`;
      row.addEventListener('click', (e) => {
        e.stopPropagation();
        openSection(i, true);
      });
      body.appendChild(row);
    });
    head.addEventListener('click', () => {
      const wasOpen = chapEl.classList.contains('open');
      chapEl.classList.toggle('open');
      body.style.maxHeight = wasOpen ? null : (body.scrollHeight + 'px');
    });
    tocList.appendChild(chapEl);
  });
}

function checkContinue(){
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  const card = document.getElementById('continueCard');
  if(saved && sections[saved.section]){
    card.classList.add('show');
    document.getElementById('continueTitle').textContent = sections[saved.section].title;
    card.onclick = () => openSection(saved.section, true, saved.scroll);
  }
}

function getParaTextByKey(sectionIdx, key){
  const paras = sections[sectionIdx].paragraphs;
  if(key[0] === 'm'){
    const rest = key.slice(1);
    const parts = rest.split('_');
    const i = parseInt(parts[0], 10), li = parseInt(parts[1], 10);
    const raw = paras[i];
    if(raw && raw.startsWith(POEM_MARK)){
      const lines = raw.slice(POEM_MARK.length).split(LINE_SEP);
      return lines[li] || '';
    }
    return '';
  } else if(key[0] === 'a'){
    const i = parseInt(key.slice(1), 10);
    return (paras[i] || '').replace(/^-+/, '').trim();
  } else if(key[0] === 'p'){
    const i = parseInt(key.slice(1), 10);
    return paras[i] || '';
  }
  return '';
}

function renderMyNotes(){
  const all = loadHighlights();
  const summary = document.getElementById('mynotesSummary');
  const list = document.getElementById('mynotesList');
  const items = [];
  Object.keys(all).forEach(secIdxStr => {
    const secIdx = parseInt(secIdxStr, 10);
    if(!sections[secIdx]) return;
    Object.keys(all[secIdxStr]).forEach(key => {
      all[secIdxStr][key].forEach(h => {
        const fullText = getParaTextByKey(secIdx, key);
        const snippet = fullText.slice(h.start, h.end);
        if(!snippet) return;
        items.push({ secIdx, key, id: h.id, snippet, title: sections[secIdx].title });
      });
    });
  });
  if(items.length === 0){
    summary.classList.remove('show');
    list.innerHTML = '<div class="mynotes-empty">還沒有標記任何重點</div>';
    return;
  }
  summary.classList.add('show');
  document.getElementById('mynotesSummaryTitle').textContent = `共 ${items.length} 則`;
  list.innerHTML = '';
  items.forEach(it => {
    const el = document.createElement('div');
    el.className = 'mynote-item';
    el.innerHTML = `<div class="mn-body"><div class="mn-chap">${escapeHtml(it.title)}</div><div class="mn-text">${escapeHtml(it.snippet)}</div></div><div class="mn-del">✕</div>`;
    el.querySelector('.mn-body').addEventListener('click', () => {
      openSection(it.secIdx, true);
      setTimeout(() => {
        const mk = document.querySelector(`mark[data-hl-id="${it.id}"]`);
        if(mk) mk.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 80);
    });
    el.querySelector('.mn-del').addEventListener('click', (e) => {
      e.stopPropagation();
      removeHighlight(it.secIdx, it.key, it.id);
      renderMyNotes();
    });
    list.appendChild(el);
  });
}

function splitTitle(title){
  const m = title.match(/^(.*?)[（(]([^）)]*)[）)]\s*$/);
  if(m){
    return { main: m[1].trim(), sub: '（' + m[2].trim() + '）' };
  }
  return { main: title, sub: null };
}

// ---------- Favorites ----------
function loadFavorites(){
  try{ return JSON.parse(localStorage.getItem(FAVORITES_KEY) || '[]'); }
  catch(e){ return []; }
}
function saveFavorites(arr){
  localStorage.setItem(FAVORITES_KEY, JSON.stringify(arr));
}
function isFavorited(idx){
  return loadFavorites().includes(idx);
}
function toggleFavorite(idx){
  const favs = loadFavorites();
  const pos = favs.indexOf(idx);
  if(pos === -1){ favs.push(idx); } else { favs.splice(pos, 1); }
  saveFavorites(favs);
  return favs.includes(idx);
}
function updateFavToggleUI(){
  const on = isFavorited(currentSection);
  favToggle.classList.toggle('active-mode', on);
  favToggle.textContent = on ? '♥' : '♡';
}
function renderFavorites(){
  const favs = loadFavorites().filter(idx => sections[idx]);
  const summary = document.getElementById('favSummary');
  const list = document.getElementById('favoritesList');
  if(favs.length === 0){
    summary.classList.remove('show');
    list.innerHTML = '<div class="mynotes-empty">還沒有收藏任何文章</div>';
    return;
  }
  summary.classList.add('show');
  document.getElementById('favSummaryTitle').textContent = `共 ${favs.length} 篇`;
  list.innerHTML = '';
  favs.forEach(idx => {
    const s = sections[idx];
    const el = document.createElement('div');
    el.className = 'mynote-item';
    el.innerHTML = `<div class="mn-body"><div class="mn-chap">${escapeHtml(s.catTitle)}</div><div class="mn-text">${escapeHtml(s.title)}</div></div><div class="mn-del">✕</div>`;
    el.querySelector('.mn-body').addEventListener('click', () => {
      openSection(idx, true);
    });
    el.querySelector('.mn-del').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(idx);
      renderFavorites();
    });
    list.appendChild(el);
  });
}

function openSection(idx, saveIt, scrollFrac){
  currentSection = idx;
  const s = sections[idx];
  document.getElementById('chapEyebrow').textContent = `第${s.catNum}章　·　${s.catTitle}`;
  document.getElementById('chapTitle').textContent = s.title;
  const body = document.getElementById('chapContent');
  body.innerHTML = '';

  const paras = s.paragraphs;
  const FOOTNOTE_SPLIT_RE = /(?=(?:^|\s)註[〇○零一二三四五六七八九十百千0-9０-９＃#]{1,4}[：:])/;
  const FOOTNOTE_TEST_RE = /(?:^|\s)註[〇○零一二三四五六七八九十百千0-9０-９＃#]{1,4}[：:]/;
  const STEP_SPLIT_RE = /(?=(?:^|\s)[1-9１-９][．.]\s)/;
  paras.forEach((p, i) => {
    const stepMatches = p.match(/(?:^|\s)[1-9１-９][．.]\s/g);
    if(stepMatches && stepMatches.length >= 3){
      const parts = p.split(STEP_SPLIT_RE).map(t => t.trim()).filter(t => t.length > 0);
      parts.forEach((part, pi) => {
        const pEl = document.createElement('p');
        pEl.className = 'footnote-line';
        renderParaText(pEl, part, `p${i}_${pi}`);
        body.appendChild(pEl);
      });
      return;
    }
    if(FOOTNOTE_TEST_RE.test(p)){
      const parts = p.split(FOOTNOTE_SPLIT_RE).map(t => t.trim()).filter(t => t.length > 0);
      if(parts.length >= 1){
        parts.forEach((part, pi) => {
          const pEl = document.createElement('p');
          pEl.className = 'footnote-line';
          renderParaText(pEl, part, `p${i}_${pi}`);
          body.appendChild(pEl);
        });
        return;
      }
    }
    const pEl = document.createElement('p');
    renderParaText(pEl, p, `p${i}`);
    body.appendChild(pEl);
  });
  applyFontSize();
  updateFavToggleUI();

  // prev/next
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if(idx <= 0){ prevBtn.classList.add('disabled'); }
  else { prevBtn.classList.remove('disabled'); document.getElementById('prevTitle').textContent = sections[idx-1].title; }
  if(idx >= sections.length - 1){ nextBtn.classList.add('disabled'); }
  else { nextBtn.classList.remove('disabled'); document.getElementById('nextTitle').textContent = sections[idx+1].title; }

  screenToc.classList.remove('active');
  screenMynotes.classList.remove('active');
  screenReader.classList.add('active');
  window.scrollTo(0,0);
  const rb = document.getElementById('readerBody');
  if(scrollFrac){
    requestAnimationFrame(()=>{ window.scrollTo(0, scrollFrac * (document.body.scrollHeight - window.innerHeight)); });
  }
  updateProgress();
  if(saveIt !== false){ persistProgress(); }
}

function persistProgress(){
  const doc = document.documentElement;
  const scrollFrac = window.scrollY / Math.max(1,(document.body.scrollHeight - window.innerHeight));
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ section: currentSection, scroll: scrollFrac }));
}

function updateProgress(){
  const frac = window.scrollY / Math.max(1,(document.body.scrollHeight - window.innerHeight));
  document.getElementById('progressFill').style.width = Math.min(100, Math.max(0, frac*100)) + '%';
}

window.addEventListener('scroll', () => {
  if(screenReader.classList.contains('active')){
    updateProgress();
  }
});
window.addEventListener('beforeunload', () => {
  if(screenReader.classList.contains('active')) persistProgress();
});
let scrollSaveTimer;
window.addEventListener('scroll', () => {
  if(!screenReader.classList.contains('active')) return;
  clearTimeout(scrollSaveTimer);
  scrollSaveTimer = setTimeout(persistProgress, 500);
});

document.getElementById('backBtn').addEventListener('click', () => {
  persistProgress();
  setHlMode(false);
  screenReader.classList.remove('active');
  screenToc.classList.add('active');
  checkContinue();
  renderMyNotes();
  renderFavorites();
  window.scrollTo(0,0);
});

document.getElementById('mynotesSummary').addEventListener('click', () => {
  screenToc.classList.remove('active');
  screenMynotes.classList.add('active');
  window.scrollTo(0,0);
});

document.getElementById('mynotesBackBtn').addEventListener('click', () => {
  screenMynotes.classList.remove('active');
  screenToc.classList.add('active');
  window.scrollTo(0,0);
});

document.getElementById('favSummary').addEventListener('click', () => {
  screenToc.classList.remove('active');
  screenFavorites.classList.add('active');
  window.scrollTo(0,0);
});

document.getElementById('favoritesBackBtn').addEventListener('click', () => {
  screenFavorites.classList.remove('active');
  screenToc.classList.add('active');
  window.scrollTo(0,0);
});

document.getElementById('prevBtn').addEventListener('click', () => {
  if(currentSection > 0) openSection(currentSection - 1, true);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if(currentSection < sections.length - 1) openSection(currentSection + 1, true);
});

function applyFontSize(){
  document.getElementById('readerBody').style.fontSize = fontSize + 'px';
  document.querySelectorAll('.reader-body p').forEach(p => p.style.fontSize = fontSize + 'px');
  localStorage.setItem(FONT_KEY, fontSize);
}
document.getElementById('fontInc').addEventListener('click', () => {
  fontSize = Math.min(24, fontSize + 1);
  applyFontSize();
});
document.getElementById('fontDec').addEventListener('click', () => {
  fontSize = Math.max(14, fontSize - 1);
  applyFontSize();
});

// Theme toggle
function applyTheme(t){
  document.body.setAttribute('data-theme', t);
  const icon = t === 'night' ? '☼' : '☾';
  document.getElementById('themeToggleCover').textContent = icon;
  document.getElementById('themeToggleReader').textContent = icon;
  localStorage.setItem(THEME_KEY, t);
}
function toggleTheme(){
  const cur = document.body.getAttribute('data-theme');
  applyTheme(cur === 'night' ? 'day' : 'night');
}
document.getElementById('themeToggleCover').addEventListener('click', toggleTheme);
document.getElementById('themeToggleReader').addEventListener('click', toggleTheme);
applyTheme(localStorage.getItem(THEME_KEY) || 'day');

// Search
const searchInput = document.getElementById('searchInput');
const searchResultsWrap = document.getElementById('searchResultsWrap');
const tocListWrap = document.getElementById('tocListWrap');

function highlight(text, q){
  const idx = text.indexOf(q);
  if(idx === -1) return text.slice(0, 60) + '…';
  const start = Math.max(0, idx - 18);
  const end = Math.min(text.length, idx + q.length + 40);
  let snippet = (start>0?'…':'') + text.slice(start, idx) + '<mark>' + text.slice(idx, idx+q.length) + '</mark>' + text.slice(idx+q.length, end) + (end<text.length?'…':'');
  return snippet;
}

function doSearch(q){
  q = q.trim();
  if(!q){
    searchResultsWrap.classList.add('empty');
    searchResultsWrap.innerHTML = '';
    tocListWrap.style.display = '';
    document.getElementById('continueCard').style.display = '';
    return;
  }
  tocListWrap.style.display = 'none';
  document.getElementById('continueCard').style.display = 'none';
  let results = [];
  sections.forEach((s, si) => {
    s.paragraphs.forEach(rawP => {
      const p = rawP.startsWith(POEM_MARK) ? rawP.slice(POEM_MARK.length).split(LINE_SEP).join('　') : rawP;
      if(p.includes(q)){
        results.push({ si, title: s.title, snippet: highlight(p, q) });
      }
    });
  });
  results = results.slice(0, 40);
  searchResultsWrap.classList.remove('empty');
  if(results.length === 0){
    searchResultsWrap.innerHTML = '<div class="sr-count">找不到相關內容</div>';
    return;
  }
  let html = `<div class="sr-count">找到 ${results.length} 筆結果</div>`;
  results.forEach(r => {
    html += `<div class="sr-item" data-si="${r.si}"><div class="sr-chap">${r.title}</div><div class="sr-snippet">${r.snippet}</div></div>`;
  });
  searchResultsWrap.innerHTML = html;
  searchResultsWrap.querySelectorAll('.sr-item').forEach(el => {
    el.addEventListener('click', () => {
      const si = parseInt(el.getAttribute('data-si'), 10);
      searchInput.value = '';
      doSearch('');
      openSection(si, true);
    });
  });
}
searchInput.addEventListener('input', (e) => doSearch(e.target.value));

renderToc();
checkContinue();
renderMyNotes();
renderFavorites();

const favToggle = document.getElementById('favToggle');
favToggle.addEventListener('click', () => {
  toggleFavorite(currentSection);
  updateFavToggleUI();
});

// ---------- Highlight mode (select text, tap a color in the fixed bottom bar) ----------
const chapContentEl = document.getElementById('chapContent');
const hlModeToggle = document.getElementById('hlModeToggle');
const hlColorBar = document.getElementById('hlColorBar');
const readerBodyEl = document.getElementById('readerBody');
let hlModeOn = false;
let hlActiveColor = null;

function setHlMode(on){
  hlModeOn = on;
  hlModeToggle.classList.toggle('active-mode', on);
  hlColorBar.classList.toggle('show', on);
  readerBodyEl.classList.toggle('hl-mode-padding', on);
  if(!on){ window.getSelection().removeAllRanges(); lastCapturedSelection = null; }
}
hlModeToggle.addEventListener('click', () => setHlMode(!hlModeOn));
document.getElementById('hlDoneBtn').addEventListener('click', () => setHlMode(false));

function getOffsetWithin(container, node, offset){
  const preRange = document.createRange();
  preRange.selectNodeContents(container);
  preRange.setEnd(node, offset);
  return preRange.toString().length;
}

// Read whatever is currently selected, right now — called at the moment a
// swatch is pressed (mousedown/touchstart), before the browser has a chance
// to collapse the selection because of the tap itself.
function captureSelectionRange(){
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  const anchorNode = range.commonAncestorContainer;
  const elNode = anchorNode.nodeType === 3 ? anchorNode.parentElement : anchorNode;
  const pEl = elNode ? elNode.closest('p[data-key]') : null;
  if(!pEl || !chapContentEl.contains(pEl)) return null;
  if(!pEl.contains(range.startContainer) || !pEl.contains(range.endContainer)) return null;
  const start = getOffsetWithin(pEl, range.startContainer, range.startOffset);
  const end = getOffsetWithin(pEl, range.endContainer, range.endOffset);
  if(end <= start) return null;
  return { key: pEl.getAttribute('data-key'), start, end };
}

// Some mobile browsers (notably iOS Safari) collapse the text selection the
// moment any element is tapped, before our touchstart handler on the color
// swatch even runs. To work around this, we continuously track the most
// recent non-empty selection via 'selectionchange' and fall back to it if
// the live capture at tap-time comes back empty.
let lastCapturedSelection = null;
document.addEventListener('selectionchange', () => {
  const hl = captureSelectionRange();
  if(hl) lastCapturedSelection = hl;
});

hlColorBar.querySelectorAll('.hl-swatch').forEach(sw => {
  let firedAt = 0;
  const activate = (e) => {
    const now = Date.now();
    if(now - firedAt < 400) return; // avoid double-firing from both mousedown and touchstart
    firedAt = now;
    let hl = captureSelectionRange();
    if(!hl) hl = lastCapturedSelection;
    e.preventDefault();
    hlActiveColor = sw.getAttribute('data-color');
    hlColorBar.querySelectorAll('.hl-swatch').forEach(s2 => s2.classList.remove('selected'));
    sw.classList.add('selected');
    if(!hl) return;
    const fullText = getParaTextByKey(currentSection, hl.key);
    addHighlight(currentSection, hl.key, hl.start, hl.end, hlActiveColor);
    const pEl = chapContentEl.querySelector(`p[data-key="${hl.key}"]`);
    if(pEl) renderParaText(pEl, fullText, hl.key);
    renderMyNotes();
    lastCapturedSelection = null;
    window.getSelection().removeAllRanges();
  };
  sw.addEventListener('mousedown', activate);
  sw.addEventListener('touchstart', activate, { passive:false });
});

chapContentEl.addEventListener('click', (e) => {
  // Tapping an existing highlight always removes just that mark.
  const mk = e.target.closest('mark.user-hl');
  if(!mk) return;
  const pEl = mk.closest('p[data-key]');
  if(!pEl) return;
  const key = pEl.getAttribute('data-key');
  const id = mk.getAttribute('data-hl-id');
  removeHighlight(currentSection, key, id);
  const fullText = getParaTextByKey(currentSection, key);
  renderParaText(pEl, fullText, key);
  renderMyNotes();
});
