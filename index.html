<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>錫呂瑪塔吉演講節錄・初階版</title>
<meta name="theme-color" content="#8FA37E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="演講節錄・初階">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#7E9470;
    --gold-soft:#A8BC9B;
    --ink:#33362E;
    --ink-soft:#5B5F52;
    --soft:#F9FAF6;
    --card:#ffffff;
    --muted:#8B8F80;
    --border:#E3E7DC;
    --shadow:0 2px 18px rgba(51,54,46,0.06);
  }
  [data-theme="night"]{
    --gold:#A8BC9B;
    --gold-soft:#7E9470;
    --ink:#E4E8DE;
    --ink-soft:#B9BEB0;
    --soft:#1D1F1A;
    --card:#282B24;
    --muted:#767A6D;
    --border:#383C33;
    --shadow:0 2px 18px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--soft);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC",sans-serif;
    transition:background .4s ease, color .4s ease;
    overscroll-behavior-y:none;
  }
  .app{max-width:640px; margin:0 auto; min-height:100vh; position:relative;}

  /* ---------- Screens ---------- */
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- Cover / TOC screen ---------- */
  .cover{
    padding:44px 32px 12px;
    text-align:center;
  }
  .cover .mark{
    font-size:13px;
    letter-spacing:.4em;
    color:var(--gold);
    margin-bottom:22px;
  }
  .cover h1{
    font-family:"Noto Serif TC",serif;
    font-size:22px;
    font-weight:700;
    letter-spacing:.04em;
    margin:0 0 14px;
    line-height:1.4;
    white-space:nowrap;
  }
  .cover .author{
    font-size:15px;
    color:var(--ink-soft);
    letter-spacing:.15em;
    margin-bottom:2px;
  }
  .cover .author-en{
    font-size:14px;
    color:var(--muted);
    letter-spacing:.1em;
    margin-bottom:24px;
  }
  .cover .rule{
    width:34px;height:1px;background:var(--gold-soft);
    margin:26px auto;
    opacity:.6;
  }

  .continue-card{
    margin:0 24px 24px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    display:none;
    align-items:center;
    justify-content:space-between;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .continue-card.show{display:flex;}
  .continue-card .cc-label{font-size:12px; color:var(--muted); letter-spacing:.15em; margin-bottom:4px;}
  .continue-card .cc-title{font-size:16px; color:var(--ink); font-weight:500;}
  .continue-card .cc-arrow{color:var(--gold); font-size:16px;}

  .mynotes-summary{
    display:none;
    align-items:center; justify-content:space-between;
    margin:0 24px 24px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:var(--shadow);
    cursor:pointer;
  }
  .mynotes-summary.show{display:flex;}
  .mynotes-summary .ms-label{font-size:12px; color:var(--muted); letter-spacing:.15em; margin-bottom:4px;}
  .mynotes-summary .ms-title{font-size:16px; color:var(--ink); font-weight:500;}
  .mynotes-summary .ms-arrow{color:var(--gold); font-size:16px;}
  .mynotes-list{display:flex; flex-direction:column; gap:10px; padding:0 24px 100px;}
  .mynote-item{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 15px;
    cursor:pointer;
  }
  .mynote-item .mn-body{flex:1;}
  .mynote-item .mn-chap{font-size:11px; color:var(--gold); letter-spacing:.08em; margin-bottom:4px;}
  .mynote-item .mn-text{font-size:14px; color:var(--ink); line-height:1.7;}
  .mynote-item .mn-del{color:var(--muted); font-size:15px; padding:2px 4px; flex-shrink:0;}
  .mynotes-empty{padding:60px 24px; text-align:center; color:var(--muted); font-size:14px;}

  .search-wrap{
    padding:0 24px 18px;
  }
  .search-box{
    display:flex; align-items:center; gap:8px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:11px 16px;
  }
  .search-box span{color:var(--gold); font-size:15px;}
  .search-box input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:"Noto Sans TC",sans-serif;
    font-size:16px; color:var(--ink);
  }
  .search-box input::placeholder{color:var(--muted);}

  .search-results{
    padding:0 24px 12px;
  }
  .search-results.empty{display:none;}
  .sr-item{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .sr-item .sr-chap{font-size:12px; color:var(--gold); letter-spacing:.1em; margin-bottom:5px;}
  .sr-item .sr-snippet{font-size:15px; color:var(--ink-soft); line-height:1.7;}
  .sr-item mark{background:none; color:var(--gold); font-weight:600;}
  .sr-count{font-size:13px; color:var(--muted); padding:0 2px 10px; letter-spacing:.05em;}

  .toc-section-label{
    padding:0 24px 10px;
    font-size:12px;
    letter-spacing:.25em;
    color:var(--muted);
  }
  .toc-list{padding:0 24px 100px;}
  .toc-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 4px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .toc-item:last-child{border-bottom:none;}
  .toc-num{
    font-family:"Noto Serif TC",serif;
    font-size:14px;
    color:var(--gold-soft);
    min-width:24px;
  }
  .toc-title{
    flex:1;
    font-size:17px;
    color:var(--ink);
    font-weight:400;
    letter-spacing:.02em;
  }
  .toc-title-en{
    display:block;
    font-size:12px;
    font-style:italic;
    color:var(--gold-soft);
    letter-spacing:.06em;
    margin-top:3px;
  }
  .toc-arrow{color:var(--muted); font-size:14px;}
  .toc-item.preface .toc-title{font-family:"Noto Serif TC",serif; font-weight:500;}

  .toc-chapters{padding:0 24px 100px;}
  .toc-chapter{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    margin-bottom:10px;
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  .toc-chapter-head{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px;
    cursor:pointer;
  }
  .toc-chapter-num{
    flex-shrink:0;
    font-family:"Noto Serif TC",serif;
    width:34px; height:34px; border-radius:50%;
    background:var(--soft); color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:600;
  }
  .toc-chapter-title{flex:1; min-width:0; font-size:16px; color:var(--ink); font-weight:500; line-height:1.4;}
  .toc-chapter-count{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .toc-chapter-chevron{color:var(--muted); font-size:12px; transition:transform .25s ease; flex-shrink:0;}
  .toc-chapter.open .toc-chapter-chevron{transform:rotate(180deg);}
  .toc-chapter-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .toc-chapter.open .toc-chapter-body{border-top:1px solid var(--border);}
  .toc-article-row{
    display:flex; align-items:center; gap:12px;
    padding:14px 18px 14px 22px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .toc-article-row:last-child{border-bottom:none;}
  .toc-article-row .toc-num{min-width:34px; font-size:12.5px;}
  .toc-article-row .toc-title{font-size:15px;}

  .theme-toggle-fixed{
    position:fixed;
    top:20px; right:20px;
    width:42px;height:42px;
    border-radius:50%;
    background:var(--card);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    font-size:17px;
    cursor:pointer;
    z-index:50;
    box-shadow:var(--shadow);
  }

  /* ---------- Reader screen ---------- */
  .reader-top{
    position:sticky; top:0; z-index:40;
    background:var(--soft);
    padding:14px 18px 10px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .back-btn{
    display:flex; align-items:center; gap:6px;
    color:var(--gold);
    font-size:13px;
    letter-spacing:.05em;
    cursor:pointer;
    padding:6px 8px 6px 0;
  }
  .back-btn span.sym{font-size:15px;}
  .reader-controls{display:flex; align-items:center; gap:12px;}
  .font-controls{
    display:flex; align-items:center; gap:3px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:11px;
    padding:3px;
  }
  .fc-btn{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
    font-family:"Noto Serif TC",serif;
    font-weight:600;
    cursor:pointer;
    border-radius:8px;
  }
  .fc-btn:active{background:var(--soft);}
  .fc-btn.small{font-size:13px;}
  .fc-btn.big{font-size:20px;}
  .fc-divider{width:1px; height:20px; background:var(--border);}
  .theme-btn-inline{
    width:40px;height:40px;
    border-radius:11px;
    background:var(--card);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    font-size:16px;
    cursor:pointer;
  }
  .theme-btn-inline:active{background:var(--soft);}
  .theme-btn-inline.active-mode{
    background:var(--gold);
    color:#fff;
    border-color:var(--gold);
  }
  #hlModeToggle{
    color:#e8552f;
    border-color:#f0c3b3;
  }
  #hlModeToggle.active-mode{
    background:#e8552f;
    color:#fff;
    border-color:#e8552f;
  }
  #favToggle{
    color:#c25b6b;
    border-color:#f0c9cf;
    font-size:18px;
  }
  #favToggle.active-mode{
    background:#c25b6b;
    color:#fff;
    border-color:#c25b6b;
  }

  .progress-track{
    height:2px; background:var(--border);
    position:sticky; top:68px; z-index:39;
  }
  .progress-fill{height:100%; background:var(--gold); width:0%; transition:width .1s linear;}

  .reader-body{
    padding:8px 30px 120px;
  }
  .chap-eyebrow{
    text-align:center;
    font-size:11px;
    letter-spacing:.3em;
    color:var(--muted);
    margin:26px 0 10px;
  }
  .chap-title{
    text-align:center;
    font-family:"Noto Serif TC",serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:.06em;
    margin:0 0 40px;
  }
  .chap-title-en{
    display:block;
    font-size:14px;
    font-style:italic;
    font-weight:500;
    color:var(--gold);
    letter-spacing:.1em;
    margin-top:8px;
  }
  .reader-body p{
    font-family:"Noto Serif TC",serif;
    line-height:2.15;
    letter-spacing:.03em;
    margin:0 0 1.6em;
    color:var(--ink);
    text-align:justify;
  }
  .poem-block{
    margin:1.8em 0;
    padding:0 4px;
  }
  .poem-block p{
    font-family:"Noto Serif TC",serif;
    line-height:1.85;
    letter-spacing:.04em;
    margin:0 0 0.35em;
    text-align:center;
    color:var(--ink-soft);
    font-style:italic;
  }
  .reader-body p.attribution{
    font-family:"Noto Sans TC",sans-serif;
    font-size:.85em;
    color:var(--muted);
    text-align:right;
    letter-spacing:.05em;
  }
  .reader-body p.footnote-line{
    font-family:"Noto Sans TC",sans-serif;
    font-size:.85em;
    color:var(--muted);
    text-align:left;
    line-height:1.9;
    letter-spacing:.02em;
    margin:0 0 0.5em;
  }
  .reader-body mark{
    background:rgba(169,137,90,.22);
    color:inherit;
    border-radius:2px;
  }
  .reader-body mark.user-hl{
    cursor:pointer;
    padding:0 1px;
    border-radius:2px;
  }
  .hl-colorbar{
    position:fixed;
    top:53px;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:640px;
    z-index:60;
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    padding:14px 22px;
    box-shadow:0 6px 22px rgba(0,0,0,.10);
  }
  .hl-colorbar.show{display:flex;}
  .hl-colorbar-label{font-size:12px; color:var(--muted); letter-spacing:.03em; flex:1; line-height:1.5;}
  .hl-swatch-row{display:flex; align-items:center; gap:11px;}
  .hl-swatch{
    width:26px;height:26px;
    border-radius:50%;
    border:2px solid transparent;
    box-shadow:0 0 0 1px var(--border);
    cursor:pointer;
  }
  .hl-swatch.selected{
    box-shadow:0 0 0 2px var(--ink);
  }
  .hl-done{
    font-size:13px; color:var(--gold); font-weight:600;
    letter-spacing:.05em;
    cursor:pointer;
    padding:6px 4px;
    flex-shrink:0;
  }
  .hl-mode-padding{ padding-bottom:70px; }

  .chap-nav{
    display:flex; justify-content:space-between; align-items:center;
    padding:30px 30px 60px;
    gap:14px;
  }
  .chap-nav-btn{
    flex:1;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    cursor:pointer;
  }
  .chap-nav-btn.disabled{opacity:.3; pointer-events:none;}
  .chap-nav-btn .cn-dir{font-size:10px; color:var(--gold); letter-spacing:.2em; margin-bottom:5px;}
  .chap-nav-btn.next{text-align:right;}
  .chap-nav-btn .cn-title{font-size:13px; color:var(--ink-soft); line-height:1.5;}

  ::selection{background:rgba(169,137,90,.3);}

  @media (min-width:641px){
    .app{box-shadow:0 0 60px rgba(74,66,56,.08); min-height:100vh;}
  }
</style>
</head>
<body data-theme="day">
<div class="app">

  <!-- ===== TOC / Home screen ===== -->
  <div class="screen active" id="screen-toc">
    <div class="theme-toggle-fixed" id="themeToggleCover">☾</div>
    <div class="cover">
      <h1>錫呂瑪塔吉演講節錄</h1>
      <div class="author">初階版</div>
      <div class="author-en" id="coverStats">14章・166篇</div>
    </div>

    <div class="continue-card" id="continueCard">
      <div>
        <div class="cc-label">◈ 繼續閱讀</div>
        <div class="cc-title" id="continueTitle"></div>
      </div>
      <div class="cc-arrow">▸</div>
    </div>

    <div class="mynotes-summary" id="mynotesSummary">
      <div>
        <div class="ms-label">✧ 我記下的重點</div>
        <div class="ms-title" id="mynotesSummaryTitle"></div>
      </div>
      <div class="ms-arrow">▸</div>
    </div>

    <div class="mynotes-summary" id="favSummary">
      <div>
        <div class="ms-label" style="color:#c25b6b;">♥ 我的收藏</div>
        <div class="ms-title" id="favSummaryTitle"></div>
      </div>
      <div class="ms-arrow" style="color:#c25b6b;">▸</div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <span>✦</span>
        <input type="text" id="searchInput" placeholder="搜尋全書內容…">
      </div>
    </div>

    <div id="searchResultsWrap" class="search-results empty"></div>

    <div id="tocListWrap">
      <div class="toc-section-label">目　錄</div>
      <div class="toc-chapters" id="tocList"></div>
    </div>
  </div>

  <!-- ===== Reader screen ===== -->
  <div class="screen" id="screen-reader">
    <div class="reader-top">
      <div class="back-btn" id="backBtn"><span class="sym">◂</span> 目錄</div>
      <div class="reader-controls">
        <div class="font-controls">
          <div class="fc-btn small" id="fontDec" title="縮小字級">A</div>
          <div class="fc-divider"></div>
          <div class="fc-btn big" id="fontInc" title="放大字級">A</div>
        </div>
        <div class="theme-btn-inline" id="themeToggleReader" title="日／夜間模式">☾</div>
        <div class="theme-btn-inline" id="favToggle" title="收藏">♡</div>
        <div class="theme-btn-inline" id="hlModeToggle" title="劃重點">✎</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="reader-body" id="readerBody">
      <div class="chap-eyebrow" id="chapEyebrow"></div>
      <h2 class="chap-title" id="chapTitle"></h2>
      <div id="chapContent"></div>
    </div>
    <div class="chap-nav">
      <div class="chap-nav-btn prev" id="prevBtn">
        <div class="cn-dir">◂ 上一篇</div>
        <div class="cn-title" id="prevTitle"></div>
      </div>
      <div class="chap-nav-btn next" id="nextBtn">
        <div class="cn-dir">下一篇 ▸</div>
        <div class="cn-title" id="nextTitle"></div>
      </div>
    </div>
  </div>

  <!-- ===== My Notes screen ===== -->
  <div class="screen" id="screen-mynotes">
    <div class="reader-top">
      <div class="back-btn" id="mynotesBackBtn"><span class="sym">◂</span> 目錄</div>
    </div>
    <div class="mynotes-list" id="mynotesList"></div>
  </div>

  <!-- ===== Favorites screen ===== -->
  <div class="screen" id="screen-favorites">
    <div class="reader-top">
      <div class="back-btn" id="favoritesBackBtn"><span class="sym">◂</span> 目錄</div>
    </div>
    <div class="mynotes-list" id="favoritesList"></div>
  </div>

  <div class="hl-colorbar" id="hlColorBar">
    <div class="hl-colorbar-label">按住文字拖曳選範圍，放開後點顏色</div>
    <div class="hl-swatch-row">
      <div class="hl-swatch" data-color="#f4cf6b" style="background:#f4cf6b"></div>
      <div class="hl-swatch" data-color="#a9c9a0" style="background:#a9c9a0"></div>
      <div class="hl-swatch" data-color="#e3a8ad" style="background:#e3a8ad"></div>
      <div class="hl-swatch" data-color="#9db4d1" style="background:#9db4d1"></div>
    </div>
    <div class="hl-done" id="hlDoneBtn">完成</div>
  </div>

</div>

<script>
const SECTIONS_RAW = [{"num": "1-1", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "靜坐的關鍵在無思慮的靜觀", "paragraphs": ["你每天都應該靜坐，那些不靜坐的人可能會下墜迷失，因為靜坐就像將油加進油燈裡面。以為自己可以不用靜坐的練習者是自己搞錯了，這是很不幸的事。他們也必須早晚靜坐，問題出在他們(到霎哈嘉後)輕易地獲得自覺與總總的好處，以致於他們不了解靜坐的重要性。靜坐可以有效地撫慰身心靈，也是一個和上天神聖的力量(Divine)來連結的上乘方法，所以你全部的問題都會在靜坐狀態中得到解決。假如你不靜坐，那麼或許你內在的光將逐步減弱，(有一天)你可能會沒有足夠的光了。", "許多人問我：\"如何做靜坐呢？\"， 你不用做任何事，只需進入無思慮的靜觀(thoughtless awareness，或譯：無思慮的覺知) 狀態。要試著進入這無思慮的靜觀狀態，假如你可以進入，那麼你已完成你的工作了，因為在這狀態下的此刻，你是和真理(truth)、實相(reality)、喜樂(joy)在一起，和所有這些重要的東西在一起。當你靜坐的時候不要想從靜坐獲得什麼功能、作用，不要如此。靜坐是用來讓你靜下來，讓你的思緒平靜下來，然後進入你內在深邃的海洋。我可以立即分辨出誰是有靜坐、誰沒有，這對我一點都不難。那些不靜坐的人總是表現出猶豫、混亂，他們沒有能力了解事情。這就是為什麼靜坐是霎哈嘉瑜伽中最重要的事。", "靜坐就是持續獲得上天能量的方法，這能量不只會減少你所有的不安與憂慮，也可以去除所有的負面想法，即會將所有令人消沉的念頭都清除。當你可以進入無思慮靜觀的靜坐，你會驚訝到你裡裡外外都獲得助益，無思慮的靜觀是一個可以產生好處的巨大的力量，所以那些不靜坐的練習者並無法從霎哈嘉瑜伽中獲取深層的益處。每一個人都應該試著去靜坐，去達到這無思慮靜觀的狀態，當你處在無思慮的靜觀狀態時，你會有信心，對靈性(Divinity)有完全的信心，你自己會知道你有這信心，即這靜坐會帶給你安全感。是靜坐帶給你真正的覺醒(enlightenment)，及和上天(Divine)完全的連結。假如無法和上天連結，那麼從事霎哈嘉瑜伽有什麼用處呢？", "我知道有些練習者的靜坐可以到達很深的程度，有些人則只是表面而已，這深度就存在無思慮的靜觀，這是一個你應該要達到的重要關鍵點。當你看到任何事物時，假如你可以處在無思慮靜觀的狀態，那麼你就變成一個可以真實反映事物的鏡子一般，試著這樣去做，我不知道你可以處在這種狀態多久，縱使(開始)只是一秒鐘，之後你也會越來越容易進入此狀態。", "和上天神聖力量(Divine)的連結是一個關鍵，這只有在你靜坐且達到無思慮的靜觀狀態時才有可能。此時此刻上天的力量會展現出來、會來幫你。它是以如此(微妙)的方式來幫你，以致於你都不曉得你是如何完成一些事。所以無思慮的靜觀是你們都應該要到達的第一步，在這之後你可以更上層樓，但第一步是無思慮的靜觀。進入無思慮的靜觀狀態是非常重要，因為此刻沒有來自左右、來自過去和未來的思緒，你就處在當下的現在，這是你們都可以做得到的。但是你必須讓自己穩固在此狀態，多久不是重點，一旦你觸及此狀態，你未來將一再體驗到它。許多人雖然也靜坐，但是他們的思緒持續在進行，他們並無法處在無思慮的寧靜之中，這是一個關鍵點。假如你要成長昇進，你必須經由無思慮的靜觀和上天有完全的連結，你不必(對外)祈禱，也不必呼叫任何人(的名號)，都不必！在這狀態下自然就會成就，因為它就存在你的内裡。", "註一： 2002-11-03"]}, {"num": "1-2", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "請靜坐，請每天靜坐", "paragraphs": ["我一再說：\"請靜坐，請每天靜坐！\" ，但人們仍是不了解它的重要性，像有些不靜坐的人問我：\"我已是自覺的靈，為什麼要靜坐呢？\"，就像我前面的麥克風，它已是完美的工具，但假如它沒有一直連接到電源，那它有什麼用處呢？在靜坐中，你將會感受到愛、上天的愛、上天大愛的美麗，這將會是完全的改變，一個靜坐的人會有非常不一樣的態度及氣質，非常不一樣的生命，而且會在生活中對自己有完全的滿足感。", "在霎哈嘉中，你不應該只滿足於一些小成就、一些小奇蹟，你應該追求和神聖的大能(Divine)合而為一，完全合而為一。而這只能經由一個很簡單的途徑來達成，即真正的靜坐。", "在剛開始靜坐，有人像度日如年，有人一直想著某事，有人急著要看手錶，有這個問題、那個問題。這都無妨，這只是開端，慢慢地你會上軌道，漸漸地你會掌握靜坐的要領，而進入靜坐的殿堂，此時你就不會再喜歡那些無聊、没意義的事情。要達到你内在的美麗、光輝及你自己偉大的特質，你唯一要做的只是：真正地、虔誠地去靜坐。不要去找任何藉口，如我没有時間、我有工作要完成等，没有人想知道你的藉口，這是你自己的事，是為了你自己的好處。", "做爲一個霎哈嘉練習者，不論你是否認為自己已經到達一個很高的階段，唯一最重要的態度即是：你必須謙虚來面對靜坐這件功課！", "此外，許多練習者也忘記了這一點，即集體靜坐。大部份人可以認真地自己靜坐，這是不錯的，但是他們却很少在一起集體靜坐。你們必須(也)集體一起靜坐，因為我是你們所有練習者的集合體，如果你們集體靜坐，你們會真正地非常接近我。所以有任何聚會活動時，必須將集體靜坐當成重點。你們可以唱歌等等，但當所有的項目都做完時，你們就可以一起靜坐。", "假如我一直強調某事，你應該知道這必是真理，必是重要的基礎，縱使它看似很普通的，但這表示它非常非常重要！", "註一： 1993-06-06."]}, {"num": "1-3", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "靜坐與完成你自己", "paragraphs": ["霎哈嘉瑜伽有一個重要的原則，那即是：假如我們要成長，我們必須要靜坐。靜坐表示在那個時候我們是處於無思慮的覺知狀態，那個時候既不是未來，也不是過去。在靜坐時，我們對無所不在的神聖力量敞開自己，讓這力量用靈感及美麗的念頭來充滿我們，如同樹木的汁液滋養了整棵大樹一般。在這同時，我們也可以體驗到上天的大愛，感受到這大愛如何流通在我們身上。", "所以我一再告訴大家早晚要靜坐，五分鐘或十分鐘都可以。我們不必放一個鬧鐘，五分鐘一到功課就結束了，並不是這樣，而是我們要去享受靜坐。去享受你内在的真我(Self)的美麗與光彩，但就靜靜地往内看著自己，這本身就是一件很美麗的事。", "當我説你要靜坐，並非指你要把它當成一種紀律。而是要把靜坐當成一條道路、一個方法，藉由這個方法你可以抵達無思慮的覺知狀態。在那狀態下，你知道你真正的自己，我並不是指你的輪穴的狀況，而是指你知道你是一個靈(Spirit)，你是一個純潔的靈，而且是一個充滿榮耀與光輝的靈。這個靈正如同你和上天之間的一個承諾與約定------在你誕生成為人類之前的約定，而你在靜坐當下，你回到了你自己最真實的那一部分，你完成了這個承諾。我們的靜坐就是要完成這一點，這是一個人關於自己最需要知道、最重要的事情。", "註一： 1992-02-12."]}, {"num": "1-4", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "一個清潔根輪及左脈的方法", "paragraphs": ["假如你的根輪(Mooladara) 有問題，你可以坐在這塊土地上(指 Maharastra 這個地方，註一)，前面放相片，左手掌朝相片(註＃)，右手掌貼地，然後唸Shri Ganesha 或 Atharvasheersha 的口訣(mantra)，如此你的左脈的問題將會得到治療。我説左脈會得到治療，乃是指首先你的左腹輪(left Swadistana)會得到清潔。你們當中有許多人去找過假導師等等，也做過一些錯事，這些都會獲得療癒。尤其在西方世界，婦女流產(註二) 是非常普遍，這可能是由於不好的根輪或左腹輪。無論是什麼，我們也不必管是什麼原因或過去如何，只要你清潔左脈，當左脈的能量(vibration)流通，你就清除根輪的阻塞，也解決了根輪的毛病。這對所有的練習者都非常重要。當然你也可以在任何地方做此方法，因為到處都是母親大地，但是效果可能無法像此地(Maharastra)這麽好，因為此地是根輪的一個特殊地點。此處的大地可以清潔你，也會讓你充滿神聖(holiness) 與吉祥(auspiciousness)，所以你們在此地要儘可能坐在大地上。此外你們也要試著左手掌朝太陽(註＃)，右手掌貼地來靜坐。", "清潔左脈只有兩種方法。一種是經由寬恕輪，另一種則是經由根輪，我前面所述是最簡單的方法。", "註＃：即左手掌張開，指尖向前，掌心向上、微向前。 註一：Maharastra 是印度中西部以孟買為首府的一個行政區。Shri Mataji 指此地有很好的能量，因為自古就有許多聖人居住在此，Shri Rama(羅摩)及Sita(悉妲) 也曾經光腳在此行走。Shri Mataji 也說在其他地方亦可用此方法。 註二：Shri Mataji 用 abortion 這個字，應是指流產，而不是指墮胎。 註三： 1988-12-07"]}, {"num": "1-5", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "一個測試自我及制約的方法", "paragraphs": ["(那些愛批評的人)應該拿一張紙-----薄紙，放在手掌上，然後面對相片。假如你可以停止手掌的抖動(shaking)，那麼表示你是ok的。你們每一個人都可以來試驗看看，譬如先試試看右手，這是非常實際的方法，假如紙張在抖動，這表示你內在的\"自我先生\"(Mr. Ego) 在顫抖。", "人的内裡有兩個問題，一個是制約(conditioning)，另一個是自我，我們的觀念及想法(minds) 就是來自制約及自我，其實我們是活在這兩者的掌控之下，所以你必須非常小心。你現在可以試試你的左手，假如你的左手會抖動，那麼表示你有一些制約，假如你的右手會抖動，那你是有一些自我。若有，你們就要去處理這兩個問題。", "在相片之前，在你的左手掌放一張報紙，或小一點的紙、薄一點的紙，在右手放另外一張紙，或左右逐一測試，來看看你自己是什麼樣的情形。你來到這裡是想讓自己更進一步演化，所以你必須面對你自己，自己來看你內在有什麼-----有那些點很強烈、有那些點是給你麻煩、有那些點正在將你往下拖、有那些點正在傷害你？", "***譯者整理：**Shri Mataji談到的方法如下：以坐姿為例，將靜坐時放在大腿的雙掌往上提高約20公分，雙掌仍是向上，手掌上放一張紙(可用影印紙，或更薄一些的紙，大小約半張A4)，然後面對相片，看紙張是否會抖動？假如左手會抖動，表示你有一些制約，假如右手會抖動，那你是有一些自我。*", "註一：1997-03-21"]}, {"num": "1-6", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "不要去嘗試新的方法", "paragraphs": ["在美國(註一)人們就是喜歡嘗試新的事務, 從新的流行甚至到新的毒品。如果你告訴他們不要如此，他們就會回應: \"為什麼 ! 為什麼不行 !\"，這是西方世界心態上很大的一個問題。", "在霎哈嘉瑜伽裏，我特別要提醒大家: 不要去嘗試新的方法 ! 霎哈嘉瑜伽是在古老傳統中已建立完成，它所擁有的各種方法已非常充足完善，所以你不必外求，不必去試任何新的方法。那些自以為發明新的霎哈嘉瑜伽方法的練習者往往會陷入麻煩，以前倫敦的集體就有一些人自做主張, 講授新的霎哈嘉瑜伽，結果一群人都誤入歧途，產生心智的問題。他們的能量(vibration) 都變得十分狂亂，我也不知如何處理。我十分驚訝地問他們為何要試新方法 ? 為何有這必要 ? 他們的答覆就是: \"我們想試試這個新的方法，或許會比較好。\"，我已經教大家所有的方法，你們應該去試我教過的每一種方法，讓自己臻於完善，這才是正途。但我總是看到一些資質平庸的人，喜歡去嘗試自創或自行找到的新方法，然後又得意洋洋宣告一些很平凡又無意義的大發現。這是很常見的，但是其中也有一些心術不正的人，所以你們務必要小心。", "我的建議是: 不需要去試我教你們之外的任何新方法，你們目前需要的是鞏固自己， 鞏固自己在平衡之中。", "註一: 這談話是在美國聖地牙哥. 註二: 1985-05-31."]}, {"num": "1-7", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "如何正確提升昆達里尼(靈量)及做靈體保護 (非談話)", "paragraphs": ["前言：提升靈量與靈體保護(畫班丹)是新人學靜坐的第一步，但華人世界的教法已有些分歧。筆者仔細看所有Youtube找得到的，且是Shri Mataji 親身示範的影帶，整理如后。這些影帶中有一個共通點：即Shri Mataji 示範時都十分賣力，且強調要認真做好。所以學習正版的作法絕非吹毛求疵，而是走出正確的第一步。", "如何做提升靈量與靈體保護，請看影帶 (建議看所附影帶1、2(註#))。此處特別釐清一些重點。", "**提升靈量的重點：** 1. 左手掌向著身體，從三角骨位置開始一路往上移動。 2. 同時右手掌繞著左手轉(旋轉方向為下內上外旋轉)。 3. 到頭頂上方後，左右手掌互相轉數圈後打結。此時頭往後仰向上看。(註一) 4. 左手向上移動時，眼睛睜開看著左手掌。(註二) 5. 提升靈量的動作要做三次，打結的次數為1-1-3。但是全球也有些地方是做1-2-3。Shri Mataji 的示範大都是1-1-3(除了影帶8為例外)，1-1-3是主流，但兩者應該都可以。 6. 在這些影帶中，Shri Mataji 從未提過左手往上時需同時做如下觀想：逐次觀想靈量在左、右、中脈往上移動。筆者認為這是完全不符合霎哈嘉原理，提升靈量是和左右脈無關，更何況左脈的運行是從上往下，而非右脈及中脈的由下往上。這些觀想應該是某些練習者自己的發明，不宜遵循這種作法。", "**靈體保護(畫班丹)的重點：** 1. 這是針對身體外的能量場(aura)所做的，是用來保護七個輪穴。 2. 用右手自身體左側，從根輪的水平位置(請注意：絕不是胸部或腹部的高度)往上劃大圈過頭頂(請注意：絕不是小圈揮過額頭)，再往下到右側，直到根輪的水平位置。然後再循原路返回，如此來回叫做一次。 3. 共做7次，但是第七次只到右側，並不用再回來。(所以是六次半，見註三) 4. 左手都放在大腿上不動。右手掌畫圈的起點是身體左側的根輪水平位置。 5. 做班丹時，注意力放在那裏呢？大部份影帶皆未提示，但影帶2有強調要放在頂輪。由於Shri Mataji 提過越專注則形成的保護越強，所以筆者建議初學者將注意力放在頂輪且閉眼。", "註#：請看網路版 ( shrimatajitalk.blogspot.com/2019/02/1.html )第一類文章中的本文，文末即有影帶網址。 註一：Shri Mataji 在大部份的示範皆強調要抬頭，只有小部份(影帶5、7)未見抬頭。筆者建議一律抬頭。 註二：有三個影帶Shri Mataji 提示要看著左手(影帶1、3、4)，有一個提示注意力放頂輪(影帶2)，其餘則無指示。筆者建議一律看著左手，也有助於專注。 註三：所附的影帶皆如此，只有二例外：一次是教小孩，只做7個半次(即只去未回，見影帶8)，另一個則是做3又1/2次(影帶7)，和靈量捲曲3圈半相同。"]}, {"num": "1-8", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "靈體保護(班丹，Bandhan) (非談話)", "paragraphs": ["Shri Mataji 演講中提到的班丹可以分為兩種，雖然基本的原理是相同的，但是做法及使用時機却稍有差異，對初學者而言可能會有一些困惑。", "第一種的班丹可以翻譯為\"靈体保護\"，即是在靜坐之前及結束後用右手掌所做的七次繞過頭頂，針對三脈七輪所畫的拱型保護罩。這靈体保護不只用於靜坐前後，Shri Mataji 也強烈建議大家出門前必須做此靈体保護。此外，在幫他人提升靈量之前，也必須要先幫他人從背後做靈体保護。(1992/03/15). 若針對一些麻煩人物 (如正在發飆的人)，無法近身幫他做靈体保護，也可以遠距離看著那人，用右手畫拱型，為他做靈体保護。(1981/11/01) 在公眾場合靜坐，有時不方便手畫大圈做靈体保護，此時我們用右手指對左手掌順時針轉七圈，這亦是此種靈体保護的簡單版。 \"靈体保護\"基本上是對内在的三脈七輪精微系統上放置一個保護盔甲。做此動作即如同打電話給無所不在的神聖力量，讓自己和無所不在的神聖力量連結上，讓自己或他人處於無所不在的神聖力量的愛的保護之下。(1984/11/23)", "第二種班丹是用右食指在左手掌寫下自己想解決的困難(如惡人的名字，如個人的困擾，或國家的問題)，然後用右手指在左手掌上順時針轉三圈。此時無所不在的神聖力量 (Divine power )流經你的手指，進而接管此事，解決此問題。(workshop in Melbourne)", "Shri Mataji 提到用這小小的班丹可以解決每一個人自身的問題，或你想解決的困難(如你父親的病痛)。若是屬於團體的問題(如國家社會的問題)，則可以一群人一起做此班丹。但是做此班丹時，你必須同宇宙大我 (Divine )是連結的，你必須是\"愛\"的來源，如此宇宙大愛才會接管此事。(1995/07/16)(1995/12/24) 此外，當我們清除輪穴阻塞時，我們用右手指(掌)對阻礙輪穴順時針轉七圈，基本上也是此種班丹.", "註一: 江瑞凱綜合摘譯自 Shri Mataji 的談話 1981/11/01, 1983/03/20, 1984/11/23, 1991/04/06, 1992/03/15, 1992/07/04, 1993/04/26, 1994/04/21, 1994/04/24, 1995/07/16, 1996/03/14 及 workshop in Melbourne(時間不詳)."]}, {"num": "1-9", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "如何對付負面力量", "paragraphs": ["觀眾問：有什麼最簡單的方法？可以用來對付來自週遭的人的負面力量。", "Shri Mataji 答：首先最重要的是獲得你的自覺，一旦得到自覺後，(當你碰到此情況)，你試著保持在無思慮的狀態，假如你(腦中)想到那個人，或假如這(相關的)思緒一直進來，你只要說：\"我原諒，我原諒\"，這是對付此(思緒)最簡單的口訣(mantra)。所以進入無思慮的狀態是第一個方法。", "再來，你也可以(用右手食指)將他的名字寫在你的(左)手掌，然後用右手的手指繞著左手掌(順時針)轉三圈，那麼它們就無法再干擾你。很多困擾都可以用此方法來處理，任何事都可以用此原理來做，我們叫它做\"班丹(bandhan)\"，或是\"保護(protection)\"。你只要(在左手掌)寫下你希望做的事，然後用右手指對它繞三圈，就會成就，因為這力量會經由你的指尖流通(出來)。", "在未來的課程，他們還會教你們更多其他的方法。", "註一： 1985-03-17."]}, {"num": "1-10", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "如何治療身心病-----以淋巴系統爲例", "paragraphs": ["假如淋巴系統(lymphatic system)受到攻擊，那麼你可能會變成偏左脈。整體而言，只有兩種型態的毛病，(第三種是不存在的，或可說它不會給我們太大的麻煩，註一)。一種是左脈的毛病，另一種是右脈。而淋巴系統的毛病是這兩種的綜合，是一種身心病(psychosomatic disease，註二)。毛病只有兩種，所以治療的方法也很簡單，不是用三隻蠟燭(three-candle treatment，用來治療左脈的毛病)，就是用水來治療(water treatment，譯者：即泡腳或冰敷肝，是用來治療右脈的毛病)。至於淋巴系統有問題的人是左右脈皆有問題的身心病，則必須先處理左脈的問題。首先必須先去除心理上的毛病，所以必須先針對左邊開始。當左邊清除好了，右邊的問題就不難處理。", "一個太右脈的人往往會產生如下的狀況，就像一個鐘擺一樣，他會突然從極右脈擺到左邊去，此時若受到來自左邊負面力量的攻擊，此時身心病就產生了。最好的處理步驟是先去除左邊的阻塞，然後再處理右邊。霎哈嘉的方法是一個很簡單的清除障礙的方法，是非常有效。(在身心病的情況下)，先用三隻蠟燭的方法，一隻蠟燭在照片前，一隻放在左腹輪(譯者：即左邊)，然後另一個人(從後面)用燭火對每一個輪穴的左邊逐一來做班丹(bandhan)。當你的注意力在左邊時，左邊的病毒(virus)就給你麻煩，一旦你的注意力從左邊抽離出來，你就清除左邊的毛病了！這一點都不複雜，霎哈嘉瑜伽是非常簡單的。", "註一：第三種毛病是指曾經去找了錯誤的導師，但並未偏左或偏右。 註二：肉體的毛病是來自右脈，心理的毛病是來自左脈。身心病則往往是因為太右脈，再鐘擺到偏左脈時，受到負面力量的攻擊而引發的，故稱為身心病。Shri Mataji 說癌症、多重硬化症(multiple sclerosis)及愛滋病(AIDS)等皆是身心病。她又說西方医學不知道負面力量的種種，也無法清除這些負面力量，所以西方医學仍無法根治這些身心病。 註三：1992-02-11,2000-10-08,1990-09-19,2000-03-11,1993-10-14, 1989-10-23."]}, {"num": "1-11", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "有左脈問題的人不宜泡腳", "paragraphs": ["***前言：**靜坐時同時泡腳是許多練習者每天的功課，Shri Mataji 也多次提過練習者應天天用塩水泡腳(註一)，因為塩水泡腳可以清潔下面三個輪穴(1977-01-26)。 但是在大多數人都遵循此一成規之下，往往不知道Shri Mataji 也提過：偏左脈的人是不宜做泡腳。因為這種水療法(water treatment)會導致左脈的毛病不易去除。 譯者在Shri Mataji 的談話中搜尋到三次提及此點，翻譯其中最完整的一篇如下，其於兩篇則放在註三。*", "**正文(譯文)：**", "為了(提高)發展你的品質，你必須靜坐，但是你必須知道你的問題所在，即你是偏左脈(left-sided)或是偏右脈(right-sided) ? 這是非常重要的。例如某些人有左脈的問題，但他們(竟然)去做水療法(譯者：指泡腳及冰敷肝臟)。德里的Nigam醫生，你們應該有不少人認識他，(先前)我治好了他的癱瘓麻痺(paralysis)的毛病，但是他的左手仍然不是運作的很好，這一點令我頗為訝異，所以我問他：\"你的靜坐是如何做？\"，他答道：\"用燭火和水\"，\"什麼！你用兩者？\"，\"是的\"，\"什麼！你的問題在左邊，所以你應該只做燭火療法(candle treatment)，不需要再用水\"。........ 所以你必須知道你應該選用什麼療法(treatment) (註二)，對那些偏左脈的人，他們應該只做左脈的療法，不可以混淆。 我接著問他：\"誰告訴你如此做？\" 他答：\"每一個人都如此說。\" 我問：\"他們怎麼說？\" 他答：\"可以如此做\"(譯者：即燭火及水兩種療法一起做)。", "在霎哈嘉裏，神聖的知識是有一些特定的法則。假如你的問題來自左邊，你要只做左邊的療法(譯者：燭火療法)，不需要做水的療法，完全不要！若你的問題來自右邊，則完全、完全不要用燭火療法。偏左及偏右都必須被矯正，如此才可以回到中間。當你覺得你在中間時，你就可以兩種療法一起用(譯者：即用燭火及水)，但是據我的觀察，處在這種情形的練習者很少。假如你處在中間，你是不必去做這些療法，但你仍是需要靜坐，在相片之前靜坐。但是若要去除一些制約等，或要去除白天(整天)帶來的問題，你可以坐在相片前，同時用一根蠟燭及水療法(譯者：指泡腳或再加上冰敷肝臟)；但是並非有此需要的人，則不必燭火及水一起做。", "(1994/04/24 Shri Mataji 也有類似的談話：", "睡前假如你有時間，你應該要泡腳。......在泡腳之前，最重要的是你必須知道你是屬於那一種特性的人。你們(香港人)大部分是偏右脈的，所以將你的右手朝向相片，兩隻腳都放入加一點塩的水中，然後左手像這樣(舉高過肩，掌心向後)。但是有一些人是偏左脈的，尤其有些人是非常偏左，他們不應該用水療法。霎哈嘉有兩種(不同的功能的)療法，那些偏左脈的人尤其不應該去泡腳、不應該用冰敷法------這些都是治療偏右脈的人。......我仍是要再說一下，那些偏右脈的人儘可能也不要用燭火。)", "***譯者的結論：***", "*將偏左、偏右的狀態拉回中間是比較重要，這比清潔下面三個輪穴來得優先。因為根據昆達里尼的理論，一旦處在中間，昆達里尼即容易上升，一旦它可以上升，它自動會去清潔輪穴的阻塞。人若不處在中間，很難進入無思慮的狀態，如此靜坐的效果也差，昆達里尼也不易升起。泡腳故然十分重要、有益，但碰到左邊有問題的練習者，仍是要依Shri Mataji 的建議，暫時還不要泡腳，先單獨使用燭火療法，先治療偏左的問題，否則反而會事倍功半。這應該是Shri Mataji 談及此事，語氣皆十分強烈的用意。*", "*至於偏右脈的人是否暫時先不用蠟燭？Shri Mataji 在2000-09-01的談話是如此說過(譯者搜尋後只找到這一次)，假如依Shri Mataji 的邏輯，譯者以為應先少用燭火，仍舊優先矯正偏右脈的問題。*", "註一：請見1983-01-29, 1983-01-21, 1980-07-21, 1980-09-07, 1988-09-21。 註二：Shri Mataji : 整體而言，只有兩種型態的毛病，一種是左脈的毛病，另一種是右脈。......所以治療的方法也很簡單，不是用三隻蠟燭(three-candle treatment，用來治療左脈的毛病)，就是用水來治療(water treatment，譯者：即泡腳或冰敷肝，是用來治療右脈的毛病)。 註三：1990-02-28：\"他是一個偏左脈的人，讓他坐在相片前，並點一根蠟燭，左手向著相片，右手朝向大地，左腹輪處也放一根蠟燭，然後用(另)一根燭火來提升他的昆達里尼，但不要用水療法。\" 1995-02-28：\"骨關節炎？你應該去做左邊的三根蠟燭療法，絕對不要用水療法，只做三根蠟燭療法，完全不要用水療法。\" 註四：在針對右脈的人的水療法，Shri Mataji 在兩次談話中甚至講泡腳時只泡右腳(1996-03-10, 2000-09-01)。譯者認為不泡左腳是為了避免左脈過度冰冷的副作用。 註五：1994-04-07."]}, {"num": "1-12", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "無法感覺到涼風", "paragraphs": ["練習者問：有些練習者在霎哈嘉已經好一段時間，但是他們仍然無法感覺到涼風，或手指感覺不到任何的阻塞(catches)，有些人則隨時(手指)都非常脹熱，有些人則在頭上感覺到這些阻塞，或是在身體、腳趾頭、手等感覺到這些。是我們每一個人都會發展出身體都可以感覺到這些？或是不同人會有不同的感覺？", "錫呂瑪塔吉回答：不是這樣！這是和每一個人的神經系統相關，假如你的神經系統被干攪了，你或許就完全感覺不到。對神經系統而言，(最好的改善方法)就是去按摩它，有些人應該按摩他的背部、手......。我也告訴你們許多次，你們要常用能量化的橄欖油來摩擦按摩手(譯者：指掌心、手背及手指)，來按摩這些地方，如此它們就會變得敏感。這些問題可能來自不太敏感。假如某些人身體可以感覺到一些阻塞，( 而手感覺不到)， 那麼表示他們的狀況是ok的，只是他們的喉輪比較有問題而已，這種情形就需要用油摩擦喉輪、做各種改善喉輪的治療方法，來清潔喉輪。對喉輪而言，假如你可以用牛油來按摩頸部一帶的肌肉(譯者：影片上指的是：後頸部的肌肉，及左右下顎和脖子之間這一帶)，那樣子問題就會解決，手就會有感覺。", "但是假如沒有涼風從頭頂出來，那麼表示自覺並未建立完成。其他人可以來幫忙感覺那個人的(頭頂)是否有涼風，因為那個人可能自己無法感覺到。假如他無法感覺，但是旁人可以感覺到(涼風出自頭頂)，那麼就表示那個人已得到自覺，只是他的輪穴需要再好好清潔......。另外有些許久未婚的人，他們可能從未在手上感覺到涼風，所以就有一些麻煩，但是他們是已得到自覺的靈，只是可能手上無法感覺而已。因為婚姻會帶給人一種柔軟、一種平衡，他們缺乏這個，這就為什麼他們當中有一些人無法(在手上)感覺到。另外有各式各樣的原因，有些人因為自我太大，這種人就要將能量由左撥右，要做很多次。這種人可能從他們兩手但大小可以察覺出來，即一隻手會比較大，一隻手比較小，這種(自我太大的)人的左手比較小，需要將能量由左撥右，或右手向相片左手舉高向後，用這些方法來矯正.....。但是也不要因為如此(譯者：即感覺不到涼風)，而造成左喉輪(因愧疚感的)阻塞，這將是最糟糕的事.....。(縱使無法從手上感覺)，這些輪穴阻塞造成的毛病大部分還是會表現在外，你也可以從個性來看出輪穴的阻塞。有些人就是無法感覺到能量，對這些人而言，這是很大的麻煩。", "註一： 1982-08-06"]}, {"num": "1-13", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "一些練習者的發問", "paragraphs": ["練習者問：當我們反省時，什麼是我們應該做的......？", "Shri Mataji答：(霎哈嘉所談的)反省並不是你的心智活動，重點不是如此。在得到自覺之後，反省指的是進入無思慮的靜觀狀態(thoughtless awareness)，在此狀態下，你有時會得到一些來自内心的靈感、啓發，從這裏你可以知道你有那些錯處，而且此時上天也會幫助你(來進行此工作)。不用去剖析你的觀念、想法，你只要對自己說：''我現在來反省自己，我有做錯什麼？''，如此就可能會突然有一些想法浮上來。假如没有任何想法出現，那即表示你没什麼錯處，你只是有些自我懷疑而已。", "練習者問：在靜坐時，我想著您的形象在我的頂輪，用此方法來進入無思慮的靜觀狀態，這樣子是否可行？", "Shri Mataji 答：這是可以的，你可以如此做。真正的靜坐是要進入完全的寧靜，即在唸完口訣後，你是要進入無思慮的靜觀狀態。假如你處在深度的冥想當中，此時也不需任何口訣，也不必說什麼。", "練習者問：許多人喜歡藉著聽音樂來使自己安定、安靜下來，然後進入靜坐的狀態。這可以嗎？", "Shri Mataji 答：真正進入靜坐的時候，你不會希望此刻是來聽音樂，你是要達到那個無思慮的狀態，靜靜地處在那個狀態。音樂是可以用來幫助你進入那個狀態，單純的只聽音樂是可以的，但是不應該起任何反應。假如你聽音樂，但不起任何反應，那就表示你處在無思慮的靜觀狀態。（譯者：Shri Mataji的意思是：''左耳進右耳出''的聽法是可以的，但若是欣賞音樂或沉醉在音樂之中則不是靜坐）", "練習者問：我在太強的燈光下常覺得不易靜坐，是否可以在黑暗中靜坐，只點一根蠟燭？", "Shri Mataji答：可以，只要你可以看清楚相片即可。", "練習者問：有時候我會聽到一個聲音從遠處向我而來，像一種聲波一樣，這有問題嗎？", "Shri Mataji答：這是OK的，但是不應該是像有人對你講話的聲音。你可以在耳朵内滴一點油來改善這狀況。", "練習者問：為什麼我覺得生命好像沒有什麼意義？", "Shri Mataji答：假如在你的生活中，時間都花在各式各樣無意義、不重要的事物上面，那麼你就會有這種感覺。但假如你將重心放在霎哈嘉上面，那麼你的生命就會有意義，因為你會在其中找到你的認同與歸屬(identity)。", "註一： 1995-03-06, 1995-03-13.."]}, {"num": "1-14", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "無為的靜坐", "paragraphs": ["無所不在的能量(vibration) 是向你發射過來，你所需要做的是對它敞開自己，最好的方法是不要有任何的用力與作為(effort)。不要擔心你有什麼問題，譬如我發覺很多人在靜坐的時候常去照顧他們有阻礙的部位。其實你不必去擔心，你只需要讓能量自由運行，它會自行來解決問題、來成就。就是這麼簡單！", "所以你不必有任何努力，這就是所謂的\"靜坐\"。靜坐是將你自己置於上帝的恩寵之中，這恩寵的力量自己知道如何來療癒你，它知道如何修補你、如何在你裡面運作、如何點亮你的靈(Spirit)。它知道所有的事情，所以你不用去擔心你必須做什麼，或你必須唸什麼(神祇的)名號，或什麼口訣(mantras)。在靜坐的時候你必須完全的不要有所作為(effortless，即 \"無為\" )，將你自己完全敞開，而且必須在當下處在完全的無思慮的狀態。", "有時候你可能不是無思慮(thoughtless)的狀態，這時候你只需要去靜觀你的思緒，但不要牽扯進去。你會發覺正如同太陽升起來，黑暗會逐漸消退，而太陽光最終會照到每一個裂縫及每一個部分，讓整個大地都明亮起來。靜坐也是如此，整個你(最終)會完全被點亮啟發。但是假如靜坐時你去用力，或試圖阻止內在的某些運行，或試圖給它一個班丹，那麼這個光照反而無法抵達你身體的每一個部分。", "無為是達到真正靜坐的唯一道路，但是你不能變成毫無精神的昏睡狀態(lethargic)，你必須是處在清醒(alert)及靜觀(watch)周遭的狀態，否則有些人甚至會睡著了，這是不對的，你必須是清醒的。假如你打瞌睡，那麼這種靜坐是不會有效果的，那是另外的一種狀態。假如你是以懶惰的心態來靜坐，那不會有效果的。你必須是清醒，而且敞開自己，處在完全有覺知的狀態，完全不去用力。當你完全不去用力時，靜坐的效果會是最佳的。", "不論你那一個輪穴有阻塞，完全不要去擔心這些問題，只需要對無所不在的能量敞開自己。你看當太陽普照大地時，自然界的一切就將自己暴露在陽光之中，毫不用力地來吸收太陽的恩賜。在陽光中大自然的植物並沒有任何作為與努力，而只是接受太陽光，如此太陽光就開始來運作，來啟動(光合作用)。", "同樣的，這無所不在的力量(All-Pervading Power)也是如此來運作，你不必去操縱它，你不必對它做任何事，只需要不去用力，完完全全的不作為。你不需要去唸誦(某一個神衹的)名號，也不要去擔心你的額輪是否阻塞，或那邊有阻塞，這個力量會自行去處理這些問題。只要它做得到，它就會持續去處理。而且當有必要時，它也會展現出種種的奇蹟。你完全不用去擔心這些，它知道它的工作。但是當你去費心、用力時，事實上你反而給它製造出一個障礙。所以沒有任何努力是需要的，就完全的無為，只需要說：\"就讓它自行運作！讓它自行運作！\"。就是這樣！", "不需要去唱誦什麼口訣，假如你發覺靜坐不順利，你可以唱誦我的名字，但是這其實也不需要，(因為)當你將雙手朝向我(譯者註：雙掌向上、手指朝向前面) 就像一個口訣，這就很足夠了！這個姿勢本身就是口訣。你沒有需要去說出來，但你的內心、你的情感必須就像伸出手來(祈求)，如此就會有成就。當你內在(的祈求)情感完整足夠時，就沒有必要去唸任何口訣，此時你已經超越口訣了！你必須完全不要用力！完全的無為！重點就是如此！", "靜坐是為了你自己的昇進，為了你自己必須有的益處。一旦你進入靜坐狀態，你也會獲得自己的大能(powers)。如同當你成為總督時，你就有總督的各種權力。靜坐的時候不必去想到其他人，不要將你的注意力放到其他人，而只是來接收能量，不要去想任何的煩惱和問題，只需要不用力，完全的無為。", "若只是單純來接收能量，靜坐的效果會是最好的。一般人都有一些毛病及問題，這就是為什麼你會在這裡(來學靜坐)。但是你並無法解決這些問題，這些問題必須由上天的力量(Divine Power) 來解決，這一點你必須完全理解，即人無法解決人的問題，人的問題是超出人的能力所能解決的，所以要交給上天的力量來處理，人只需要完全毫不用力，讓自己處在上天的大能之中。", "就舒服地坐著，將雙足接觸在大地，雙手如此放鬆地張開(註一)。姿勢要完全輕鬆舒適，不要有任何的不舒服。(姿勢)一定要非常舒服，因為你將靜坐一段時間。雙手必須如此放著(註一)。", "無為是靜坐的關鍵要點，完全不要去用力。", "註一：此談話只有音檔沒有影像，手的擺放姿勢是參考其他談話。霎哈嘉靜坐姿勢就是：雙手張開，掌心向上，輕鬆地放在大腿上，手指朝向前面。 註二： 1980-01-01"]}, {"num": "1-15", "catTitle": "靜坐，靜坐技巧", "catNum": 1, "title": "消融情緒的靜坐方法", "paragraphs": ["當一個人的情緒受到較大的干擾，如過度驚嚇、過度悲傷，這時不只左脈會沉重，也會影響到右脈，例如呼吸會變得急促等等，因為左脈的情緒和右脈的生理反應是相關聯的。在這種狀況下，左脈的情緒及右脈的生理反應( 如呼吸急促)必須被消融(dissolved)，如何在靜坐的時候來消融這兩者呢？", "在靜坐開始的時候，我們可以先張開雙掌來感覺自己是否有偏左或是偏右，然後用撥能量的方法( 如偏左的時候由右撥左)，讓自己恢復平衡。在給自己平衡之後，就可以將注意力放在你的這些情緒，就靜靜地觀察它們。你的注意力是有力量的，你可以啟發點亮(enlighten)你的情緒，即無所不在的力量會來解決這些問題。當你在靜坐的時候來觀看這些情緒，你會觀察到它們在你内裡逐漸放大，假如你將它們交給無所不在的力量，即將它們交托出去，它們就會逐步被消融，你會感覺到你可以控制這些情緒，然後造成這些情緒的背後原因也會被解決。", "也可以在靜坐時練習如下的呼吸法。當你覺知到你的這些情緒是在那裡，此時你觀看你的呼吸，試著減少你的呼吸------即你呼出氣，然後屏氣一小段時間，再帶著你的情緒吸氣，將注意力放在情緒上，如此左脈的情緒和右脈的呼吸動作就連結在一起，吸氣後也屏氣一段時間，然後再呼氣。如此進行多個循環之後，你的呼吸就會減少、緩慢下來。然後你會發覺昆達里尼上升了！你也會發覺你整個人沉澱、緩和下來了。此時左右脈的兩個力量合而為一，就是左脈的情緒及右脈的生理反應(呼吸急促)都被消融了，當下你也會發覺你現在沒有思慮了。這個方法會帶給你無思慮的覺知狀態。", "註一： 1981-10-29"]}, {"num": "2-1", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "用無思慮靜觀來超越你的想法", "paragraphs": ["***譯者說明：**此談話可說是霎哈嘉靜坐的方法論，即為何霎哈嘉要先追求無思慮的靜觀。這簡單的說明可以用來滿足某些初學者，即要先知道理論才能學靜坐的人。*", "**譯文**：", "人類的想法與觀念(mind, 註一)，不論是說出來的或據以行事的，往往都是一種虚構的東西(myth)。人的頭腦是真實存在的，但是諸多想法、觀念却不是真實的。這些想法觀念往往是對外面的反應，來自對\"自我\"(ego)的反應，或是對\"非我\"(superego, 或譯\"超我\")的反應而產生的。所以這些想法是猶如真實(reality)的海洋產生的氣泡，它們並不是真實的。 (人類的)這些想法是非常有侷限性的(limited)、虚幻的，甚至有些是令人非常震驚的。由於這些想法並無真理在其中，所以根據它來行事，往往最後會有回彈的效應，即產生很大的破壞力或帶給人們很大的震撼。", "根據這些想法、觀念，人們去做了許多事，但是它並無法帶來滿足，它不是一個解決的方案，它也無法幫助你。而且當人們太過倚靠這些(人創的)想法，人們會產生各種身體、心理及情緒的問題，压力可以說是最新的問題，人們對於压力是没有什麼解決方法。這些(人創的)想法就如同一個很大的阻礙，阻擋人類前進。", "所以人類必須找尋一個方法來擺脫這些想法的主宰，昆達里尼(Kundalini)即是答案。當她被喚醒時，她帶你超越你的這些想法、跨過這些想法。即首先你先達到無思慮的覺知狀態，在這狀態下你已超越、跨過你的種種想法、觀念，它們再也無法影響你，即此時你的昆達里尼帶領你的注意力跨越你的(固有的)種種想法。", "人類之所以會對外界產生反應，是因為人有一個稜鏡(prism)般的大腦，或說有一個稜鏡般的頭殼，當能量經過大腦時，它產生折射的分叉，因此我們的注意力會往外，所以會產生反應，這在我的書已解釋過(註二)。當人們對外界有太多反應時，就可能產生一個可怕的想法或觀念，這想法可能將人類帶到難以想像的境地。這些想法會替自己合理化、正當化，這些想法也會寵壞你的自我，創造出這些想法的自我或非我也會利用這些想法來自圓其說，雖然這些想法是完全没有根據的、也沒有真理在其中。這就像如下的情形：人類創造了電腦，但却變成電腦的奴役；人類製造出手錶，但却成為手錶的奴役。這些想法就是如此來宰制人類。假如一個人有很強烈的想法，想去毁滅(他人)，例如像希特勒，就會對人類的文明、對人類的靈性造成可怕的災難。", "註一：mind這個字是此談話的關鍵字眼，但並不容易找到合適的中譯。綜觀全文，譯者以為Shri Mataji此文所講的mind最接近\"想法、觀念\"。譯者嘗試列出一些Shri Mataji曾提過的\"人類的想法\"，以恊助讀者明瞭本談話。例如：科學能証明的才是真的；神是不存在的；曰耳曼民族是最優秀的種族；人應該不要受任何拘束來做任何他想做的事；女人也可以做男人做的任何事，這才叫男女平等；人要拚命賺錢；流行就是對的；人類社會就要追求經濟成長。 註二：應是指：太初之母的書(The Book of Adi Shakti)。 註三： 1996-03-03"]}, {"num": "2-2", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "你的想法與觀念都是虚構的(上)", "paragraphs": ["***前言：**這是一個重要的談話，Shri Mataji 多次談及此，但以1996-03-21講得最詳盡。本談話較長，譯者嘗試譯其大要，做為大家看全文或影帶的參考。文長，分成上下。*", "**譯文：**", "一般人並不了解人的心智及其產生的觀念、想法 ( mind, 請務必看註一 )，而只是活在這些觀念及想法當中。對霎哈嘉的練習者而言，應該是很容易了解到：人類就是容易反應的動物，習慣性地對外界的種種作出反應。因為人類的腦袋裡有兩個氣球，就是''自我''(ego)及''非我''(superego, 或譯\"超我\"，指的是人的制約，即人被訓練而養成的習慣)。這兩個氣球會使人有反應的傾向，即人類的自我及非我無時不刻在對外界做出反應，這個反應的機制是內建在人類的裡面。人類的思維、想法等即是這個反應機制下的產物，它們隨時轟炸你的頭腦，你也不知道它們從何而來。也正因為這個反應的動作及這些思維想法，使人類無法看到外在事物的實相(reality)。當人類倚靠其心智產生的種種觀念及想法時，他就沒有了解好壞對錯的明辨力，這些人們創造的觀念及想法往往是各種罪惡的根源，帶來爭端、衝突、佔有，最後甚至造成戰爭。", "這些觀念與想法只是人的心智虚構出來的東西，它們並沒有和實相有任何的連結，（即它們並不是真理），但是人們卻依憑這些想法來行事，說：''我的心裏就是這樣想，這就是我想要、想做的''。這些並非真理、完全來自虛構的的想法觀念就帶人走到各種錯誤的途徑。", "人們往往以為人的心智頭腦可以創造出各種發明，這是完全錯誤的概念，不論是愛因斯坦的相對論，或是牛頓的萬有引力，或是盤尼西林的發明，並不是因為人們心智頭腦的探索研究而發現的，而是經由一些未知的力量進入他們的腦袋，其實他們當中的大部分人知道這個事實。愛因斯坦是在花園玩肥皂泡沫時，突然間不知從何而來，相對論的概念降臨他腦袋。牛頓也曾經說過：'' 這個（萬有引力的）概念是從我所未知的來源而來的''。我們霎哈嘉練習者都知道這個來源就是''神聖力量''(Divine Power)，即無所不在的力量(Paramchaitanya)。你們是知道這個力量，因為你們可以感覺到它，你們知道它在那裏，所以你們應該要知道：你們必須超越你們的心智的種種想法(beyond your mind)，來達到無思慮的覺知狀態(thoughtless awareness)。", "在這種狀態之下，你就不會對外界反應，你變成一個靜觀者(witness)，是外在這齣戲的靜觀者，此時你完全處在放鬆和諧的狀態，你只是看著外物，你變成一個旁觀者，外在的一切並不會激起你任何反應。在此狀態下，你可以看到的整個事件的實相，而非被你的心智想法所扭曲的幻相。這就是為什麼我一直告訴你們要靜坐！要靜坐！因為只有靜坐可以帶你到無思慮的覺知狀態。", "註一：mind這個字並不容易找到合適的中譯。譯者以為Shri Mataji所講的mind最接近\"想法、觀念\"，有時候也代表 \"頭腦心智\" (即產生\"想法、觀念\"的主體)。譯者嘗試列出一些Shri Mataji曾提過的 \"人類的想法\" (即人的腦袋心智虛構出來的錯誤想法)，以恊助讀者明瞭mind。例如：科學能証明的才是真的；神是不存在的；曰耳曼民族是最優秀的種族；人應該不要受任何拘束來做任何他想做的事；真正的自由就是做任何我喜歡的事；收費超高的導師才可能教上乘的法門；女人也可以做男人做的任何事，這才叫男女平等；人要拚命賺錢；流行就是對的；人類社會就要追求經濟成長。"]}, {"num": "2-3", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "你的想法與觀念都是虚構的(下)", "paragraphs": ["人本來就帶著許多制約(conditionings)，譬如你生在印度，你就認同印度的種種，生在英國，你就認同英國的種種，這許多的認同皆是你的制約，因為這些制約，你會對某些事情做出特別的反應。若是你生在某一種宗教的家庭，這宗教背景更會帶給你許多制約。當今已無真正追求內在信仰的宗教，這些世俗的宗教都只剩下外表，所以才會排斥其他宗教，才會彼此有很多爭戰。因為信仰宗教的人已被制約，這些制約使他們為宗教而戰。生在回教家庭的小孩，從小就以為他是一個回教徒；生在基督教的家庭亦同，在他們的腦中已被灌輸這種種宗教的觀念，這些觀念在他們的腦內根深蒂固，他們已被這些制約綁住，而沒有任何的自由。", "若說\"制約\"是人類的第一個敵人，那麼\"自我\"就是令人頭痛的第二個大敵。人類從許多方面都會形成自我，人的自我其實是來自輪穴的缺陷(deformity)，例如來說，現代社會是完全金錢導向，有些人覺得金錢十分重要，他們累積了無數的錢財，但錢卻無法滿足他們的需要與欲望，也無法帶給他們快樂。他們會給修行人大量的錢，藉此來表示他們的堅信，甚至有些有錢人認為我必須單獨和他們見面，這些都是他們的自我在作祟，我們可以說錢帶給人類最大的自我。", "另外，我再來舉一個有關\"自我\"的制約（譯者：被自我宰制）的例子，這在印度尤其明顯。許多丈夫認為必須主宰他們的妻子，如此才像一個男人，這種想法完全是被他們的自我所控制。請問這種主宰在夫妻關係中可以獲得喜悅快樂嗎？ (我們都知道)只有關心與愛才可以獲致一個喜樂的夫妻關係。這種宰制的錯誤想法也帶來另外一種反彈及反作用力，即現在社會有許多女人變得極端有掌控欲，這只是另一種來自自我的錯誤想法而已。", "不論是來自\"制約\"或是來自\"自我\"，人類的種種想法與觀念其實只是一堆垃圾而已，它對人類並沒有什麼好處，但它卻無時不刻控制操縱人類的行為。人應該是掌控自己的想法，而非被想法所掌控才對。如何才能取回掌控權呢？如何才能控制我們的想法及觀念呢？有些人嘗試來控制心智頭腦及其產生的種種想法，但是說穿了，他們也只經由頭腦心智來控制頭腦心智，或許應該說經由制約及自我來控制原來的制約及自我而已，這是不會成功的。人類必須超越其頭腦及心智才可能成功。而喚醒昆達里尼正是超越種種想法及觀念的最有效途徑，因為當她穿越寬恕輪時，你就進入無思慮的狀態，你超越了種種來自制約及自我的想法及觀念，當她穿越頭蓋骨時，她帶你進入實相的領域。即你的大腦，或該說你的心，和外面無所不在的力量產生連結，這即是所謂的瑜伽。此時你的注意力已超越你種種的想法與觀念，若你將此注意力放在任何人、事或困難之上，立即將會有光照在這對象上，你將看到事情如何被成就、被解決，你的注意力是有能力做到一般人無法做到的事，因為此時你的注意力已被淨化，且和外在的神聖力量連結，所以它會展現出無以倫比的力量。", "註二：請參考相關的譯文： 2-1用無思慮靜觀來超越你的想法，及 2-7達到無思慮狀態的練習方法。 註三： 1996-03-21。"]}, {"num": "2-4", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "反應", "paragraphs": ["經由昆達里尼的力量，發生在你身上最重要的是：你進入了''無思慮的覺知'' (thoughtless awareness)，即你是活在當下。(對常人而言)，要活在當下是不可能的。一旦你進入無思慮的覺知狀態，你的腦袋心智不再受到各種思緒的轟炸，用簡單的字眼來說，即你不再起反應(reflect)，即你没有一個隨時起反應的心智。常起反應可以說是今天霎哈嘉練習者的一個基本毛病，不隨便起反應是通往穩定成長的道路。例如我(常)看到有些人無緣無故地大笑，或一看到某人或某事就有一些反應，嘴巴開始說出種種的意見，如：''這個不錯但沒有很好......''，幾乎對任何事情，他們都可以發表看法，這在西方世界尤其明顯，每一個人好像都非常有知識，滔滔不絕說什麼是最好的，什麼不是最好的...... 。當他開始如此談話時，他的心智就變得(非常)容易反應。假如你的心智頭腦不容易起反應，那麼你就可以有無思慮的靜觀。只是靜觀周遭的一切，靜靜地看著，只是一個旁觀者，而不必去反應。假如你用你頭腦心智的力量，那麼這靜觀的力量就會消退。這是霎哈嘉練習者常見的毛病，一個很容易起反應的心，對靈性是很不利的，它會造成你無法成長、昇進。帶著一顆容易起反應的心，你會有(許多)不同的情緒。 ........這個容易起反應的心智是當今練習者成長的最大障礙。", "假如你可以不再起反應，你立即會處在和平的海洋之中，此時若你看著某事，你只是靜觀，但你心中沒有任何思緒的漣漪。若可如此，你會變得很有創造力、有活力，而且會十分有愛心。你也不會有任何害怕，不會去擔心別人是否會利用你的愛心。只有在没有任何反應之心時，你才可以去享受(你所碰到的一切)，因為你已將一切交托給上天(Divine)，而不是你在負責這一切，(所以)你會知道你不必去起任何反應。這是你最大的力量-------不要去起任何反應。........", "當我們對某事起反應時，我們就會從那裏吸收，而且我們的注意力往往是集中在他人的缺點，如這個人(什麼)不好、那個人那裏有問題、她的髮型不合適、她的莎麗不佳等等，都是一些無意義的事。在這些反應之中，我們將所有的負面都吸收進來。假如你凡事讚美，至少你是處在比較好的境地，不會吸收到負面的東西。但要做到無思慮的靜觀中產生出來的讚美，則需要相當的深度，........只有當你能達到不起反應時，你才可能有如此的深度。但是人類常是非常容易凡事都起反應，在西方尤其平常，這個地毯不好、那個不好.........，總是隨時都評論人物及事情。這些都是不重要的，這些有什麼重要性呢？假如你是坐在天堂的花園之中，外在的這些有什麼關係呢？你有没有問自己：我現在是坐在那裏？我正在做什麼？", "註一： 1995-10-01。"]}, {"num": "2-5", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "靜觀！停止你的反應", "paragraphs": ["靜觀的狀態並不是一種心智的狀態，而是一種靈性昇進的狀態，在此狀態之下，你變成一個靜觀者。練習靜觀狀態的最好的途徑，就是不要去批評任何人。我看見有些人成天批評別人，他們無法批評自己，所以他們只好拼命批評別人，甚至到達完全看不見自己這樣做有什麼錯誤。", "在霎哈嘉裏，我看見一些人拼命想要對外炫耀表現，我知道誰這樣做，但是這些人應該要知道，一旦你(不要在意外在的眼光，)不要對外界的眼光做反應，你就會開始對你的內在做反應，如此自我省思就會穩步地開始。當你(可以)看見你自己，你會驚訝到你是何等令人喜歡、你是何等的快樂。假如你由此再更進一小步，連這些都不要想，你就進入無思慮的狀態，此時就會變成一個受尊敬、被喜愛、人人喜歡和你作伴的人。所以不要去擔心人們如何看待你、人們如何說你、人們對你有什麼看法，你應該只要反省、去觀察自己，一段時間之後，你甚至不需要再自我省思了。", "你們每一個人都應該去發展靜觀的力量，當你起反應時，停止你的反應！對任何外物停止你的反應，如此你會驚訝地發現你自己是一個非常非常有能力的人。在這狀態下，你不會有什麼企圖心，你不會有慾望，你不會特別喜歡某種事物，你只是靜觀外在的這一齣戲。觀看外在的這齣戲本身就是非常有趣，因為你會了解到這些戲碼背後的滑稽之處與愚蠢荒謬之處，你也會理解到為什麼人們有如此多的暴力，你只會對此現象開口而笑。你不會沮喪，也不會興奮，你沒有太多的情緒反應，你只是會心微笑。假如你如此練習，一段時間後，你會驚訝地發現你的靜觀狀態大有增長。假如在集體裏，大家都有這個靜觀狀態，那麼你們不必做什麼，不必說什麼，不必有任何行動之下，你們就可以成就許多不可思議的事。只要你們在場，光這樣就可以成就一些事情，我並未說可對每一個人都有效果，但對大多數人都會產生效果的。任何一個處在靜觀狀態的人，他本身就會帶來平靜與喜樂。", "有些人非常有企圖心，甚至在霎哈嘉裏也是如此，他們想當負責人，但是負責人、領導人本身都是虛構的，他們想得到的、腦中想的都是這種虛構的東西。一旦你學習如何去靜觀，你會看清楚這是虚構的，你會知道追求領導地位是荒謬可笑的，你會知道這是幻相。所以要克服這種個性上的問題，最好的方法是靜觀，練習去靜觀外界，靜觀萬事萬物。在開口講話之前，先練習靜觀，在發表評論之前，就只需要先靜觀一下，這將會是一種非常令自己愉悦滿足的行事方法。", "說明：本談話的主題是靜觀，譯者彙整此話題的部分，希望有助於大家看整個影帶的談話。", "註一： 1998-08-16。"]}, {"num": "2-6", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "靜觀(Witness)", "paragraphs": ["練習者問：如何在一天裏都維持靜坐的狀態呢？", "Shri Mataji：如果你全天保持一種靜觀(Witness) 的心態，那你就是處在靜坐的狀態了！無論你看到什麼，就只是觀看，這是最好的。若你只是靜觀，你會驚訝地發現你好像處在另一個世界，你好像從另一個世界來看眼前的這些人和事。此時你的内心或許會油然生出慈悲心，或是可憐、同情之心，或者你有一種不喜歡他們的感覺。無論是什麼感覺，你是從他們那個世界分離出來。", "假如你不慎介入這個外在世界，一旦自己查覺到，只要告訴自己：這不對，這不對。然後再抽身而出，恢復靜觀的狀態即可。這就像一種練習，愈練習就愈熟練，然後你處在靜坐的狀態就越來越長久。", "當你靜觀外界外物，若你發覺那事(或那人)是不對的，你也只需要保持安靜，你不需要去告訴他這是錯的。最好還是讓他們自己從錯誤中去學習。很少人喜愛被糾正，更何況他們未必會接受你的建議，說不定還會生出忿恨之心。", "註一： 1987-05-06。"]}, {"num": "2-7", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "達到無思慮狀態的練習方法", "paragraphs": ["我們必須超越(我們的)想法和觀念(mind, 註一)，這個想法、觀念只是(人)虚構出來的東西，但是人們却活在其中，(以為那是真實的)。這就為什麼你們問我這麼多問題(註二)，這些疑惑都來自你固有的想法、觀念。假如你可以超越這些想法、觀念，你心中將没有任何疑問了。因為你没有處在那狀態，所以你問這些問題。或許(有時候)你可以短暫地處在那狀態，但(往往)你一下子又掉下來了。如何更多的時間處在那狀態？如何讓你超越你的想法、觀念呢？有一個很有效的練習方法：", "無論你是在靜坐，或是站著，或做某事，只要你有空，首先要先連結上(譯者：即進入靜坐狀態，連上這無所不在的上天大能)，然後試著去觀察你的頭腦心智(mind)在想什麼(譯者：即腦袋裡冒出什麼思緒)，即你分離出來，從你的想法、思緒分離出來，去觀察你的腦袋在想什麼。當你這樣繼續去觀察時，突然間你就會發覺你是没有任何思緒的，即進入無思慮的覺知狀態。", "所以常去觀察你的頭腦心智，看它正在做什麼。但是若你並没有處在入靜的狀態(譯者：即没有連結)，你是無法做這種練習的。", "另外還有一個練習的方法也很有助於進入無思慮的狀態，即當你看著某物時，例如看著一朶花，立即地，你的腦袋心智會反應，會冒出一個想法，此時試著去觀察它在說什麼，然後告訴它：\"我不想聽！我不想聽！\"，而只是(繼續)去看著這個對象(譯者：即 \"花\")，若如此練習，你就會逐漸成長。這就是禪的方法，這是用來訓練人超越其\"頭腦心智及想法觀念\" (mind)的方法。", "註一：mind這個字並不容易找到合適的中譯。譯者以為Shri Mataji所講的mind最接近\"想法、觀念\"，有時候也代表\"頭腦心智\"(即產生\"想法、觀念\"的主體)。譯者嘗試列出一些Shri Mataji曾提過的\"人類的想法\"，以恊助讀者明瞭mind。例如：科學能証明的才是真的；神是不存在的；曰耳曼民族是最優秀的種族；人應該不要受任何拘束來做任何他想做的事；女人也可以做男人做的任何事，這才叫男女平等；人要拚命賺錢；流行就是對的；人類社會就要追求經濟成長。 註二：這個談話從Shri Mataji回答練習者的發問開始。 註三： 1996-03-10。"]}, {"num": "2-8", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "注意力的訓練------Abhyasa", "paragraphs": ["練習者問：錫呂瑪塔吉，能否請您談關於如何維持我們的注意力 ，讓注意力維持在它應該的地方，而不會漂移到一些不重要的小事。", "錫呂瑪塔吉答：他問了一個很實際的問題，確實是要將注意力維持在應該的地方。對於此，你必須隨時做一些abhyasa的練習(註一)，這是在自覺之後做的，不是之前。(其中)最好的途徑就是學習如何靜觀你自己，就像現在你坐在這裡，讓自己處在一種(靜觀的)狀態，來觀察你自己：\"我現在正在做什麼？\"，這就是abhyasa，這是一種(自我的)探索。除了口訣和其他種種方法，abhyasa 是一種實作的練習方法，練習成為一個靜觀者的方法。這種處在靜觀的狀態，就是一種靈的狀態，此時注意力不會在外奔馳，即你可以看見所有的外物，它們就在那裡，但是注意力卻是在内裡，試著去練習這個：\"(現在)我是一個靜觀者嗎？\"。", "譬如有人說：\"我的天啊！我有一個很可怕的際遇，發生了這個事情，又發生了那個事情\"，這表示你不是一個靜觀者，假如你是一個靈，你如何會有可怕的遭遇呢？只有當你不是一個靈時，你才會有可怕的經歷。假如你可以把整件事情當成外面上演的一齣戲，那麼你就不會有可怕的經歷，而只是你的身體之外發生了一件可怕的事情，它只是你觀賞的一齣戲。......", "假如你練習 abhyasa，隨時練習成為一個靜觀者，那你的注意力就可以被訓練得很好。譬如你外出看到某事，試著只是去看它，而不要有任何的想法，在整個過程只當一個靜觀者，如此你將是處在隨時享受的狀態，你也會有完全平靜的心情，你的注意力也會被徹底啟發，而你獲得的靈感啟示也會是無可比擬的。", "假如你知道如何去靜觀，你的注意力可以有非凡的記憶容量。對我而言，這靜觀所看到的外界就如同我腦海中的一部電影，譬如我看這個房間，我知道房間內有什麼：它的設計、房間內所有的東西、你們如何坐著、你們的坐姿、你們的穿著，每一樣都像一個圖案與設計，它們進入我眼簾就如同一幅畫，而且並不只是這一世，而是很多世。", "我們的覺知就像一個錄影系統，在這種(靜觀)狀態下可以錄得最清楚，假如你有一些思緒，那麼就像物體和眼睛之間有東西遮擋。就如同那位練習者目前正在錄影我的談話，假如鏡頭和我之間有東西，那麼就沒辦法錄到我的影像；假如中間沒有遮擋，那就可以看透，可以錄下所有重要的一切。", "而且會更令你驚訝的是，(若沒有這些干擾的思緒，)你不會錄到不重要的東西。譬如人們到鄉村去，他們看到的、錄到的是：\"哇！我的天！這裡很髒，又發生這事，到那邊又只有水泥地可以睡覺\"、\"房子裏面也沒有適當的椅子可以坐，椅子是如此硬，弄得我的背部都痛了\"，這些是他們所記憶的(、所錄下的)，每一樣看到的都是不好的......。但是對一個真正的自覺的靈，他看不見、聞不到這些髒的東西，他總是聞到香的東西。他不會聞到，或他不認為有什麼東西是髒的，他去的每一個地方都是漂亮美麗的。甚至只是光秃秃的不毛砂地，他也看到其上美麗的圖案。", "我對那些去Maharashtra的人說：\"你們有看到Maharashtra美麗的山？\"，他們回答說：\"那有什麼漂亮？山上都沒有覆蓋著綠樹！\"，我說：\"這才是漂亮之處！你們沒有看到眾山的型態嗎？\"，他們看不見我所看到的那些山形走勢。假如你問我某座山是什麼型態，我也知道，因為我知道所有山的型態------山形走勢是如何變化、那些型態是如何形成等等。因為他們只是看到缺點，所以他們無法看到這些美麗之處。或者他們會掉入相對的觀點，如：\"英國的樹比這些樹漂亮，所以這裏不怎麼樣\"，這就是相對比較的陷阱。但是靜觀者是立足在絕對與純粹，正是看到事物的原原本本的絕對實相。所有的一切都源自你自己，為什麼要去批判評斷呢？", "註一：abhyasa是梵文，意思為實做練習(practice，見1988-12-30 及1986-02-20)，但是Shri Mataji 談話中似乎特別指這種練習，所以譯文中保留原文。 註二：請也參考類似的談話：9-2導師與無思慮(之一)。 註三： 1982-08-06。"]}, {"num": "2-9", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "如何穩固你的注意力", "paragraphs": ["體驗到無思慮的覺知是非常簡單、容易，但是維持在那狀態則是困難的。看到外事外物，你仍然會起反應、會起思慮，此時要如何回到無思慮的覺知狀態呢？首先即是要改變你的注意力。 舉例來說，有一次我和家人去看某個山頂的寺廟，一路上是數不盡的階梯，到達之後大家都十分疲憊，而不得不躺下來，他們抱怨連天說：這是什麼(鬼)寺廟！我告訴我的女婿說：\"你有没有看到頭上罩蓬式的天花板的石雕大象，每一隻大象都有不同的小尾巴？\"，他答道：\"母親，我們都累死了，您怎麼能看到大象的小尾巴呢？\" ，此時你就必須將你的注意力從疲累轉移出來，為什麼不去看這些各式各樣的小尾巴呢？(註一)", "當你(平常)總是將注意力放在外面的種種，首先你也必須試著轉移你的注意力。譬如你看到這地氈，你的注意力可能跑到：它是多貴、它值多少錢。假如它是你的，則頭腦想的更是：會不會有人弄髒它、我要不要去買個保險。這些都是人們的正常反應，但假如你就觀看著它，不要去想，你將會驚訝到，你會(開始)看見它内在的美麗，你會看見這位藝術家投注在這地氈上的喜樂，以及他洋溢的才華等等。這些將充滿了你，一種清涼的鬆弛感覺將降臨你，此時你的昆達里尼會上升，你就變成穩住在你的無思慮靜觀中(註二)。所以當你看任何事物時，甚至像今天的選舉(結果)，只需靜靜地看著被選上的這個人，光是靜靜地看著他，這就會帶給他祝福，給他種種更好的(治國)構想。而你也會獲得更好的構想，如：如何使這個當選人成為一個成功的人、如何使這個國家成為一個成功的民主國家。這些構想都是從真實而來，(而非從虚幻的自我或非我來的)。當你將你的注意力從批評、反應等轉移出來，這些(好的構想)就會自然發生。 你只需要靜觀，成為一個旁觀者，就試著去靜觀每一件事。但是(大部份的)練習者並没有如此去練習，在得到自覺之後他們仍不了解應該去靜觀每一件事。當你經由你的靈開始來靜觀，你就不會看到他人不好之處，而是只會看到他人的優點。所以一旦你的靜觀狀態擴大，你會開始享受每一個人，享受你碰到的每一件事。假如你有很大的深度，甚至連一片小小的草，你也可以去享受它。", "在日本，禪宗的體系發展出類似的方法，菩提達摩(Bodhidharma) 開創了這種庭院花園的藝術。在一個很小的花園内，他利用苔癬、小花、小樹等來創作，觀賞者站在高處來欣賞。當你開始看這庭院時，你的思緒會(瞬間)停止，因為當你將注意力放在這個創作品，這個令人讚嘆的庭院時，你的思緒就停止。", "所以你必須去練習，去發現什麼會停止你的思緒，什麼會讓你變成靜觀的狀態。一旦你發展出此習慣，你就會優雅地將自己穩固在無思慮的靜觀狀態。然後你將開始看到霎哈嘉如何幫助你，你是如何經由霎哈嘉獲致這些，這是何等的祝福。 當你只是靜觀外在的一切，你會驚訝到這無所不在的力量(Paramchaitanya)是如何在每一個角落運作 !", "註一：Shri Mataji 在談話中提及這個故事多次，請同時參考另一譯文：4-7大象的尾巴(上)。 註二：如何靜觀地氈？在Shri Mataji 的談話亦出現多次，此處譯文亦參考其他的談話。 註三： 1996-03-03。"]}, {"num": "2-10", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "現代人的注意力與如何鞏固注意力", "paragraphs": ["練習者問：我們應如何鞏固我們的注意力(attention)? 我的注意力非常散漫(weak)。", "Shri Mataji：你的注意力有問題，我一點都不訝異。因為這問題是源自這個國家(指英國)、源自西方世界的生活及種種。因為這西方世界的經濟發展就建立在破壞你的注意力。從發明機器開始，機器本身就像惡魔-----一個不得不製造產品的惡魔。當機器生產這麼多的產品，這些資本家必須吸引你的注意力來購買(消費)這些產品，所以他們發明了廣告，各式各樣的廣告來讓這些產品十分有吸引力，從而他們可以順利賣出這些機器製造的大量產品。慢慢地，他們發覺廣告的效果逐漸鈍化，於是他們就在廣告加上一些可怕的畫面，如裸体的男女或一些浴室内的鏡頭。這些都是為了吸引你的注意力。於是你内在的格涅沙(Ganesha) 開始變得對你生氣，你的注意力就受到干擾了。在西方文明中，為了產業的發展，多少類似的事都一再被推動，人的注意力當然被擾動了。這是一點都不奇怪的。 要使你的注意力回到正常，首先即是要反觀自己的注意力跑到那裏去了？", "我過去常告訴人們走路時要看著大地的青草，要感謝大地母親給我們如此柔軟、美麗的草地。你也可以看樹、看小孩，但是不要將你的目光放於三尺之上的事物。你大可不必擔心這三尺的視野會看不見迎面而來的汽車或大象。在三尺高之下，你可以看到各式各樣漂亮的花朶及小孩，如此你的注意力就會慢慢鞏固下來。", "我常常看見現代人持續不斷地東張西望，好像在找什麼似的，不斷地找，又不知道該做什麼。他們的注意力正被外面的事物抓著團團轉。有時我真會擔心他們的脖子是否會斷掉？這真是現代人的一大咀咒，他們的喉輪如何能好呢？", "註一： 1988-06-19"]}, {"num": "2-11", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "你不應該有不純潔的目光", "paragraphs": ["一般人的注意力(attention, 註一)都是扭曲的、不純潔的，這就是為什麼耶穌基督來世的時候講：你不應該有邪淫(adulterous)的目光(註二)。這\"邪淫\" (adulterous)乃廣指\"不純潔\"(impurity)的意思。一般人眼睛向外看到一樣東西，就會勾起了一連串的思緒，如為什麼我没有這樣東西？我如何去弄到一個？及其他種種的為什麼要如此，或為什麼不要如此等等的思緒。這些思緒都是不純潔的，往往會將你帶向物質、帶向低下。若你看到一樣事物，腦筋立刻興起一些思緒，這表示你仍未跨過寬恕輪的門檻。對一個霎哈嘉練習者而言，無論你看到什麼或碰到什麼事，你應該要保持無思慮的靜觀狀態 (thoughtless awareness)。當你隨時都達到這種狀態，那些扭曲的、不純潔的思緒就會離你而去，不會進入你的注意力之中，不會再影響你。此時你的目光完全是純潔的，如耶穌基督所要求的。那你的目光就如同太陽光一樣，太陽光可以滋養樹葉，使它更茁壯，你的目光則可以在周遭創造一個純淨的氣氛，將無所不在的神聖力量(Divine Power)的喜樂傳遞給這個世界。", "你們應該將所有的不純潔的思緒從你們的目光中去除。我們有Nirvichara 的口訣( mantra)可以幫助你，不要讓這些不純潔的思緒主宰你。當思緒來襲時，可以唸 \" Yen Neti Neti Vachane\" ( 它不存在！)，或唸 \" Kshama Keli, Kshama Keli\" ( 我原諒！我原諒！)。", "註一：Shri Mataji 常用的 attention 不完全等於中文的注意力。中文的注意力常指眼光所及的外在之處，Shri Mataji 的 attention 則更包括内在的思緒、想像、情緒等等，即泛指\"腦筋轉到的那裏\"。 註二：摩西的十戒中有\"你不應該犯通姦罪\" ( Thou shalt not commit adultery.)。聖經記載中耶穌基督更進一步講：如果你用淫穢的眼光看一個婦女，那在你的心中你已經犯了通姦罪( But I tell to you that anyone who looks at a woman lustfully has already committed adultery with her in his heart.)。這即是每次 Shri Mataji 談耶穌基督都會提到耶穌基督的名言：\"你不應該有邪淫的目光\"( Thou shalt not have adulterous eyes.) 的出處。 註三: 1986-01-01."]}, {"num": "2-12", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "無思慮的覺知與當下", "paragraphs": ["試著來到無思慮的狀態，試著將你的注意力放在無思慮的層面，然後(你的)成長就會開始，因為無思慮的狀態正是當下，而不是過去，也不是未來。假如你駐足在無思慮的覺知狀態，你會開始看見許多超越表面你所能看到的。", "舉個例子，我看到前面的這些玫瑰花，我看到了什麼呢？我立刻可以看到漂亮的顏色，也聞到花的芬芳，我的思緒會被帶到這花給我的愛。花所要表達的正是愛，這是花的本質。而我看著花時，我即刻看到它所要表達的愛，而我也享受它的愛。這是一個重點，在無思慮的覺知狀態，你立即處在愛之中。", "例如你在大自然裏，立即你感受到上天的愛，你會驚訝到上天為我們創造這麼美麗的世界，賜與這麼多美麗的事物給我們。在那當兒，所有一切可怕的、競爭的念頭都會消失退去。只在這當下，你才能享受你所擁有的，而不是在未來或是過去。", "註一： 1992-02-12."]}, {"num": "2-13", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "當下( The Present )", "paragraphs": ["過去的種種錯誤已如流水逝去，而明日的偉大計劃則只是空中樓閣；", "只有當下的現在才是真實的，既美好又是神聖的。", "而這神聖的當下就是喜樂的海洋，你正是這海洋中的一滴水。", "在這當下你只需要去享受；而享受的當兒，你忘了誰是享受者，而誰又是創造者。", "你化身成純粹的存在----享受這當下的存在。", "**原文**：", "Whatever you have committed wrong in the past or whatever you used to think of the future -- the present becomes Divine. And that Divine present is the ocean of joy. Of which you are the part and particle. Just enjoy that. As I was telling you today that then you don't think about who is the enjoyer and who is the creator. You just become the existence. Existence is the present.", "註一： 1986-07-07。"]}, {"num": "2-14", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "純真與無思慮的靜觀", "paragraphs": ["純真(innocence)是一種特質，這種特質是天生的，人無法強制來變得純真，也不能經訓練而獲得它，它是人內在的一種原本的特質。當人變成錫呂格涅沙(Shri Ganesha) 的門徒時，他就變成一個純真的人。", "或許你會說純真的人會被奸詐、有侵略性的人所欺負，但是純真有其偉大之處，它是無法被摧毀的。它是靈(Spirit)的一種特質，當你內在的靈被喚醒時，你就獲得源自純真的力量，藉著這個力量，你可以克服所有對你的成長、對你理解靈性會有妨害的負面力量及錯誤觀念。", "要假裝成純真是不可能的，你必須是原本就是純真才可能表現出純真，而這會發生在你獲得霎哈嘉瑜伽的自覺之後。", "假如你說：\"我可以來發展出(我的)純真\"，那是無法做到的！那麼要用什麼方法來變得純真呢？在霎哈嘉中我們有一個好的方法來達到，就是經由我們的無思慮的靜觀(thoughtless awareness)來達成。當你處在無思慮靜觀的狀態時，什麼會發生呢？此時你不會(對外物)有反應，你不會陷入任何的錯誤之中，你不會陷入任何的討論、爭論等等，你只是靜觀著外在的一切，此時你內在的純真將油然而生，如同蓮花一般從汚泥中優美地伸展出來。", "所以無論周遭是什麼狀況，只要你處在無思慮的靜觀狀態，你就不會有反應，這就是純真的一種表徵。而且不會隨時起反應的人會保持年輕，不會顯出衰老，因為對外物反應並不是一件好事，那只會讓你介入其他人(的事務)。但假如你不起反應，假如你只是靜觀，當一個旁觀者，那麼你不會捲入任何事，你會遠離這些紛爭，如此你的純真就會成長，而且你會對它有十足的信心 。", "假如有人對你說一些不好的話，你應該只是純真地來面對，此時純真的力量就會展現出來，不論他是想掌控你或是給你麻煩，你的純真會讓他了解到他的不對，而且他自己會了解到：\"我對此人做這些事，(但)這位我想掌控的人似乎對此毫不在意\"，如此他就會感到自己的軟弱無力，他會認為他沒有力量來掌控你。", "許多人說：\"錫呂瑪塔吉，我們無法做到無思慮的靜觀！\"，為什麼你無法達到無思慮的靜觀呢？因為平常無論你看到什麼，你總是想去反應。假如經由你自己的反省，及自己去觀察自己，你逐漸開始去停止你的反應行為， (如此你將逐步可以做到)。如果你仍是常常會有反應，則你要告訴你的頭腦好好自我約束一下。一旦仍有一些反應，則(試著)不要講任何話，就保持安靜，如此慢慢地你會驚訝地發現你自己已變成可以無思慮的靜觀，你會驚訝這是何等優美的事！任何接觸到你的人會發覺你是有特殊之處，是和一般人不太一樣！", "註一 ： 2000-09-16。"]}, {"num": "2-15", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "無思慮靜觀的空檔", "paragraphs": ["關於靜坐，我們必須瞭解我們要處在無思慮的靜觀(thoughtless awareness)狀態，當你腦袋有很多思緒時，你是活在未來或是活在過去，而不是活在當下的現在。", "當你開始靜坐時，你必須說Nirvichar 的口訣(註一)，這就是無思慮的靜觀狀態，如此你的思緒會延緩拉長(elongate，註二)，在兩個思緒之間會有一個(很小的)空檔，這個空檔就是現在(the present) ！", "而且當昆達里尼上升時，她也會使這個空檔變大，如此你就可以在你的靈性上成長得更快，這才是真正的成長方法。這個(昆達里尼的)力量是在你的内裡，她早已經存在(你的三角骨裏面)，而且會更進一步運作、成就。我們也除了個人自行靜坐之外，也必須一起來集體靜坐，因為這是一個整體的工作。", "註一：應是這個口訣 \"Aum Twamewa Sakshat Nirvichara\"，請參見譯文9-2導師與無思慮(之一) 註二：Shri Mataji 在其他談話也如此說過，但是\"拉長思緒\"卻很少被翻譯出來，反而常被翻成\"拉開思緒\"，譯者以為那是誤譯，因為elongate完全無\"拉開\"的涵義，它的意思就是伸長、延長。譯者的體驗是：當人進入無思慮的覺知狀態時，人不會在諸多思緒中跳來跳去，頭腦整個沉澱下來，此時的思緒緩慢而像拉長了。請參見譯文3-4\"昆達里尼穿越頭蓋骨之後\"。 註三： 1992-10-12。"]}, {"num": "2-16", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "用你的注意力來改進你自己", "paragraphs": ["假如經由反省，你發現你仍然有一些久遠、幽微的荒誕習慣，它仍然糾纏著你。此時你不必發誓來除去它，你只需要靜觀它，觀看它將如何帶你走向毁滅之路，立即地，你將會放棄這壞習慣。你不必因擔心它，而對自己發誓將如何如何改進，因為現在的你已是 \"samarth\"，它表示的是你(的注意力)現在已完全具有力量了(empowered)。", "所有你認為不對的(習慣)，(只需要)將你的注意力放在那上面，慢慢地，你的注意力的力量會逐漸地除去這種種的困擾-------對這些徘徊不去的問題、條件制約、連結及自我(ego)等等的困擾，你絕對可以拋棄它們。只要運用你的注意力，它們是會離你遠去的。", "然後你將會體悟到你的注意力一天天地被淨化，且你的注意力變得更有力量、更有慈悲心。以前在你的注意力之下引起的各種反應(reaction)也會消失，而且你開始可以如旁觀者來靜觀外界的一切，此時經由靜觀而產生的力量，即你的注意力的力量會開始作用，開始成就一些事情。它不只作用在你身上，而且會作用在你週遭的一切。", "註一： 1994-03-21。"]}, {"num": "2-17", "catTitle": "靜觀，無思慮，注意力", "catNum": 2, "title": "頂輪之上是什麼？", "paragraphs": ["練習者問：在到達、完成頂輪之後，再更上一步又會是什麼呢？", "Shri Mataji答：首先先鞏固你目前所學到的，不要想未來，否則你的自我會膨漲，會認為自己是很不得了的大瑜伽士(mahayogi，註一)。當你在無思慮的覺知狀態(thoughtless awareness)時，你會以自然而然、霎哈嘉的方式自動地前進、自動地成長。你需要的是試著去擴大無思慮的覺知狀態的時間長度，如此你就會自動成長。花朶會去思考如何才能成長嗎？絕對不會！它們就自然而然地成長。同樣地，當你變成無思慮的覺知狀態時，你就會成長，而且你知道你在成長，慢慢地你對此也會沒有疑惑。 你可以看著相片上的額輪(譯者：即紅點)，這會幫助你進入無思慮的覺知狀態。無思慮的覺知狀態是最重要的，首先你要達到此狀態，一旦你逐步鞏固無思慮的覺知狀態，那麼(下一階段的)無疑惑的覺知(doubtless awareness)狀態就會來到。此時你就會安住在自己裏面，你不會去想未來或過去，或其他種種，你就和(當下的)你自己在一起。 真正的成長會是自然且霎哈嘉的方式，而不是人為的、刻意的成長，這是一個活生生、如生命般的成長。", "註一：在Shri Mataji的談話中，mahayogi有兩個截然不同的意思，一者指證量很高的瑜伽士；另一者是反諷，指自以為很不得了的半吊子練習者。此段譯文之前談的正是第二種人，所以此處必然也是指此種人。 註二： 1995-03-13。"]}, {"num": "3-1", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "你的昆達里尼(Kundalini,靈量)", "paragraphs": ["首先，關於你自己的昆達里尼(或稱\"靈量\")，最重要的、應該知道的即是她告訴了你有關你自己的知識(self-knowledge)，即當她升起來，她會指出你每一個輪穴的問題。而且因為昆達里尼的純潔的特性，你也可以知道別人(的輪穴)，她如同反射鏡(reflector)一般(譯者：即鏡子)。假如你變成一面更好(譯者：更潔淨)的鏡子，則你的昆達里尼可以告訴你更多(別人的資訊)。", "我們知道昆達里尼是一種純潔的願望(pure desire)，但我們不知何謂純潔(purity)，它表示一種没有情慾(lust)、没有貪念(greed)、沒有其他種種慾念的一種純潔高尚的願望(chaste desire)。這個力量是你的母親，她就位在三角骨裏面。她知道所有關於你的一切，如同錄音帶記錄一切。她對你有完全的知識(即知道一切)，因為她是如此地純潔。她知道你每一個輪穴的問題，在接觸這輪穴之前她就知道。在喚醒她的過程，她不會帶給你任何麻煩，因為她已完全準備妥當，而且她已把自己調整得十分合宜。假如某一個輪穴有阻礙，她會耐心等待，慢慢地穿過打開此輪穴。", "你的昆達里尼是太初力量(Primordial Power)在你身上的反映。在你體內，她就如同一束一束交纏的能量，就像麻繩是由許多細絲相互交纏所構成一般。在人身上，這些如細絲般的能量有3乘以7得21，21的108次方這麼多(即21×21×21......共108個21相乘。譯者：約等於600.....，6後面有142個0)。但是當你的昆達里尼初次升起時，只有其中的一、二絲升起、穿過頭蓋骨囟門(fontanel bone)區域。因為她必須經過最内層的梵脈(Brahma Nadi)而上(註一)。她是以螺旋狀的方式上升，昆達里尼是螺旋狀的型式，三脈的通道也是螺旋狀的。........經由梵脈，昆達里尼開始將這些能量絲往上送，這會使輪穴鬆弛，輪穴一旦鬆弛，整個交感神經系統(sympathetic nervous system)也會開始放鬆。當昆達里尼抵達額輪(Agnya Chakra)時，你的眼睛就會鬆弛，你的瞳孔開始張大，此時你的眼睛就可能變成像我的眼睛一樣，非常黑且完全放鬆。所以你可以很輕易地從一個人的眼睛知道他的昆達里尼已升到那裏。假如她已穿過額輪，則他的眼睛必然是瞳孔張大。額輪之後，昆達里尼就進入頂輪。此刻她是知識(knowledge)、愛(love, compassion)和注意力(attention)的純粹之光(pure light)，這三種特質是在這能量之内。", "其他的能量(如電能、光能)是無法思考的，無法自行調整，它們無法自行控制自己，它們必須由人來操控。但是昆達里尼這種能量是一種活生生的能量(living energy)，她知道如何掌控自己，她是會思考的。打個比喻，如果你看過種子發芽，它的根的尖端細胞(譯者：即指生長點)可以說是如同有一個小小的昆達里尼，它知道如何穿過軟土，如何繞過石頭，發現水在那裏。", "昆達里尼是你的母親。就她對你有特別的了解而言，每一個人是有不同的昆達里尼，即你的昆達里尼對你裏裏外外有十分的了解，你不可能欺騙她。但就她的功能、她使用的方法而言，每一個人的昆達里尼都是相同的。她都認識我，她在每一個人的位置都一樣，她的移動方式、治療方式、工作方式都是相同的。", "註一：譯者：梵脈是指中脈(內分三層)的最內層。Shri Mataji 此處可能指因為梵脈的通道最初是非常窄，所以只有一二絲可以通過。請參考譯者另一篇譯文：3-10擴大你的中脈。 註二： 1991-08-11。"]}, {"num": "3-2", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "昆達里尼(靈量, Kundalini )上升的過程", "paragraphs": ["昆達里尼必須有根輪的支持，假如根輪太弱，則昆達里尼無法獲得足夠的支持(譯者：Shri Mataji 言下之意是：如此昆達里尼則無法上升)。在昆達里尼喚醒的過程，首先必須有根輪的支持。當昆達里尼上升時，所有根輪執行的功能皆暫停，此時昆達里尼受到根輪的全力支持與照顧。你們都看過我常常一坐就是九、十個小時，而不用起來(去洗手間)，原因即是在此(譯者：指昆達里尼上升時，根輪主管的排泄功能會暫停)。", "昆達里尼是一個帶給你昇進的能量，她是一個處女的能量(virgin energy)，這個能量是無所執着的(detached)。她不執着於任一個輪穴，或任何的功能。她唯一執行的功能即是慢慢地、穩定地穿過這些輪穴、滋養輪穴，給各輪穴它們所需要的、所喜歡的及所能承受的。最後再慢慢地、穩定地打開頂輪。....... 雖然她是一個處女的能量，但是她是如此地有智慧、敏鋭、有愛心且小心翼翼地，所以在她升起的過程，她不會給你任何麻煩。因為她是你個人的母親，她知道你的一切，她妥當地安排如何進行。她甚至不會讓你感覺到她正在上升，當然有些人可以感覺到，那是因為他們有些阻塞的問題。一般而言，大多數人是不會感覺她正在上升。這個内建的機制就讓她好似以自動的方式，一個輪穴接著一個輪穴往上爬。", "在下面的輪穴先打開，讓她可以進入，然後這個輪穴脹大，之後再縮緊讓昆達里尼可以保持在此輪穴(而不會下掉)，如此讓她可以更進一步往上升。就這樣逐一而上直到穿越頂輪。.........當她打開喉輪時，人的舌頭會有一點往內縮，這是爲了幫助昆達里尼上升。這個舌頭後縮的反應動作叫 khechari，這是高層次的瑜伽士進入很深的靜坐時才會發生的。他們發覺在深層靜坐時突然進入khechari的狀態，或有人叫做 mudra，此時好像有蜜汁從上顎流出來(註一)。你們在靜坐時不用刻意將舌頭内縮，這種狀態是自然來到的。目前在霎哈嘉瑜伽只有非常少數的人可以達到此一境地。..........", "當昆達里尼抵達額輪、打開額輪時，你進入無思慮的覺知(thoughtless awareness)的狀態，此時你没有思緒，你的思慮就是停止。此時你可以靜觀外在的一切，就只是靜觀，而不介入你所觀看的外物。你就只是靜靜地觀看，就是這靜觀的本身帶給你成長------内在的成長。", "註一：在Raja Yoga (帝王瑜伽，即八大瑜伽之一)有所謂的 khechari mudra 的練習，即將舌頭後縮，或用舌尖内縮去頂上顎(palate)或喉頭(uvula)。Shri Mataji 介紹過一個類似的動作來幫助喉輪：下巴往下靠近胸部、摒氣(停止呼吸)、將舌頭儘量往後縮(1985-05-02)。 註二： 1991-04-08，另參考1995-03-13，1990-06-03，1982-07-09，1985-05-02。"]}, {"num": "3-3", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "昆達里尼(Kundalini，即靈量)開啓頂輪的過程", "paragraphs": ["昆達里尼穿過五個輪穴(即從腹輪到額輪)後，祂進入腦部的邊緣系統(limbic area，見註一)。這個區域被數千條的神經所包圍，當這些神經被點亮喚醒(enlightened)時，它們像七彩顏色的火焰，非常温和、光亮，是一種散發祥和(peace)的火焰。 當昆達里尼開始向各方向散發出她的能量(vibration)時，這些神經就逐漸被點亮喚醒，也開始向各方向移動，同時頂輪就打開了，此時昆達里尼從囟門(fontanelle bone)區域出去，囟門就叫梵穴(Brahmarandhra)，randhra 是洞的意思，Brahma(梵)指的是來自上帝的愛的無所不在的力量(All-Pervading Power of God's love)。當昆達里尼從梵穴出去，即進入(頭頂外)無所不在的精微能量(subtle energy)之中，這個精微能量是一般人平常無法感覺到的，可以稱之為: 無所不在的生命能量(All-Pervading Power，或叫 Paramchaitanya)。此時屬於這精微能量的一部分(可叫 Chaitanya或 vibration)就進入我們的腦部，將上天的恩賜(blessing)灑在邊緣系統。由於邊緣系統是連接到腦部的各個區域及神經系統(nerves)，所以這能量開始流到神經系統，帶給你一個新的集體意識(collective consciousness)的知覺(awareness)，這知覺又叫：samuhik chetana。", "這些能量(指 Chaitanya)的運作是非常有趣的。它們大部份的時候是形成像小逗點(commas，即\"，\")的型式，但是它們也會變成其他的型式。它們可以變成卐 (swastikas )或Omkara(即 Aum 的符號ॐ)，前者是純真(innocence)的代表，後者則是我們的行動(doing)及知覺(awareness)。當這些能量形成卐字時，它們滋養左脈，形成ॐ (Omkara)則是滋養右脈。即它們滋養左右交感神經系統(sympathetic nervous systems)。", "但是要持續保持頂輪的打開，對人而言是有些困難，因為這中間可能會有一個惡性循環(vicious circle)。首先當頂輪打開時，這些能量經由梵穴進入你的腦部來滋養你的神經，因而使你的左右脈皆更打開，如此就容許更多的能量流入到各個輪穴。但是假如你的頂輪並没有開啓的很妥當，上述的過程就不會發生，結果就是輪穴無法打開，這會造成只有幾絲的昆達里尼可以(流通)保持在脊髓内(譯者：即梵脈内)，而無法容許更多的昆達里尼升起。所以在霎哈嘉瑜伽裏，如何保持你的頂輪打開是非常重要，否則這惡性循環就會發生(註二)。", "註一：邊緣系統是位在腦幹(即脊髓頂端)更往上的區域，約是在腦部的中心，其外圍為大腦，即邊緣系統並没有緊鄰頭蓋骨。邊緣系統的位置仍在視神經交叉點(即額輪所在)更往上一點。 註二：譯者用良性循環的方式再來說明此一過程：當頂輪打開後，外在的能量會自梵穴進入來滋養左右脈，會使左右脈更暢通放鬆，各輪穴也因此更打開。輪穴打開更多則容許更多的昆達里尼上升，這造成頂輪開啓得更妥當，如此又有更多的外界能量進入，這是一個良性的循環。Shri Mataji 在其他的談話談過此良性循環。 註三： 1991-05-05。"]}, {"num": "3-4", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "昆達里尼穿越頭蓋骨之後", "paragraphs": ["當昆達里尼升起且穿越囟門的頭蓋骨，你就和無所不在的力量連結上，這力量就是神聖的愛(Divine Love)，此刻就是實現真正的\"洗禮\"(baptism)。", "此時首先發生在你身上的，就是你進入無思慮的覺知(thoughtless awareness)狀態，平時我們的思緒(thoughts)不是想到未來，就是想到過去，而不是想到現在，現在的當下才是真實的，過去已經結束了，它已不存在，未來則尚未發生，也是不存在，但是事實上，人就是無法處在當下。平常人的腦袋是一個又一個的思緒來了又走，人就是在這些過去和未來的眾多思緒中跳躍。但是當昆達里尼升起時，它會拉長(elongate)這些思緒(註一)，然後在兩個思緒中產生出一個空檔，這個(没有思緒的)空檔就是\"現在\"、\"當下\"，此時你的心智頭腦不再起反應(reflection)，你完全處在自己的寧靜之中，但此刻的你是有覺知的，有完全的覺知，可是你毫無思緒的。當你和這無所不在的力量連結時，這力量本身是完全平安、没有衝突的，所以你(也)會變得完全安祥、平靜，此時上天的祝福與喜樂會傾注到你身上，而這份安祥平靜會散播到周遭，你會讓周圍的人感到祥和，所有不是真理的想法都會褪去，所以你會體悟到上帝正是這祥和的來源，因而你可以散播這祥和到周遭。此時你變成大我的一小部分，你這個小水滴成為海洋的一部分。", "另外一件美好的事也會發生在你身上，即你的注意力(attention, 註二)會得到啓發(enlightened)。在受到啓發的注意力中，你會體會到萬物一體(the totality of the whole)，你的注意力會充滿愛和慈悲，你會看到他人的優點，而且你會試著去幫助那些需要你幫助的人。", "第二件發生在你的注意力的是：這個受到啓發的注意力會告訴你什麼是正當的行為，這就是為什麼有人在得到自覺後，可以一夜之間戒斷毒品、酒精及其他種種自我毁滅的行為。在西方世界中，人們的想法就是應該去享受人生，但他們的種種娛樂都帶著自我毀滅性。有了啟發的注意力後，你不會再去從事這些帶來毀滅的娛樂，你會去享受大自然，享受周遭的每一個人，享受所有真正內在的宗教。", "這個受到啓發的注意力也非常有威力，像昨天那些練習者告訴我列寧格勒的天氣將會非常冷，我就告訴他們：\"你們只需要將注意力放在天氣，太陽將會來幫助你們\"，結果昨天就是豔陽天。所以你們可以對它們下指令，所有的自然界都會為你服務，因為你已經和這無所不在的神聖力量合而為一，這個神聖力量就是創造季節、創造萬物的力量，它也創造你、創造人類，所有對你有好處的事，它都會去做。但它不會去做對你不好的事，例如你認為某人應該被殺死，這種事就不會如你所願。但是在你得到自覺之後，在你成為一個靈(Spirit)之後，你不會去想(此種)壞事了。", "此外，(在得到自覺後)，另外有一件很重要的事會發生在你身上，即只要你使用你的注意力，你可以給他人自覺，如同一隻點燃的蠟燭可以點燃許多蠟燭，點燃成千上萬的蠟燭。", "然後在你開始給其他人自覺之後，你會進入另一個階段，即無疑惑的覺知(doubtless awareness)狀態，即你對霎哈嘉瑜伽、對我、對霎哈嘉是否能夠成就、對你自己都不再有疑惑了。", "註一：Shri Mataji 在其他談話也如此說過，但是\"拉長思緒\"卻很少被翻譯出來，反而常被翻成\"拉開思緒\"，譯者以為那是誤譯，因為elongate完全無\"拉開\"的涵義，它的意思就是伸長、延長。譯者的體驗是：當人進入無思慮的覺知狀態時，人不會在諸多思緒中跳來跳去，頭腦整個沉澱下來，此時的思緒緩慢而像拉長了。在影帶中Shri Mataji的比劃手勢是好像指個別的思緒更悠長，也因此創造出兩個思緒中的空檔。 註二：Shri Mataji 常用的 attention 不完全等於中文的注意力。中文的注意力常指眼光所及的外在之處，Shri Mataji 的 attention 則更包括内在的思緒、想像、情緒等等，即泛指\"腦筋轉到的那裏\"。 註三： 1995-09-19。"]}, {"num": "3-5", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "昆達里尼(靈量)的特質", "paragraphs": ["這個在你内裏的力量叫做\"昆達里尼\"(Kundalini)，它是一個純潔的願望(pure desire)，不止如此，它也是一個想要去潔淨的願望(purification desire)。它擁有淨化的大能(power)，這是一個巨大的力量，而且這個昆達里尼會思考(thinks)、組織(organizes)，能知道(knows)(事情)、能恊調(co-ordinates)、能給予祝福(blesses)，而且它最終也會引導(guides)(你)。你必須了解昆達里尼是(最)純淨的型態，這表示她是完全抽離、無執(detached)，任何有所執著牽掛的東西或想法就不是純淨的，任何會腐敗變壞的東西都不是純淨的。我們說黄金是純淨的，因為黄金不會生銹沾污而失去光澤，這是黄金的特質，(昆達里尼即是如此)，昆達里尼是完全無瑕的(immaculate)，它不能被破壞或汚染，但是她只可能因内在的破裂而變得虚弱(weak)。", "它有一個去潔淨外物的特質，可以說是像一個能淨化外物的東西。打個比喻，就像肥皂一樣，你把肥皂塗抹到那裏，它就會潔淨那裏。當昆達里尼走到任何部位，它就會清潔那裏，而且它也會滋養那裏。因為它會思考，所以它知道如何來滋養你、應滋養到什麼地步、應尋何路逕來進行、要做到什麼程度，或要停止等等。但它的思考並不是語言式的，它並不說什麼，當它經過輪穴時，它會產生一個聲音，這是一個非碰撞的聲音，這些聲音被(以前)偉大的聖人聽到並記錄下來，而用在梵文的語言語音中，這就是為什麼梵語是最純粹的語言。", "註一： 1985-03-17。"]}, {"num": "3-6", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "昆達里尼像火一樣的特性", "paragraphs": ["這個昆達里尼的力量有某些特性，第一個特性是所謂的 \"ungrahavati\" ，即它的走向是和地心引力相反的，即它是向上走的，而不是向下的。所以一個人必須是本質上有一種向上升進的渴望，否則昆達里尼不會升起。就如同食物往下到我們的胃裏，它會擠壓腸子的周邊，靠著這個就產生食物往下的移動。所以當昆達里尼啟動之後，它會對輪穴的周邊施加壓力，她(註一)會創造出來一種將自己拋向更高再更高的感覺，所以輪穴就將它往上彈。", "所有沉重的東西都會往下掉，但是昆達里尼是一路向上，因為它就像火一樣，火不會向下燒，而總是往上燒。她也像火一樣，在她内裡也有火一樣的能力。火是有能力來潔淨，火會燒掉所有可以燒掉的東西，也可以潔淨無法燃燒的東西，譬如將黃金和白銀放入火中，火會淨化、純化這些金屬，讓這些金屬變成更精純的形式。", "存在於昆達里尼内裡像火一樣的特性會燒掉所有沒有用的東西...，當她升起的時候，她就燒掉你内裡沒用的東西，如沒有用的欲望、有關行動的沒有用的觀念及想法、所有來自感覺和自我的種種沒有用的累積，和其間毫無意義的各種東西。每一樣都會很快被燒掉，因為它們是可以被燒掉的，因為它們本質上就不是永恆的存在，它們只是暫時存在那裡。昆達里尼會燒掉這些暫時存在的東西，她就是如此來照亮你内裡的靈(Spirit)，靈是無法被任何東西燒掉的。", "這種燃燒(清潔)是如此的完美，它會燒掉所有不好、沈滯腐臭、會帶來污染、疾病等，而使整個系統變得清涼...。當昆達里尼燒掉這些東西的時候，你會感到熱，因為她正在燃燒這些(不好的)東西。", "昆達里尼的力量是用來潔淨，像火一般來潔淨我們，而不是像水，這是非常特殊的。她潔淨人們並不是像水的作用。水是如何作用呢？水不會燒掉任何東西，但它會溶解某些東西，水會將某些東西吸收進來，它將某些髒東西包容在它裡面。譬如你將一個顏料放入水中，水會吸收它，而變成那個顏色；但是昆達里尼不會變成這個顏色，她會將這個顏料燒掉。假如你有任何不好的東西在你裡面，她就將它燒掉，而不會去吸收它。她是完全純淨的，她無法去吸收這些會污染她的東西，她是無法被污染的。", "註一：錫呂瑪塔吉在談昆達里尼時，有時候用女性的\"她\"(She)，有時候用\"它\"(It)，譯者原文照翻。譯者：\"她\"應該是表示昆達里尼是較接近陰性的屬性，\"它\" 則指能量、力量的屬性。 註二： 1981-05-17。"]}, {"num": "3-7", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "你的昆達里尼(Kundalini，靈量)的寶藏", "paragraphs": ["在你裏面存在著一個來自昆達里尼的很大的力量。在這寶庫裏有滿滿的慈悲(compassion)，這慈悲可以被你的靈(Spirit)所點亮喚醒(enlightened)。你的寶庫有愛、慈悲，也有知識(knowledge)，也有如海洋一般大的寬恕(forgiveness)。當人們得到自覺時，他們並不了解他們現在必須成長昇進。為什麼他們沒有成長呢？因為他們不知道(向寶庫)去祈求這些能量。假如一個自覺的靈說：\"我必須有更多的慈悲心，因為我的慈悲心有問題。我對別人的關心不是很妥當，我對別人的慷慨之心並不足夠。我是在佔別人的便宜，別人愛我更甚於我愛別人.......\"，一旦他如此説，這個能量就開始流動，開始給他更多、更深的愛及慈悲。但是假如你不想成長，你的昆達里尼會說：\" OK，他是一個半吊子的練習者，就讓他繼續這樣子。\"，她就不會供給你這些存在你内裏的能量。", "我告訴過你，這能量有21的108次方那麼多、那麼大(即21×21×21......共108個21相乘。譯者：約等於600.....，6後面有142個0)。你的内在儲存有這麼大的能量，但是很可惜的是，由於你們習慣了世俗的想法，人們(在自覺後)往往只是要求工作，或諸如\"我的母親生病了\"、\"我的父親生病了\"，或要求一些金錢的利益而已。這些都是經濟學上所講的無法被充分滿足的需求 (譯者：即假使獲得了又會要求更多，或有更進一步的需求)，它們都不是純粹的需求(pure want)。", "昆達里尼是你的母親，她在那裏等著要供給你、滋養你、照顧你、讓你成長到有更高、更深、更寬廣的人格。所謂更高的人格並不是世俗所謂的讀更多書、更有錢、更努力工作，或知道一些宗教等等。更高的人格指的是在靈性上更進化(spiritually evolved)。.............", "人們常問我：\"我們如何更進一步成長？我們應該做什麼呢？\"，這就為什麼我要你們多反省，要自問：\"我這一生要的是什麼？我應該有能力毫無慾念、貪念或要求回報來愛更多的人吧！\"，假如你如此要求，那麼昆達里尼將可以給你如潮水般的愛。昆達里尼可以給你靜觀的狀態，可以給你平安，她可以給你許許多多讓你變得十分有力量，讓他人無法騷擾你。她可以給你安全感，可以給你智慧。但是你若要求一些愚蠢的東西，她就做不到，因為她不擁有這些。所以做為一個霎哈嘉練習者，若你想成長，你應該知道有那些能量是儲存在你自己的昆達里尼裏面。", "註一： 1991-08-11。"]}, {"num": "3-8", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "你處在中脈嗎？", "paragraphs": ["你們要隨時都反問自己：我是處在中脈(center)？或向左走偏了？或向右走偏了？", "處在中脈的練習者會有如下的種種特癥：", "一. 首先，你不應該有生理上的疾病(physical problem)，也應該有能力完全治療自己。縱使不能治療他人，至少可以治療自己。你應該是感覺自己健康且快樂，而不是每天抱怨這裏痛、那裏痛的人。", "二. 你應該是一個平靜和氣的人，你不會生氣。或許你有時候會演出一齣生氣的戲，但是你不會陷入憤怒或其他情緒之中。你不只可以靜觀，也可以演戲，但那只是演戲而已。因為有時候客串一下憤怒的演出也是有必要的，但是你要確定你是完全的抽離與沒有任何執著。在演出之前你必須先成為演戲的大師，要成為演戲的大師則你必須先成為你的真我(Self)，當你和你的真我合而為一時，你可以清楚知道自己在做什麼、在演什麼戲，你就是真正的演戲大師。", "三. 你會放較多的注意力在大自然，如自然界花開花謝是如何在進行、大自然是如何變化及運作等等，及放在天空、星星及種種。你應該能享受周遭千奇百態的各種生物，就是單純的享受它們。這種享受可以是難以言喻的深遂。", "四. 當你看到一個美麗的風景或事物，譬如你到了一個美麗的地點，有一種喜樂會自你的頂輪傾注而下流到全身，這應該是你曾經有過的經驗。 或是當你看到一件美麗的事物，你突然進入無思慮的狀態，當下你就只是看著它，而滿滿的喜樂就這樣傾注到你全身。", "五. 你對各宗教不會有分別心，即視眾宗教如一。你不會去責備批評宗教，但有可能去責備那些自稱有宗教信仰但却是愚笨的信徒，因為他們根本沒有遵循他們的宗教的原理。 你只看到各宗教的根源，這根源是相通的。所以你不會去責難任何宗教、及它的先知及降世神祇。我指的是你内心根本就不會去做這種事，而不是你刻意不去犯這種錯，你會自然而然去尊重他們。譬如說你是一個基督徒，但你會去尊重印度教的經典。若你是一個印度教信徒，你會去尊重伊斯蘭的可蘭經。如此才是處在中脈，假如不是這樣，那你仍然不是一個霎哈嘉瑜伽士。你不應該對宗教有任何的敵意，沒有宗教是錯的，是追隨宗教的人走錯了路。他們不是追求金錢，就是追求權力，總之就是愚昧。對各宗教的信徒而言，其他宗教都是異端；但對你而言，每一個宗教都是你的宗教，所以你不會是一個基本教義派的信徒(fundamentalist, 譯者：堅信只有自己的宗教是唯一的正教，其他宗教皆是異端)，你不會成為維護基本教義及打擊異端的戰士。", "註一： 1992-02-20。"]}, {"num": "3-9", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "偏離摩訶拉希什米原理的幾種人", "paragraphs": ["當你的注意力偏移到左邊或右邊，你的摩訶拉希什米原理(Mahalakshmi Principle)就會產生問題。甚至霎哈嘉瑜伽的練習者時常也會偏到左，或偏到右，(所以)練習者必須(隨時)省思觀察自己，因為我們來到霎哈嘉是為了(在中脈)昇進，(而不是要迷失在左邊或右邊)。", "假如你走到右邊去，你(可能)開始和集體的領導人爭吵，找他的種種缺失，如此你就變成耶穌基督所講的\"喋喋不休的靈魂\"(murmuring souls)，你開始講領導人的壞話。這些各地的領導人都是我親自任命的，我知道他們有那些問題，也知道他們没有那些問題，他們和我有密切的連絡，所以你們不必去評論他們。若你去注意、評斷他們，只是妨礙你自己的進展，且妨礙霎哈嘉的發展而已。", "另外有些(偏到右邊的)人會試圖去發明新方法，這種人是最麻煩的，因為他們的自我(ego)帶給他們很大的制約，以致於他們看不見他們(這樣做)有什麼問題，他們不知道自己正在做\"違反神\" (anti-God)的事情。他們不只給自己製造麻煩，也帶給他人許多問題。任何開創新方法的人都會遭受苦難，他們的臉上没有喜樂，他們只是想炫耀而已。這是非常非常危險的事！我看過各種嘗試這些新把戲的人，他們最後都陷入許多的麻煩。因為霎哈嘉有它自己獨特的文化與方法，這些都是完全經過我批准認可的。没有必要去開創新方法。假如要採用新的方法，他們應該離開霎哈嘉。這是一種自我，而且是最糟糕的一種！你們不應該和這種人有任何關係。在霎哈嘉裏，所有的一切(方法)已完全研究好了，所有的知識都已妥當準備在那裏。自創方法的想法是源自一種(特殊的)自我，在這種自我之下，他們無法正確感應生命能量(vibration)，所以他們就從摩訶拉希什米原理偏離出來。(註一)", "偏左脈的人很容易掉入如下這些陷阱：其他的(假)導師、其他的書本(知識)等，在霎哈嘉裏亦是如此。有時候，那些太依戀(attach)妻子、小孩和家庭的人會變得非常左脈，他們不只自己没有喜樂，也不讓別人享受樂趣，這種人也應該離開霎哈嘉。在克服他們這些依戀執着之前，他們不應該待在霎哈嘉裏。", "註一：Shri Mataji在另一談話也提過此，請看: 1-6\"不要去嘗試新的方法\"。 註二：1993-09-08。"]}, {"num": "3-10", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "擴大你的中脈( Expanding Your Sushumna Nadi)", "paragraphs": ["中脈(Sushumna Nadi) 是人的軸心(axis)，人必須處在這軸心，不論是偏向右(脈)或偏向左(脈)皆有可能招致毀滅。 在霎哈嘉裏，我並不是從你的面貌來認識你，而是從你的輪穴(chakras)及中脈 ! 如果你擁有一個有深度(deep)的中脈，我就知道你是一個有深度的人。如果你的中脈十分膚淺(superficial)，那麼我就知道你是一個膚淺的人。縱使你裝得十分親切， 好像知道許多霎哈嘉的知識，我從你的中脈仍是知道你的深度有多少 ! 中脈的深度是比其他任何事情更值得你的關心。", "或許有些人會問：每一個人的中脈不是都是一樣嗎？怎麼會有深淺不同呢？", "事實是如此：人體内的中脈是猶如纸張一般，捲成了三圈半，最内層是梵脈(Brahma Nadi, 註一), 這梵脈非常細小，只有如髮絲般的昆達里尼可以穿過。一個有深度的人，他的梵脈的孔徑比較大，而包裹梵脈的外層(即外圍兩條)則比較薄，膚淺的人則是相反。當你來參加普祭(Puja)時，即是在擴大你的中脈(梵脈)，但是這效果只是暫時的，要维持這種效果仍必須靠你自己------在家、在集體内靜坐。每一個人都必須嚴肅來看待靜坐，靜坐是你對神的祈禱，是對神的普祭，必須以一種敬畏之心(reverence)來進行，敬畏之心是你能否成就的關鍵。你必須敬重自己、敬重他人。首先你應該敬重你自己的人生，\"我這一生在做什麼呢？\" ; \"我浪費我的生命在那裏呢？\" ; \"為什麼我會如此浪費生命呢？\" ; \"為什麼我不能更精進呢？\" ; \"我這一生的目的是什麼呢？\" ; \"我是否朝此目標前進呢？\"。唯有嚴肅面對自己的生命，你才可能更精進、更有深度。", "你可以一天不吃飯、一天不睡覺，但你不能一天不靜坐。唯有透過靜坐，你才可以把你的中脈阻塞緊縮的部分逐步擴大。當你的中脈逐漸地擴大時，你首先會發覺自己不再那麼在乎身體的舒適，不再那麼在乎一些外在物質的東西，你會慢慢超越這些羈絆，你的注意力逐漸地移向内在(而非外物)，此時你的中脈又會更進一步擴大。", "註一：中脈、左脈和右脈並非三根分離並排的管子，而是同心的内外層螺旋管，最外層是右脈(有一條螺旋管), 往內一層則是左脈(可內分七條螺旋管),最内為中脈(可內分三條螺旋管)。本篇談話很明顯指中脈的最内一條是梵脈。 註二：1988-01-10。"]}, {"num": "3-11", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "橫向的擴散(Horizontal Movement)", "paragraphs": ["當你的靜坐更精進深入時，你會漸漸接觸到萬事萬物的本質(essence)，例如你會觸到基本元素(Elements, 註一)。像剛才我們大家結束靜坐時，突然間大雨就傾盆而下，因為雨感知到你的靜坐的深度! 所有的基本元素都可以隨著聖人的指令，而產生一些效應。", "當你向内觸及自己最深處的本質時，你就能觸及所有基本元素的本質，因為所有的輪穴都是由這些基本元素構成的。首先它們會先有所反應，表示它們被你觸摸到，如今天的大雨就是一種反應。更進一步，你便可以指揮它，要求降雨。即如你所願來指揮這些基本元素。要達到這個階段，你必須是一個很深層的霎哈嘉練習者，你能夠觸及自己最内在的本質。當你向内觸及最深的本質-----觸及構成這些輪穴的基本元素，你是進行所謂的横向擴散( horizontal movement， 直譯是\"水平移動\"，註二)。當這些内在基本元素被觸及時，它們會往外激發外界的基本元素。", "其實你可以利用這種横向擴散來完成許多事。譬如將你的注意力放在一件麻煩的人或事上面，然後專心靜坐。如果你的程度是夠深入，則立刻會在那人或事產生一個效果、一個改善(變化)，這是你必須逐步發展的能力。", "你必須用功來靜坐，藉著靜坐來增加内在的深度及強度。當你内在成長到一個程度，你就可以幫忙解決外在世界的許多問題。", "註一：五個基本元素指地(earth)、水(water)、空氣(air)、光/火(light/fire)、空(ether)。 註二：譯者以為 Shri Mataji 用horizotal movement(水平移動)來表達不同於 昆達里尼垂直上下的移動。 註三： 1987-05-06。"]}, {"num": "3-12", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "溶入喜樂之中(Merge into Joy)", "paragraphs": ["靜坐時你的昆達里尼(Kundalini)可以自動往上升至頂輪，這點你們都知道；但是除了靜坐之外，當你處在集體之中，溶入集體時，你的昆達里尼也會上升。如何來解釋這個現象呢？ 我來告訴你們這當中的變化:", "當你在集體之中，你和其他的練習者攜手合作、相互尊重，此時宇宙精微的能量就開始在你身上體現出來，在這當下如果你能完全溶入這喜樂 (merge into joy) 之中，你就進入靜坐的狀態(即昆達里尼上升)。所以假如你在任何情境，皆可以自然而然溶入喜樂之中，那你就變成一種靜坐狀態的人格特質(meditative personality)，此時精微的向度開始在你内在展開，不管你過去受什麼制約(conditionings)的羈絆，這些枷鎖剎那間打開，你變成一個完全自由的人。你的自我及你的非我(制約)都不見了，你和喜樂融合為一。", "你可能曾經有過這種經驗，但是若要長久維持這種狀態，你必須在霎哈嘉裏持續練習與精進才可以達到。", "註一： 1988-01-05。"]}, {"num": "3-13", "catTitle": "昆達里尼，中脈", "catNum": 3, "title": "需要知道昆達里尼的知識嗎？", "paragraphs": ["觀眾問：人可以不知道昆達里尼(Kundalini)，但又獲得自覺嗎？", "Shri Mataji 答：人的心智上不必知道太多(有關昆達里尼)，即可以得到自覺，這是可能的。但是之後你必須告訴他們這是什麼，告訴他們相關的知識會是比較好的。只有極少數的人在得到自覺之後，會不想更進一步去了解，人基本上是會想去了解全部。但是(對於初學者)，你可以一點點慢慢說，不必一來就對他們講全部，你可以先告訴他們這裏有一個方法可以獲得自覺，就如同有人來問我希望獲得光，我就告訴他那裏有個開關，只要按一下開關就會有亮光，我先不必去講太多有關電及燈泡的原理。但是他接著會想知道為何燈泡會產生亮光，這方面的知識會幫助他去創造、散播更多的光。這就是為什麼了解昆達里尼的種種知識是非常重要。", "我是可以不告訴你們任何昆達里尼的知識，而(直接)提升你的昆達里尼，但是如此一來你將對此一無所知，也不知道這自覺是如何發生，這就像那些天生自覺的人一樣，他們不知道自己是自覺的靈，然後後來也迷失了。最有名的例子就是達文西(Leonardo da Vinci，或譯達芬奇)，他是一個(生來就)自覺的靈，但是他不知道自己是自覺的靈，所以就迷失了。他(生來)是比一般人有更高的人格特質，但是他迷失了，因為他不知道自己是自覺的靈，很多自覺的靈都是如此迷失了。", "觀眾再問：假如你的昆達里尼被喚醒、升起來了，你又如何會再迷失呢？", "Shri Mataji答：因為你仍不是一個完全發展好、成熟的人，當你處在那個不成熟狀態時，這是可能的。當昆達里尼(最初)升起來時，由於(輪穴)阻塞很多，所以它只升起一點點，最初的情況就是如此，只有當你達到完全無疑惑的靜觀(Nirvikalpa samadhi，或叫doubtless awareness )的階段，才算是完全的自覺，這是一個更高的狀態。 在初步階段，上來的昆達里尼只有一絲絲、很少的部分，因為人們有自我(ego)、非我(superego，或譯超我)及種種問題，所以他們會迷失。所以(你們)是要小心！", "註一： 1985-03-17。"]}, {"num": "4-1", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "Shri Mataji 關於Vibration(能量)的一段談話", "paragraphs": ["從某個角度來說，vibration是非常寬厚慈悲。縱使你犯一奌小過錯，你的vibration在那個當下並不會消失，但你會在你的內心感知到這是錯的。如果你繼續犯錯，過了一段時間後你就會失去vibration！你甚至不知道你已失去vibration了！所以在霎哈嘉正法（Sahaja Dharma）的第一準則即是：你必須維持你的vibration，並且持續增加你的vibration，而且更進一步改善你對vibration的敏感度。你對vibration愈敏感，則表示你已往上昇進了。假如你失去感知vibration的能力，即表示你也失去霎哈嘉瑜伽了，此時你要趕快去弄清楚自己為何會如此。", "註一: 1985-08-06。"]}, {"num": "4-2", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "你曾有許多老婆(丈夫)，但沒有過自覺", "paragraphs": ["你必須改變你的許多想法。在(數不盡的)前世裏，你曾經擁有過許多房子，有許多的老婆(丈夫)，也有過許多的小孩，但是你没有過\"自覺\"。所以這一世的你不應該把心思放在(周遭的)他人身上，你應該把心思放在自己。這是你累世以來唯一的一次機會，你不應該再錯失此機會，你應該告訴自己：我必須做這個，我必須得到它(自覺)，我必須(在這一世)有所成就！", "在霎哈嘉裏，我希望你們有婚姻，但是婚姻不是最重要的事，婚姻只是一種助力，你可以從你的丈夫(妻子)得到互補，如此你會發展得更好。但是婚姻中任何的逆流與障礙都可能對你的昇進造成很大的阻礙，所以不要放太多的注意力在這些婚姻中的不快，應該將你的注意力從其中脱離出來。要儘量保持在你的真我(Self)，因為只有真我才能帶給你喜樂與昇進，而不是其他的人。只有當你把心思放在真我，只有當你了解到自己才是最重要的，如此你(這一世)才可能有所成就。", "註一： 1990-03-12,1990-03-20。"]}, {"num": "4-3", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "在霎哈嘉的殿堂，你的願望不應是：請給我五毛錢", "paragraphs": ["我是你們的導師，所以你們有任何問題，當然都可以告訴我，(請求我幫忙)，但是有時候，人們訴說他們問題的方式，會讓我覺得他們的層次怎麼這麼低！他們顯露出來的心靈層次是如此的低，他們希望我幫他們什麼呢？打個比喻，假如你去見某個國王，然後對國王請求說：\"請給我五毛錢\"，那麼國王會怎麼想呢？ \"這個人出了什麼問題？他連他可以(對我)請求什麼都不知道！\"。", "同樣的，當你對你的導師請求某些東西時，應該是某些有價值、有很高價值的東西才對，應該是可以讓你完全滿足(complete satisfaction)的東西，但是我看到的事實卻是他們(只)要求這個、要求那個，這些東西是如此沒意義、不重要(註一)，有時會讓我不禁感嘆：\"喔！上帝！為什麼我只找到這些人！他們祈求的東西是如此低下、沒價值，又乏味無趣！\"", "註一：諸如註二另一譯文中舉的例子：\"我的兒子應該取什麼名字？\" ；\"我們錯過了火車，現在該怎麼辦呢？\" ；\"我的父親病了，他有心臟的問題，但他不是霎哈嘉練習者，能否請您幫忙？\" ；\"我的孩子應該上那一所學校？\" ；\"我們要搬家，是否應一併帶走椅子？\"。 註二：這談話的主要內容是有關完全打開頂輪的種種。請也參考4-9\"從現實的牽掛走出來\"。 註三： 1998-05-10。"]}, {"num": "4-4", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "你所擁有的只是一種娛樂", "paragraphs": ["當你在霎哈嘉裏逐步成長時，你會發覺你是被祝福的。不只是被祝福而已，你會有工作、有財富，你的孩子也會變得比較温順。你的身體健康也會有所改善，你也會獲得好婚姻，有聰明的妻子(丈夫)，有可愛的小孩，有房子等等。但是這些都只是一種誘惑 (temptation) 而已，然而許多練習者却都迷失在其中。", "打個比喻，假如你要去机場搭飛機，途中經過一個漂亮的花園，你會停下來欣賞花朶，而忘記去机場搭飛機這個目標嗎？所以我們應該把這些種種的好處及誘惑當成一種娛樂(entertainment)------去机場途中順便欣賞的花園而已！", "註一： 1987-10-09。"]}, {"num": "4-5", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "你捨棄了什麼？", "paragraphs": ["有一次一位\"Hare Rama Hare Krishna\" 團體(註一)的人來找我。", "他說：我們聽說你是一位偉大的聖者，又是.......，但是你有這麼舒適的生活，你擁有這麼多東西，這麼好的東西等等，你如何可能是一個聖者呢？(註二)", "我答道：那你如何是一個聖者呢？", "他說：我捨棄的我的家庭！捨棄我的車子！捨棄我的房子！也捨棄的我的小孩！", "我說：你還捨棄丟掉了另一樣東西。", "他問：什麼東西呢？", "我答：你的腦袋！", "他說：你怎麼能說我丟掉了我的腦袋呢？", "我答道：很簡單！我並沒有捨棄任何東西，因為我沒有擁有任何東西！當你沒有擁有任何東西，你如何能捨棄東西呢？現在，你看看，在這房子內、在我身上(穿戴的)，假如你可以找到任何東西，可以比得上錫呂克里希納(Shri Krishna)的塵土(註三)，那麼你可以帶走。你們所捨棄的是什麼？只是一些無價值的石頭而已！為什麼要吹噓：\"我捨棄的這個，又捨棄的那個'' 呢？", "這群人甚至剔光他們的頭！(還以為剃光頭可以上天堂，實在是難以想像的無知！) (請參見註一的另一譯文)", "註一：應是指唸誦''Hare Rama Hare Krishna''口訣的Hare Krishna 宗教團體，發源於印度，在全世界各大城市都常可以看到他們在遊街，沿路唱歌跳舞，不斷唸誦上述的讚頌，男生都剔光頭。Shri Mataji曾說這群人雖然崇拜錫呂克里希納(主管喉輪的神祇)，但唸個不停，以致於喉輪都壞掉。Shri Mataji基本上認為他們的捨棄與苦行都是外在而已，人無法經由這些外在的行為來悟道。關於Shri Mataji對他們的批評，亦可參考另一譯文：5-6\"瑜伽才是重點\"。 註二：這個質問、答覆及背後的精義和另一個故事很類似，請看：4-17\"闍拿迦的一個故事\"。 註三：錫呂克里希納即是上帝，Shri Mataji此處是引用 \"沒有什麼東西比上帝創造的塵土還偉大、還可以更永續\" 的諺語。 註四： 1996-07-28。"]}, {"num": "4-6", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "你要採集荊棘還是花朶？", "paragraphs": ["你們現在都是得到自覺的人，所以不應該談論他人(指霎哈嘉的兄弟姊妹)的短處，一點都不可以。假如你只想到別人的缺點或批評別人，那麼正表示你自己有一些問題。在霎哈嘉裏，我們應該看到他人的美麗與光彩，及享受自己的喜樂。因為假如你只想採集荆棘，那麼你只會得到荆棘，而不會得到花朶。那些無法看到別人好的一面與優點的人是無法享受花朵、無法享受其他的人。如果你抱持一種批評的眼光來看待他人，你將一無是處，你不只會發展出一種反集體(non-collective) 的個性，也會對霎哈嘉造成很大的困擾，最終你可能不得不離開霎哈嘉。", "批評他人之前，你更重要的應是觀看你自己，自己是如何？你是站在那裡？你要如何幫助他人？", "註一： 1990-03-01,1990-03-04,1990-03-12。"]}, {"num": "4-7", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "大象的尾巴(上)", "paragraphs": ["有一次我和我女兒、女婿外出旅遊，我們去Palitana，它是以漂亮的地形著名的。我們必須徒步上山，我記得一路往上的山路約有五公里之多，直至山頂有一座寺廟，其他人都喊累要休息，我們就停下了喘口氣。才剛停下來，我就看到那些在頭頂圓形天花板上面美麗的大象雕刻，我就對我的女婿說：\"你看那些大象！它們的小尾巴的捲曲都不一樣！\" 他回答道：\"母親！我們都累死了！你如何有精力來欣賞那些小尾巴呢？\" 我說：\"因為我看見了那些可愛的小尾巴，所以我一點都不累。這是關鍵，因為我看到了一條條小尾巴的美麗之處！\"", "你看，縱使是很普通的萬事萬物都有它們美麗之處。即使是很平凡的人，你也可以發覺許多可愛之處，可能是他們描述事情的方式，或像小孩子一般的率直談話，或他們很簡單的幾句話。你會發覺這些簡單的話語絕非膚淺，而是有很深的内涵。真正有深度的、有内涵的說詞必然是很簡單的字句(Whatever is deep is simple.)。而這些簡單的素材以多樣的排列組合呈現在外，則有種種不同的風味與情趣。", "再談到這間房子(譯者：指Shri Mataji在Pratishthan 蓋的大宅)，在整個建造過程我一點都沒有什麼压力。其實我一點都不在意，我很輕易地找到所有合適的建材，並將它們運送到此地。我從沒想到有什麼压力。每一個人看到這房子都說：好奇特的設計與創作！但是我從未有任何的構思，我根本不知道什麼是設計。對我而言，這房子根本是不足為道(nothing great)，外在的美麗世界才是令人賞心悅目、令人着迷的。這個世界及所有的一切之所以被創造，只是上帝的一個小小的想法。這個想法即是要你們進入上帝的國去享受，就只是這樣！上帝創造了一個如此美麗的世界，祂創造了所有的事物來將你帶到人類的階段，現在只剩下一個簡單的步驟，即進入上帝的王國。你不必把自己弄得太複雜，一旦你如此做(註一)，你會驚訝到你可以創造(成就)許多美麗的事物。", "註一：譯者認為是指：簡單及進入上帝的王國。 註二： 1990-12-14，亦參考1996-03-03有關大象雕刻的描述。"]}, {"num": "4-8", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "大象的尾巴(下)", "paragraphs": ["有一些藝術家本質上是非常單純(simple)，像 Ravi Shankar，還有他的導師。他是一個真誠且單純的人，而且他知道我是誰，從一開始他就叫我\"母親\"。", "有一天他抱了一隻出生不久的小鹿來給我，我説：\"這是幹什麼！\"", "他說：\"這隻小鹿哀嚎不停，所以我將它帶來給你。\"", "\"為什麼？為什麼是我？\"", "\"請母親抱抱它、愛撫它，它就會感到母愛。\"", "你看，如此一位大藝術家，行為舉止就像一位小孩子！是令我非常驚訝，他是一位如此單純的人！你如果觀察小孩子在表示他們的關愛，他們是何等地真誠，何等地想幫助他人。", "同樣這個地方，也有一個小男孩很喜歡我。有一天他打算送我一個南瓜，我看他拿了一個南瓜來，然後對我説：\"等一下。\" 人又不見了，一會兒又回來了，手上又抱著一個南瓜，如此來回，總共搬了九個南瓜來。我問他：\"爲什麼搬了九個南瓜來呢？\" \"因為我不知道妳喜歡那一個？所以我將它們全部都帶來了。\" 你看這是如何地感人！如何地觸動你的心！", "所以我們應該要使自己變得更單純。我們應該用簡潔單純的方式，而不是複雜的方式來交談。要用簡單的方式、甜蜜的方式。這樣子我們才可以創造一個美麗的世界。", "註一： 1990-12-14。"]}, {"num": "4-9", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "從現實的牽掛走出來", "paragraphs": ["對今日的求道者而言，現代的環境中有一個很大的阻礙，可以說是像咀咒一樣，它比過去的惡魔還更邪惡，那就是\"現實的牽掛\"(materialism, 註一)。在你的昇進途中，往往被這些現實的牽掛所抓住，它讓你變得粗糙，而不再是精微。", "舉例來說，練習者會問我如下的問題： \"我的兒子應該取什麼名字？\" \"我們錯過了火車，現在該怎麼辦呢？\" \"我的父親病了，他有心臟的問題，但他不是霎哈嘉練習者，能否請您幫忙？\" \"我的孩子應該上那一所學校？\" \"我們要搬家，是否應一併帶走椅子？\" 為了這些小事，他們可以寫信、打電話給我，我實在無法想像他們竟不知我來世的目的是什麼。 假如你無法認清自己做為一個自覺的靈的價值，那麼你就無法知道我的時間的寶貴。假如我來應付你們這些現實的牽掛，那麼我此次來世將會完全浪費掉。我不知道在這個時代，你們的腦袋出了什麼問題？你此生最重要的事應是昇進和成長，但你們却牽掛這些小事。你應該從大角度來看全貌，為什麼這宇宙被創造？為什麼你被創造成為人類？假如你可以看到全貌，那麼你就會開始試圖了解自己目前的境地：我現在是處在那裏？上天是如何選擇了我？我現在成為了霎哈嘉瑜伽士，那麼什麼是我的責任呢？", "在你的前世裏，你從未和真理連結，也從未和無所不在的力量連結，也從未和全能的上帝連結，所以你必須了解到此生你的昆達里尼可以上升，你可以得到自覺，這是何等難得的奇蹟！這是過去從未發生過的！但是在這個時代看到的，竟是這些得到自覺的人無法體悟他們此生的價值，他們詢問的、擔心的却都是這世俗、現實的牽掛。對每一件小事，他們都來問我，但是却不會來問我真正重要的事。霎哈嘉原本是如此神聖、重要的，但却被用在一些不重要、可笑的地方。", "在得到自覺後，原本就應該直接朝你的目標前進，追求你的成長，你應該是不再追求這些世俗的東西。有人說他想要有一個小孩，整個社會不是有很多小孩，你也可以去照顧他們，為什麼你死心蹋地想要一個自己的小孩呢？ \"我想要什麼\" 這個概念應該從此離你而去才對，而不是\"我想要這個，我想要那個\"。你應該變成不再執着依戀這些世俗、現實的東西。當你到達這種無執着的狀態(detachment)，没有什麼外物可以綁住你，因為這些(對你)都已不重要，唯一重要的是你的靈性昇進，没有任何外物比靈性昇進更吸引你。", "你們是被所有的力量照顧、祝福的一群，但是你們不願意去練習運用這些力量，不願去探究你有那些能力。你只擔心你自己的小孩，只關心要穿那一件莎麗，只注意到誰會成為集體的領導人，只注意到領導人有什麼問題，所有這些都不會幫助你成長，你來到霎哈嘉的目的也不在此！要試著去理解，你來到霎哈嘉是為了變成一個靈，然後將靈的光散播出去，其他的種種都不重要。", "所以在這個階段，你必須要自我省思：你現在在做什麼？你將做什麼？你將做到什麼程度？現在是宇宙演化的重要關鍵，而你們是最重要的靈魂，假如你不看重在霎哈嘉的一切，不看重你的真我，那麼爲什麼上天要關心你呢？為什麼上天要將注意力放在你的身上呢？", "註一：materialism指的是物質主義、現實主義，綜觀此談話，Shri Mataji指的是一種牽掛、執着的心態，不只對物質，更是對現實、對生活的一些牽掛，所以譯者翻譯成\"現實的牽掛\"，以利讀者流暢閱讀全文。 註二： 1993-10-24。"]}, {"num": "4-10", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "超越的生命------對求道者的公開演講", "paragraphs": ["***說明：**Shri Mataji在全球推廣霎哈嘉是從英國開始，當時(1970年代)英國有許多求道者，但是很多人都誤入歧途，成為嬉皮或吃迷幻藥或學一些奇奇怪怪的功法。這個介紹會就是針對這些人。*", "**譯文：**", "你們都來到(霎哈嘉介紹)會場，因為你們有一種感覺，感到你們必須去找尋超越生命的重要東西。這種感覺其實是來自(大我的)無意識的心智(註一)，所以你們想去發掘這些重要的東西。或許你們也不知道你們是要追尋什麼，只是感覺到你們目前並不是處在完美的狀態，即你們並不知道什麼是你的圓滿，你只是在追尋你的圓滿。", "霎哈嘉是一個必須以謹慎心思來了解的對象，它不是隨隨便便的東西，不是外面那些胡亂宣稱可以找到上帝的東西，但是人類也無法自己來研究發明就獲得霎哈嘉。這樣說來好像人們很難去了解霎哈嘉，但是你們只要想想，你們成為人類也沒有經過什麼努力，你的鼻子不需要黏膠就自然附在臉上，你也不必練習倒立或做什麼艱難的動作，你就成為人類。同樣的，假如你必須成為更進化的存有，這也會是以自然而然的方式來完成，這可以說是上帝的恩典，所以它是自然而然的。這對人類而言是很難去了解及接受，因為人們是非常的自以為是，上帝是給予人們一個\"自我\"(ego)來決定是要選擇正途或是歧路。", "我另有一項說明，學霎哈嘉與否是你的決定，這是讓你獲益而不是讓我獲益，我從頭到尾都沒有什麼利益，你可以經由接受這些真正知識的禮物，而從我這邊獲取一些益處，這些是你無法以付錢給我或購買或強制我的方式來獲得的 ......。首先你要知道，這是一個會在我們内裡自然而然發生的，即我們無法靠自己的研究發明來做到。或許有些其他法門的人會告訴你他可以教你，你靠自己就可以達成，但是我不願意這樣來欺騙你，你確實是無法自己來做此事。......", "就如同一顆種子發芽，長出根及幼苗，然後長成一棵樹，然後開花......。同樣的，在人類的成長演化過程，也有一張(類似的)地圖，必然有一些力量會使這個過程一步一步往前推演。畢竟上帝從一個微小的阿米巴原蟲一路演化創造出人類，祂是不會來毀壞祂的創作，祂也不會將這個演化留給人類自行處理，這往前的演化是會自然而然來發生完成。......", "在我們的内裡有一個自動的神經系統，人類的科學已經知道這個系統會自行運作，而且知道這個系統有兩個部分：副交感神經和交感神經。就如這圖所表示的有三個管道，中間的中脈就是副交感神經，左邊的左脈就是左交感神經，右脈就是右交感神經。這三脈是外面種種表現的內在能量流，我們在外面看到的種種，都有一些重要內在的運作來達成這些外在的表現。例如一盞燈會發亮，你就知道一定有電流從某處來，就是這個源頭使燈泡發亮。將這個源頭切斷，燈就不會亮。同樣的，這三個自動神經系統的源頭就是這三脈，它們是內在的精微面，它們是一種能量的形式。如同我們看不見電流一般，我們很難看到這些能量，我們是無法看見內裡的三脈。昆達里尼就是我們內在發芽成長的力量，它住在三角骨內，當它自行上升時，你就可以知道這內在的能量上升的移動，你也可以用聽診器來感覺到它(的移動)，你(甚至肉眼)可以看到昆達里尼的跳動。這是你自己無法做到的，縱使盡你所能，無論是跳一百下，或是做倒立，或弄斷你的脖子，做任何你能做到的，你都無法使三角骨(內的昆達里尼)跳動。......", "人類無法做自己的演化，人無法做到這一點，上帝已經為人們做好安排。是人類將習以為常的眼睛放在臉上這個位置嗎？不！是上帝創造了眼睛、將它放在這個眼窩之中，然後人們來使用眼睛！人只能使用眼睛，並無法創造出它。......", "昆達里尼上升時會經過我們內在這些輪穴，這些輪穴是人類演化的里程碑，即從阿米巴原蟲到今天人類的過程中的不同階段(的里程碑)。當昆達里尼上升經過這些輪穴時，你用聽診器可以聽到這些輪穴的脈動，這是一種非碰撞的聲音，當它抵達頭頂並突破頭頂時，你也可以聽到這聲音。", "許多求道者並不了解他們付錢所學的毫無意義的東西，但是他們卻持續一直(認真)練習，為什麼要去浪費時間呢？只是因為你付了錢嗎？我建議你們應該要去認識內在的自己和你的力量，而不是被他人的力量所迷惑。你內在有你自己的力量，這些力量應該要被展現出來，而且你應該要能掌控這些力量，而不是被他人所掌控。從這裡到那裡跳來跳去、突然(不自主)大吼大叫，你自己都無法控制自己，這不是很奇怪嗎？任何的功法都應該表示你有能力來控制這些力量，假如你無法控制這些力量，那叫什麼功法呢？假如你去觸碰通電的電線，你會被電一下、抖動一下，你可以稱摸電線、觸電抖動也是一種功法嗎？(這和那些人莫名其妙的跳、叫，有何不同呢？) 這不是一種簡單的基本常識嗎？你無法掌控的力量並不是你自己的力量，假如這是你自己的力量，你應該可以掌控它，你應該知道你在做什麼。那些會讓你叫、讓你跳的功法，不論它叫什麼，都不是你自己的力量。你在你的心臟有你自己的力量，因為你的靈(Spirit)就住在這裡，靈才是你的真我(Atma)，唯一你要做的是如何來照亮它。......", "人類演化的最後突破就是要藉著喚醒昆達里尼，來穿透我們的囟門骨頭，這是最後的一步，人類的內在已有準備齊全的工具。昆達里尼就如同弦一樣，它捲成三圈半，在三角骨内已等待好一段時間，當一個有被認可的人前來提升你的昆達里尼，你就可以完成這(和外界無所不在力量的)連結......。經由此你將會得到一種轉換，你也會有另外一個向度的覺知能力，即你的覺知會跨入另外一個領域------集體意識(collective consciousness)。什麼是集體意識呢？就是你可以感知\"他人\"，因為當你是大我的一部份時，你再也沒有\"他人\"了，你所的追尋正是和大我全體合而為一，一旦這發生了( 譯者：即你連結上了)，你將可以感知大我全體，即你將會驚訝到你可以在你内裡感知其他人。當昆達里尼從囟門出去、融入那無所不在的精微力量時，你內在所有的輪穴都會被喚醒照亮，你就可以在你的雙手上感覺你自己輪穴的阻塞，也可以開始感覺他人輪穴的阻塞狀況，即自動會如此。即你主觀上你會有這些知識(譯者：知道自己及他人的輪穴)，這並不是客觀觀察得到的，即你變成一個感知的主體。這些自動會在你内裡發展出來，你不用去想像將如何來獲得此能力。就如同其他目前已有的覺知能力一樣，它是自然地獲得及運作，你的此項超人類的覺知能力也是因上帝的恩典而獲得的。......所以請試著去了解你內在有一個力量，上帝已將它放在那裡，它將會被提升上來，如此你就會獲得你的自覺(realization)。......", "人類的任何疾病都可以被治療，甚至包括癌症，但是人類的愚笨是難以醫治的。人的愚笨是如此一件可笑的事，沒有人願意承認他是愚笨的。人往往只是愚笨地繼續做那些錯誤的功法，愚笨地想毀滅自己，甚至有一種幻覺以為他自己是偉大的聖戰士或殉道士。你是要進入上帝的王國，沒有必要去當殉道士。在這個王國外面有一個歡迎的牌子 \"歡迎你進來！\"。但是我發現的是：到處都是因求道而受傷的人，許多人甚至受傷嚴重。這也無妨！只要你愛你自己、愛你永恆的存有，只要你有心想向上進化，那麼事情一定會成就的。", "註一：Shri Mataji所謂的無意識心智(unconscious mind)，指的是一般人在自覺之前無法知道、意識到的，即是超越的意識(superconsciousness)。 註二： 1979-06-25。"]}, {"num": "4-11", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "從真我的知識(Self Knowledge)到真我的意識(Self Consciousness)", "paragraphs": ["許多人得到自覺成為 霎哈嘉練習者之後，我只能說他們只是擁有有關\"真我\"(Self)的知識,但是\"真我\"並未成為他們意識的一部分。他們仍將大部份的注意力與時間都放在一些世俗、不重要的事務上，而不是放在靈性如何升進。他們仍是無法從他們的過去跳脱出來。他們已擁有了輪穴的知識，但是並未努力去保持輪穴的清潔無暇。這表示他們並未完全意識到輪穴是他們的一部分，即輪穴(及真我)並未成為他們意識的一部分。常人穿上新衣服，都會很努力去保持衣服的乾淨；但是許多霎哈嘉練習者並不以輪穴的沾染阻塞為意，這不是很奇怪嗎？", "所以我說，在得到自覺之後，你已進入更精微(subtle)的層次，但是你的意識並未真正進入更精微的層面。再舉一個例子。有些練習者在霎哈嘉裏非常努力工作，有些人則視别人的貢獻是理所當然的，他們寧可站在一旁而不幫忙，他們習慣於別人把一切都準備好。這表示在意識上，他們不知道他們擁有很大的能力(power)-----去享受這貢獻的能力。假如他們從内心去做這一切為霎哈嘉貢獻的工作，他們將不會感到他們有付出什麼，他們只會感受到他們所領受的祝福與他們的成就，這是站在一旁觀看的人所無法享受到的。", "註一： 1986-05-04。"]}, {"num": "4-12", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "愉悅來面對不利的情境", "paragraphs": ["我第一次到美國是搭船去，人在船上會面臨一個問題：我們不能有任何的問題 (譯者：指太多的要求) ! 因為船已離岸，船上没有的，它就無法提供。假如你在船上想要一把剪刀，正好這艘船一把剪刀也没有，所以你不可能找到一把剪刀，你的問題 (或言煩惱，即需要有一把剪刀) 也就不存在了 ! 在陸地時，你有許多的選擇，也因此你有許多的問題；一旦在船上，你終究會了解到：船上有什麼，我們就只能享受什麼。", "同樣地，一個霎哈嘉練習者應該如此想：無論我們有什麼，我們都很高興，所以我們沒有任何問題( 煩惱 )。譬如你在去某地的途中迷路了，你應該如是想：我之所以來到這裏，應該是上帝的旨意，我没有迷路，我的真我仍跟我在一起，我如何會是迷路呢？ 許多人寫信給我，談及他們的種種問題，其實這些問題( 困境 )都不是問題，一旦你開始這樣想，你會驚訝到這些問題是如何被解決。", "在霎哈嘉裏，你必須如是思：假如你面臨一個困境，這困境正是你的一大契機與助力。你應該看清這困境的本質，你應該將它當成一個值得高興的良師益友，以此心態來克服這困境。", "不用把困境當成一種挑戰，你應該如海中的泳者一般，想辦法去超越這迎面而來的大浪、去享受這波動。我們不要當一個掃興的人，我們不應該説：我不喜歡這個，我無法享受這個；你應該說：有什麼不好，我就來試試。 因為一旦你說你不喜歡，你的樂趣就消失殆盡了。假如你隨時告訴自己：我就是要去享受這一切，那你的喜樂就源源不斷而來。正如這杯加了肉桂粉的咖啡 (cappuccino) 對我而言不是那麼順口，但是我現在開始享受它！", "註一： 1989-05-05。"]}, {"num": "4-13", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "摩訶拉希什米原理的喚醒(上)", "paragraphs": ["摩訶拉希什米原理(Mahalakshmi Principle，註一)是我們昇進中最重要的，這原理(或譯：力量)原本即在我們的内裏，但是在我們未達到一個狀況之前，它是不會被喚醒的。這狀況即是指：人們(開始)發覺他們並不滿足現有的生命狀態。像在富裕的國家，人們的物質生活都很好，不只有食物，日常生活所需也都很充足，人們也有錢、有很舒適的生活，但是這些並不能給予人們生命的喜樂，人們會開始問一些基本的問題：\"為什麼我活在地球上？難道只是被生下來、賺些錢，然後就死掉嗎？\"、\"生命的意義及目的是什麼呢？\" 當諸如此類的問題開始敲著人們的内心時，這個摩訶拉希什米原理就被喚醒了，追尋的道路正式展開，人們變成了一個求道者(seeker)。", "所以我們無法強迫一個人去追尋，這是一個天生内在的動力，當它開始向外顯露時，人才會開始這個歷程。當你開始想去發覺更内在的意義，如\"我的生命的目的是什麼?\"時，這表示你開始重視你自己，而且可能你也觀察到周遭的人的生活，他們沈溺在各種娛樂和刺激，可是他們並未有真正的喜樂，這些都帶給你疑惑，於是你就開始尋找答案。你可能去找書，去探尋靈性的課程，去接觸宗教等等。這表示摩訶拉希什米原理在你内裏展現，你開始追尋真理了！這個原理(或指力量)在過去五十年(譯者：約指1940~1990)非常活躍。我應該説這是(因為)一個新時代將開始，即目前將從\"鬥爭期\"(Kali Yuga，即指黑暗時代、末法時代)過渡到\"完滿期\" (Satya Yuga)，目前正是介於兩者之間的過渡期(Krita Yuga，或譯 \"成就期\")。在這個過渡期，無所不在的上天大能(All-pervading Power of Divine Love)變得非常活躍，這大能即是太初母親(Primordial Mother)的力量。由於這力量變得活躍，人們同時也突然間覺知到他們需要去追尋，有非常多的人是如此。", "註一：譯者：所謂的\"摩訶拉希什米原理\"，指的是人向上追求靈性、在中脈向上昇進的原理。 註二： 1992-10-01。"]}, {"num": "4-14", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "摩訶拉希什米原理的精進(下)", "paragraphs": ["在喚醒你的摩訶拉希什米原理(Mahalakshmi Principle)之後，你應該要知道如何來保持摩訶拉希什米原理的完整。(註一)", "霎哈嘉是讓人類先得到自覺，讓他們在摩訶拉希什米原理中有一點微小的光，如此他們可以看見自己有什麼問題，即透過感知自己的輪穴那裏有阻塞，你知道自己有什麼問題，然後你可以去清潔、去糾正自己。所以你有這些有關輪穴及清潔的知識，你可以保持中脈在打通的狀態，保持在不偏左、不偏右的平衡狀態。", "這是一個很大的祝福，你(透過自己的雙手)可以知道自己，而且你知道如何去清潔、治療自己。這是對自己內在狀況的深層的理解，經由此，你們可以開始有真正的内省，因為在摩訶拉希什米原理之下，你已昇進到一個靈(Spirit)的狀態，這個靈(原本就)是可以看清楚、可以知道這一切。所以你可以真正知道自己的問題及如何去改善。不只對自己可以如此了解，對他人亦是如此。你可以不被他人的問題所干擾，而且你知道如何保護自己。我要特別提醒的是，要特別注意你的自我(ego)，自我是霎哈嘉練習者很大的敵人。除非你除去你的自我，否則你不可能(真正)進入頂輪，你要(隨時)觀察自己，注意自己的自我，注意自己還欠缺什麼，注意自己被什麼所制約。", "假如你要繼續在昇進的道路前進，最重要的是照顧你的摩訶拉希什米原理，如此你就會忽略那些不重要的俗務，你會試圖保持輪穴的清潔，你會認真去享受靜坐，你會(儘量)將昆達里尼保持上升在頂輪的位置，你會去注意自己、觀察自己。", "有些人的昇進可以很快，他們可以維持住而不倒退，進而到達無疑惑的覺知狀態(doubtless awareness)；但是有些人就很慢，因為他們總是被一些小事、不重要的事所擾動、拖累，譬如你有一些西班牙貨幣存在銀行，現在西幣貶值了，你開始覺得好像大事發生了，好像全世界都要崩潰了。假如你是如此，你應該要知道你還不是一個霎哈嘉瑜伽士，你還未到達無疑惑的狀態。同樣地，若你在集體內，你想到的是：\"為什麼不是我當領導者？\"、\"爲什麼這活動不是由我來領導指揮？\"，那你就從摩訶拉希什米原
