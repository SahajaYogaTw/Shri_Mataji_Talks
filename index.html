理掉下來了，你開始和別人競爭，開始陷入權力的遊戲中。或是你忘記了你是一位霎哈嘉瑜伽士，或是你還會同人爭吵，或說不好聽的話等等，都表示你不知道如何來掌握你的摩訶拉希什米原理。", "所以隨著這摩訶拉希什米原理的發展，這原理更在你内裏顯現，讓你更強壯，你(慢慢地)不再有疑惑，不論是對你自己，或對其他的事物。你就達到一種純粹的意識狀態，没有任何外物可以破壞擾動這種意識狀態。此時的你會變得十分有活力、有創造力。無論你做什麼、說什麼，人們都會印象深刻。在這種無疑惑的狀態下，你知道你就像一個氣壓計，雖然你(的輪穴)仍會被感染，但那些感染只是給你一些訊息，你不會對此產生任何的疑惑。對你而言，更重要的是你隨時都成為生命能量(vibration)流動的一部分。", "在這狀態下，你不只對自己没有疑惑，對霎哈嘉瑜伽及霎哈嘉的知識也不再有任何存疑。在這個階段，你會發覺諸事順利，也有許多奇蹟發生，以致於你都會驚訝到事情就如此順利圓滿。你會在恰當的時間，碰到關鍵的人，讓你不禁想到： \"我為什麼要擔憂呢？畢竟上天的大能都為我安排妥當，為什麼我要擔心呢？\"", "所以這摩訶拉希什米原理表示你會是一個親切和善的人，非常能原諒他人，你不會被外物所擾動，但是你却非常急切想去幫助他人，你並不是要討好別人，或希望獲得回報。你不會再盯著手錶，因為你不會被時間綁住，你變成一種獨特的人格，它不只帶給你喜樂，也帶給周遭的每一個人。", "當你的摩訶拉希什米原理非常妥善時，你不會感到疲累，在每片樹葉、每片草，在天空、在所有的一切，你都可以感到喜樂。當你獨處時，你也可以享受自己，你不會感到無聊，而你也不會令人覺得無趣。假如你可以進入萬事萬物的摩訶拉希什米原理的本質，那麼這一切的存有就只是喜樂而已！", "註一：本譯文是此談話的主題，在主題之前有一序幕，請看：4-13摩訶拉希什米原理的喚醒(上) 註二：1992-10-01。"]}, {"num": "4-15", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "攻擊與謙和", "paragraphs": ["攻擊好鬥的個性(aggressiveness)是集體性(collectivity)最大的敵人，有些人本質上是極具有侵略性，他們談話的方式就極端富有攻擊性。這或許是由於某些因素：可能是受較多的教育，或可能是他來自一個非常具有侵略性的家庭，或許是他有一種優越的情結(superiority complex)，或一種自卑的情結(inferiority complex)，或是一種缺乏安全感在作祟，或是他被一些亡靈附身。", "他們往往試圖主導與掌握，對別人表現出一種強烈的優越感。這或許是源於他們的自卑感，當然也不一定如此，但是這種行為(在集體内)是必須被制止的。如何做呢？即其他人要來練習謙和(humility)。", "有一個笑話說：兩個人在樓梯相遇，上樓的人說：請讓路。下樓的那一位答道：我不讓路給儍瓜(I don't move for fools !)。上樓者往旁邊一靠説：但我會的(But I do !，譯者：英文的\" I do \"是用很簡潔的話語來表示 \"我會讓路給傻瓜 \"，但是又沒有說出 \"傻瓜\" 的字眼)。", "這個笑話正顯現出謙和是如何作用。你必須以謙和的態度來應對他人。........謙和是指你絕不可以壓迫別人，假如別人以侵略性、壓迫性的態度來對待你，你應該把它當成一種像小孩子、一種愚笨的行為，不值得你去介意。因為你是如此有容量、有能力，你可以承擔這些。", "註一： 1991-04-10。"]}, {"num": "4-16", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "覺醒的愛與愛的力量", "paragraphs": ["在我們的裏面有許多力量(powers) ，如摩訶迦利(Mahakali), 摩訶莎娃斯娃蒂(Mahasaraswati), 摩訶拉希什米(Mahalakshmi), 昆達里尼 (Kundalini)等的力量。這些力量都是用來幫助我們昇進。假如適當使用及了解這些力量，則你的昇進就可以持久。一旦你得到自覺並進入上帝的王國，所有這些力量就會被照亮覺醒(enlightened)，而這些覺醒的力量是完全充滿愛。我們必須了解這一點，即我們是經由愛而獲致完全的覺醒，所以在自覺開悟之後，我們只用一個力量，那就是愛。一旦你得到自覺後，你會體會到你的愛變成一個如此美麗的喜樂海洋。", "這個愛是不同於自覺前的愛，在自覺之後，它轉化成另一種形式，它是屬於另一個向度(dimension)。在自覺之前，你最愛的是你自己(身體、自我......)，你可能因為對自己身體的依戀，導致你吃得太多或不吃或運動太多，或追求某一種身材等；但當你得到自覺之後，你對身體的愛會變得不一樣了，你知道你的身體是神的殿堂，所以你會保持身體的清潔，你會避免所有可能毀壞身體的東西與行為。", "在自覺之前，你們也有另一種的依戀(attachment)，可以說是一種非常侷限的愛，即愛自己的家人、小孩、妻子(丈夫)。你們可能因此寵壞小孩及妻子(丈夫)，也可能因為自我中心及狹隘的目光，為幫助自己的家人而犧牲他人；得到自覺後，你會發現你原本所做所為對自己、對家人都不是有益的。你開始從群體的角度來思考，(而不是只考慮自己)，對於你自己的家人，你開始思考什麼才是對他們真正有益的，立即你會變成關心他們的問題及毀滅因子。", "正因為這種内在的覺醒，你不再有執着與依戀，這種來自無執的愛是最有力量的。就像樹木的汁液，它來自母親大地，一路上升至樹葉的細部，它不會只流到一朶它喜愛的花或葉子，它會滋養樹木的每一個部分。它没有任何執着與偏好。試想假如樹汁只依戀某一朶花、或某一片樹葉，這整棵樹及這朶花、這片葉都會凋零死亡。所以這汁液就如同無執的愛，只求付出給予，而不企求任何回饋，所以汁液帶給樹木的只是繁榮與益處。同樣地，一個成為聖人的霎哈嘉瑜伽士，他對他的家人、朋友及所有的一切的行事態度，也會如同汁液對待樹木一般。", "人類至今只是用\"仇恨\"的力量，尤其是在政治上。某些國家相信他們必須去仇視另一個國家，生來即是應當如此，只因為數百年前彼此有些爭端或發生過戰爭，所以他們的子孫還必須彼此爭鬥。其實\"愛\"的力量才是最大的力量，而且在得到自覺之後，我們只需要使用愛的力量。這是我們所擁有的、最有效的、最強力的武器，因為這是上天的愛，我們從這泉源-----無所不在的力量-----獲得了這上天的愛。 在這短短的談話中，我無法一一去談發生過的種種奇蹟，但你自己會在生活中發現，知道這愛的力量一直在保護你 ，這愛的力量其實也存在於你的心中。我看過脾氣非常壞的人，就是那種會讓別人的日子變得很悲慘的人，他們在自覺後，可以變成非常美麗、親切的人！一旦你點燃愛的亮光時，你會以正確的方式來愛自己，你會放棄所有錯的、不道德的行為。這愛是恆久的，是強而有力的，會讓你對人類的集合體有一份信心。因為正是内在的靈(Spirit)來點亮了你所有的力量，這靈正是人類的愛與集體性的來源。", "註一： 1993-08-03。"]}, {"num": "4-17", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "闍拿迦的一個故事", "paragraphs": ["闍拿迦(Janaka，註一)是降世的十大宗師之一，時間約在八千年前，他是錫呂羅摩(Shri Rama)的岳父，他本身也是一位國王。他到任何的修行靜室(ashram)，靜室內的聖者都起立，並觸摸他的腳來表達敬意。其中有一位門徒叫納其柯塔(Nachiketa，註二)看了非常生氣，就對他的導師說：\"你們為什麼去觸摸他的腳？他是一個國王(而已)，他戴王冠，過著國王的生活，他有什麼偉大之處？他又不是一位聖人！\" ，他的導師回答道：\"不，他是一位原始宗師(Primordial Master)，對他而言，住在宫殿和街道上是完全一樣。只有他可以給人自覺，他是處在極高的境地，不然你去他那裏看看。\"", "納其柯塔就來到闍拿迦的宫殿，他實在無法理解為什麼他的導師叫他來，來拜訪這樣一位國王------穿著漂亮的衣服、穿戴許多首飾，宫殿内又有許多舞蹈及宴會等等。闍拿迦問他：你為何而來呢？納其柯塔回答：我來此希望獲得我的自覺，闍拿迦答道：\"你可以拿我王國内的任何東西，但是要給你自覺是太困難了！\"，納其柯塔堅持說：\"反正你說什麼，我都完全遵行。\"", "闍拿迦在納其柯塔的頭頂上方吊了一把劍，要他在劍下睡覺，納其柯塔整晚都無法入睡。闍拿迦又帶他到河裏泡澡，當他們在享受河水時，有人跑來報告説宮殿起火了，但是闍拿迦繼續他的冥想，一點都不在意。過了一會兒，又有人跑來報告說火更大了，你的家人都逃離宮殿了，但是闍拿迦仍然繼續他的靜坐。接著又有人跑來大叫説火向這邊燒過來了！這位納其柯塔趕緊上岸去拿他的衣服，但是闍拿迦仍然在靜坐。最後他才張開眼睛從河中走出來。當他們走上來時，納其柯塔發現根本沒有什麼火災，闍拿迦對他說：\"這一切都是幻相(Mahamaya)，我知道根本没有發生什麼事，而且對我而言，没有什麼東西是重要的！\"（註三）", "註一：Janaka 的譯名自古即用\"闍拿迦\"，闍的發音同\"舌\"，是梵語，意思是指高深的修行人，\"拿迦\"才是名字。Janaka若直接音譯會是\"迦拿卡\"。 註二：納其柯塔是闍拿迦唯一的門徒，傳說闍拿迦用許多方法來試驗他、開導他。 註三：闍拿迦上岸來後對納其柯塔的說詞有另一個版本：\"當你活在無所不在的神聖力量的領域裏，大梵會照顧你\"。在Shri Mataji的想法，應該這兩種說詞都是相同的。 註四：Shri Mataji 多次談到這個故事，包括闡釋無執(detachment)、真正内裏禁欲的修行人(ascetic)、真正的捨棄放下等，皆用此故事。幾次講述的内容大致大同小異。 註五：許多人會有如下的疑問：倒底宮殿是否有失火？譯者的理解是：這好像無關重點。 註六： 1994-12-04、1996-07-16、1973-12-09、1983-06-05、1993-10-15、1983-09-10。"]}, {"num": "4-18", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "霎哈嘉和個人職業的衝突", "paragraphs": ["練習者問：您以前講過我們應該在社會上有一個事業，有一個專業的工作。在我們的工作上，我們應該投入到什麽程度？這工作對我們的重要性是到什麼程度？什麼時候我們可以將工作告一段落，而開始過完全的霎哈嘉 的生活呢？因為有時候我常覺得霎哈嘉和我的專業工作是有些衝突。", "Shri Mataji：不，不是這樣。從事任何職業，你必須以自然而然的霎哈嘉(Sahaja )方式來做這些工作。即不需要有過多的人為思量與計劃，事情自然會配合你來發展。假如你相信整個宇宙都會試圖幫助你，整個宇宙自然會將一切必要的呈現在你面前，事情也會自然成就。你不必須去花太多的功夫，不必去籌劃太多，不必去想我應該選這個或那個等等。你需要做的只是仔細觀察，等待那機會的到來，你也必須讓這機會有呈現出來的空間。用太多的頭腦去思量這個那個，並不會有太大的幫助。你會驚訝到事情如何自然而然地順利完成。", "這中間的關鍵在於你的順服是到達什麼程度？你與神聖的力量(Divine)又是多接近？你不必思量太多、擔心太多。只要你處在天父的王國裡，事情總會朝著你的期望來發展。你的所有的事都會被照顧到，連最小的部分、最微小的細節都會被照顧到。你們每一個練習者都會被照顧到。這就為什麼常有練習者告訴我：\"我不知道為什麼事情會這麽順利完成！\" 。 當你沈浸在這大洋之中，是海水帶著你上上下下，你只要去享受(enjoy)，把其他的一切都交給海洋來幫你決定。", "註一： 1988-07-27。"]}, {"num": "4-19", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "五個元素(一)------其本質與顯化", "paragraphs": ["我們是由五個元素( elements，註一)所構成，當你得到自覺，即當昆達里尼抵達頂輪、打開你的囟門區域時，你和無所不在的神聖力量(Divine Power)連成一體，此時這神聖力量開始流經你，這時會發生什麼呢？我們應該來了解在精微面的變化，此時這些(從頭頂而下的)能量(Vibration)逐漸開始滲入這五個元素的精微形式中。", "宇宙之初，是由道(Word)變成一個聲音(Naad)，然後再變成一點(Bindu)，從這一點，五個元素一個接著一個產生：", "第一個出來的元素是光(Light)，光的精微形式(subtlety，註二)是\"光澤\"(radiance，註三)，所以得到自覺之後，這光澤會開始在你的臉上出現，即光澤開始展現它自己。人們會對你臉上的光澤印象深刻，他們會想這些臉上有光澤的人一定有什麼特殊之處。", "你們也看過我的相片出現許多光暈，這就是我身上的光在散發光澤，因為這光已變得更精微了。當光這個元素變得更精微時，它就會散發出光澤，這就是你自覺之後，你内在精微面發生的成長，你的臉上開始閃閃發亮。 我們應該了解光澤是光的本質、精微面，光是構成人的元素之一，對光澤而言，光是比較粗糙、浮面的(gross)。", "第二個出來元素是空氣(Air)，我們周遭的空氣是浮面的形式，它的精微面是你感受到的涼風(cool breeze)，即空氣的本質元素、精微面是涼風，而這涼風正是我們所說的能量(Vibration)。當你的成長進入軌道，所有這些精微面都會開始展現它自己 ，不只你可以感受到能量，你也可以有涼風的感覺，這些都是空氣元素的精微面所帶給你的。", "之後出來的是水元素(Water)，它也是構成我們的元素(之一)。什麼是水的精微面呢？(什麼是水的本質元素呢？) 英文中似乎沒有足以表達這概念的字(註四)，經由水的滋潤，人的皮膚變得濕潤、柔軟，這是一個得到自覺的人至少可以看得到的特徵，你會看起來年輕，你會衰老得慢。我們可以說一個自覺的人，會變成一個溫柔的人、優美的人，在他和人談話的聲音中會有一種溫暖，或說在聲調中有一種水的清涼，如水一般的流動。即在你的行為中、在你的皮膚、在你和他人的應對中，應該表現出這些精微面，即你應該像水一樣：流動的、清涼的、帶來平靜的、有潔淨效果的。一旦你成為一個自覺的靈，這些將變成你的一部分。", "隨著水，你也會有火(Fire)這個元素，但它是一種非常安靜的火，這種(內在的)火不會燒傷任何人，但它會把你內在不好的東西燒掉，也會把他人不好的東西燒掉。例如一個盛怒的人來找我，他的怒氣會下降，因為(我的)火元素在那裡，(燒掉了他的怒氣)。假如你是一個完美的霎哈嘉瑜伽士，那麼(外在的)火絕對不會燒你；但假如你做了錯事，它是有可能燒你。悉達(Sita)走過火堆的試驗(fire Pariksha)來驗證她的純潔時，火並未燒她(註五)。一旦你進入火的精微面，那麼火及水兩者都會變成如神聖一般，(這火是不會來燒你的)。", "最後一個元素是母親大地(Mother Earth)，也是最重要的。像放在我房間的花朵會盛開，會出現人們沒有見過的超大花朵，我並沒有去做什麼，我只是坐在房間內。那麼在花身上到底發生了什麼事呢？這是母親大地的原理在運行，即(我身上)母親大地的精微面在運作，它給你所有的滋養，使你健康地成長。母親大地是我們的母親，母親大地的許多精微面都會進入我們(已得到自覺的人)，其中之一即是重力(gravity)，即你會變得非常有吸引力，並非指外表吸引人 ，而是指在靈性上，人們會被你所吸引，會覺得此人有一些特殊之處 。這是母親大地的特質之一，假如它沒有吸住我們，那麼在它轉動時，我們都會摔出去。此外母親大地的其他特質也會在自覺的人身上開始顯現，你會變得十分容忍、十分有耐心。你只要看人類在地球製造多少污染 ，對地球做了多少錯事，但地球仍然容忍我們這些荒誕的行為，你就可以知道母親大地容忍的特質。同樣的，自覺後的人也會變得十分容忍、十分有耐心，且非常能原諒他人。", "註一：根據\"太初之母的書\" (The Book of Adi Shakti，即Shri Mataji手稿編成的書，見p.202)，五個元素是指：土(Earth)、水(Water)、光或火(Light/Fire)、空氣(Air)、虛空或天空(Ether/Sky)。這應該是五個基本元素最完整的正確說法。1980-04-21的談話亦相似，指出這五個元素是：土、水、空氣、光、虛空。 但是在此談話(1998 -12-16)，解釋五個元素的精微顯現時，卻是指：光、空氣、水、火、母親大地，卻未提到虛空 ，並非沒有虛空這元素，Shri Mataji在九天之後的聖誕節普祭(1998-12-25)，談及無思慮時才補談虛空元素，那部分稍難，待來日再翻譯。 註二：所謂\"精微形式\"(subtlety)，即是指該元素的本質(causal，見1984-07-10)，或稱\"本質元素\"(causal element，見1986-07-25)，或稱\"更精微的能量\"(subtler energy，見1998-12-14)。Shri Mataji 在不同的談話用過這些不同的名詞，但所指皆是相同的，即每一個元素是由背後更精微的本質元素所構成的，土元素的本質元素是芬芳(fragrance, perfume)，是芬芳創造出土元素。 註三：光的本質是光澤、光彩(radiance)，Shri Mataji 也曾用glow這個字。 註四：在 \"太初之母的書\" 中有提到：水元素的本質、精微面是\"味道\"(taste)；光/火元素的本質是\"視覺\"(sight of vision)；土元素的本質是\"芬芳\"(fragrance)；空氣元素的本質是\"呼吸\"(breathing)；虛空元素的本質是\"聲音\"(voice)。 註五：傳說中，悉達被羅摩(Shri Rama)從魔王(Ravana)中救回後，有經過此試驗。 註六：主要摘譯自1998-12-16, 1998-12-14 ，也參考\"太初之母的書\" p.125, p.202，及談話1980-04-21, 1986-07-25，1980-09-27，1981-03-31，1983-01-21，1984-07-10，1981-10-06，1992-03-15，1982-10-26，1990-12-25，1990-07-25。"]}, {"num": "4-20", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "五個元素(二)------相關的其他談話", "paragraphs": ["右邊又叫prana shakti，即生命力量 (註一)，左邊是mana shakti (心理、情緒的力量)。這內在的右邊的生命力量，是經由五個元素展現出來，這五個元素是：土(earth)、水(water)、空氣(air)、光(light)及虛空(ether)。我們的身體(body，註二)是由五個元素所構成，這五個元素創造了五個像繭(cocoons)的東西圍繞在我們周圍，這就為什麼我們有五層光暈(auras)，這五層光暈可以被某些儀器所偵測到，因為這些儀器是用來偵測物質(matter)，它們只可以感測到右邊(屬於生命力量)的種種。這全部的物質是由這五種能量(energies，譯者：指五種元素)所形成的。這五個元素的背後亦有一個本質能量(causal energy, 或稱本質元素，causal element)，其實是本質元素創造出元素，例如土元素(或稱土能量)的本質元素(或稱本質能量)是芬芳，從芬芳創造出土元素。我們内裡到這個位置的五個輪穴(註三)是由五個元素所構成(譯者：即每一個輪穴由一特定元素構成)，這是指輪穴本身，至於駐在每個輪穴的神衹(Deities)也是從該元素所生出來的，所以祂們是由一個特定元素所生，每一位神祇會專注及侷限在這個特定元素相關的領域及知識。(1980-04-21)", "這環繞著人的光暈(auras)是由七個輪穴發射出來的，它們其實是五個元素的本質(causal)的表現，即五個元素將其本質表現在外。假如你是處在中間、處在現在，你看到的人就是人本身；假如你跑到右邊去了，你可能就會看到本質，例如一個吃迷幻藥(LSD)而跑到右邊的人，他無法看見我(譯者：指Shri Mataji的身體)，而是看到光。假如在得到自覺之前，你若可以看到我周圍的光暈，那麼你要小心了，因為那表示你有一些偏到右邊去了。至於那些很偏左邊的人，他們會看到我的前世的模樣，而不是我現在的樣子，這也是不好的，你必須就是看到我現在的樣子。當然你可以看到我現在的樣子，那表示你很正常，人必須先當一個正常的人。(1984-07-10)", "這右邊超意識(supraconscious)的攻擊就像迷幻藥LSD一樣，右邊是充滿了元素，即五個元素，所以這些跑到超意識的人會開始看見各種光，或有一些幻覺，如他感覺變成海、變成光等這些荒誕的經驗。(1980-02-22)", "耶穌基督是一位特殊的降世神衹，祂只是\"唵\"( Aum，或叫Pranava，註四)，是無所不在的神聖力量(All Pervading Power)的聲音。至於其他來到地球的降世神祇都有五個元素在其内裡，耶穌則只是一種力量、一種能量，耶穌完全是能量。他不像人類是由五個元素所構成，這五個元素都在右邊，當人死亡時，屬於土元素的那一層繭脱落了，然後屬於水元素的那一層也脫落了(註五)，剩下的就是靈魂(soul)， 靈(Spirit)則跟在你(靈魂)的頭上，昆達里尼也在那裏。", "耶穌只是純粹的能量(vibration)，這就為什麼祂可以在水上行走，因為祂的身體沒有質量(mass)、沒有物質(matter)，除了能量(Chaitanya)本身外，沒有任何元素。(1981-10-06，1981-03-31，1990-12-25)", "註一：譯者：指身體、頭腦思考等活動力量。 註二：譯者：body 在此並非指肉身而已，也包括由五個元素所構成的輪穴等。 註三：譯者：應該是指喉輪(含)以下的五個輪穴，Amruta此談話只有音檔而無影像，無法看到Shri Mataji手所指的位置。 註四：Aum 也稱Omkara，符號是ॐ。唵是太初之母(Adi Shakti)從至高濕婆神(Sadashiva )分裂出來時，產生的第一個聲音，錫呂格涅沙(Shri Ganesha)即是唵的具體化(1990-12-25)。唵也是無所不在的神聖力量(Divine Power, Chaitanya, Vibration)。 註五：Shri Mataji另有兩種稍不同的說法：一. 只有土元素那一層脫落(1987-05-04)；二. 水元素只脫去一點點(1981-03-31)。"]}, {"num": "4-21", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "克服貪婪的三個方法", "paragraphs": ["反向來平衡貪婪(greed)的方法就是變得極端的慷慨大方。假如你是非常大方，那麼貪婪會離你遠去。(並不是隨便地做)，而是可以有另一個方式來表現慷慨大方。假如你家裡有一些東西，並不是沒有用而想丟掉它，而是你覺得你其實可以不需要這種東西，你應該送給他人才對。當你開始思索你可以送給誰，你可能立即會想到：\"某人沒有這個東西，我可以送給他\"。而且假如你送給他，他將會十分感激，他會對你說各種好聽的話，這些話都是一般常人不會對你說的！你會驚訝到施予所帶來的喜樂，及人們會何等喜歡你的慷慨大方！", "人必須要慷慨大方，是對別人慷慨，而不是對自己慷慨，而且要盡可能大方。慷慨贈予的行為是給予他人愛，這也是表達你的愛的方式之一。", "另外一個去除貪婪的方法：你應該試著去做一些幫助大眾的社會工作。假如你去貧困百姓居住的地方(去幫助他們)，你(內心)的貪婪馬上會下掉！那些人的生活狀態及生活環境會讓你啞口無言，你不會再關心你的財富及種種，他們的情境會給你一個很大的震撼！", "在印度，有些人是非常的誠實。我家裡的僕人就從來不會偷任何東西，這是十分令人驚訝！為什麼？為什麼他們不會偷竊呢？因為他們安於他們的生活，他們(也)不想因偷竊而被關入監獄，他們不想改變他們目前的生活。他們根本不會想到偷竊這回事，他們根本不會去做這種事，為什麼？因為他們有羞恥心。在一些貧窮的百姓中，羞恥心(反而)有高度的發展。在他們的社群裡面，他們非常尊敬誠實的人，他們也都非常誠實，或許其中也有少數人不誠實，但是這種人是不被尊敬的，因為他們認為自我尊重(self-respect)是最重要的。這是很難想像的，他們甚至一天只吃一餐，可是對他們而言，自我尊重是比任何事都來得重要。所以如何對付這種毫無意義的貪婪呢？ 第三個方案就是你的自我尊重。為什麼你要去偷竊呢？為什麼你要去擁有這些偷來的東西？或擁有那些屬於別人的東西呢？假如你的内裡有自我尊重的心，你就不會去碰觸不屬於你的東西，那些貧窮的僕人都做得到，為什麼更富裕的人們做不到呢？這是一種他們所擁有的更高階、更進化的心態，即他們的自我尊重遠比那些可能滿足貪婪之心的東西來得更重要！", "關於貪婪有一點非常重要，即貪婪之心永遠不會被滿足！(在追求金錢及權力之下)，人處在那裡呢？是處在什麼位階呢？是處在進化過程的什麼位階呢？那些人如不停轉圈圈的老鼠一般，一直追逐金錢，這是臍輪的問題，臍輪必須要加以清理改善，正是臍輪給予人們滿足感！", "註一： 2002-08-18。"]}, {"num": "4-22", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "滿足感", "paragraphs": ["我剛剛談的(註一)就是一個霎哈嘉練習者應該有什麼樣的感覺，他應該是一個感到滿足的人。最重要的是你必須是滿足的！你觀察你自己的內在，你滿足與否？你已經得到(人生)最高的(自覺)，這是你過去累世所追求的，你已經獲得平靜、喜樂及所有來自上天的祝福。儘管如此，假如你仍是不滿足，你仍然想做一些有的沒有的、造成困擾的事，例如總是有人想在我面前炫耀，想到前面來表現.....。例如很多練習者認為我必須去他的家(譯者：這裏尤其指印度人)，為什麼你沒有想過你做了什麼(偉大的事)，所以我必須去你的家呢？或是一定要來我的房子(看我)呢？無論我在什麼地方，你都應該不要來干擾我的平靜。截至目前為止，你並未做過什麼(偉大的事)，你應該讓上述這種欲念留在心中就好，也想想(得到自覺的)你已處在什麼地位，為什麼你(還)會有這樣的欲念呢？這些會帶給我(許多)麻煩！......假如你在霎哈嘉裡沒有真正的滿足(samadhan)，那麼你是沒有用的！\"無論我在那裡，瑪塔吉都與我同在\"------在你的内裡應該要有這種滿足才對，處在這種心態之下你將會成長。", "假如你心中不滿足，隨時都在眾練習者之前爭出頭、搶表現，那你又獲得了什麼呢？假如你內心滿足，那我無時不刻都和你在一起！當你可以如此想時，你才是一個霎哈嘉瑜伽士。(在普祭、談話時)你坐在那裏都可以，對霎哈嘉瑜伽士而言，是沒有必要坐到前面、坐到台上來。我認識你們每一個人，假如你內心可以有滿足感，而且也達到那個深度，那麼在那深度之中你就可以遇見我，(所以你根本不必一定要見我)。現在你們應該(試圖)去達到這個深度。你應該是不論做什麼，你都可以得到滿足。你應該是要挺身來傳播霎哈嘉、為霎哈嘉工作，那麼你就會獲得真正的滿足，你就不會再想擠到前面來告訴我這個那個。(其實)大部分的時候，那些太過想出頭、太想到我前面的人，(往往)是不誠實的人或是小偷。而那些內心純淨、享受愛的人，往往消融在他們内裡的愛與享受之中，(而不會一直想擠到前頭)。", "再舉一個例子，許多女練習者想結婚，假如她們沒有結婚，為此她們就感到很不高興。這是不重要的事！妳現在已連結到上天！婚姻(也)未必都是一個很大的祝福。相反的，它可能是一種非常大的束縛，它可能帶來很多麻煩，所以最好不要因未能結婚而感到沮喪，無法給人自覺才是應該感到沮喪的事！妳應該想想妳已經給多少人自覺了？假如妳無時不刻就如同常人一般，只是想著婚姻，只想著這個那個，這樣子對妳不會有幫助。妳是非常特殊的人，(妳有沒有想過)妳的特殊之處在那裡？妳又用它來做什麼呢？", "註一： 在這個談話Shri Mataji 先用印度語講，下半場才用英語，兩部分都有談到\"滿足\" 這個話題。本譯文翻譯英文談話的部分，但也納入印度文談話的相關片段。 註二： 2001-12-31。"]}, {"num": "4-23", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "錫呂瑪塔吉有關憤怒的談話", "paragraphs": ["練習者問：假如在某一個狀況下，某人對他人生氣了，這是因為個性傾向的反應？或是來自一個負面力量的影響呢？", "錫呂瑪塔吉答：假如你心中發火了，但你很確定你並沒有做錯任何事，對一個霎哈嘉練習者而言，是完全沒有必要將怒氣表現在外，這憤怒本身就是一種力量(power)。此時你應該給你自己一個班單(bandhan)等等，但是你不需要表現出你是憤怒生氣的，你應該要完全的寧靜，因為你是做得到的，你是處在(宇宙不動的)軸心(axis)，你不是在(混亂打轉的)周邊。其實你心中的怒氣只是來讓你看到這憤怒，及讓你使用這憤怒來達成它的目的。假如你能如此做，這(心中的)怒氣會自行來成就，它會自行來擺平你所面對的那個人，你也會驚訝到事情竟如此成就。但是你必須先學習來靜觀你的憤怒，那憤怒是會成就事情。", "你也看過有時候(我)只是對這些負面東西吼叫，它們就跑光光，甚至有些瘋子就因此痊癒。但是你們不能(學我)這樣做，我才可以這樣做，你們必須隨時保持端莊、和善的態度。", "假如你的生氣是來自你個性上的傾向，或是你的失控，那麼這種生氣是不好的。假如發脾氣是來自失控，那麼(絕對)是不好的。我有時候會很生氣，但是完全是在我的掌控之中，我知道我在生氣，我知道負面東西在那裡，我也清楚看見它們如何跑走，我可以看得見它，但是你們看不見這些東西，所以你們沒有必要生氣，或展現你的脾氣。假如你的憤怒讓你有些失控 ，那麼有一個來祈求Shanti (即peace，平靜) 的口訣 ：\"Ya Devi sarva bhuteshu Shanti rupena samsthita.\"，你必須來祈求這個祝福、這個平靜。要控制你的脾氣，你必須對自己念誦這個口訣，Shanti 是重點、是這個軸心，從這個軸心你可以靜觀萬事萬物。縱使你是在生氣，但假如你是平靜的，你就不是處於混亂的狀態，這時候這個生氣就是一種力量，這個力量會來主導一切。總之你需要做的就是讓自己處在平靜的狀態，這個Shanti就是你的堡壘，但是這種安靜平和並不是代表一種懦弱，懦弱本身就不是平靜，一個平靜的人絕對不會是一個懦夫，因為沒有任何東西可以超越平靜，可以打敗它。懦弱與平靜從來都不是相提並論的。你的力量是來自裡面，而不是來自外面，所以你不必將你的憤怒的力量展現在外面，只需要對人展現一點點的憤怒，你就會看到它如何成就事情。", "首先你必須在你的内裡建立一個基礎，在這個基礎上，你是軸心，你不會容許憤怒騎在你頭上，如此你就會成長。", "這兩種憤怒你都要知道，當你可以抽離出來看你的憤怒，這種憤怒是完全無礙的；當憤怒會將你淹沒，你就必須想辦法來解決這種憤怒了。你必須自己好好判斷你的憤怒是那一種。", "註一： 1982-08-06。"]}, {"num": "4-24", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "如何對付自我(Ego)及非我(Superego)", "paragraphs": ["練習者問：錫呂瑪塔吉，可不可以談一些關於如何用靈(Spirit)來反擊我們的自我。", "錫呂瑪塔吉回答：你不應該去反擊自我，假如你想去打擊自我，那麼它會更進一步騎在你頭上。並不是說有一個自我，你就去打擊它，這不是對抗自我的方法。假如你對自我說：\"我要打扁你\"，那麼你的自我會長得更大，所以絕對不要和自我對抗，對付自我的唯一方法就是去靜觀它。你的注意力是非常重要，你的注意力現在已經被照亮喚醒了，你(的注意力)所觀照的東西，它會(自動)回復到正常的大小。假如你的自我長得太大，你只要觀看你的自我，即只要對鏡子中的自己說：\"嗨！自我先生，你好嗎？\"，如此你的自我就會消退下來。不要去打擊它，只要去觀看它。人有各式各樣的自我，教育程度高的人有他的自我，教育程度低的人也有他(自以為傲)的自我，因為人們總是想表現出他是重要的、他是不凡的，就是有這些各種型態的自我。所以最好的方法是：看到你的真我(Yourself)，這就是為什麼我常說的：面對你的真我(Self)，你的真我就是你(內在)的靈。", "練習者問：您剛才所說的也可以同樣用在 \"非我\" (superego，或譯\"超我\")嗎？", "錫呂瑪塔吉回答：是的，幾乎是如此。面對非我，你不必害怕，你只需要說：\"滾出去！我可以很清楚看見你，你在那裡，你現在滾出去！你斗膽敢來嚇我！我是一個靈！我是一個靈！你未免太大膽了，竟敢來影響我！\"，就是如此做。", "自我會讓你變成一個不折不扣的笨蛋，非我則讓你變成一個懦夫。如何去對抗它們呢？假如你說：\"我不想成為一個笨蛋\"，自我就會跑掉。假如你想成為一個笨蛋，那麼自我會出來幫助你。假如你想當一個笨蛋，只要召喚自我先生，那麼你直接就變成一個大笨蛋，這是最簡單的方法。至於非我，假如你是一個懦夫，它就騎在你頭上，你可以說：\"我不想當一個懦夫......\"。或說：\"Ham，Ksham\"，這是額輪的口訣，面對非我，你說：\"我是(一個靈)\"；面對自我，你說：\"我原諒\"。(註一)", "註一： 從其他的談話，譯者整理出如下：Ham 的意思是 \"I am\"(我是)，或 \"To know Thyself\" (知道真我)，或 \"To know you are a Spirit\" (知道你是一個靈)。 Ksham 的意思就是 \"forgive\"(原諒)，或 \"I forgive\"(我原諒)。 註二： 1982-08-06。"]}, {"num": "4-25", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "真誠與內外的整合", "paragraphs": ["完全徹底的整合(integration) 是非常重要，除非你有內在的整合，否則是無法來進行外在的整合。完全的內在整合是來自專注奉獻在自己的改善昇進之上，最重要的是：你必須將時間用在你的(靈性)發展上。做此事並不是為了給我看或給他人看，這是你和你自己之間的事。你必須努力來清潔你自己，當然你可以很輕鬆、很舒坦地和你那些阻塞嚴重的輪穴共存，但是你最好是有很暢通乾淨的輪穴，這是很享受的狀態，也不難做到。", "如何做到呢？首先就是要真誠(sincerity)，要完全的真誠！你對你自己真誠嗎？ ......你的真誠必須是完全的，任何的不真誠的想法對你都是有極大的傷害。如同我是真誠的對待你，你也必須真誠對待你自己，如此你就可以開始享受霎哈嘉。這對你內在的整合是非常重要的，因為假如你是真誠的，那麼這是來自你的心，假如來自你的心，那麼你的身體、腦袋、智力及所有一切都會努力來完成它；但假如不是來自你的心，那麼將只是一件表面的作為而已。所以你必須試著從你的心來感覺一下，這就是所謂的真誠。你不能靠任何人，不論是你的妻子、丈夫、小孩、母親、父親都不行，這是你自己的事，所以你必須如此來做，才能達成你內在的整合。而達到整合狀態的原動力就是非常簡單的一樣：真誠。若是如此，你將會自動達到(內在的)整合。", "另一個重要因素是耐心，你必須耐心對待別人，因為假如你沒有耐心，你會懷疑你自己的真誠，所以你必須有耐心。假如你知道你過去是如何、從過去到今天你又經歷了那些才到今天的階段，如此你就會對他人有很大的耐心。當你對他人有耐心時，你的真誠就是無時不刻都是完整的。只有經由你自己的真誠，你才會有完全的整合。", "我們更進一步來談真誠。如何來維持你的真誠呢？首先你必須下定決心，即要發誓來當一個真誠的人，然後你必須去發掘你在何時、因何事而變得不真誠。你是很會分析的，你可以發現你如何變得不真誠？在那個情況下你變得不真誠？如何來矯正自己呢 ？你要監看控制你的頭腦心智，看它如何變得不真誠。", "你會驚訝地發現以真誠來行事是遠比不真誠來的容易，最簡單的方式其實就是真誠，而不是去欺騙，因為你根本不必傷腦筋。你不用花腦筋就可以真誠，但是你必須動腦筋才可以不真誠，你必須計劃這個那個，你必須想一些辦法、找漏洞、找藉口等等。假如你完全忠於你的真誠，你就不必去擔心任何事，而且這真誠本身就會帶給你許多好處。你不必去要求任何人對你的真誠給予回報，真誠本身就會給你回報，此時你就會開始享受你自己的真誠。假如你可以用一個旁觀者的角色來看這些，你會發現你的真誠讓你變得如此優美、尊貴，及你的自尊又是如何地在這過程中逐漸上升。你將會驚覺到真誠本身就是一個巨大的力量，它在你身上展現了活生生的動力，而且你將會是一個完全轉換的人。", "你內在的轉換將會來改變這整個世界。人們將會看到你不是一個充滿混亂疑惑的人，你既不是一個懷疑古代聖人的人，也不是一個狂熱的基本教義派(註一)，你也不是一個有盲目信仰的人，而是一個清醒、有覺知，而且能比別人更看清楚世事的人。上天只對這種人有興趣，我告訴過你們上天對一隻有警覺的蟲的興趣，是遠超過一個行屍走肉的國王。當你内心更清明警覺，無所不在的神聖力量就會對你放更多的注意力。這種清明警覺的心，其實就是被你的真誠所喚醒的。真誠就是表示你終於你自己，在真誠之下你必須忠於自己，而無法不忠於自己。忠於你自己就是真誠，我就是以此來經營霎哈嘉，但是真誠是我的本質，我不需要任何努力，即我本來就是如此，我也無法不真誠。假如我是你的模範，那麼你應該嘗試在你的内裡吸收我的本質，如此你就會驚訝地發現你是如何地和我連結在一起。然後我們就可以如同一個波浪、一個共同體、一個共同的人格來前進移動，這就是這個頂輪紀念日所要達成的。......", "當你的轉換開始有所成就，假如人類能開始逐漸被轉換，那麼明天你們將會是社會中各個事務的領導者。不論你是社會中那個階層類別，試著去接觸、影響你的層級中的人，如此你就可以創造出一個進化圈，這就是 \"外在的整合\" (outside integration) ，如此這個社會就會得到整合。不同宗教的人都會來到霎哈嘉，因為它就是所有宗教的成果。政治、經濟、各種意識形態也將整合在一起，因為它們的本源其實是同一個。只是因為人為(錯誤)的認同，它們才變成今天分離的局面。這就是我們如何來整合全世界成為一個美麗、統合的文明，讓其中的每一個人都可以來享受。", "註一：就是譯文 \"古代的聖人\" 最末段中提到的當代的兩種人。 註二： 1980-05-05。"]}, {"num": "4-26", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "有智慧的人生", "paragraphs": ["***說明：**這個在靜室(ashram)的對内談話提及許多，末段Shri Mataji談到有人因為讀拜倫(Lord Byron)的作品，而偏向左邊、整天哭泣等等。本譯文就是翻譯接下去的部分。*", "**譯文：**", "一個人應該要有一種非常有智慧(wise)、有理性(sane)的生活態度，即：", "人有一個永恆的生命，人是一個永恆的存在，人來到地球是為了享受所有上帝為人所準備的一切祝福，並不是為了傷心哭泣或是感到有罪惡感，這些並不是人應該去承擔的。這是最重要的一點，這種態度才是有智慧的。", "再者，人也不要為了一些生活中的小事而把自己弄得十分可憐。譬如前幾天我聽到一個很可笑的故事：一位先生和他太太吵嘴，最終鬧到離婚，這位可憐的先生沒有地方住，就去他的兄弟的房子。他的嫂嫂是一個凡事非常挑剔的人，又養了三隻寵物。這位先生找不到任何位置來放攜帶來的箱子，因為他嫂嫂會說：\"不不不！不能放這裡！這個位置是給寵物的！\"，這位無家可歸的先生將箱子放到另外一個位置，他嫂嫂又說：\"不不不！不能放那裡！有另外一隻寵物！\"。(有些人)就是像這樣，成天為一些生活中不重要的小事擔心，這種生活態度也會衍生出\"自我\"(ego)的問題。人應該活在一種悠閒、少煩憂的人生，那些小事一點都不重要！但是這並不意味著懶惰、散漫的人生，絕對沒有這個含義！人生必須要認真辛苦工作，但要去享受人生，而不要陷在一些完全不重要的事或無用的事。", "你的人生應該是去散播喜樂，所以為什麼去在乎這些小事呢？那些不是你人生的目的吧！", "註一： 1980-04-24。"]}, {"num": "4-27", "catTitle": "自覺，昇進，修行", "catNum": 4, "title": "霎哈嘉狀態-----自然而然的境界", "paragraphs": ["這是霎哈嘉練習者必須要達到的境界，這種狀態在薄伽梵歌( Gita )中，錫呂克里希那( Shri Krishna )叫它是Sitha Pragya。格尼殊哇( Ganeshwara )則稱之為Sahaja Stithi，即是\"霎哈嘉狀態\"的意思。一個達到此境界的人，就如同一面鏡子一般，眾多臉孔在鏡中走過、許多人往鏡內注目、多少裝扮在鏡前進行，但是鏡子仍然是鏡子，完全沒有改變。所以達到自然而然的境界的人，他並不在乎是誰看著他、也不管是誰在看誰、不管他是在那裡，他只是安然自處，他就獨立在他自己(的真我)之內。雖然人有種種的感官與感覺，但他不在乎這些感覺，對他而言，這些感覺沒有太大的差異，他不會陷入這些感覺，他只是讓這些感覺漂流而過。你們都必須達到此境界，如此你才是一個真正的霎哈嘉瑜伽士。", "(雖然許多人已得到自覺)，但是我仍然發現許多練習者迷失了，迷失在想從霎哈嘉撈一點錢、迷失在領導人之爭、迷失在忌妒及羨慕之中等等，這表示這些練習者仍有許多内裡的功課要做。但是你們也不須要走入放棄所有(外在)東西的苦修，這就是為什麼我總是說：你們要靜坐！因為當你靜坐時，那些將你往下拉的力量會褪去，慢慢地它們會消失，因為你變成真正的你自己，你為你的真我所包圍，此時你超越在這些之上，即在貪婪、慾望之上，你是一個靜觀者，你只是靜靜地看觀看，你不會迷失在這些將你往下拉的事物之中。在這靜觀狀態下，你會變得精微，變成(真我的)你自己，此時外物無法干擾你、影響你。", "在你得到自覺之後，你開始可以將真正的你自己和其他東西分離開來，如有些人可能看到自己的自我及其造成的種種問題，有人看到自己臍輪不好和汲汲謀利的行為，即你開始會有關於自己的真正知識。在自覺之前，人是活在無明及黑暗之中，而沒有(關於自己的)真正知識。當你內在有光，便可以看見自己的問題時，你就可以將自己和這些問題分開來，來去除它們，來使自己更清潔、更完美。一旦你更往上到達自然而然的境界時，你也不需要這些知識了，即你不需要知道你的輪穴的種種狀況，這些都不再重要了。你就像一個石頭，這個石頭内裡有完整的大腦、心、肝，你不在乎任何事，任何外物也不會令你煩憂，你只是享受著愛與慈悲的流動，及享受從別人身上再折返的愛的迴響，甚至再一段時間後，連這些都不再為你所感知，你就自然而然消融在其中。", "過去的聖人是可以達到此境界，但是他們並無法將此境界告訴或教導大眾，最後他們也消失了。在過去他們並未有今日霎哈嘉瑜珈的集體意識(collective consciousness)，在現代的霎哈嘉瑜伽之下，你們發展出來一個新的象度(dimension)，在此集體意識之下，你會想到他人，你會對他人有慈悲心，你也會想給他人自覺。", "註一：大家可能會有一個疑問：自然而然的境界又是相當於以前提到的靜坐的那個層次？ （Shri Mataji說過靜坐有三個階段，一. 無思慮的靜觀 (thoughtless awareness，即Nirvichara)，二. 無疑惑的靜觀 (doubtless awareness，即Nirvikalpa)，三. 完全的自覺。在這之上才是神的自覺(God's Realization)，亦有三階段(1977-02-15)。但也另有其他談話說三個目標是：一. 無思慮的靜觀，二. 無疑惑的靜觀，三. 神的自覺(1996-03-03)。）譯者以為Shri Mataji在談話中從靜觀的狀態一路講到完美的階段，所以自然而然的境界應該是指\"無疑惑的靜觀\"或\"完全的自覺\"。 註二： 1996-11-10。"]}, {"num": "5-1", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "什麼都是可能的 ------一個上帝的故事", "paragraphs": ["有一個人要去見上帝(God)，在途中他碰見一位苦行者。這位修行人住在森林中，每天從事諸如倒立、單腿站立等等的苦行。這位苦行者得知這個人要去見上帝，就請他代為稟告上帝。他說：\"我一直祈望能有看見上帝的福德(darshan, 註一)，我每天這麼努力做這麼多的苦行，但是為什麼我還是看不見上帝，我什麼時候可以看到上帝呢？\"，他回答道：\"好，我一定代爲轉告。\"。之後他又繼續前行，他又碰到另一個人。這個人懶散地躺在樹旁，揮手對他說：\"你過來，你過來！我聽說你要去看上帝，請你幫我告訴上帝，祂今天還沒送食物給我，我肚子已咕嚕咕嚕在叫了。\"，雖然有些訝異，但他也答應代為轉達。", "他終於看到上帝，辦完他的事情後，他稟告上帝：\"我來的途中碰到一位苦行者，他有如此如此的疑問。\"，上帝答道：\"你告訴他要再努力一些，他需要更多的苦行。\"。他接著問：\"我另外還有碰到一位肚子餓的人.......。\"，上帝說：\"什麽！他還沒有收到食物？ \"，上帝立即叫來服務人員，吩咐他們即刻送去食物。上帝接著說：\"我知道你一定有些疑惑，你回去之後只要告訴那兩個人如下的故事，你就會明白了。你告訴他們你在這裏看到我將一隻駱駝穿過一個針眼。\"", "他下山之後先碰見那個苦行者。他依舊很努力在做那些瑜伽動作。 \"上帝如何回答你呢？\" \"上帝說你仍是要再努力一些。但是我在上帝那裏看到了一個奇蹟，上帝將一隻駱駝穿過一個針眼！\" \"將一隻駱駝穿過一隻針的針孔？這怎麼可能？那隻駱駝是多大？\" \"正常的大小啊！\" \"那針孔又多大？\" \"也是正常的大小啊！\" \"那麼駱駝怎麼穿過針眼呢？\" \"就是這樣穿過去！\"", "他接著又去拜訪那位飢餓的人。他正快樂地享受他的食物。 \"哦！你回來了。我以前只是和你開玩笑！上帝從來都不曾忘記我的食物。又，你在上帝那裏有没有看到什麼有趣的？\" \"我看到一個奇蹟！上帝把一隻駱駝穿過一個針眼！\" \"這叫什麼奇蹟！祂是上帝，祂是無所不能的上帝！祂可以將整個宇宙穿過一個針孔！以祂的大能，什麼都是可能的！\"", "註一：印度文化裏有這種的說法，即人若可以看見聖人或神祇，那是一個很大的福德。 註二 :這是一個Shri Mataji 講過許多次的故事，是印度的一個古老的故事。 註三： 1988-07-27。"]}, {"num": "5-2", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "人不可能了解上帝", "paragraphs": ["你們是無法了解上帝(God)，你們必須理解這一點，那即是：了解上帝是不可能的(註一)！但你是可以和上帝有聯結，你可以同上帝為伴，你可以被上帝祝福，你可以蒙上帝照顧，你可以知道許多有關上帝的事，但你不可能了解祂。", "同樣地，你不可能知道為什麼上帝做此事，爲什麼做那事，你無法理解，你也無法解釋它。有些人甚至會問：\"為什麼上帝創造Swastika(卐)？\"、\"為什麼祂創造Omkara(即Aum，符號為ॐ )？\"。有些人甚至如此地自大而問上帝：\"爲什麼祢存在呢？\"，人就是會超越界限到如此難以想像的地步。人類的自大與自我造成人無法認識上帝，人們想的都是自己，又很固執己見，但又不知道自己是如此。", "是太初的力量(Shakti)給你自覺(Self-realization)，甚至更進一步給你神的自覺(God-realisation)，但是依然你無法了解上帝。除非你在上帝之上，你才可以了解上帝。", "人們是從源頭(Source)而來，人是無法了解這源頭，人們是無法去評論它，也無法去問為什麼。不管上帝做什麼，這是上帝的期望、上帝的願望。人們必須接受的是：無論上帝的願望是什麼，我們都很樂意去接受。", "註一：這是Shri Mataji常提到的一個觀念。 註二： 1992-09-27。"]}, {"num": "5-3", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "無所不在的神聖力量( Chaitanya)", "paragraphs": ["無所不在的神聖力量( Chaitanya，註一)流通在宇宙每一處，這個力量會思考，祂清楚知道所有的事情，而且祂會安排一切。更重要的是，這個力量是愛你的-----無條件地愛你！祂的愛是完全不要求你的回報，祂只希望對你付出，希望你有所成長，希望你幸福。至於那些在你前進路上的荆棘和阻礙，或是要給你麻煩的人，這些通通都會被消滅。但是你不用耗費力量在這上面，你只要請求這個力量去毁滅這些邪惡的勢力即可。這個神聖力量有祂毁滅的一面，你不要接近這毁滅力量，你只要祈求(desire)，這個力量就會自行去運作。", "進入無思慮的靜觀狀態( Nirvichar)是你的避難所，可以避開那些試圖要掌控你、給你麻煩或差辱你的人們。你應該進入靜觀的狀態來看這些人。例如有一個瘋狂的人一直纏著你，你要如何應對呢？你但就靜觀他的瘋狂、他所受的心智折磨、他的困難，你可以笑看他的演出，欣賞他是何等的愚蠢，你不要去承受任何他給你的麻煩。你只要進入你的堡壘-----無思慮的靜觀。當你在這之中，那些愛你、給你喜樂、養育你的大能都會來幫助你。但是假如你仍然忙著想我如何消滅這些、如何處理這些，那麼這些麻煩將繼續糾纏著你，而非對方。", "註一：Shri Mataji 有時也用 Divine Power 來表示 Chaitanya。 註二： 1988-10-16。"]}, {"num": "5-4", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "錫呂瑪塔吉關於Vibration(能量)的一段談話", "paragraphs": ["從某個角度來說，vibration是非常寬厚慈悲。縱使你犯一奌小過錯，你的vibration在那個當下並不會消失，但你會在你的內心感知到這是錯的。如果你繼續犯錯，過了一段時間後你就會失去vibration！你甚至不知道你已失去vibration了！所以在霎哈嘉正法（Sahaja Dharma）的第一準則即是：你必須維持你的vibration，並且持續增加你的vibration，而且更進一步改善你對vibration的敏感度。你對vibration愈敏感，則表示你已往上昇進了。假如你失去感知vibration的能力，即表示你也失去霎哈嘉瑜伽了，此時你要趕快去弄清楚自己為何會如此。", "註一: 1985-08-06。"]}, {"num": "5-5", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "精微的能量 (Vibration)", "paragraphs": ["昆達里尼(Kundalini)捲曲成三圏半，潛藏在被稱為薦骨(Sacrum)的三角形骨頭中，當昆達里尼從三角骨升起，往上穿過上面的輪穴，當她穿過(三角骨上面)第六個輪穴，即\"頂輪\"(Sahastrara)，此時她把你和''無所不在的神聖的愛的力量''(All-pervading Power of Divine Love)連結起來。", "什麼是這個神聖的愛呢？這力量又做什麼呢？它是母親的能量(the energy of the Mother)，我們可以說它是太初之母(Adi Shakti)的能量，它無所不在，它經由來vibrations來運作，vibrations又是什麼呢？它是一種非常精微的能量，(在打開頂輪之後)，它開始流經你的頂輪，頂輪的一千朵花瓣都慢慢地被點亮喚醒(enlightened)，它也會開始流過遍佈你的身體、你的手腳。而且當你的注意力越集中在頂輪，它就運行得越快。", "當這個能量流動時，它會起作用，會在每一個方向、每一個向度(dimension) 起作用，例如它會在生理上起作用，假如你有生理的病痛，(你會得到治療)。你們都看過許多人在我出現的場合就得到醫治，單單只是因為我的在場，而且我並不需要對他們做什麼。當我看到某人，我立即知道他是什麼病痛，同樣的這也是因為我和這個神聖力量(Divine)的連結，它告訴我這個人有什麼問題、該如何去治療，而且這些毛病可以立即被治好。這些都自然而然發生，我不必去問任何問題、不必試圖去發現、不必去分析，它就直接說：''如此去做''，或是它也不說，它直接就去運作，它就自動去成就。", "實在是非常難以(向你們)解釋這個能量是如何運作，但是所有得到自覺的你們也可以去了解、運作你自己的能量，如何做呢？藉著釋放出能量、藉著去感覺能量、藉著將能量給予他人、藉著去試驗(能量)。", "註一： 2001-05-06。"]}, {"num": "5-6", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "瑜伽才是重點", "paragraphs": ["印度人對未知有一種敬畏，但却不知道全能的上帝是(猶如)充滿慈悲與愛的海洋。人類必須達到一個程度才可能知道上帝，人類是既不了解上帝，也不了解自己。首先你必須先了解自己，之後才可能了解上帝。", "我在南印度看到許多非常儀式化(ritualistic)的行為，我是很驚訝他們如此用心去做這些儀式，但是他們却不知道為何要做這些。他們是如此地虔誠(bhakti)，但是這般盲目的虔誠却無法帶領他們到任何(更高)的境界。你必須有一種覺醒的虔誠，即所謂的\"堅信\"(shraddha)。除非你得到自覺(enlightenment)，否則這些虔誠、崇拜都没有任何意義，正如同我前面的麥克風，若不連接到電源，它是没有任何意義的。同樣地，如果你不連接到這無所不在的神聖力量(all-pervading power of Divine Love，或叫Brahmachaitanya)，那麼你的崇拜與虔誠是没有任何意義，因為那是没有任何的連結，那是如同經由一隻沒有連線的電話來對人講話一般。我們要知道最重要的是必須有所謂的\"瑜伽\"(Yoga，譯者：指和上天的連結)。", "或許你讀了許多書，或許你擁有許多知識，如吠陀經(Vedas，註一)中的種種，但這作為就如同你頭痛去看医生，医生開了一個藥方，但你只是(拼命)唸誦藥方而未去服藥。除非你去服藥，否則你没有任何機會去獲得這處方所承諾的藥效！這些從書本或傳統而來的許多觀念是如此地穿透人們，以致於人們有很大的無明(ignorance)。我看過有些人很努力讀書，有些人不停地唸咒語(mantra)，有些人拚命地禁食，但他們都無法獲致什麼成就，他們只變成暴躁的脾氣，在他們的内心没有任何喜樂。其中有些人甚至抛棄家庭，他們以為這是做了很大的犧牲 ，但是上帝並不會要你去做這些無意義的事，上帝是你的父親，祂是如此地慈悲與充滿愛心，為什麼祂會希望你去受苦呢？", "爲什麼你要去受苦呢？你如何能經由自我折磨而獲得解脱呢？迦比爾(Kabir, 註二)有一個很有趣的諷喻：\"假如經由餓肚子你可以得到開悟解脱，那麼印度有多少窮人是成天在餓肚子，這些人不是都會得到解脱嗎？假如剃個光頭就可以開悟解脱，那麼那些每年剃毛的綿羊不是會比你更早得到解脱嗎？\"。上帝創造這個世界是為了你的舒適與享受，假如你必須接受地獄般的折磨才能獲致解脱，那麼祂爲什麼要創造這(美麗的)世界呢？", "經由霎哈嘉瑜伽，你會知道真正的你，一旦你連接到無所不在的神聖大愛，你會了解到你自己的光輝，也會知道你擁有那些大能(powers)，你會知道你内在的美麗，而且你會開始尊重你自己，你會變成一個情緒平衡的人，更重要的是你會獲得給予他人自覺的能力。", "註一：在印度傳統中，有關宇宙的神秘知識稱為吠陀(Veda)，記述吠陀知識精華的聖書，都稱為吠陀經。 註二：迦比爾是印度十五世紀的一位聖人。 註三： 1994-01-17。"]}, {"num": "5-7", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "當代宗教的問題", "paragraphs": ["當今我們面臨的很大危險之一即是宗教的基本教義主義(fundamentalism，註一)，幾乎無論那一個宗教皆背離它原先開創者。人類歷史上這些不同時代、不同地域的先覺者、聖人、先知或降世神衹，他們都是靈性大樹上面美麗的花朶，他們都是吸收同樣神聖汁液而綻放的花朶，他們在世界各地散發著相同的愛的芬芳。但是這些美麗的花朶却被後人(追隨者)從靈性樹上摘取下來，而成為毫無生命的宗教，再也沒有任何的芳香與生命力。", "宗教原本應該是要給予人價值，要把人從受制於原始動物本能中提升出來，使人脱離那些基植於不安全感、害怕及衝突的原始部落天性。宗教原本是要使人走向平衡，為最後的靈性昇進做準備，即變成内在有光而圓滿的人。這樣子的人是完全知道神聖的宇宙法則，因為他們是和上帝有連結的。這即是這些聖人及神祇們來世的原本目的。很不幸的，隨著時間的推移，宗教變成了人類之間最大的衝突來源。這些宗教人士表面鼓吹愛及盲目的信仰，但是他們實質上却是完全的金錢導向或權力導向，而那些在上位的宗教人士本身也不認識神，和神也沒有任何的連結，他們沒有任何實相(reality)的知識，他們所知所談者皆是屬於幻相的。這些由人所創造的宗教甚至扭曲原始的經典，或是只用他們的頭腦去解釋它。所有的宗教最原本的精義即是要人明瞭人類的有限，而利用有限的生命去追求永恆、追求上帝的國。相反地，這些由人創造的宗教却是一種以為自己是上帝的選民，進而鼓吹仇恨、渺視他人(異教徒)的组織，那些忠實的追隨者、盲信者更是有能力犯下各種可怕的罪行。這都是因為他們無法感知内在最高指導的靈(Spirit)。人唯有在得到自覺之後，内在的靈才能成為真正的高我(主人)，來指揮種種較低層的自我。 正也是由於這些宗教的種種問題，許多現代人並不相信有一位全能的上帝，他們只相信科學可以證明的事物。", "註一：即認為自己的信仰才是唯一的正統，其他的宗教皆是異教外道。 註二：Shri Mataji 在一生的談話中談及此問題可謂是無數多次！這是每一個練習者不可不了解的議題。了解此問題則更能知悉霎哈嘉瑜伽和其他宗教的差異. 註三： 1989-09-01。"]}, {"num": "5-8", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "過渡期(Krita Yuga, 或譯 \"成就期\")", "paragraphs": ["前言：Shri Mataji 屢次提到練習者應該知道這個時代是Krita Yuga，是一個吉祥的時代，是求道者的大好機會。其實我們可以碰到霎哈嘉，可以得到自覺，最主要是因為我們生在這個屬於成就的時代的Krita Yuga。譯者綜合整理Shri Mataji 約三十餘次提到此點的談話。", "過渡期乃是從一個時期進展到另一個時期之間的一個空檔(註一)。目前這個時代正是Krita Yuga，鬥爭期(Kali Yuga)剛結束，再來是完滿期(Satya Yuga)，這中間的一個空檔正是現在。Krita的意思是：成就的時代(work will be done, 或 when it was done)。Krita Yuga翻譯為\"成就期\"較為貼切。", "過渡期有一個最大的特色，即是在此階段無所不在的生命能量(Paramchaitanya, 或叫 All-Pervading Power)變得非常活躍，因為祂會試圖使(人類的)進化再往前推進一步。正因為如此，在過渡期有一些如下的特色：", "一，很多人會開始覺得他們需要去求道追尋，許多人在這個階段會得到自覺，這都是來自這個力量的運作與恩賜，所以今天我們在全球有這麼多的霎哈嘉練習者。因此Shri Mataji 叫這個時代是一個開花結果的時代。", "二，會有很多的奇蹟(或是異象等等)，如許多練習者皆親身經歷到不可思議的事情，這些皆是這個活躍的生命能量的傑作。", "三，每一個人都會得到他的業報(Karma phalas, 意思為\" 行為的果報\", fruits of actions)，即善惡都會有報。做惡事，必然會為此付出代價，這力量會懲罰你。Shri Mataji 特別提到若你是一個口是心非的偽君子(hypocrite)，最後會傷害到你自己。所有的謊言及虚假都會被揭露拆穿，這也是這個時代業報明顯的例子。", "四，在推廣霎哈嘉瑜伽時，因為這個力量的幫忙，你會有許多助力，你會有許多神奇的經驗，事情會很順利地成就。同時你會受到這力量的保護，其他人也無法傷害你。那些試圖傷害你的人反而會受到懲罰。所以這個時代的聖人是不用擔心被迫害，這和以前是大大不同。假如你更投入，則你得到這力量的祝福將是更大。", "Shri Mataji 提到此次的Krita Yuga尤其特別，因為這次是往前邁進了一大步，這個力量有些過度活躍，有時甚至連她都會驚訝到如何跟上這麼快的腳步。對霎哈嘉練習者而言，却是正好可以利用這個時代所特別擁有的大好機會，假如你力求昇進，你會得到很大的幫助。但是假如你的注意力仍是到處遊走、無法靜坐昇進、只願反省別人、無法投入，那麼你將會錯過這班列車。", "註一：印度古文化認為宇宙的時間分爲四個時期，周而復始，永不休止。四個時期依序為：Satya Yuga, Treta Yuga, Dvapar Yuga, Kali Yuga。Kali Yuga(鬥爭期)是紛亂的時代，也是黑暗的時代。Shri Mataji 說她此生來到時 (1923) 仍是鬥爭期，1982 年談話時說鬥爭期已結束，現在已進入Krita Yuga(過渡期)了。譯者在Amruta 網站未查到1982年之前Shri Mataji 有提過Krita Yuga。 註二：江瑞凱綜合整理摘譯自Shri Mataji的談話1982-09-26, 1982-04-02, 1991-03-31, 1990-08-19, 1991-01-01, 1982-07-04, 1983-11-01, 1992-07-24, 1996-07-09, 1992-09-30, 1990-12-12, 1991-04-05。"]}, {"num": "5-9", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "鬥爭期的祝福", "paragraphs": ["(人類歷史上有很多因宗教而來的仇恨、殺戮，不同的國家種族之間也有許多戰爭、屠殺)(註一)，但霎哈嘉的理念是：你愛所有的人，因為他們是人類。他們和你生在同一個時代，大家都必須互相幫助、彼此相愛。這是最重要的事！假如你可以發展出這一點，那你將會是非常非常強大的霎哈嘉瑜伽士，而且你會得到上天(Divine)的支持與祝福。假如你是擁有愛的特質，上天會幫助你來脫離所有的麻煩、災難與各種困難的處境，這是在鬥爭期(Kali Yuga，註二)特有的祝福，以前並不存在像這樣的祝福。", "假如你是一個充滿愛的人，上天會出來幫你、會解決你的困難、會處罰那些給你麻煩的人。以我自己的經驗就是如此，我從未去做什麼，我從不咀咒任何人，我不去爭鬥，我不需大聲吼叫，但事情就會自動地成就，我甚至都不必告訴上天做什麼。上天有最偉大的人格特質，正是它來執行所有的公義。沒有人會在上天的愛及導引之下而受苦，這是我可以保證的！這就是鬥爭期的祝福！鬥爭期是非常可怕的，(這個時期的)人也很可怕，事實是如此。但是在這個時期上天變得非常警覺，它從未如此地保持警覺。假如耶穌基督是生在這個時代，祂絕對不會被釘上十字架，祂會被迫害只是因為祂沒有生在這鬥爭期。對我們(霎哈嘉練習者)而言，上天的警覺是一個很大的祝福，沒有人會被迫害，沒有人會被找麻煩。唯一的條件是你必須是一個謙虛的人，你必須是一個有良好品行、有非常愛他人的特質，只需要這樣！(若如此)，你將可以享受這個愛他人的特質，因為這特質你會得到上天的祝福，即上天無微不至的照顧。有許多練習者告訴我許多奇蹟，我一點都不訝異，因為我知道(在這個時代)上天對善良親切的人變得十分警覺，它會照顧他們、支持他們。它會做任何事(來幫他們)。上天在這個時期變得如此警覺，是令人十分驚訝。穆罕默德(在世時)受到許多苦難，(過去的)每一個聖人也遭受許多折磨，但是現在這個時代不會如此，霎哈嘉瑜伽士在這個時代是不會遭受這些苦難，我可以明確地保證！他們會被上天所照顧，各方面都會被照顧。", "註一：在談此譯文的課題之前，Shri Mataji 先談到這些仇恨、戰爭。 註二：照Shri Mataji的說法，現代是鬥爭期(Kali Yuga)的尾端，之後將進入完滿期(Satya Yuga)，這兩個時期之間是過渡期(Krita Yuga, 或譯 \"成就期\")，所以也可以說這是過渡期的祝福，請見譯文：5-8\"過渡期\" 。 註三： 2002-04-21。"]}, {"num": "5-10", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "邪惡的魔鬼", "paragraphs": ["這些惡魔及邪惡的人是有一種仇恨的潛能，而且會用各種可能的方式來表達他們的仇恨。他們有些人真的是生來就是邪惡，有些則是後來才變成邪魔。你可以分辨出那些生來就是邪惡的人，他們整個行事及個性就是十足具有攻擊性及報復心。仇恨是沒有極限的，完全沒有極限！因為那些心中有仇恨的人，當他們恨某人時，只為了給仇恨正當的藉口，他們會說各種的理由，只為了將自己的仇恨合理化。有時候他們甚至也不辯解了，而直接認為仇恨是他們擁有的基本權利。", "這些仇恨的力量連結起來，有時候就會形成一種邪惡的人格特質，他會去殘害人類、會給人類麻煩。這些邪惡的人會喬裝成各種不同的身份，宣稱自己是什麼，但是他們是百分之百的邪魔。對這些邪魔，全能的上帝是沒有任何的憐憫和慈悲，他們必須被毀滅。去毁滅他們則是女神(Goddess)的責任，而女神卻是一位充滿慈悲及愛的母親。對女神而言，去殺這些邪魔是非常矛盾的事，但是從較廣大的觀點及利益來看，所有這些邪魔應該被徹底毀滅。可是他們並沒有被徹底毀滅，他們只是被送到地獄去受苦一陣子，如同去坐監一段時間，之後他們又會更強壯地再度回到人間，然後又試圖去給求道者麻煩。這是很常見的型態，他們遍佈整個世界。", "他們可能以各種身份出現，如一個好人、一個非常和善的人、一個宣稱知道上帝的人，或說他們可以給你自覺。他們可以講各種謊言，因為他們有邪惡的本質，有能力做(各種)邪惡的事，所以他們會假冒種種的角色，如宣稱自己是什麼或什麼，宣稱可以給人這個那個。事實上他們來到地球就是要毀滅人們，世界各地出現過許多的假導師，也有許多愚蠢的人跟隨他們。這些假導師從來不會彼此攻訐，耶穌基督就說過：''魔鬼不會說他們自己家族的壞話''。這些惡魔好似都來自同一個家庭，在此家庭内他們不會去講破壞他們集體或兄弟之情的話。他們彼此的兄弟之情是如此的強大，無論在何處他們都知道他們是一夥的。他們這種行為及彼此的連結，是令人十分訝異的，可以說他們是非常有集體性。假如一個人佔據、獨霸某一個領域，另一個人則會攻佔另外一個區域，並不會相互競爭。他們最終的目標就是要摧毀上帝的所有創造，摧毀世界上原本最終將獲得自覺、知道實相的善良人類。這種情形在黑暗期(Kali Yuga)是最糟糕的。", "註一： 1999-10-17。"]}, {"num": "5-11", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "耶穌將水變成酒？", "paragraphs": ["聖經中提到耶穌將水變成酒(註一)，這是完全錯誤的，而且是荒謬的說法！祂所做的是將水變成有葡萄汁味道的飲料。在希伯來文中''酒''(wine)這個字不只代表''酒精'' (alcohol)，也代表''葡萄汁''，(而葡萄汁是當時大家常喝的飲料)。但是你無法瞬間製造出酒精，酒精的形成需要時間，必須經過腐爛發酵、再腐爛發酵的過程，如此才能變成酒精。假如耶穌是以如此快速、自然而然的方式，如何能製造出使人昏醉的酒精呢？", "許多人，尤其是基督教人士，(因為此段聖經)相信耶穌將酒聖名化，這是完全錯誤的，祂從未給予''酒精''神聖的地位，祂只是將水變成有葡萄汁味道！以前我碰到Romano Battaglia(註二)，他說：\"錫呂瑪塔吉，請您給我自覺\"，我說：\"好，去拿一些水來！\"。他弄一些水來，我將我的手指放入水中，然後他嚐一口說：\"這水的味道像酒！\"，我說：\"沒有錯！這就是當年耶穌基督所做的'' (註三)。所以(耶穌在世上)並未將酒精神聖化，你如何能想像耶穌去做這種事呢？酒是會使人的覺知能力(awareness)徹底的毀壞！耶穌怎麼可能給酒正名呢？我們都知道那些喝了酒的人並不正常，(喝酒之後)他們的腦袋都有一些狀況，若去開車會出大問題的。當他們(酒醉後)講話，你可以分辨出他們是不太正常。喝酒後他們會試圖表現出很神勇的樣子，有時候則可能像很沒落消極的樣子，但是大部分會變得很有攻擊性，行事完全不像一個人類應有的樣子。", "所以你們必須了解，這個經過長久發酵的酒是非常不好的，對人的靈性生命也是非常不利的。所有將酒精視為神聖的國家都會產生很大的問題。酒和錫呂格涅沙(Shri Ganesha )是完全抵觸的，酒和純真是完全相反的，喝酒的人可能會變得十分狡猾、鬼靈精和非常想主宰他人，所有厄運及壞事也都會跟隨而來。人們是無法去信任一個酒鬼，酒鬼會責罵攻擊他的妻子、小孩及任何周遭的人，會試圖去破壞他們的生活，因為他知道自己已完全被毀壞了。", "所以人必須要了解：純真是不會容許你去喝這種破壞你的覺知能力的東西，人類的覺知能力是非常重要的，這覺知能力必須被尊重。任何損壞你的覺知、你的健康的東西都是不好的，對霎哈嘉練習者更是如此！你必須保持你的健康，要避免所有這些破壞你健康的東西。", "註一：聖經原文如下：第三日，在加利利的迦拿有娶親的筵席，耶穌的母親在那裡。耶穌和他的門徒也被請去赴席。酒用盡了，耶穌的母親對他說：「他們沒有酒了。」耶穌說：「母親（原文是婦人），我與你有甚麼相干？我的時候還沒有到。」他母親對用人說：「他告訴你們甚麼，你們就做甚麼。」照猶太人潔淨的規矩，有六口石缸擺在那裡，每口可以盛兩三桶水。耶穌對用人說：「把缸倒滿了水。」他們就倒滿了，直到缸口。耶穌又說：「現在可以舀出來，送給管筵席的。他們就送了去**。**」管筵席的嘗了那水變的酒，並不知道是那裡來的，只有舀水的用人知道。管筵席的便叫新郎來，對他說：「人都是先擺上好酒，等客喝足了，才擺上次的，你倒把好酒留到如今！」這是耶穌所行的頭一件神蹟，是在加利利的迦拿行的，顯出他的榮耀來；他的門徒就信他了。（約翰福音2：1-12） 註二：Romano Battaglia 在成為霎哈嘉練習者之前，是一位義大利知名的編輯與作家。從1986開始他連續多年邀請Shri Mataji到義大利的公開推廣介紹會。 註三：Shri Mataji 在其他的談話說耶穌基督只是將水能量化(vibrated)而已，如此水就會有如葡萄汁一般的甜味。Shri Mataji 說這並不難，她也可以做得到。Shri Mataji 認為假藉耶穌之名將喝酒合理化，是人類一貫的弱點。(見1988-12-20及Meta Modern Era) 註四： 2000-09-16，也參考1994-11-13、2001-08-31、1988-12-20、2001-12-25 及 Meta Modern Era的談話。Shri Mataji 在談話中澄清聖經的誤譯，及批評人類自我毀滅的喝酒行為，可謂是不下數十次。"]}, {"num": "5-12", "catTitle": "上帝，神聖的力量，能量", "catNum": 5, "title": "為什麼掌心有涼風就代表是真的？", "paragraphs": ["凡我所說的，你都可以從你手掌的涼風來驗証，但是你如何知道掌心有涼風就代表這是真的呢？", "這可以從相對比較(relativity)的常識來了解。假如你從精神病院找來兩個瘋子-----医生認証的精神完全失常的人，你兩個手掌朝向他們，你的指掌會有可怕的麻熱的感覺，或許你整個左手掌都會發熱(註一)。然後你(離開他們)再双掌向上問如下的問題：\"真的有神存在嗎？ \" 或問：\"神的力量是無所不在嗎？\"(註二)，此時你的手掌心就會有清涼的感覺。從這截然不同的涼熱，你就可以知道無所不在的力量就是以涼風來告知你什麼是真的(註三)。你可以如此來試驗你手掌上涼熱的感覺。", "註一：Shri Mstaji 說精神失常的人在她的相片之前會不停地顫抖 (或說：双手朝向她或她的相片，双手會抖動)。其他如宗教狂熱分子(fanatics)、集端分子(extremist)、吸毒者(druggist)、吸食化學物品成瘾者（chemist）或癌症病患皆會有相同的反應。即我們也可以用這些人來試驗指掌的麻熱。在其他的談話中，Shri Matsji 也提到可用希特勒(或史達林) 來實驗 (1984-08-08, 1992-07-23)，或也可問如下的問題：\"希特勒是聖人嗎？\" 來試驗掌心是否發熱。 註二： Shri Mataji 在其他的談話亦提過可問如下的問題：\"耶穌基督是神的兒子嗎？\"(1992-07-23) 註三：譯者解釋：Shri Mataji 乃指從絕對的謬誤(即瘋子)所產生的熱，來推論出清涼所代表的正是謬誤的相對，即絕對的真理（代表\"對\"的答覆）。這即是Shri Mataji 所謂的\"相對比較(relativity)的常識\"。 註四： 1980-07-21。"]}, {"num": "6-1", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "靈，靈魂，輪穴及肉體", "paragraphs": ["Shri Mataji 用一杯水來比喻：玻璃杯是肉體(body)，玻璃杯承載的水則是靈魂(Soul)， 這水可以反映出光，光則是靈(Spirit)。", "靈是指住在左心輪的真我(Atma)，是Shri Shiva( 濕婆神，或稱上帝) 在每一個人的反映。靈魂則包括靈及因果身(causal 或 causal body)，因果身是由五個基本元素(element, 註一)的本質所組成的。這五個\"元素的本質\"(causal elements, 或 the causal of the elements.見註二)造就一個人獨特的個性及特質。這個因果身作用於輪穴，而輪穴再作用於肉體。可以用如下的順序來表示它們的精微(subtle)次序。", "靈；靈魂；輪穴；肉體", "靈是最精微的，其次為靈魂，再其次為輪穴，肉體則是最浮面的(gross)。", "我們可以說人(指肉體)的原本狀態(primitive)或本質是因果身，因果身是以一圈圈(hoop)的方式依附在七個輪穴及三角骨上面。", "所有的物質(包括人的肉體)是由五個基本元素(element)所構成的。這五大元素的背後有causal element(即是\"元素的本質\")，其實是元素的本質創造出基本元素。以土元素為例，土元素的本質是\"芬芳\"(fragrance)，是\"芬芳\"創造了土元素，而非土元素創造出芬芳。", "人身體之外有五層的auras(註三)，這auras是由七個輪穴發射出來的。如繭一般圍繞在身體之外，這五層的auras是由五個基本元素所控制的。我們做靈體保護時，即是對此auras所做的。", "所以我們可以說：靈的外面包裹著五個基本元素，及五個基本元素的本質 (the causal of the elements)，而昆達里尼(Kundalini )則是在周邊。(註四)", "註一：五個基本元素指地(earth，或稱\"土\")、水(water)、空氣(air)、光(light)、空(ether). 註二：Causal means the causes of these.(1992-03-15) 註三：auras指籠罩在人身體之外，如氣一般的光暈(glow)，有時用肉眼可以看見。Shri Mataji 說你可以看見auras 並非好事，這代表你没有處在中間，而是跑到右邊去了，所以你看到光的本質------光暈，若處在中間則是會看到人或物的本身( 即\"光\"). 註四：Shri Mataji 接受香港電台訪問時(1992－02)有提及身體是五大元素組成，去除土元素，人就變成靈魂. 註五：綜合整理自：1976-03-02,1980-04-21,1984-07-10,1986-07-25,1987-02-26,1990-07-02.譯者希望能釐清Shri Mataji 對這幾個名詞的定義及解釋。"]}, {"num": "6-2", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "人可以分成四種(錫呂瑪塔吉談靈魂之一)", "paragraphs": ["***前言：**本系列譯文摘譯自Shri Mataji早年一本未完成的書的某些章節，時間約在1970到1982。Shri Mataji在各演講談話中偶而也會談及靈魂、生死及死後世界，但是往往只是蜻蜓點水，很難一窺究竟，在此書的這些章節裏則講得較為詳細周全，所以譯者以此為準翻譯本系列(錫呂瑪塔吉談靈魂)。2013年霎哈嘉中央委員會正式將這未完成的書印刷成冊，取名為：太初之母的書(The Book of Adi Shakti)。*", "**譯文：**", "活在世界上的人大致可以分成四個類別，當然並没有絕對的準則來劃分這四個類別，因為人可以因他的行事及抉擇來往上昇進或向下沉淪。", "一. 壞人(Bad People) 包括惡魔(rakshasas)、非常壞且墮落的人、非常自我的人、非常被壓制的人。", "二. 普通人(Ordinary People) 包括一般人、非常好的人、求道的人、純真的人、覺醒的人(awakened people)、有信仰的人。", "三. 優等的人(Superior People) 包括已得到自覺的人(realised souls)、完全自覺的靈魂(fully self-realised souls)、已得到神的自覺的靈魂(God-realised souls)。（註一）", "四. 降世神祇(Incarnations)", "基本上，無所不在的神聖力量(Unconscious)對第一類的人是不感興趣的，這一類的人有些是來自動物的投胎轉世。當動物死掉後，牠們也可能投胎到人類的卵子，所以雖然有人的外形，但却是動物的特質。假如人類的環境對動物是比較意氣相投，那麼動物就會投胎成為人，這或許可以解釋在鬥爭期(Kali Yuga, 或譯\"黑暗期\")的目前，地球有人口爆炸的問題。(譯者：錫呂瑪塔吉言下之意指目前的世界已墮落到接近動物界的程度)", "無所不在的神聖力量是非常關心第二類的人，祂對此類的人做非常細緻的安排，祂會安排讓原來的靈魂的兩半(一半跑到精子，另一半跑到卵子)再度相遇。如此誕生的人即可以保留和原先一樣的靈魂(譯者：即有相同的靈及相同的人格特質，註二)。大致而言，這一類的人都是如此。(譯者：第一類的人未必有和前世有完全一樣的靈魂。)", "無所不在的神聖力量是給予第三類人非常特別的重視。他們的生父生母皆是精挑細選的，他們都會保有和上一世一樣的靈魂及特質。他們來世之前也先選擇好出生及死亡的日期。他們大部分是選在有降世神祇來世時才來投胎。", "第四類的降世神祇挑選了祂們的生父生母，也包括降世的時間及地點，也選擇了世上的生活及死亡的時間(及方式)。祂們是神的某一特性的顯化(manifestation)，在這顯化中祂們是帶著宇宙大我的輪穴(Chakras of the Virata)。", "達到神的自覺的靈魂可以知道降世神祇的來到，因為他們可以看到天空中的種種異象徵兆，這也是無所不在的神聖力量用來告訴他們有偉大的靈魂來世的方法之一。", "當自覺的靈魂死亡時(譯者：指第三類的人)，他們的靈量(Kundalini)會保持在靈魂之内，因為他們的靈(Spirit)與靈量已合而為一。", "第二類的人死亡時，他們的靈量會離開靈魂，而只是在靈魂的周圍觀看靈魂的行為，此時所有靈量的力量(powers)也離開了靈魂，也無力控制靈魂，所有原先在輪穴的神祇也全部消失不見。這就是為什麼一些較低下的靈魂會犯下罪行。", "至於非常低級的靈魂(像第一類人)，他們死後會在人間徘徊，或進入其他人的身體。這種靈魂會被他的靈量所抛棄，這些靈量會枯萎、消散在大梵(Pranava，此字即是Aum，唵)。這些可怕的靈魂就脱離了演化的過程，他們就是撒旦(satanic)，在地球上進行一些邪惡的勾當。他們先被錫呂格涅沙(Shri Ganesha)丢到集體潛意識界(譯者：照Shri Mataji 的說法，此界有許多層，此處應是指此意識界的較低層)，然後再掉到地獄去。但是那些未被完全摧毀的惡靈仍然會一再輪迴，直到這個創造的周期結束，當十一個毀滅力量(Ekadesha Rudra)來臨時，才會被澈底毀掉。", "註一：譯者：這類人的三個階段或可類比為：無思慮的靜觀(Nirvichara)，無疑惑的靜觀(Nirvikalpa)，神的自覺(God's realisation)(1981-07-06)。或1976-05-29的談話中提到的三階段：與神聖合一(Oneness with the Divine)，接近上帝 (Nearness to God) ，與上帝同在(Companionship with God). 註二：另一篇的譯文6-3(本系列之二---死亡與誕生)對此有更詳細的說明。 註三： Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-3", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "死亡與誕生(錫呂瑪塔吉談靈魂之二)", "paragraphs": ["靈魂(soul)指的是人的精微身體(subtle body)，即我們的身體減去土元素及水元素之後的精微形式。靈魂包含五層外殼(sheaths)，當人(肉體)死亡時，這兩層(譯者：指土元素及水元素這兩層)在肉體面上分離開，脱離的這部分是構成染色體(chromosomes)，其餘的部分(譯者：即所謂的\" 靈魂 \")仍然是圍繞著靈(Spirit)，這個個體以靈魂的方式存在於空氣中至少13天，然後會轉入宇宙大我(Virata)的集體潛意識界(collective subconscious，叫Paraloka)，這個潛意識界分成許多不同隔層(Strata)。當人(譯者：指靈魂)進入潛意識界(譯者：指離開人的世界)就無法再演化昇進，但是可能因犯下惡行而往下墮落。", "靈魂在肉體死亡後，最終會消失在空氣中(譯者：指離開原先身體所處的地球)，多久才會消失則看他有多少未完成的欲望而定。如果靈魂可以在死後立即拋下所有的物質欲望，則他可以毫不用力地立即上升到很高的高度，超出大氣層及目光可及的範圍。但他也可以隨時下降回到地球，像幽魂突然顯現一般，或去和他的親人溝通。若真理的追求者的靈魂找不到路回家(譯者：指回到靈魂該回去的地方)，天使會在旁邊觀照並保護他們，如同照顧小孩子一般。", "宇宙大我的集體潛意識界就是(肉身)死去的靈魂(或叫亡魂)的居所，根據這些靈魂的願望及行為，他們分別住在不同的隔層。在這裡面，(肉身)剛死去的靈魂會根據自己的求道途逕(seeking path)，來規劃他們(未來)的昇進。濕婆神(Mahadeva，或叫Shiva)會替他們決定下一世的投胎。 那些(上一世)有某一極端處境的靈魂，往往在下一世會被丟入另一個相反的極端，如同鐘擺一般。例如有人上一世有很多小孩，而且有很不好的經驗，在下一世他可能没有任何孩子。或是有人上一世過著極端強制性的禁慾生活，下一世可能有一個淫亂的人生。逐漸地，這些靈魂(學習著)回到比較中庸的道路。但是那些一直偏在某一極端的靈魂，他們就會被拋離出這演化的歷程，最後就堕入地獄(hell)之中。", "靈魂有不同的顏色，顏色即代表他們的等級。從黑色、黑紫色到綠色，到淺藍，再到像金黄水晶，再到白色。例如自我很大的靈魂是東一塊西一塊樣補丁的金黃色，自覺的靈魂則是像清晰的水晶。", "靈魂的臉孔及身驅和生前是完全一樣。假如他們待在集體潛意識界中，他們的身驅會愈來愈小，最後變成非常小。當他們準備投胎時，會先分裂成兩個分離的個體，即\"男性\" 及\"女性\"兩部分。然後經由食物或空氣中的灰塵或某一器官，進入事先選好的父母體内。即男性的部分在父親内發展成精子，女性的部分則成為卵子。精子是由摩訶莎娃斯娃蒂力量(Mahasaraswati power)所形成的，其内包含有靈魂(soul, 即五個元素減去土元素)。卵子則由摩訶迦利力量(Mahakali power)形成，其中有靈(Spirit)，卵子即是土元素。精子加卵子形成胚胎，當靈量進入胚胎時，胚胎即著床在子宫壁上。", "原先的靈魂先分成兩半，各自進入生父生母的精子及卵子，最後再合而為一，成為和原來一樣的靈魂。這是無所不在的神聖力量的精心安排，所以人間會有婚姻是上天註定的說法。所以當某人很焦慮迫切想和另一個人結婚時，我們應該知道這可能是神聖力量已選擇此二人成為夫妻。這個上天的決定是一個最後的定案，不應該被變更干擾。當一個婚姻經由双方父母及一些人共同敲定，這個集體認可的決定其實是主要為未來的小孩，他們可以經由此結合而誕生。基本上，無所不在的力量是負責為那些尊重愛的人來安排這些配婚，這婚姻在眾人的見証出席下來進行，婚禮往往也是一個有獨特意義的節慶與歡樂，人們久久之後都還有很美好的回憶，其原因也在此。人類的婚姻系統應該建構在了解無所不在的力量是如何運作，如此才能提供一個環境來確保第二類的人(註一)可以如此誕生，即可以按照原計劃，保有和前世一樣的靈魂。", "靈魂即是如此一再的經歷誕生、死亡、再誕生。", "只有那些想結婚的人才應該有小孩。因癡迷或暫時的情慾或其它人為的考量(如美色、財富、地位等)而來的婚姻，往往是基礎非常薄弱，最終會失敗或產生出問題的小孩。西方世界裏常見的亂交及婚姻配偶的不忠誠，往往會干擾原先神聖力量的安排，造成原本分成兩半的靈魂無法照計劃再結合成原先的靈魂。即新誕生的小孩的靈魂一半來自某人，另一半却來自另一個人。這樣子形成的人(靈魂)會有人格特質無法整合的問題，而且往往是一場混亂。他們的内在無法彼此妥恊，有時會造成一種雙重(人格)生命，甚至這一半不知另一半在做甚麼，他可能是一個好丈夫，但却不是一個好公民，或是相反的情形。", "註一：請同時參考相關的另一篇譯文：6-2(本系列之一---人可以分成四種)。 註二： Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-4", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "亡魂的附身(錫呂瑪塔吉談靈魂之三)", "paragraphs": ["那些生前願望没有滿足的亡魂(即靈魂)遊走在地球的空氣中，找尋適合進入的活人。他們附身的對象包括各式各樣的人，例如：性慾的奴隸、酒精的奴隸、毒品的奴隸或一些喜歡被控制的可憐蟲。有些獨裁者就是被一位或多位自我很大的亡魂附身，導致這位暴君可能終其一生發動了一些戰爭。 另外一些附身則來自藝術家、医生、音樂家、詩人或政客的亡魂，這些亡魂想藉著活人的身體，再度體驗他們以前的才華及風光，他們想再享受做人的存在，但又不必承受實際人生的種種負擔。 由於這些亡魂是非常精微(subtle)，他們可以隨著意願進出人類的人格(personality)，而且他們是如此的微小，甚至許多的亡魂可以同時入侵一個人。", "附身的亡魂有如下幾個管道進入人裏面：", "一. 當一個人在心理、情緒承受太大的壓力時，他的自我(ego)或非我(superego)會出現一些裂縫，這些裂縫就成為亡魂入侵的通道。若人的左脈過度活躍，會過度膨脹非我；過度活躍的右脈則帶來膨脹的自我。過度膨脹的非我及自我有可能破裂成多塊，這中間的空隙會吸引從集體潛意識界(collective subconscious) 及集體超意識界(collective supraconscious)來且急於有所展現的亡魂。", "二. 在假導師(false guru)的誤導下，從事一些將注意力集中在某些精微能量中心的練習，尤其是在額輪(Agnya Chakra)及臍輪(Nabhi Chakra)。這兩個輪穴最容易受到外界的影響及感染，也因此最容易由此引來附身。所有任何集中注意力在兩眉之間，或刺激肚臍區域的旁門左道方法都是非常危險的。", "三. 最可怕的附身是來自一些假導師，他們將死去的亡魂放入門徒身上，藉此來操控他們。有些術士(Tantrikas)或咒師(Mantrikas)也會將他們控制的亡魂放到他人的身上。", "印度婦女在前額點上一個紅點，就是要避免亡魂從額輪(即所謂的\"第三隻眼\" )進入，因為這是太初母親(Primordial Mother)的標記。聖母瑪利亞(Virgin Mary)犧牲了她唯一的兒子來拯救人類，她在她的前額塗上了耶穌基督身上的寶血，而耶穌基督正是保護這精微的額輪的神祇！也保護額輪不被亡魂入侵。", "人類的輪穴都被覆蓋住(covered)，唯一的例外即是額輪，(所以亡魂可以從額輪進入)。但是一些亡魂也可以經由食物的攝取而進入臍輪，然後再移居到非我(superego)來控制人的心智。食物是會被烹煮的人的邪惡思想所污染的，一些邪惡的壞人甚至用這樣的食物來陷害他的敵人。", "有些附身亡魂雖然只進入一小段時間，但却對被附身者的人格特質產生很大的變化。我認識一位富有的女士，她突然渴切地想妝扮成男人，並想和女人結婚。事實上她是被一個男性的亡魂附身，當這個亡魂從她身上被趕走後，她又變成一個正常的女人。", "那些在自我或非我的亡魂附身有可能是永久的，也可能是暫時的。有時候亡魂只是待一小段時間，然後就和其他亡魂交換宿主，但是也可能從潛意識界邀請更多的亡魂來附身。例如一個医生的亡魂若以附身的方式來治療病人，他可能邀請其他医生護士的亡魂來幫他，有時候他們只出現在固定的某些日子的特定時段，只停留一小段時間就離去了。", "有些所謂的神童，雖然明顯是智能不足，但却有能力不必計算就可以解數學方程式，他們也是被附身。許多天才死亡時仍有未滿足的願望，他們仍想炫耀他們的才華，所以會去入侵小孩，而且往往是他自己的家族。這種小孩最初顯得心智正常，但長大後却有一些智能不足。假如這些神童没有機會去公眾場合展現他的的天分，他們極可能會恢復正常，因為那些附身的亡魂若發覺没有機會去表演，就會失去繼續附身的興趣。", "註一：譯自Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-5", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "催眠(錫呂瑪塔吉談靈魂之四)", "paragraphs": ["許多嘗試過催眠的人可能都不知道他們其實是連上集體潛意識(collective subconscious)，也接觸了許多亡魂。在催眠之下，被催眠者是被這些亡魂所掌控，在亡魂的指引下，將他的注意力從有意識的狀態(conscious state)移轉到潛意識狀態(subconscious state)。首先，注意力可能先被帶領到此生的過去，讓被催眠者的心再度經歷幼小時期，讓他們感受到在母親子宫内的安全與温暖。當潛意識取代有意識的心智時，在一些亡魂的影響下，整個有意識的注意力移轉到潛意識。此時催眠師可以將被催眠者帶入睡眠狀態，或命令他到過去或小時後的經歷。逐漸地，作用在潛意識的亡魂變得十分強大，以致於有意識的人格變成完全無助，而完全被掌控，此時有意識心智的注意力完全轉移到潛意識狀態。此時被催眠者的整個人格是和亡魂成為一體，催眠師可以對亡魂下達指令，只要簡單的指令，被催眠者的身體就可以如木板一般，筆直地横放在兩端的兩張椅子上(註一)，此時觀眾看不到的是：這個支撑如僵屍一般的被催眠者的亡魂！ 這時你縱使拿一根叉子去戳被催眠者，他也没什麼感覺，因為他有意識的心智已完全睡著了。 其實這些亡魂有著和他在世時一樣的身驅，只是一般人的肉眼看不見也感覺不到。但是那些也被亡魂附身的靈媒、千里眼卻可以清楚看見舞台上幫忙的眾多亡魂。在大部份的情形，催眠師是得到突然去世的亡魂或最近才自殺的亡魂的幫助。", "現在也有人把催眠用在手術，(像使用麻醉一樣)來幫助病人避免承受痛苦。這種作法可以有一些放鬆的效果，因為這個有意識的心智已被另一個(亡魂的)人格所取代。但這只是暫時的好處，長期而言，這個病患將會有一些痛楚。這是來自他的交感神經系統會有過度活躍的問題，因為這個系統必須額外支持這個附身進來的亡魂，這個亡魂會耗掉他的交感神經系統的能量與資源，而且這種人無法得到自覺。", "經由心智鎮靜(鎮压)的效果，催眠的力量有可能被利用來做大規模催眠(mass hypnosis)，一次控制數千人。有一些邪惡的天才甚至可以經由演講做到大規模催眠，他們是先操縱少數幾個人，先對其催眠，然後這幾個人成為後續亡魂進入的主要管道，如此將數千人控制在催眠的狀態。政治的狂熱現象、宗教狂熱行為、及一些毫無理智、殘酷且大規模的人類行為等等皆是大規模催眠的產物。它們的發生往往只是來自單一個人，來自他的騎在別人頭上的霸道的人格特質，這個人主宰了這一群人。正是他深知這大規模催眠的技巧！", "註一：此處指的是常見的催眠表演：被催眠者身體變成僵硬如木板，頭及腳放在兩端的椅子，中間身體完全懸空，甚至可以支撐一個人站在上面。 註二： Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-6", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "超感應能力(錫呂瑪塔吉談靈魂之五)", "paragraphs": ["超感應能力(Extra-sensory perception, ESP, 註一)事實上是一種\"多了額外人格的能力\"(譯者：即多了一個額外的亡魂) ! 這是一種非常危險的超能力，因為這是附身的亡魂展現他的超感應能力，但被附身的人却渾然不自知！縱使這是在未被催眠的狀況下(擁有超能力)也是如此。例如在戰場上有人受傷了，一個医生的亡魂為了展現他高超的医術，他可能選擇一個能承受被附身的強壯軍人，然後附身在其上，而來從事對受傷者的外科開刀手術。在戰場上這種例子發生過多次，這個被附身的人甚至没有任何医學的常識，(但却成功地完成外科手術)。", "少數具有超能力的人是生來即帶著附身亡魂，但是大多數都是後天經歷了一種神經的緊張(nervous tension)時被附身的。這種人可以感覺到在周遭出現的亡魂，因為他們也住在潛意識的領域裏(譯者：字面翻譯是如上，但用中文時以如下的表示可能較貼切：他們跨入了潛意識界)。這種人有些是附身的亡魂在耳邊告訴他種種訊息，所以這個被附身的人可以預測未來的事件、說出過去發生的事情，也可以講出陌生人的名字、地址、參加的政治組織及民間社團等等。這些附身的亡魂有時也會告訴被附身者如何治療自己的病痛。往往這些擁有超能力者都以為自己在從事解碼翻譯訊息的工作(mind reading)，甚至有人以此為業，當起自我認証的靈媒，而却不知道自己是被亡魂附身！", "我在普那(Poona) 碰過一個非常知名的咒師(Mantrika, 以咒語召魂的人)，警察也利用他的能力來恊助辦案，民眾利用他來尋找祖先埋藏的寶藏，他因這些服務而致富。他要求我給他自覺，他也對我坦誠他的方法就是刺激人們的左脈(譯者：左脈可以連上潛意識及亡魂)等等，我告訴他如果他想得到自覺，必須放棄所有的超能力，他說他也十分焦慮地想去除身上這些亡魂。我於是提升了他的靈量(Kundalini)，在得到自覺之後，他驚訝地發現他喪失了所有的超能力，他再怎麼唸咒語，也都没有任何效力，因為那些以前幫他的亡魂通通都離他而去了！其實這些亡魂以前也一直在折磨他，那些因附身而有超能力的人往往會死得很淒慘。", "至今為止，我從未碰過一個不用亡魂而來從事工作的靈療師(spiritual healer)！在大部份的情形，甚至這些受到亡魂幫助的靈療師都不知有亡魂的参與！這些亡魂往往隱藏的很好，而不讓這些被附身者察覺。", "註一：ESP是通指有超乎常人的特殊感官能力，如他心通、千里眼、順風耳、特異功能等等。 註二： Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-7", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "抛媚眼(錫呂瑪塔吉談靈魂之六)", "paragraphs": ["喜歡用眼睛來抛媚眼、賣弄風騷、調情(flirt)的人往往不知道他們會成為一些亡魂附身的對象，這些亡魂往往是前輩子有性無能的毛病或對性不滿足等等。這些亡魂總是獵取有相同弱點的人，來做為他表現(舒發)的管道。最可怕的亡魂往往是經由額輪，藉著已被附身者的眼睛凝視來進入對方(譯者：指下一個要被附身的人)。現代的社會不把抛媚眼調情當成一種惡習，但是没有什麼習慣是比這個造成更大的傷害。沈溺在此習慣的人會喪失對其他種種娱樂的興趣。藉著抛媚眼來享受這種欺騙自己的樂趣，其實是一種很做作虚偽的行為，也是一些很墮落的亡魂在地球上展現破壞的方法之一。藉著此方法，這些亡魂毁掉了人們種種昇華的樂趣與愉悅。這不只是對拋媚眼的人有害，抛媚眼的動作也成為許多前世不滿足的亡魂進入人類社會的管道。這種亡魂以嚇人的速度從集體潛意識大量入侵，正是經由這些拋媚眼賣弄風騷的人，他們有能力瞬間抛出具有催眠效果的凝視！抛媚眼的人凝視這個人又那個人，以誘惑異性的名義逐一散佈亡魂，這些被勾引的人也學會相同的技倆，他也變成亡魂的奴隸而渾然不自知。", "有一個年輕婦女曾向我坦白，她的這個習慣是學自另一位50餘歲的男人，而這個拋媚眼的習慣已完全掌控她。許多年輕人問我如何戒斷此種淫穢又毫無意義的習慣，他們覺得這猶如在散佈病毒一般，他們發覺他們如奴隸一樣，浪費了太多的能量在這上面，而且這種習慣讓他們無法享受真正性愛的歡愉。這種病毒在社會上散佈愈多，整個社會就變得更虚偽做作。非常早年的性無能往往是此習慣的獎賞，而且會造成一種惡性循環，婦女們開始要(更)暴露她們的身體，想要抛媚眼賣風騷的欲望也更強烈，然後帶來更多的性無能，然後又更需要靠拋媚眼來達到性滿足。", "註一： Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-8", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "假導師(錫呂瑪塔吉談靈魂之七)", "paragraphs": ["在人類發展的初期，降世神祇一再來世只為了毀滅魔鬼。太初母親(Primordial Mother)過去即降生多次來從事此工作。在當今的黑暗期(Kali Yuga)，許多的魔鬼已經再度投胎轉世，他們擔心若以惡魔的身份將不利於工作，所以他們披著宗教的外衣，自稱是(靈性)導師(guru)。他們身上發出很大的熱力，任何一個霎哈嘉瑜伽士都可以感覺得到，這個熱度甚至會讓自覺的靈去感測的手指產生水泡！", "他們表演各式各樣的魔術般的花招，例如無中生有變出珠寶等(materialisation)，對那些追求物質財富的人就非常有吸引力。 我認識一個印度富翁告訴我他的故事。他們夫妻都是某個導師的追隨者，那個導師曾無中生有變出一個鑽戒送他，他因此非常信服，也捐了一大筆金錢給他的導師。我問他：你有多少鑽石？ 他答道：數不清了。 我又再問他：你既然可以買任何你想要的鑽石，那麼你為什麼要因為一顆鑽石去找這個導師呢？ 他說他覺得這位導師是一位屬於神派來的偉大的人。 我不得不告訴他：假如他那麼利害，為什麼不多變一些鑽石，來救濟印度的窮人呢？ 我問他你來找有做什麼呢？ 他答道：\"我家裏的鑽石都不見了！而我的妻子成天都在導師那裏，既不管家務，也不管孩子。\" 聽了之後我要求他帶妻子來。我發覺他妻子完全被附身了。趕走那些附身的亡魂後，她告訴我：\"有人在我裏面，告訴我那些都是石頭，拿去給導師.....。\" 她還告訴我許多女追隨者的丈夫年紀輕輕即死於心臟病，那些寡婦就成為導師的侍僕 .......。", "另一個例子是一個美國名校的研究生，他千里迢迢到印度，没找到我，後來到倫敦才碰上我。他之前在美國跟隨一位導師學靜坐，學到了一個方法可以進入恍惚出神的狀態(trance)。在那狀態下他覺得很放鬆，但是當他從出神狀態回來時，他却有一種衝動想殺他的父母、親人，或任何他碰到的人，這讓他頗為困擾。當他試圖將他的心智從這些可怕的想法拉出來時，却開始有自殺的念頭。最後也試圖自殺四次，幸好都被發現救回來。", "我發現那位導師是給他一個字的咒語，藉此帶他進入出神狀態。這個字是山頂的意思，也是一位古代的偉大導師的名字，應該不可能和這些亡魂的技倆有關。我遂要求這年輕人進入出神狀態，立即發現他被一隻可怕的獨角獸附身了！這完全是魔鬼的怪物。至此我才想起這個字在梵文是\"角\"的意思。 由於不易將他和它分離開，我試圖和它交談。它說它是這位導師的奴隸之一，而這位導師本身就是惡魔(Rakshasas)的轉世，上一世就是被太初之母(Adi Shakti)所殺。它又說這位年輕人及許多其他人，都是在美國學此新潮的方法而被附身，目的就是為了摧毀許多投胎來追求昇進的求道者。一旦被附身的人死了，他們就成為被控制的亡魂。它還說許多法力強大的惡魔也都投胎了，也是用同樣的方法來吸引人們。", "這位假導師在西方世界是一個家戶喻曉的人物，参加他的初階課程即要數百美元，進階班則更要數千美元。他就是針對這些家境不錯的年輕人，藉著滿足這些人的\"自我\"(註一)來吸引他們。許多純真無知的人被他那充滿科學名詞及研究用語的演講所迷惑，結果就是用高價買到亡魂的附身！ 這種經歷不只會讓求道者失去自己的人格，而被亡魂所控制，且不只這一世，甚至包括未來數世。", "註一：超高的費用及新潮的標籤都是足以讓参加者自我滿足，或對別人炫耀：\"我\"参加入數百美元的靜坐班、\"我\"去學很新潮的靜坐......。這\"我\"即是自我。 註二： Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-9", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "驅鬼(錫呂瑪塔吉談靈魂之八)", "paragraphs": ["許多人並非自覺的靈，但又宣稱他們有能力驅趕附身的亡魂，即所謂的驅鬼(Exorcism) 。以我的觀察與經驗，這些人往往只是趕走一個附身的亡魂，然後再以另一個亡魂取代之。當然，這也可能是一個走掉後，另一個自動跑進去。這些驅鬼者是連結到潛意識界，他們在此界說服或強迫附身的亡魂離開，然後再引入另一個亡魂。用這個方法他們就可以控制受害者，而受害者却以為他已得到治療。這些人叫做術士(Tantrika, 即可以控制或操縱神祕機制的人)，或咒師(Mantrika, 用咒語來施行法術的人)。其實(人内在)真正的神祕機制(Tantra, 指精微的系統機制)是靈量(Kundalini)，但是當這些自我認証的術士試圖在靈量上面工作時，靈量反而會退縮不動(freeze)，而那些駐在精微身體(各輪穴)的神祇(Divine Deities)也會隱藏起來進入睡眠的狀態。在没有祂們的保護之下，邪惡的亡魂就可以被咒師引入受害者之内。這些術士與咒師藉著這些虚假的把戲來謀利，也帶給這些尋求治療的人難以回復的損傷，這些術士咒師往往也靠這些黑心錢過著非常墮落的生活。", "有一個女士來見我，因為她丈夫受到一些亡魂的干擾，這些亡魂是由一位女導師所引入的。她說她之所以去找這位女導師，乃是因為她的先生變成一位無可救藥的酒瘾者。這位女導師趕走了造成酒瘾的亡魂，但是這位女導師却引入另一個亡魂。結果她先生對喝酒不感興趣了，但是却變成爲一個賭鬼。她再回去找女導師，當然又付了一大筆錢。賭博的亡魂不見了，但却被一個殘暴的亡魂取代。有一天她先生在亡魂的影響下，拿刀攻擊她及他自己的母親。這讓她們一家人都十分害怕，她也不再去找那位女導師。没多久，三個亡魂都回到她先生身上，她先生也變得十分病重。最後我將這些附身的亡魂都驅離，也治好她先生。當然我沒有收任何錢，這位女士非常訝異，因為她花了數千盧比卻讓她先生病奄奄的，如今卻不用一文錢就讓她先生回復建康！ 這位女導師是一位很有錢的婦人，不只用人們的奉獻來享受種種的奢華，也過著一種非常淫亂的生活，是完全沒有任何道德觀念的人。當然她最後也住到監獄裏去。", "憑著人類的智慧，我們應該可以知道一個有真正宗教信仰(religious)的人應如何，他是不可能過著不道德的生活。聖潔(holiness)是宗教的外顯，而純真(innocence)則是其本質。任何狡猾、取巧、殘酷、貪婪、情慾等皆是屬於生命中較低下的本能，不是一個神聖的(godly)人應該有的特質。真正神聖的人是非常不同於假導師(false guru)，他是過著一種自然而然、充滿愛與有信仰的生活。假如一個人以宗教之名來斂財，而又沈溺在個人的種種享受，這種人是不折不扣的魔鬼，經由此標準應該是可以被完全認出才對。(註一)", "註一：譯者總結此系列：錫呂瑪塔吉的基本觀點：人是不斷地死去又再誕生，而靈魂是不會死亡的。迷失的靈魂就成為四處遊蕩的亡魂，他們會試圖進入人體內。任何無法真正喚醒靈量力量的術士、咒師或假導師皆只是和亡魂打交道，是無法真正治療因亡魂附身的種種問題。而靈量的力量是非常聖潔的，那些愛錢、私生活有問題、離道德規範太遠的人，絕非真正的導師，他們不可能喚醒靈量。更可怕的是，他們當中許多是惡魔轉世，當代求道者不可不慎。 註二： Shri Mataji 的\"太初之母的書\"(The Book of Adi Shakti)p.57~p.80。"]}, {"num": "6-10", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "只有自覺的靈才適合土葬", "paragraphs": ["有些宗教相信人死後若將屍體埋葬，在數百年後(最後審判日來到時)，那肉體會走出墳墓，然後你會得救。基督教、猶太教及回教都有這樣子的說法，這也為什麼這三個宗教都將死人埋葬。這是非常荒謬可笑的想法，試想五百年後，你在墳墓裡的肉體還剩下什麼呢？(註一)你如何能像耶穌基督一樣復活呢？基督在死後三天就復活了，祂在星期五被釘上十字架，星期天早上即復活，甚至不到三天，但人們却妄想將屍體保存五百年！更不用說他們根本不是基督，耶穌基督的身體是完全不同的！(註二)", "只有自覺的靈(realized soul)死後才可以被埋葬，一般普通人都不應如此，因為一般人有許多遺願，他們(死後)仍希望做這個、做那個，所以他們的靈魂(soul)可能仍會在屍體附近徘徊遊走。埋葬屍體不只佔據土地，又造成亡魂(bhoots)在那附近遊走。西方世界這種風俗是非常令人驚訝，當我第一次到巴黎，在市中心他們有一個很大的墓園，一般人很自然在那裏喝酒，因為所有埋在墳墓的酒鬼亡魂都跑出來鼓動這些人喝酒！", "只有了解正法(dharma)的人才知道如何處理一般民眾及自覺的靈的死後事宜，只有那些合乎正法的人才可以(用土葬的方式)來保存他們的屍體，因為這些人的正法從臍輪(Nabhi)行到頭腦(註三)，而頭腦又供給靈的能量給所有的神經，所以自覺的靈的整個身體都充滿神聖能量(vibratory awareness)，這個肉體若埋到土裏面，人們是可以感覺到它的芬芳(fragrance)，(甚至)你在遠處即知道有一個聖人埋葬在那裏。(註四)", "你們應該記得我談過這個故事，也看過那張有光照在我頭上的相片(註五)，我去Mian ki takli 村莊時，他們告訴我有一位蘇菲派(註六)的聖人叫Mianh，他死在這裏也埋葬於此地，立即我感覺到這能量(vibration)。當我在演講時，我看到他以光的方式呈現，然後他將光投射在我頭上，這就是相片所照到的景象，(他來向我致意)，我感到十分高興，當我將手放在頭上示意他停止，他就停止將光照在我頭上。他死後没變成一個亡魂，而是變成光，當任何地方有需要時，他就以光出現。", "註一：約翰福音5：28，29：\" 時候 要 到 ， 所有 在 紀念墓 裏 的 人 都 要 聽見 他 的 聲音 ， 就 出來 。 行善 的 ， 復活 終 得 生命 ； 作惡 的 ， 復活 終 被 定罪 。\"。 譯者：目前的聖經是不認為有輪迴的，但有些研究指出原始的聖經是主張有輪迴的，後來統治者為方便控制信徒而將有關輪迴的文句全部刪除，但仍留下一些蛛絲馬跡。在否定輪迴的主張之下，只好說人死後就繼續留在棺木中，當最後審判來臨時再走出來。Shri Mataji 在許多談話中都提過目前看到的聖經已被保羅及後人竄改過，其中約三四成是錯誤的。 註二：Shri Mataji：耶穌基督是由\"唵\"(Omkara，即：無所不在的神聖力量)構成的。 註三：臍輪的正法跑到頭腦是\"生前即如此\"或\"死後\"呢？原文看不出答案。 註四：Shri Mataji 在其他的談話也提過：埋葬在土裏的聖人身體的能量可以滋養母親大地。 註五：Shri Mataji 多次談話談及此故事，請看後面所附相片。 註六：蘇菲派(Sufi)是伊斯蘭教中的一個神秘主義教派，他們透過冥想及導師來接觸阿拉。 註七： 1994-07-13。"]}, {"num": "6-11", "catTitle": "靈，靈魂，生死", "catNum": 6, "title": "對死亡的恐懼", "paragraphs": ["人類對死亡的恐懼是非常荒謬且無意義的。最初我開始演講時，人們常問我有關死亡的事，我的回答：\"你現在不是活得好好的，你為什麼要問死亡呢？\"。想要知道死亡，知道死後會發生什麼等等，這是一個很没意義且痴狂的想法。一旦你死了，你不就結束了？你再也不用做什麼了。去知道什麼時候會死，死後會發生什麼等，知道這些有什麼用處呢？任何會發生的就會自然發生。我們從未去問：\"我睡覺時，我身上會發生什麼事情 ? \"，而死亡就像一個永久的睡眠而已，我們却如此擔心，好像我們非知道死後會如何不可。在該死的時候人就會死亡，所有誕生的都要經歷死亡，但是你們(得到自覺的人)都知道你有一個永恆的生命，你絕對不會死掉(不見)。死亡並不是指這個軀殼消失，而是當你對你的靈魂(soul)完全無法掌控時，你才會有所謂的\"死亡\"；一旦你是一個\"自覺的靈魂\" (realized soul, 註一)，你對你的靈魂就有完全的控制，你有完全的能力帶著你的靈魂到任何你想去的地方。假如你想再投胎，你也可以再回到這個世界，也可以選擇和你的家人、你認識的人一起再投胎，都可以完全依照你的意願。不過也有一些偉大的靈魂會勇敢地投胎在衰敗、可能步入毀滅的社會。但是若你不想再投胎，你就不會再投胎。", "對自覺的靈魂而言，就没有常人所謂的死亡，當然更不應該有死亡的恐懼，因為你(已)有永恆的生命，我指的當然不是你一直擁有目前相同的身體，如同你會一再換衣服一般，你會更換身體。縱使這個身體不存在了，你仍會活著、有覺知，而且你知道你將會隨時為霎哈嘉、為所有和真理有關的事的完成來做準備。所以做為一個永恆的存在，你應當知道你所處的地位為何、什麼是你的工作、你應該有什麼觀念、什麼是你應該去做的。所以你們應去除死亡的概念，因為死亡對自覺的靈魂而言是不存在的。", "那些怕死的人因擔心而做了種種的準備，如買保險、這個、那個，但最終還是留下所有世俗的東西而離去，連一丁點的塵土也帶不走。對自覺的靈魂而言，他們早已放棄這些世俗的東西，對這些東西都没有興趣，他們不是物質取向的，他們的靈是完全自由的，所以當他們(肉身)死亡時，他們會感到十分自由、完全的自由，他們可以完全依循自己的意願來決定他們要做什麼，這些願望也都會實現，他們甚至不會感覺從這個肉身走出來，所以完全不需要去害怕死亡。相反的，這死亡應是被歡迎的，因為(没有這個肉身)你更自由、更自在，你再也不用承擔因肉身帶來的種種麻煩，譬如你不必再吃這個藥、那個維他命等。肉身帶給人許多麻煩，縱使你不管它，它也會纏著你，它不會放過你，它隨時會黏著你，所以這個肉體的結束，其實也是很好的事情。", "註一：realized soul正確的中譯應該是\"自覺的靈魂\"，而不是大家習慣用的\"自覺的靈\"。靈魂(soul)才有自覺及不自覺的區分，而每一個人的靈(Spirit)則都是光亮美麗的，並無高下之分。關於靈魂及靈的區別，請看另一譯文：6-1\"靈，靈魂，輪穴及肉體\"。 註二：在對内、對外的演講，Shri Mataji其實少談死亡及死後種種，基本上Shri Mataji認為談這些是無益於人的昇進。在她早期的書(太初之母的書，The Book of Adi Shakti)，則稍有着墨，譯者有翻譯一部分，請見：6-2\"人可以分成四種(錫呂瑪塔吉談靈魂(之一) \"及6-3\"死亡與誕生(錫呂瑪塔吉談靈魂(之二) \")。 註三： 1995-05-07。"]}, {"num": "7-1", "catTitle": "根輪", "catNum": 7, "title": "吉祥(Auspiciousness)", "paragraphs": ["任何可以散發出能量(vibration)的東西就是吉祥之物，它可能是一種形狀(shape，註一)、一種形式(form)，或是一些特殊物質在某些因素下的集合體，它可能是一棵特別的樹，或一個人。這種能量(及吉祥之感)只有自覺的靈或對靈性特別敏感的人才能感覺到，至於那些對靈性不敏感的一般人並無法感受到，他們無法了解所謂的吉祥。許多小孩子可以感覺吉祥與否，狗也可以，老鼠也可以，蛇也可以，老虎及獅子皆可以，人類則不太行。馬對吉祥與否則是相當敏感，譬如說你帶一匹馬靠近有不少亡魂的墓地，最初它會抗拒進入，當然最後它會慢慢習慣，狗也是如此。它們(應是指馬及狗)可以分辨一個人是否是自覺的靈，它們可以感知到聖人。甚至一隻瘋狂的狗也會被聖人馴服。", "吉祥的感覺是來自我們的心(heart)，而不是頭腦，不是從人的自我(ego)或非我(superego)，是來自心，是來自已被喚醒的心(請參見註二的故事)。在我們的心裏居住著靈(Spirit)，在未得到自覺之前，靈只是靜靜地住在心中，但並未進入人的意識之中，即未進入人的中樞神經系統之中。當昆達里尼(Kundalini)上升、打開頂輪時，心中的靈會得到完全的照亮(enlighten)，此時靈開始散發出喜樂和吉祥，只有當你到達此一境地，你才可以感知他人(他物)是否吉祥。你會開始不喜歡不吉祥的東西，譬如有一個不吉祥的人來，你會説：\"抱歉！我無法幫這位先生。\"，但是當你更成長、更上層樓時，你就不會介意幫助任何的人。", "當你内在的吉祥本質達到最高時，甚至你的名字都可以成就許多事，你的相片都可以創造出奇蹟。此時你是吉祥的化身，你是神聖中之最神聖( the holiest of the holy)。要達到此一地步，你必須去除身上的灰塵與髒汙，即除去錯誤的概念與種種的迷思。昆達里尼會一一幫你去除這些，但是你必須容許她來完成她的工作，就這麼簡單。", "註一：Shri Mataji 提到馬蹄形可以散發出能量，要練習者自行試試。譯者註：我們做靈体保護即是畫馬蹄形。 註二：在這談話中，Shri Mataji 提到另一個例子：有一次兩個新人來學靜坐，一大群練習者都靠到其中一個男孩那邊，去感受、享受他的能量；但是他們就是不肯接近另一個男孩，縱使我叫他們過去，他們仍然不願意。我知道為什麼，我就走過去幫助那位無人關注的男孩。我發覺他做了一些非常嚴重的錯事，他告訴我：\"老師，我並不是魔鬼。\"，我答道：\"你不是，但你做的那些事卻是非常邪惡。你和亡魂打交道，召喚亡魂將之放到人身上，這是非常的邪惡。\"。這些練習者的心都已被喚醒，他們從他們的心即可以感覺到，所以他們都有趨吉祥避不吉祥(趨吉避凶)的相同舉止。 註三： 1980-07-21。"]}, {"num": "7-2", "catTitle": "根輪", "catNum": 7, "title": "明辨力與根輪(之一)", "paragraphs": ["你們都知道明善輪(Hamsa Chakra)給你明辨力(discretion)，但是你們並不了解明辨力是什麼。 在我們的內在，第一個也是最重要的輪穴是根輪(Mooladara)，假如人對根輪没有適當的明辨力，那麼人會變得迷惘，也可能打開了通往地獄之門。", "你們知道只有左脈(Ida Nadi)是從根輪開始，左脈是代表內在的一種願望(desire，也包括渴望、欲望)的力量，這力量是從根輪開始。這願望並不是一種心智的(mental)活動(譯者：即指需用腦袋思考。舉例：對愛的渴望並非要用腦袋思考後才會有)，心智的活動是屬於右脈(Pingala Nadi)，右脈並非從根輪開始，而是從更上面的輪穴開始(譯者：指腹輪)。所以你們必須知道根輪 (譯者：指根輪所掌管的活動，根輪主管排泄及性功能，Shri Mataji 此處指\"性\")並無法被我們的心智活動所控制。假如你把這些根輪所掌管的活動(譯者：Shri Mataji 此處指\"性\")移轉成心智的活動，那麼你可能失去對根輪(譯者：即指性功能)的掌控。在西方世界，根輪(譯者：此處指性)完全變成心智活動，它被大量地談論、討論，甚至被詳細地描述、書寫在書本，且大量被閲讀。換言之，大量被塞進人的腦袋裡，即性變成一種心智活動，以致於根輪(譯者：指性功能)無法照它原來的設計本能地、自發地(spontaneous)進行。這就為什麼(現代)有這麼多人無法生小孩，許多人年紀輕輕即有陽萎的問題。因為他們把它當成一種(右脈的)心智活動，而不是使用欲望的力量。以油燈來比喻，油燈是靠油及燈芯來產生燃燒及火光。假如你用水取代油，油燈就無法燃燒，因為水無法燃燒產生光，所以假如你在性這件事用太多的頭腦(即用太多的心智)，那你的根輪會被毀壞掉，而變成無法控制(性功能)。假如你把這件事留給欲望，那它就會本能地、自然地來發生。這個很根本的原理是西方思想中所欠缺的，他們把本能的、會自動發生的當成一種心智活動來進行。", "在你必須使用心智活動的地方(即右脈的活動)，你就必須使用心智活動(即右脈)；在欲望及情感的領域，你就必須使用你的願望的力量。當然這種事(譯者：指性)本身是本能、自動地發生，所以不應該變成一種過度的迷戀。凡是過度的迷戀就不再是自然與本能。這只是一種在某個時刻你有這種欲念，如此而已。假如所有的時間你的腦袋都在想這件事，那麼就猶如想用水來產生出火光！", "註一： 1991-04-28。這是一篇很長的談話，Shri Mataji 逐一談各個輪穴應該有什麼明辨力。"]}, {"num": "7-3", "catTitle": "根輪", "catNum": 7, "title": "根輪(之一)", "paragraphs": ["在宇宙大我(Virata)中，在昆達里尼(Kundalini)開始創造之初，根輪(Mooladhara)是第一個被創造出來的輪穴。而太初之母(Adi Shakti)唯一的兒子------錫呂格涅沙(Shri Ganesha)------則被安置在根輪上面，做為其上的神祇。錫吕格涅沙是永遠的孩童(eternal childhood)的象徵。Mooladhara是由兩個梵文所構成，moola是表示\"根\"，adhara是表示\"支撑\" ，所以Mooladhara是表示：宇宙創造的根基的支撑(the support of the root of Creation)。", "錫呂格涅沙是從土元素(earth element)中創造出來，在不同層次的人，祂有不同的展現。降世神祇(Incarnations)的根輪是黏土的顏色(colour of clay)，而且是閃亮的。自覺的靈則像是閃亮的霧狀霓虹燈，或是橘色的。一般人是珊瑚紅(coral colour)。至於那些走錯路的求道者則是紅色，或暗紅色。", "當根輪順時鐘方向旋轉時，錫呂格涅沙啓動了創造的功能及美感的本質，這會帶給創作的藝術家喜樂。逆時鐘方向旋轉時，則是給那些醜惡與死亡的東西帶來毁滅。", "由錫呂格涅沙的活動是移向左或移向右，我們可以知道這位求道者的需要(譯者：Shri Mataji 指錫呂格涅沙會根據這個人需要的幫助來移向左側或右側)。假如一個人的行為是走向沈溺與放縱(譯者：如性、酒精等)，則錫呂格涅沙會彎向(bend towards)左側；假如一個人的行為是強迫性的禁慾與克制，則錫呂格涅沙會彎向右側。但是錫呂格涅沙只會往左右兩側移動到某個程度，一旦這個人在某一側有太多的活動，錫呂格涅沙會退回祂的住所，放棄祂試圖去平衡的努力，最後甚至在這種墮落的人身上消失不見。當祂消失(譯者：休眠)時，祂主管的意識心智(conscious mind)的領域就會被一些來自潛意識界或超意識界的亡魂所入侵。 假如錫呂格涅沙可以穩定地在中間，這表示代表中庸的智慧狀態(Sattwa Guna)取得主宰。這會發生在這個人持守人類的正法，或他的昆達里尼已被霎哈嘉瑜伽士所喚醒。假如錫呂格涅沙的穩定性持續改善，那麼正表示霎哈嘉瑜伽士穩固地走在昇進的道路上。", "根輪是所有輪穴的根基。根輪是位在脊髓之外，如此它可以散發錫呂格涅沙的能量。錫呂格涅沙是一個永遠保持清醒及警覺的神祇，也是正因為根輪處在脊髓之外。暴露在脊髓之外正是讓它對外界發生的種種有更好的敏感度。根輪也對其他輪穴的各種反應非常敏感，它也將各輪穴的經歷記錄下來，它也會將這些資訊和幻海(Void)的資訊相互核對。它的另一功能是記錄幻海周遭現實世界發生的所有事情，這些記錄的種種事件及問題會和母親靈量(昆達里尼)通聯，這些就是構成所謂的\"業\"(karma)。當一個人去世後，這些業就用來計算決定他的下一世。錫呂格涅沙也會咨詢其他輪穴的神祇，然後將一些資訊告訴這個人，這往往經由無意識心智(unconscious mind)的一些資訊系統。錫呂格涅沙可能在夢中傳送一些象徵符號給這個人，藉此來引導這個人，也達成祂做為糾正者的功能。", "有一些自覺的靈甚至可以把根輪移出來，拿到身体之外來清潔，然後再將它放回正確的位置。霎哈嘉練習者没有必要去使用這種方法。對霎哈嘉練習者而言，清潔根輪最好的方法是保持心的純淨，及過一個貞潔高尚的生活，並在這生活中充滿善念及善行。", "註一：摘譯自Shri Mataji 的手稿\"太初之母的書\"(The Book of Adi Shakti) p.143~146及p.149~151。"]}, {"num": "7-4", "catTitle": "根輪", "catNum": 7, "title": "根輪(之二)", "paragraphs": ["錫呂格涅沙是一個活生生的神，而且隨時都充滿活力，在人類的辭典找不到詞句來描述祂的光彩。錫呂格涅沙產生的靈性火花事實上點燃了每一個輪穴的每一個花瓣。錫呂格涅沙的導師是祂的父親，即全能的上帝(God Almighty)。其他的神祇，包括祂的母親太初之母，都是原始導師達陀陀哩耶( Dattatreya)的門徒。", "錫呂格涅沙是遠為人類所不及，甚至梵天婆羅摩(Brahma)、毗濕奴(Vishnu)、濕婆神(Shiva)都無法在德行上接近祂的完美(His absoluteness)。錫呂格涅沙以人類的形態出現則是耶穌基督(Jesus Christ)，耶穌基督是來照顧全人類的，因為祂是宇宙的根基。錫呂格涅沙以人類的形態(耶穌基督)出現，正是神聖與純真的化身，也是世界的支撑。耶穌基督的住所是在額輪，額輪正是進入天堂國度(Kingdom of Heaven, 即宇宙大我的頂輪)的門戶。", "根輪是從\"AUM\"(唵)這個字的第一個音節\"A\"所創造出來的。AUM是由三個神聖音節(syllables)所構成的，每一個音節都是一個口訣(mantra)。口訣\"A\"代表太初之母的摩訶迦利力量(Mahakali Power)，而根輪就是由化身為哥維(Gauri)的摩訶迦利所創造的，哥維就是錫呂格涅沙的母親。後來她將她的唯一的小孩交給摩訶拉希什米(Mahalakshmi)，摩訶拉希什米化身為聖母瑪利亞(Virgin Mary)生下了錫呂格涅沙化身的耶穌基督。", "錫呂格涅沙的頭是一隻小象的頭，小象就是太初之母的坐騎，也是實相與莊嚴(reality and majesty)的象徵。而且這動物的頭代表永遠的孩童的純真特質，因為動物的自我(ego)及非我(superego)並未發展到像人類的程度。在人類的情形，大腦是完全被自我及非我所覆蓋，這也造成囟門處的頭骨完全鈣化。所以這個個体就和無所不在的神聖力量(All-pervading Divine Power) 分離開來，而發展成為一個分開(獨立)的個体。錫呂格涅沙則是相反的，祂總是和無所不在的力量完全調和一致，因為祂有一個動物的頭，祂未切斷和無所不在的力量的連結。", "在進化的過程，動物如巨大毛象(mammoth)等曾變得体積很大，但大象是巨大動物中唯一被保留下來的，這也是來自錫呂毗濕奴(Shri Vishnu)的恩賜。這也証明大象是唯一有節制且符合正法的大型動物，(所以它在演化中仍然被保留下來)。 大象是錫呂拉希什米(Shri Lakshmi)的坐騎，也是目前存在的動物中最像人、最純真的。因為動物並未發展形成它們的自我，所以它們並未切斷和無所不在力量的連結，人類則是切斷了連結。", "錫呂格涅沙的象鼻是祂的昆達里尼，而祂只有一個輪穴，位置是在象鼻的尾端(at the end of His trunk, 譯者：指象鼻的尖端)。這個輪穴是完全没有保護，完全不怕邪惡或罪惡的污染，因為祂是不會沾染任何污點的。做為一個在正邪交戰中無懼的戰士，祂是輪穴遠離身體的唯一神祇，而且是在身体之前。(譯者：身体的最前端原本是最容易受攻擊、最脆弱的。)", "錫呂格涅沙有純真(innocent)、潔淨(purifying)、不被污染(unblemishable)、不沾染(unattached)的特質。正因為祂有這些特質，祂被安置在人類靠近排泄器官的根輪，祂猶如蓮花獨立存在於這些周遭的不潔淨，這是由於祂獨特的純真、貞潔高尚及純潔的特性。", "註一：摘譯自Shri Mataji 的手稿\"太初之母的書\"(The Book of Adi Shakti) p.143~146及p.149~151。"]}, {"num": "7-5", "catTitle": "根輪", "catNum": 7, "title": "純真與儀式主義", "paragraphs": ["我們應該要注意我們的制約(conditioning)是如何來影響、取代我們的純真，制約會讓你變得極端的儀式化(ritualistic)。縱使在霎哈嘉裏，我也看到、聽說有些練習者非常堅持儀式應如何進行，這些儀式主義(ritualism)者就像這樣：你必須説什麼3次或7次等等，就像被綁住手腳的人。", "我們應該了解禮法(protocol)和儀式主義的差別，一個純真的小孩(自然)知道什麼是禮法。我記得有一次一位小男孩來Oxted看我，我說我們上樓去，那樓梯只是一個小木梯，他說：\"什麼？母親要走這没有紅毯子的小樓梯？\"，這個念頭就從他的腦袋跑出來！所以對純真的小孩而言，崇拜及其種種都不是一個儀式，而是一種真情的流露。不論是如何去崇拜，或如何去表現你的愛，都是從你的内心深處的自然表現。一個純真的人來做這些，是讓人有十分甜美的感覺；但是一個守著儀軌的人，他甚至會打另一個做錯儀式的人，他會叫道：\"你為什麼如此做？你不應該將樟腦放在裏面！爲什麼你將樟腦加在裏面？這是非常錯誤的！\"。没有什麼是錯的！假如你從你的内心----純真的心來做這些儀式，怎麼做都是可以的。惟一需要的是用你的心來做這些儀式，而不是没有投入你的心。", "你現在是處在上帝的國度裏，在這裏是没有這些種種的規定及儀式主義。", "註一： 1993-09-19。"]}, {"num": "7-6", "catTitle": "根輪", "catNum": 7, "title": "純真與正法", "paragraphs": ["從物質(matter)到活生生的植物，再到動物，再往上到人類，都有錫呂格涅沙的能量(energy)在運作，在物質的層次，有人把這能量叫電磁力(electromagnetic)，其實從潛在面來講，這電磁力就是錫呂格涅沙的能量。這能量也會往上演化、成長，即在更上層的植物、動物或人類，各有不同層次的能量。", "在人類身上，這能量是以吉祥(auspiciousness)、純潔(purity)來存在，或應該說它主要是純真(innocence)，所以這純真的力量是一個引導的因子。純真並非無知(ignorance)，純真和無知是不同的。假如你是純真的，那麼對你而言，除了愛之外，什麼都不重要。對一個純真的人，他没有什麼制約，他也不會有很大的自我，他也不是所謂成熟世故的人，他只了解愛，他不在乎財富、權力等，他只在乎別人純粹的愛，這是他感受得到的。在他的認知裏，不論是他接受愛或給予愛，他從沒有想到從愛中來獲取什麼。", "純真是所有正法的基礎，假如你没有純真，那麼你無法(真正)去遵循正法。縱使你(看起來)是那麼遵守正法，那可能也只是一種心智上的態度，或是一種來自自我，或是因為你出生在一個宗教的家庭，或是有人告訴你應該如此，這些都是非常表面的。除非這些遵循正法的行為是基植於純真的特質，否則這種正法是没有任何意義的。在(真正)遵循正法的狀態中，你不是想到這是該做的正法，你已完全超越這種想法，也超越任何理智的推論。就是如此自然而然地去遵循正法，你無法去做違反正法的事。", "道德本身就好像是純真的外顯一樣，一旦(你内裏的)錫呂格涅沙被喚醒，假如你尊敬祂-----只需要尊敬祂，那麼自動地你會發展出一種道德感，我不必再叮嚀你，不用再向你解釋(為何應該要這樣做)，你(自然而然)變成有道德感。外面的人看到(這樣子的)你，都會很驚訝的說：\"為什麼他們的眼神如此穩定、如此純真，没有任何的情慾與貪婪\"。因為這是從後額輪而來的錫呂格涅沙之光，或可說是從額輪而來的耶穌基督之光，耶穌基督正是錫呂格涅沙的轉世再現。", "註一： 1993-09-19。"]}, {"num": "7-7", "catTitle": "根輪", "catNum": 7, "title": "譚崔的歧路", "paragraphs": ["***前言：**在\"太初之母的書\"中，Shri Mataji 花了許多篇幅談此話題，在平時的演講亦常提到此，顯然當代有許多假導師是利用此一技倆，而許多求道者亦掉入此陷阱，所以Shri Mataji 只好大聲疾呼。當代的霎哈嘉瑜伽士也需要對此有所了解，以解大眾的疑惑。*", "譚崔(Tantra)的原意是指人内在的神祕機制，這個人類並不是十分清楚的機制正是\"昆達里尼瑜伽\"(Kundalini Yoga)。通過這個神祕的機制，人可以達到梵我合一(譯者：即天人合一)的狀態。但是今曰大家所指、所了解的譚崔却是完全相反(譯者：今日的\"譚崔\"是\"性力修行\"的同義詞)，它不只和神聖、宗教和神没有關係，它的作法和想法是完全邪惡和屬魔的。它和進化是背道而馳，甚至我們可以說今日的譚崔是用來傷害昆達里尼，而非來提升昆達里尼！", "這個錯誤的起源應是如此：遠古時代一些求道者試圖去觀看根輪，他們看到了錫呂格涅沙的象鼻，這象鼻是捲曲且發出亮光，或許他們將之誤認為昆達里尼，這個根本的錯誤造成了一個很嚴重的後果。由於錫呂格涅沙是座落在骨盆神經叢(pelvic plexus)，這個神經叢又是掌管性功能，導致這些求道者不只混淆了錫呂格涅沙和昆達里尼，也將昆達里尼和性混淆在一起。這個錯誤開啓了一個最具破壞性的理論：即人可以經由性行為來喚醒昆達里尼，這即是當今譚崔(Tantrism)的基本觀點。", "其實昆達里尼是駐在薦骨(sacrum)的三角骨中，是比根輪更往上一些的位置，這証明誕生在世的人類已擁有一個更淨化、更昇華的人格，已經没有必要如譚崔理論所主張的，需要用性來達到昇華與純化。", "當一個求道者繼續堅持這些錯誤且變態的實驗，錫呂格涅沙會變成不活躍、不動作，最後甚至會消失。一旦祂在根輪變成漠不關心或休眠狀態，撒旦的力量即大量從地獄(hell)湧入集體潛意識(collective subconscious)，他們會佔據潛意識，最後會變成人類心智(mind)的主宰。當一個靈魂如此被控制時，他再也没有對錯的概念，所以當放縱沉溺在各式各樣充滿罪惡的性遊戲時，甚至還自以為是純潔和純真。", "在這個黑暗期(Kali Yuga，即所謂的\"末法時代\")，一些假導師為了控制意志薄弱的求道者，往往用刺激根輪的方法，藉此來控制他們的心智。經由此法，他在門徒的根輪引入一個亡魂(spirit entity)，正常的情形下，錫呂格涅沙會大力反抗這個入侵者，但是假如祂已如前所述的狀況，早已進入休眠的情形，此時這位求道者就完全没有任何保護。", "這些譚崔的理論，不論是西藏、尼泊爾或是印度的假導師，為了証明性是可以達到和上天的連結(即\"瑜伽\") 的精神境界，他們都鼓吹相同的說法，宣稱男人是依上帝(God, 或Shiva)的形象所創造的，而女人則是依太初力量(Shakti)的形象所創造的(譯者：當原始大梵一分為二時，即形成上帝及太初力量)。所以若男人與女人進行各種方式的結合，則可以形成一種最理想的境界，來達到最極緻的與上天的連結。這種魔鬼的理論是吸引很多人，但是事實上，在人類的身上，靈(Spirit,或 Atma)代表濕婆神(Shiva)是駐在心裏頭，而祂的力量(Shakti)則是昆達里尼，她駐在三角骨内，兩者是安置在同一個人身上，所以為達到人類的注意力或覺知(和上天)的再結合(即達到昆達里尼和靈的再結合)，每一個人都不需要另外一個異性來完成和上天的聯結！性在這昇進過程是完全没有必要的。", "註一：Shri Mataji的手稿\"太初之母的書\"(The Book of Adi Shakti) p.81、82、89、96、146、176。"]}, {"num": "7-8", "catTitle": "根輪", "catNum": 7, "title": "錫呂格涅沙( Shri Ganesha )", "paragraphs": ["錫呂格涅沙是坐在所有的輪穴上，從這一點來說，祂其實是宇宙的總管。若没有祂，這世界是無法運作，因為祂代表的是神聖的本身(holiness)。當昆達里尼(Kundalini)升到某個位置，正是錫呂格涅沙將祂的神聖本質灑遍此處，也正是祂用祂的潔淨力量來清理你的輪穴。", "所以了解錫呂格涅沙的美德，知道祂如何在你的輪穴內運作、如何幫助你等等，是非常重要的。我們除了崇拜祂、唱頌祂的拜贊外，我們也應該想到我們從祂身上獲得的種種好的特質，如純潔高尚的品德(chastity，註一)、純潔(purity)及智慧(wisdom)。我們必須了解我們的智慧並不是經由反覆的教導而獲得，智慧是無法被操縱學習的，它是屬於天生的，它是經由人變得成熟而獲得的。而這成熟只有經由適當地將注意力放在你的昆達里尼，讓這無所不在的神聖力量(all-pervading power)來調整、來修補你的昆達里尼，要經由如此才能達到。而這必須靠著規律的靜坐來達成。靜坐並不是每天必做的儀式(ritual)，它是在你覺得喜歡需要時來做的。一段時間後，你會發現你無時無刻都在靜坐，甚至平時你不靜坐時，亦處在靜坐的狀態。", "錫呂格涅沙的風格是如此偉大，甚至找不出適當的詞彙來描述祂。唯一我可以說的是：祂是一個小小孩，祂是一個永遠的小孩。這永遠處在小孩狀態是給予祂小孩子般的純真(innocence)。一般人是無法強迫自己變成純真，因為我們已長大，我們已經學了許多種種的奸巧與做作。但是當内在的昆達里尼開始上升時，她會開始祝福我們的輪穴，我們會自動地找回我們的純真。慢慢地，我們會有純真的心(heart)、純真的心智(mind)與純真的愛。這種簡單純真的人格特質正是一個好的練習者的表癥。這樣子的練習者會經由他的經驗知道：他是被錫呂格涅沙的眾多仙眾(ganas)所照顧的。不論你在那裏，這些仙眾都是跟隨在左右看顧你、指引你、幫助你。你應該有許多奇特的經驗，你也知道其他人也談及(寫下)許多的奇蹟與體驗，我們甚至無法用一本書來編篡全部的故事。", "雖然這些仙眾是跟隨在旁邊，且非常和藹可親，但是他們也一直監督著你，看著你的行為舉止。假如你試圖從霎哈嘉中謀取私利，你有可能會被處罰，這些仙眾有可能攻擊你。我已經警告你們不要剝削霎哈嘉來獲取你的私利，你已經獲得你的自覺，你不應該利用或剝削霎哈嘉，你應該來享受霎哈嘉.......。", "註一：譯者常年翻譯Shri Mataji 談話的理解：Shri Mataji 用\"chastity\"這個字，表達的不只中文的\"貞潔\"，而是\"純潔高尚的品德\"。 註二： 1991-12-31。"]}, {"num": "7-9", "catTitle": "根輪", "catNum": 7, "title": "錫呂格涅沙和平衡(上)", "paragraphs": ["我們必須了解錫呂格涅沙(Shri Ganesha)如何帶給我們平衡(balance)，錫呂格涅沙的代表符號卐(swastika)正是代表平衡而已。當它不動的時候就代表平衡，當它開始朝正確的方向移動，就會成就建設性的工作，且成就了所有對生命重要的事物。當它反方向移動時，破壞性的工作就開始了。建設性及破壞性兩部分會達成平衡，假如沒有，那麼生命就無法繼續。例如在大自然裡，先是花開了，當花凋謝死亡時，就產生果實。樹木的水份會蒸發到天空，假如不是這樣，那就不會引發下雨。冬天時樹木會落葉，因為這些樹葉必須死亡、掉落在大地，用它的氮元素來滋養母親大地，然後在夏天時，這些樹葉又長回來。", "所以生命就是如此，凡是被創造的都會被毀滅，然後新的又產生。當新的事物產生時，表示它走在創造之路，然後這被創造的(至少)有部分又會被毁壞，所以死亡就蘊藏在生命之中。假如沒有死亡，你可以想像從古至今所有的人都活著，那麼我們如何存活在這麼擁擠的世界？其實我們根本就不可能存在！", "許多已死去的動物也轉世為人，人也必須死亡，如此其他的人才能來到這地球。(有一天)你也必須死去，然後休息一陣子，之後再回到這地球。所以死亡只是生命的轉變而已，沒有死亡，那生命不可能存在。生命和死亡之間是一個平衡。 做為霎哈嘉瑜伽士不應該害怕死亡，因為假如一個人將要死去，其實他只是要進入另一個(型態的)生命，在那裏他會休息一陣子，然後帶著更大的熱情及能量，重新再回到這世上。", "大自然裏是有一種完全的平衡，假如没有平衡，那麼我們可能都不會存在。假如這地球以稍快的速度移動，你可能就不存在了。假如太平洋只深個幾尺，你可能也不存在。所以很多事物都處在一種完全的平衡，如地球到太陽的距離、到月球的距離等等，都是處在一種平衡。假如這平衡被打破了，那麼我們可能都不在這裡了。", "你必須了解所有這些都是由錫呂格涅沙來完成的，是祂來照顧所有的物質，及所有被創造的萬物。", "註一： 1992-02-09。"]}, {"num": "7-10", "catTitle": "根輪", "catNum": 7, "title": "錫呂格涅沙和平衡(下)", "paragraphs": ["第一個輪穴(指根輪)是母親大地所創造的，然後整個宇宙是由第二個輪穴所創造。但是第一個輪穴散發出神聖(holiness)及吉祥(auspiciousness)，正是吉祥帶來平衡。", "只有處在平衡時才會有吉祥。我發覺人一旦失去平衡，他們不是跑到右邊，就是跑到左邊。有些人非常正直(righteous)，極度的正直，也是很好的瑜伽士，但是他們(心中)没有愛。没有愛的正直是完全沒有意義！愛並不是表示你沈溺在某事或某人，而是你必須有不執着的愛與責任。所以在我們的人生裏，我們應該注意自己是否有這種平衡。", "錫呂格涅沙是住在根輪，祂控制根輪附近的感官，特別也包括排泄的功能。對於性，我們不宜沈溺於其中，但也不宜有禁慾的觀念，而是要有平衡的概念。這就為什麼你們都應該結婚，你們必須有一個正常的生活，有幾個小孩，有一個有尊嚴的婚姻生活。這是非常重要的，尤其必須有愛在裏面，夫妻之間、和孩子、和父母之間都必須有愛。假如一個人失去平衡，那麼整個家庭都會不平衡。", "我發現在西方社會裏，這個平衡瀕臨毁滅，你看有這麼多的同性戀問題及這個那個的問題(譯者：應該是指性變態、性犯罪等等)，這是由於不平衡所造成的，所以人們走到極端去。另一個極端則是苦行禁慾，人們走入了違反自然的道路。其實平衡才是最符合自然的，假如你没有處在平衡，那麼就會出問題，不是變得太過，就是不及。這就是人們受苦的原因。", "從錫呂格涅沙的輪穴我們可以學到如何行事，例如我們購買東西，我們也要會將這些東西往外送，而不是一直買，拚命地堆置在家裏。對於我們的知識與想法也是一樣，我們會從各個地方獲得形形色色的知識與想法，我們應該只消化那些對我們有益的，其餘的就毫不留念地將之丟棄。例如昨天一個人來找我，她是一個天主教徒，她無法離開天主教，但是她想學霎哈嘉。我告訴她：\"妳就留在天主教，教義中和霎哈嘉相通的，如妳必須尊崇基督的部分妳就接受，至於其他一些不正確、無意義的部份，妳就把它拋棄。\"", "面對各種知識、觀念、書籍及任何我們所讀的，我們必須發展出一種能力，消化吸收對我們有益的，拋棄那些對我們不好的，這也是一種平衡。", "註一： 1992-02-09。"]}, {"num": "7-11", "catTitle": "根輪", "catNum": 7, "title": "錫呂格涅沙和喜樂", "paragraphs": ["錫呂格涅沙(Shri Ganesha)最大的特質就是喜樂(joy)。在甚至還不會講話的階段，小小孩就會帶給我們許多喜樂，這個給人喜樂的特質就是來自錫呂格涅沙。我看到有些人來到霎哈嘉之後，並未充滿喜樂，他們非常嚴肅，他們不知道如何笑，不知道如何享受每一件事，這就是他們能缺乏純真(innocence)的表癥。做為一個霎哈嘉練習者，你必須了解 你應該是(隨時都是)喜樂的，而且可以帶給他人喜樂的，就如同小孩子一般。小孩子是給人何等甜美的感覺！或許他們只是剛出生，但是他們就可以給予人十足的喜樂。假如你無法來享受小孩子的純真，那麼恐怕是無可救藥了，錫呂格涅沙也無法幫你了。因為這應該是人類與生俱來的能力，假如你沒有這種能力，那麼你其他的感官能力都沒有什麼用處。譬如有人喜歡食物、顏色和其他種種，但是假如你沒有錫呂格涅沙(的喜樂)，那麼你無法單純地來享受任何事物。只有在錫呂格涅沙的祝福之下，人們才能真正的完全來享受所有的事物。否則人們只會開始論斷、開始批評，只會對外物提出種種的質疑，......就如現代社會有許多批評家，他們無時不刻都在批評......。他們就猶如身體中的瘡、膿。假如你無法有欣賞的態度、無法來享受外在的一切，正表示你的内裡缺乏錫呂格涅沙。你應該要能享受每一件事物，要能享受你的小孩及他人的小孩，如此才表示你有錫呂格涅沙完全的祝福。", "如果你沒有錫呂格涅沙的祝福，你將是一個完全無用的霎哈嘉練習者，因為你將總是看到他人不好的一面，即你會陷入一種困境------你無法去享受任何事物。或許你會說你的態度是比較嚴肅、成熟、進化，但是其實你(只是)沒有純真！這種人只會帶給週遭的人頭痛與麻煩。假如團體中有這樣的一個人，大家都會想將他踢出去。", "所以你應該有錫呂格涅沙的特質，即給予他人喜樂的特質。重點是在於你能給他人多少喜樂，而不是你要(獲得)任何東西。即有這種特質的人不會說：\"我必須要得到這個、我必須要有這個職位、我必須當負責人等等\"。他只是去享受給予他人喜樂。他會是一個幽默、和善的人，他絕對不會去侮辱他人、傷害他人。假如他陰錯陽差傷害到一個人，他一定會百般自責，並一再請求對方原諒。", "像這種快樂的人才是一個真正的霎哈嘉瑜伽士，這種人才是大家喜歡與之共處的練習者。這種人對他人沒有恨意，沒有任何惡意，也不會去找他人的缺失，而只會看他人的優點及特點。這種人是不會在乎他人是白皮膚或黑皮膚，是高或是矮。對他而言，這都沒有差別，因為他是(處在)完全的享受與喜樂(absolute joy)之中，在這享受之中，你不會去批評，不會去找尋他人的過錯。", "註一： 2002-09-14。"]}, {"num": "7-12", "catTitle": "根輪", "catNum": 7, "title": "關於純真的種種", "paragraphs": ["人類的最大同情心出現在(小孩子及他人的)純真(innocence)受到侵犯時，這是人類內在就有的，在人類的内裡有這個力量(power)------來自錫呂格涅沙(Shri Ganesha) 的力量，這個力量會給你這種感覺、能力來知道你必須去保護純真、純真的小孩、純真的人。而且整個世界都會挺身而出來反對那些屠殺純真人民的壞蛋，這是毫無疑問的！若有人不會反對、批評此種對純真人民的攻擊，那麼他們就是尚未進化到人類的階段。最高貴的人可以犧牲任何東西，可以放棄任何東西，但他們無法放下捨棄他們必須對純真負責的感覺，這是非常奇特的！人們並不了解人的内裡對純真的喜愛及保護心是猶如海洋之深廣。當人們看到純真的人、純真的小孩受到攻擊，是會引發最大的意志力，這就是人類的美麗之處！", "假如你無法愛小孩子，那麼你也無法愛任何的人或物。至今為止我仍未碰過宣稱不喜歡小孩的人。或許有人會說：\"我們喜歡花朵\"，為什麼？為什麼你喜歡花朵？因為花朵就是純真的，因為純真的美麗就顯現在花朵裡面。為什麼你愛大自然？因為大自然就是純真的。", "國家是會被摧毀的，但是純真的力量是無法被摧毀的，你必須對此有信心，你必須對你的真我有完全的信心，你的真我其實就是純真！有人可能會說純真的人往往被人欺騙，但是沒有人可以騙走純真，因為純真是有永恆價值的寶貴東西。他們或許會騙走你的錢，或是在一些(世俗的)東西上欺騙你，但是你最永恆存在的是你的純真，(他們是無法騙走的)。假如你是完全的純真，而且持續照顧你的純真，那麼你將是生命中最成功的人。如同前面提到的，純真是絕對不可能被摧毀的，它可能被你不好的想法、不好的行為所遮蓋，只是暫時被遮蓋。但是假如你可以將純真天空上的烏雲去除，那麼毫無疑問的，你會贏得全世界的尊敬！", "如何變得純真呢？你要做什麼呢？首先你可以自己觀察你的內心如何運作？它在做什麼呢？它對外界如何反應呢？這些是你必須去觀察的，這就是我所說的\"反省\"(introspection)。你的內心都在盤算什麼？它認為什麼是最好的呢？在這些你內心的思考、思緒中，什麼是觀察你自己的重點呢？最重要的部分就是要去知道：你對他人是如何來做反應？是一種純真的反應嗎？或是一種有報復心的反應呢？", "現在你們都是霎哈嘉練習者，應該很容易來觀察你自己，當有人對你有攻擊性的侵犯時，你可以觀察你自己是有什麼樣的反應，當任何的麻煩降臨你，你又如何來反應呢？你會有什麼行為呢？假如你是一個擁有大能的人，那麼你的行為會是你毫不在意，你自己知道這只是一個笨蛋在對你做這些事，是完全愚蠢的行為！既然他們在做這些蠢事，那麼我們又何必去在意呢！", "我們應該知道必須來尊崇(worship)我們的純真，有時候有人會覺得他就是因為(太)純真而被他人控制指揮，而會有一些沮喪：\"為什麼我被如此對待呢？\"，這些想法可能會來到你的腦袋裡，但是假如你尊崇你的純真，那麼你會經常都是一個快樂的人、親切的人，也是一個謙虛的人。", "每一個人都必須小心，你是你自己的摧毀者，就是你摧毀了你自己！以希特勒為例，他摧毀了他自己，沒有人摧毀他。當然每一個人遲早都會死，所以希特勒也會死，但是將希特勒澈底摧毀殺死的是他自己！所以你可能殺了自己，但是假如你是純真的，藉著純真你可以拯救你自己，而且可以變得十分光輝亮麗！要對純真的力量有信心！", "最重要的是：在你的生命中你如何展現出純真的力量？如何對待他人？這就是所謂的\"愛\"。除非你對自己是如此，否則你是不可能有真正的慈悲、親切。或許你暫時可以有這些感覺，但是只有在你的人格中有持續的純真流動時，這種永久的、真正的慈悲的特質才會降臨你身上。", "說明：這個談話完全針對純真，其中有許多非常精微、引人深思的片段，譯者特別將這些集中起來翻譯，有興趣的人可以去看整個談話。 註一： 2001-09-22。"]}, {"num": "8-1", "catTitle": "腹輪", "catNum": 8, "title": "明辨力與腹輪的創造力(之二)", "paragraphs": ["在不應該用頭腦與思維的時候，人們却是常用頭腦。這種情形也發生在腹輪(Swadisthana Chakra)。腹輪是主管創造力(creativity)，每一個人都可以創造出一個美麗的設計圖或圖案，可以創造出一件藝術品。但是假如你用思維去想：一件藝術品需符合那些條件、需有那些特點等等，那麼你的創造力就完蛋了！在西方世界，人們對藝術(品)有太多的討論與批評，正是這些批評扼殺了藝術家的創造力。一旦社會上有太多的藝術評論家，則藝術家的創作就不是源自他們内心自然而生的創意。他們會去想：假如我這麼畫、這麼創作，那麼評論家會怎麼說？一旦如此，整個自然、自發的創造力就喪失了。評論家常說：\"這裏不對，那裏不像一個藝術品。一幅畫應該如此如此。\" 這些評論讓藝術家再也無法自然地發揮其創造力。大家應該讓藝術家去創作他們想創作的，不要去批評。當我們看到一個來自任何地方的藝術品，做爲一個霎哈嘉瑜伽士，你就只需要去看、靜靜地欣賞，如此這藝術品就會全然地向你展現出這藝術家所要表達的。 藝術評論家却是用頭腦在看藝術品，例如有人在畫布上畫一條線，評論家說：\"這是藝術！ \" 這不是很荒謬嗎？一條線算是什麼藝術品呢？評論家會接著解釋說：\"這表示一個孤獨的人站在那裏，等等等。\" 這不是很可笑嗎？畫應該是讓你自然地去欣賞，而不是如此地用頭腦來描述、來解釋！當這些評論家在批評時，他們的心智都處在非常警覺的狀態，他們總是根據一些標準來看這些藝術品，嘗試把這些標準加到原本是自然、無所拘束的藝術上面。這會造成人變得不自然、十分做作(artificial)，因為這些都是人的思維創造出來的，是人造的(man-made)。在這人造之中，所有屬於自然的、自發的特質(spontaneity)都喪失了。", "同樣地，這也發生在其他領域，例如受這些希臘悲劇的影響，即羅蜜歐與茱莉葉的浪漫愛情，這些皆是想像出來的，完全不是自然的，但它跑到人的腦袋裡，使人以為男女之間的愛情，或夫妻間的關係就應該如此浪漫做作。好像先生每天都要送花給妻子，把妻子當成一個重要人物一樣。在這些想像的做作影響之下，夫妻之間那種自然的感情就消失殆盡。丈夫本來就是馬車右邊的輪子，妻子是左邊的輪子，兩個人都應依照他們本來應該扮演的角色、本來的天性與特質來行事，如此的夫妻關係才會是最符合自然、最完美的。", "註一：此篇Shri Mataji 從藝術談起，談什麼才是自然流露的創造力，什麼又是人為做作。這個話題也是Shri Mataji 在許多談話中常提到的，此次談話講得最詳細，Shri Mataji 所闡釋的很類似老子所講的自然之道。其實Shri Mataji更希望我們了解其中的精義，如此在其他的領域，就可以用我們的明辨力來知道如何行事才是符合自然之道。譯者：腹輪是一切行動、創造力的起點，這些行動最重要就是要符合自然之道，這是我們的明辨力在行動時首先需要關注的。 註二： 1991-04-28."]}, {"num": "9-1", "catTitle": "臍輪，幻海", "catNum": 9, "title": "你必須當你自己的導師", "paragraphs": ["在過去古老的印度，這導師原理是非常嚴格的，嚴格到使很多人並不敢去當一個門徒。那時候的導師有完全的權威，是導師來決定誰可以當他的門徒。這些候選人往往必須經歷嚴厲的苦行，才能成為一個被導師揀選的門徒。能否度過這些苦行的折磨，往往是導師判定某人能否成為門徒的唯一標準。", "但是今天的霎哈嘉瑜伽是完全不同，甚至是相反的。因為你們的導師是一位母親，縱使是最小的事(苦難)發生在你(即門徒)身上，我的眼睛都會充滿淚水，因為我為我的慈悲所折磨。所以以母親的身份來當一個導師是非常困難的。同時對門徒的你而言，你要達到相當的修行成就亦是有些困難，因為你很容易迷失在我的愛裏，尤其是當我給你太多的愛時，你常會忘記你的升進十分緩慢的這個事實。所以在霎哈嘉瑜伽裏，你要對自己嚴格一些，這是非常重要的。這也為什麼我常說：你必須要當你自己的導師 (You have to be your own guru.)。即你要引導你自己，你要把自己當成自己的門徒，而且你要時常修整你自己。假如你不了解在霎哈嘉瑜伽裏你要負責自己的升進，那麼你的進展將會十分緩慢，因為霎哈嘉瑜伽是不同於以往，是另一種型態的導師門徒關係。", "所以這就爲什麼我常說：你要成為你自己的導師。你必須做許多自我反省(introspection) 及糾正自己的許多想法。我現在坐在你面前，你們都知道我如何，我可以吃任何(你們給我的)食物，我也可以幾天不吃。我可以睡在任何地方，我也可以完全不睡覺。我到處旅行(演講)而毫不疲倦，我有充足的精力。為什麼呢？因為我是我自己的導師 (我嚴格訓練、要求我自己)。", "所以首先你應該對自己有許多内省，如 \"我有什麼過錯呢？\"，而不是 \"別人有什麼過錯？\"；\"我是否在追求我身體(感官)的舒適？\"；\"我的注意力是在我的身體或是靈(Spirit)上？\"；\"假如是在我身體，那我正在做什麼呢？\"；\"我可以睡在地上嗎？\"；\"我可以坐在石頭上(而非椅子)嗎？\"；\"我隨時都可以睡，或隨時都保持清醒嗎？\"等等。你必須訓練你的身體，使它爲你所用。 除了身體及習慣外，你也必須做一些更深層(心理方面)的内省，反省你的周遭(即成長背景)、你的風格(style)、你的方法(methods，註一)及在外在制約下而你是如何對待你自己(註二)等等。", "註一：譯者：指人習慣處理事物的做法。 註二：指人的一些心理上的制約。 註三： 1991-07-28。"]}, {"num": "9-2", "catTitle": "臍輪，幻海", "catNum": 9, "title": "導師與無思慮(之一)", "paragraphs": ["如何達到導師(Guru)的狀態(state)呢？當然首先你要成為自己的主人(master)，這是毫無疑問的，你都不是自己的主人，那如何當別人的導師呢？", "要達到導師的狀態，首先你們必須要培養一些能力(faculties)，第一個能力是你可以達到無思慮(thoughtless)的狀態。(最初)在靜坐時你可以進入無思慮的狀態一小段時間，慢慢地，這短暫的時間應該可以逐步增長，即你可以有一段時間是沒有任何思緒的，我們可以說這是一種狀態。如何達到這種狀態呢？人們總以為必須要很努力做一些事才可以達成某一狀態，他們不知道事情有時是可以自然而然地發生。在霎哈嘉裏，我們有一個很簡單的口訣(mantra)來讓你自然而然達到無思慮的狀態，即 \"Nirvichara\"。所以當你看(外在的)任何事物時，你唸頌此口訣 \"Aum Twamewa Sakshat Nirvichara\"，然後你就可以開始只是單純地看著，如旁觀者(witness)一般，靜靜地看，而沒有任何的思緒。這單純的看的本身就會在內裏創造出這種無思慮的狀態，這是非常的重要的，此時你變成一個旁觀者。當你是一個旁觀者時，你會看到這個的標的物的全貌，既看到内在精微的部分，也看到外觀粗糙的部分。你不只看到了它，也知道了它，做為一個霎哈嘉瑜伽士，它變成了你的知識(knowledge)。", "記得有一次我旅行經過Sangamner一帶，我看到一些紅色的石頭。後來我告訴他們可以採集一些紅色的石頭做為我們在Pratishtan的建築之用，他們卻回答說：\"在整個Maharashtra都没有紅色石頭！\"，我説：\"你們去靠近Sangamner的那一帶就可找到。\"，\"我們常經過那一帶，但我們從未看過紅色的石頭！\"， \"我不曉得你們看到什麼、注意到什麼，但是那裏確定是有！\"。結果他們去那裏，果然看到一山又一山的紅石頭，這些都是他們以前未曾注意到的！", "所以當你無思慮靜觀外界時，就没有任何思緒來阻礙你完全看到這外界的全部，來吸收外界的的知識(譯者：即此例中的\"紅石頭\")。此時由於没有思緒的干擾，百分之百完全吸收就自然而然地發生。然後在適當的時機，它就展現出來(譯者：在此例中就以你的知識展現出來：\"那裏有紅石頭\")。這就是當你進入無思慮的狀態時，上天的力量(Divine Power) 如何在你内裏運作的方式。這也是我很少會忘記事情的原因，很多人都應該注意到我有這個特點。", "用當代的術語來說，當你(没有思慮)看著外物，外在的一切就如同錄影帶般記錄在你的心智(mind)裏，然後它再以知識或喜樂或愛心的方式展現出來(註一)。(在得到自覺後)你會有不同的向度(dimensions)的能力，這些向度是你們必須去發展的。", "同樣地，若你現在去面對一個難應付的人，他一直說話，不停地說，此時你只要進入無思慮的狀態，你猜往下會發生什麼事呢？首先，他那些如炸彈般、不止歇的話語再也無法接近你，因為你已完全處在另一個不同的國度，在這無思慮的國度裏，你的能力(power，或譯：大能)就開始展現出來，它可能會使講個不停的對方冷靜下來，或甚至令他嘴巴閉起來，或是可能讓他感受到源源不斷的大愛。", "註一：本文的例子是\"以知識展現出來\"，至於\"以喜樂或愛心的方式展現出來\"，可以參考另一篇譯文：2-12無思慮的覺知與當下。 註二： 1992-07-19。"]}, {"num": "9-3", "catTitle": "臍輪，幻海", "catNum": 9, "title": "導師與自尊及寧靜(之二)", "paragraphs": ["為什麼一個導師(Guru)需要知道自己的自尊(self-esteem)呢？人類並不太了解自尊的重要，人們必須先自我省思(introspect)才能有真正的自尊。藉著自我省思來知道：", "今天的我已不同於以前的我，我是一個自覺的靈，我擁有一些大能(powers, 或譯：能力)，我擁有愛的力量、憐憫慈悲之心的力量、洞悉事物的能力、創造的能力、給他人自覺的能力。", "過去的人類並没有這些能力，雖然今日的霎哈嘉練習者擁有這些能力，可是他們却自己没有意識到，當然我們不應該太過認為自己會這個、會那個，這樣子會使自我(ego)變大。但是我們應該有自尊，有什麼樣的自尊呢？因為你知道： 我是一個導師，我不是一個普通的路人，我有一些和凡人不同的特質，我是已到達彼岸、知道真理的人，我必須來拯救那些盲目及瘋狂的世人。", "今日的世界是處在非常混亂的狀況，但在這個時代，一種寧靜(silence)會在你的内裏出現。當有任何危機混亂發生時，立即地，你變成十分的寧靜，這是一種我講的\"狀態\"(state)。所以試著訓練自己，當你碰到令人不快或沮喪的事，試著回到這一點，回到這個軸心(axis)，回到這個寧靜當中。此時，這份寧靜會讓人擁有很強的能力(powerful)，因為這個寧靜並不是你的寧靜而已，當你處在寧靜之中，你同時是處在宇宙的寧靜之中(silence of the cosmos)，這個宇宙的寧靜就會幫助你、為你工作。可以說此時你是聯結到宇宙的大能(Cosmos Power)，其實不止這樣，應該說是上天的大能(Divine Power)，這上天的大能是作用在所有的宇宙。所以假如你回到你内在的寧靜，你會知道你正坐在上帝的國度(Kingdom of God)裏。", "這份寧靜正是你和上天大能有完全聯結的一個標記，正因為上天會來看顧所有的事，所以你是寧靜的。你不必做任何事，只需要保持寧靜，當然不是強迫地處在寧靜，而是一種狀態。 當有任何騷動混亂發生，或遭遇了一些問題，突然間你的注意力會跳到那寧靜，一旦你跳入那寧靜，你就聯結到無所不在的力量(All-pervading Power)。這無所不在的力量就是愛，它不只像一種到處流動的能量，不只像河流一樣，也不只像虛空(ether)，它是完整的全部實相(totality of Reality)。相對於它，其他的都不是真實的。這個實相是如此地有效率，它從未失敗。它是如此巨大、相互糾纏的流程，人們的理解力是無法了解它如何來控制、如何來運作。", "所有你們看到的奇蹟都是這個力量的創作，這個力量會思考、能理解、會合作恊調，也會照顧及愛你，其實它是任由你來運用、差遣。你到那裏，它都隨侍在旁，好像你是一個總督出巡，它猶如護衛隊跟隨在前後左右。這力量不只跟隨著我，也跟隨著你，因為你是一個霎哈嘉瑜伽士，你已在此註册登記，所以它知道要照顧你。所以要試著去了解你的尊貴之處-------你的自尊，無論你是睡覺、走路、坐著、在家裏或在外，它都看顧著你，而不看顧其他人。你不必下指令，也不必要求，它都跟隨著你，因為你已是這個上帝國度中的一個總督。", "一旦你了解你的自尊，接著你就需要領受(assume)你的大能(powers)，如此才是一個導師。假如你不領受你的大能，依舊在想：\"我是否有這些能力？\" 那表示你仍是一個初階者而已。一旦你開始領受這些大能，所有的負面力量及阻礙(badhas)都會跑光光，因為没有任何人或負面力量可以對抗這個人----他是一個聖人，也是一位導師，而且他自己知道他是導師！", "但是你必須有反省的能力，有能力來看清自己的自尊是否完全正確。絶對不是自認為自己是一個導師就可以了。", "註一： 1992-07-19。"]}, {"num": "9-4", "catTitle": "臍輪，幻海", "catNum": 9, "title": "拉希什米(Lakshmi )和給予", "paragraphs": ["拉希什米(註一)的兩隻手上各持有一朶蓮花(Lotus)。蓮花是愛的象徵，蓮花是粉红色，粉紅色就代表愛，所以拉希什米原理代表的就是愛，而不是一般人以為的錢財，這些錢財只是用來表示你的愛而已！所以真正有拉希什米的有錢人會十分慷慨，就像蓮花會歡迎面目猙獰的大甲蟲晚間躲到它的花瓣中，它會輕輕地合上花瓣，讓甲蟲在裏面安眠。", "拉希什米的左手平伸(手掌向上)就表示給予。這些内在有拉希什米原理的人只想到如何給予他人，而且他們不會把自己不要的東西給予他人。朋友不是你的廢物桶，把不要的東西給予朋友不是所謂的慷慨。假如你有能力給予，你應該把最好的贈予他人。很可惜大部份的人不懂也未曾學過贈予的藝術(註二)，再加上人們都是非常自我中心，他們知道什麼(東西)會帶給自己喜悅，但是他們不了解什麼可以帶給他人真正的喜悦。當你懂得贈予的藝術，知道別人真正的需求，此時因贈予所帶給對方的喜悅會千倍返回你的心中。", "當我們表達我們的慷慨時，有時候難免會碰到對方利用我們的好心來佔便宜。這是無所謂的，這不是你的錯。是那個佔你便宜的人犯了罪，他將會因此受到懲罰，這是上天無所不在的神聖力量(Divine Power )的職責，你不用去擔心。你不會因此有損失，你甚至會有十倍的回報。你是一個霎哈嘉練習者，你是隨時都被神聖力量所祝福的。", "註一：拉希什米是住在臍輪的神祇，在印度可說是最受歡迎的女神，因為祂帶來財富。 註二：Shri Mataji 在其他的談話中有提過\"贈予的藝術\"乃在於給人他所需要的或他所缺乏的東西。 註三： 1990-10-21。"]}, {"num": "9-5", "catTitle": "臍輪，幻海", "catNum": 9, "title": "拉希什米(Lakshmi)與保護", "paragraphs": ["拉希什米的另一隻手就像如此(註一)，這表示祂給你保護。對霎哈嘉練習者而言，你們首先要照顧你們的小孩(即給他們保護)，照顧他們的需要，養育他們，給他們指引，但不要寵壞他們。一旦他們長大結婚有他們自己的小孩之後，就不要試圖去佔有(掌控)他們及他們的妻子小孩。", "拉希什米的保護是一種像媽媽的保護。不論你的工作是在辦公室或医院或工廠，所有你的下屬都像是你的小孩，你必須照顧他們，讓他們有家庭的感覺，讓他們有被照顧的感受。像以前我先生的辦公室員工一早從加爾各答搭飛機來，甚至是早上五點鐘，我都親自為他們煮早餐。他們只是一般的辦事員而已！因為經由這像的保護、照顧與愛，你可以讓他們變得非常有活力，也使他們的拉希什米力量增強。否則職場上就容易有罷工和各種爭鬥。", "註一：Shri Mataji 向前伸出右手，右手掌向前。 註二： 1990-10-21。"]}, {"num": "9-6", "catTitle": "臍輪，幻海", "catNum": 9, "title": "愚笨的妻子才會宰制丈夫", "paragraphs": ["有些婦女很會宰制丈夫，說穿了就是愚笨。婚姻應該是(如你們所說的)蜜月(honeymoon)，甜蜜(honey)應是婚姻的核心本質，而moon代表的是安祥與和諧(peace)。假如妻子是愛爭吵、愛爭鬥、喜歡冷言冷語諷刺 ，這種婚姻對男人而言就如同地獄一般。相反來說，假如妻子了解婚姻的核心本質是甜蜜，她應該知道如何去讓她的丈夫高興，知道如何將祥和帶到家庭裡。", "如何去取悅丈夫呢？對自覺的靈而言，這只需要一點小技巧。首先要去發掘妳的丈夫喜歡什麼，以我為例，我的先生(婚後)告訴我：\"你頭髮上不應當插花，我不喜歡女人在頭上插花\"，雖然在這個Maharashtra地區所有已婚的婦女都在頭上插花，但是從他講的那一天開始，我從未在頭上插花，這有什麼關係呢，插不插花一點都不重要。然後他又說：\"你應該掛手環\"，因為他來自一個非常傳統的家庭，(婦女都穿戴許多手環)， 從此之後我都一直戴著手環。 戴手環會讓他高興那就戴手環，這有什麼關係呢？ 當你在小事上取悅丈夫，他就會開始想我應當為我太太做什麼，所以這種良性循環應該從妻子開始，而不是等妳的丈夫來開始，因為婦女的責任就是在社會(及在家庭 )，但西方文化並沒有告訴人你的責任是什麼。男人的責任是在經濟、政治、賺錢等，雖然他們將這些都弄得一蹋糊塗，但女人的工作與責任是在社會，所以首先你必須知道如何讓小孩子高興、讓丈夫高興、如何幫助他們、接近他們。假如妳不是這樣做，而是隨時去掌控宰制，那就不對了，因為妳的工作不是去掌控，妳的工作是要去中和男人的掌控，用小小的技巧去中和他。", "我舉一個我的例子，我的丈夫辦公室有一位優秀的下屬跳槽到其他公司，他為了高薪而跳槽，之後他發覺那個公司不好，他又想回來，我的丈夫有他堅持的原則，他拒絕了這位下屬，將他趕走。那位下屬就來找我、拜託我，我從來不干預我丈夫辦公室的事務。他拜託我說：\"假如妳代我求情，妳丈夫可能會聽進去\"，我答道：\"假如我告訴他，他一定不會答應，但我知道如何做\"。之後我告訴我丈夫那位下屬來拜訪過，他說：\"哈哈！他找對人了！那麼妳現在要開始給我麻煩了嗎？\"，我說：\"不！不！我不會去管你的事，但是你只需要想一下他為什麼來找我？\"，\"為什麼？\"，\"因為他認為我比你寬容大方\"，\"什麼！！\"。結果那位下屬就回到我丈夫的辦公室工作了。(後來)那位下屬是我丈夫的好朋友，也幫他很多。", "所以當妳認為妳必須影響妳先生時，最好是用一些好的技巧。只有在一些重要的原則上，妳才可以嚴肅強硬，但在一些小事上，若妳也要宰制妳先生，那就完全錯了！妳的結婚是為了展示妳的愚笨，還是要享受甜蜜與和諧呢？西方世界的婦女，尤其是義大利、英國，往往是如此。", "男人並不期望妻子是揮著馬鞭，騎在他頭上來指揮他。男人為什麼要結婚呢？是為了享受來自女人的快樂、喜悦及甜蜜！我為什麼要特別談這個話題呢？因為現在有許多女人認為她們很了不起，她們有錢、有工作。但她們的首要工作應該是讓社會家庭快樂、讓丈夫快樂。假如一個妻子無法讓她的丈夫快樂，那麼她不是一個好的霎哈嘉練習者，她對我們沒有任何好處。假如她無法為她的丈夫設想，那麼她就不應該結婚。她可以不結婚，而去做她喜歡的事。我當然也看了那些電影，那些羅曼蒂克的電影，那些情節從未在現實發生，沒有人會像那樣子，那些都是荒謬(不存在)的，難道你要期待妳的丈夫是克拉克蓋博(Clark Gable，譯者：美國知名影星)，婚姻不是那樣子。妳必須去愛，妳首先必須將妳的丈夫放入妳的心，這是妳的職責，不然妳的責任是什麼？", "男人是很簡單的，但妳必須去了解他們。他們有時候會生氣，這沒有什麼大不了。事實上有時他們對外面的人不滿，回家將怒氣發到妳身上而已，但這至少比在外生氣而挨他人揍來得好。假如妳了解男人的一些點，那就很容易駕輕就熟、遊刃有餘。當然我不是說那種很卑劣、令人難以忍受的丈夫，所以在霎哈嘉我們是容許離婚的。", "註一：這個話題是Shri Mataji常講到的，Shri Mataji基本上認為妻子是先生的力量(Shakti)，也是維持一個家庭的核心力量，唯有有母愛呵護、管教的小孩才能成為正常、有道德的好公民，這是男人做不到的，因為男人天生沒有這些特質。這也是婦女的天職與神聖的使命，若女人放棄此責任，只忙和男人爭平等、比高下，整個社會將會衰敗。 註二： 1997-10-04。"]}, {"num": "9-7", "catTitle": "臍輪，幻海", "catNum": 9, "title": "明辨力與臍輪(Nabhi Chakra)(之三)", "paragraphs": ["就左臍輪而言，婦女必須是一個古哈拉希什米(Gruha Lakshmi)，而丈夫必須像一個真正的丈夫，而不是羅蜜歐。丈夫必須注意太太的行為，必要時要糾正她，這是丈夫的職責，不可以逃避。做為一個古哈拉希什米的婦女，她應該知道她有一個重大的責任-----創造一個非常偉大的霎哈嘉社會。她並不是一個普通的婦女，因為過去是少有婦女得到自覺的。但是在霎哈嘉裏，你會發現少有婦女是真正了悟到此責任，大部份人是處在一種昏沈的狀態。許多事情她們都不知道，(甚至)她們也不知道厨房的事。有時候我同她們講話，感覺她們好像吃了什麼(迷幻)藥似的，腦袋似乎是空空的。我覺得好像我自己來做反而比較省事，因為她們的覺醒之心(alertness, 註一)都不見了。她們把原有經右脈的覺醒之心都浪費在没有意義的事物上(譯者：指衣服、流行、肥皂劇等)，注意力都浪費掉了！這就是爲什麼家庭主婦喪失了基本的明辨力，以致於她們不知道她們必須要極端有警覺、敏鋭與有智慧。", "假如妳没有這基本的覺醒之心，那妳無法當一個古哈拉希什米，妳無法是一個好媽媽、好妻子。我並非說婦女要當一個(服務家人的)女奴，但是(今天許多)婦女連這些基本的事都不知道，例如：如何創造一個祥和的家庭、如何使丈夫高興(註二)、什麼時候該說什麼、何時應說好聽的話、何時要嚴格一些.......。這些該有的明辨力都不見了，不論她是一個潑婦或小女人都是如此。", "霎哈嘉的婦女應該保持覺醒之心、有智慧，且知道生活中的大小事情。但是許多人却連輪穴在腳的位置都不知道，也不清楚靈量如何穿越輪穴、靈量在做什麼等等。靈量本身是一個女性的力量，你是她的小孩，她知道你的每一個細節。但是許多媽媽却連她的小孩是否吸毒都不知道，也搞不清楚她的小孩(在外)的行為是如何。往往除了打小孩及寵小孩之外，什麼都不會做。假如(霎哈嘉的)媽媽有明辨力，她們是可以把這些特殊的小孩(譯者：指生來就自覺的小孩)變成偉大的人物。這是我對這些小孩的遠景與期待。但是假如這些媽媽沒有明辨力，她們是會徹底毁掉這些小孩。 (婦女的)明善輪的完善是非常重要的，如此我們才能創造出一個美麗的家、一個祥和的家，不只爲了家庭的成員，也為了來到這個家的其他霎哈嘉兄弟姊妹。", "右臍輪是羅闍拉希什米(Raja Lakshmi)，即妻子必須像個王后，丈夫必須像個國王。此處的明辨力是：你的行事為人是否有尊嚴(dignified)。對丈夫而言，他必須尊重他的妻子，否則他不是一個霎哈嘉瑜伽士。尊重是不同於(西方)所謂的羅曼蒂克，那不叫尊重。尊重妻子在霎哈嘉是非常重要，當妻子不被尊重時，孩子也不會尊敬他們的媽媽，而正是這個媽媽要負責來照顧這些孩子，所以你可以知道不尊重妻子是何等沒有明辨力的行為。", "在臍輪最没有明辨力的行為可以說是：沒有聽從你的導師。聽從你的導師是如同服從至高的上帝。導師所說的，你要當成一種祝福來接受，當成一種對你的糾正來遵循。但是我說了數百次，仍然有許多練習者無法聽進去，他們依然遵循原有的常規或社會流行所告訴他們的。我對你們有這麼多的談話，是為了告訴你們什麼是重要的，你們應該敞開你們的心(來聽)，對你們的導師完全順服，如此你們才可能成長。除此之外，別無他途。", "註一：alertness 是指一種警覺的狀態，而不是渾渾噩噩、什麼都不知道。 註二：Shri Mataji 常說聰慧的妻子是很清楚知道丈夫喜歡什麼，如何讓丈夫高興更是輕而易舉的事。 註三： 1991-04-28。"]}, {"num": "9-8", "catTitle": "臍輪，幻海", "catNum": 9, "title": "穆罕默德就是摩西", "paragraphs": ["十大宗師都是一體的，他們有相同的人格特質，他們都是原始宗師(Adi Guru)達陀陀哩耶(Dattatreya)一再的轉世，不論是摩西、亞伯拉罕、蘇格拉底等(註一)都是相同的人。", "那些有宗教偏執的人容易在胃部產生問題，有一個伊朗醫生，他得到胃癌，1974年他千里迢迢來找我。我問他：\"你相信穆罕默德和摩西是同一個人嗎？\"，這對回教徒而言是一大挑戰，", "他說：\"不！不可能！我無法相信，這怎麼可能呢？\"", "我說：\"但是穆罕默德說他們都是相同的，他們共有10個人，為什麼你無法相信呢？\"", "\"但是他們兩個人是不同的！我無法相信！\"", "\"那麼我無法醫治你，因為你是一個宗教狂熱份子，這就為什麼你得到胃癌。你的問題是在宗教的偏執，而非癌症。你必須接受他們是相同的。\"", "他回到旅館後，他太太勸他：\"你都這麼嚴重了，醫生也說你已無法醫治了。為什麼你不要試試看？\"。於是八天後他又再回來找我，說：\"好！Shri Mataji，我接受，假如你如此說。\"，我說：\"現在你要一再說你的口訣 \" 穆罕默德，我知道你是摩西。\"，你就只須說這個相同的口訣。\"。結果他的胃癌被治好了，他現在(譯者：1982年)仍活得好好的，還住在伊朗。", "註一：十大宗師是闍那迦、亞伯拉罕、蘇格拉底、摩西、瑣羅亞斯德、老子、孔子、穆罕默德、那納克、賽乃夫。他們是駐在幻海(void，即3a)的位置。 註二：Shri Mataji在許多談話都提過這個故事，內容大同小異。 註三： 1982-10-29, 1982-06-22, 1982-09-28。"]}, {"num": "9-9", "catTitle": "臍輪，幻海", "catNum": 9, "title": "金錢的價值", "paragraphs": ["對有些人而言，金錢是非常重要的， 現代這個社會毫無疑問是一個金錢導向的世界，但是我要說的是：去擁有那麼多的金錢，但變成一個傻瓜，這對你有什麼好處呢？看看那些有錢國家的老百姓，他們有很高的自殺率，顯然他們並不快樂，金錢是不能帶給人快樂。假如你成天想的都是錢錢錢，那麼你無法成為一個霎哈嘉瑜伽士。", "金錢只是用來讓你表示你的愛而已！假如你有錢，最好是用來買東西送給其他人，買對他人有用的東西、買美麗的東西、買有藝術品味的東西來送人，如此可以來表示你的愛、你的感謝和你的堅信(Shraddha)。", "但是有些人拼命累積錢，累積了無數的錢，但是却完全不了解錢的價值。對他而言，世界上除了錢之外，沒有任何值得一提的東西。這就像一個原本要去機場的旅客，途中看到的路邊有好玩的東西，下車去玩賞，但却忘記原本是要去機場搭飛機。這些累積了無數財富的人也是如此，他們浪費了精力在拼命賺錢上，將他們的注意力放錯了地方，最後他們也不快樂。因為我們都知道，人類的需求是無止境的，不可能從車子、房子，到更大、更更大的需求去獲得滿足感。而是純粹的愛(pure love)，你和他人之間感受的真愛，才可以帶給你滿足感，即是從你給予的愛及你從他人接受的愛，才可以獲得完全的滿足，因為這種愛是沒有參雜任何目的與任何想法的，而是單單去感受你和他人內在純粹的愛，這可以說是來自上天(Divine)最大、最美好的禮物。", "註一： 1996-03-21。"]}, {"num": "9-10", "catTitle": "臍輪，幻海", "catNum": 9, "title": "錫呂拉希什米與金錢", "paragraphs": ["拉希什米(Lakshmi)是給我們財富、繁榮的女神，毫無疑問的，她是帶來幸福的。她給我們保護，她也非常謙虛，從她站在蓮花上即可知道，她是非常輕盈的，即她不會給人壓力。這些都是拉希什米的特徵。", "但是唯有在這個時代，她同時也是摩訶摩耶(Mahamaya，即''大幻相'')的一部分。當人們得到拉希什米(的祝福)，即得到(許多)金錢時，人們並不明瞭拉希什米最初是人們的母親，所以拉希什米(及金錢)必須被尊重。即拉希什米帶來的祝福及金錢必須以極端適切的心態來使用，就如同(均衡地)站在蓮花上，而不會摔到水池中，這含義就是你必須超越來自幻相(maya)的誘惑，安穩地站在蓮花上，否則摔下來就會被池中各種(可怕的)動物吃掉了。", "在梵文中，我們也稱拉希什米是幻相，如果有人得到很多錢，大家都會說：你獲得了許多幻相。(註一)", "這個幻相會玩許多把戲，金錢及繁榮並無法拯救這個世界，否則這個世界不會(在擁有金錢及繁榮之後)仍然有這麼多問題。那些有錢的人往往被金錢所毀滅，假如他們本身沒有，則往往是孩子或是孫子被毀滅。", "人們內在的拉希什米原理是非常模糊的，今日社會外在的誘惑又如此大，以至於人們看到別人開名車，就會認為：\"哇！他是一個了不起的人！\"，他無論如何都不會給你他的車，有什麼好讚嘆呢！假如有人擁有許多豪華建築物，人們就開始欽佩仰慕，這是黑暗時代(Kali Yuga)的特色，人們仰慕那些有錢人 ，甚至也仰慕穿名牌衣服的人。", "金錢對人的誘惑力是如此之大，它可以毀滅人們對崇高價值的各種寶貴感受 ，它幾乎可以毀滅任何價值。例如一個(原本)不錯、可親的人，那天他以不正當的手法獲得了一大筆錢，他可能變成一個不理會父母、兄弟姊妹的人。所以可以這麼說，拉希什米此時變成一個負面(bhoot)，所有拉希什米的祝福都變成對你的品格、尊嚴的挑戰。", "拉希什米普祭並非表示你來崇拜金錢，金錢(其實)是最危險的東西，它是拉希什米女神隱藏的武器。假如你誤用她所帶來的金錢，那麼拉希什米會用金錢給你一拳，假如你還未清醒，她會再給你另一拳。然後她可能(試著)扭轉你，試各種方法來說服你，告訴你目前所做的是毫無意義的。(假如你仍執迷不悟)，最後她會睜著眼睛看你被徹底毀滅。所以拉希什米雖然是恩惠的施予者，是各種財物的給與者，但是你不應當被她屬於大幻相的特質所誤導，要非常小心。", "註一：譯者：\"幻相\"在此句開玩笑的話語中，可能有\"試煉\"的含義。 註二： 1997-11-02。"]}, {"num": "9-11", "catTitle": "臍輪，幻海", "catNum": 9, "title": "錫呂毗濕奴與正法及平衡", "paragraphs": ["錫呂毗濕奴(Shri Vishnu，註一)是這個宇宙的維持與保護者(preserver)。當這整個世界被創造時，也必須創造一位維護者，因為假如完全讓這個世界自行運作，而沒有一位維護者，那麼這個世界可能會被毁壞。(我們只需)考量人類的行事方式，人們是可能對這個世界做任何(破壞的)事。", "錫呂毗濕奴不只是維護者，祂也是唯一真正有降世的神祇(incarnation)。當然梵天婆羅摩(Brahmadeva)亦降世過(一、二次)。在人類的演化過程，錫呂毗濕奴以不同的面貌(forms)(降世)，祂以不同的方式來到這個地球。祂也在祂周圍創造出許多偉大的先知(prophets)，所以他們可以來維護這宇宙的正法(dharma)。", "祂所要維護的根本是正法，正法是靈性生命中最重要的基石，而在正法中正是要建立(人的)平衡(balance)，(因為)人類有一種特性，即在各種事物中都會走向極端，所以祂在人類的内在創造出一個平衡。可以說正法的第一個原理即是產生出平衡。", "假如一個人没有平衡，那麼他將無法獲致昇進(註二)，這個道理很簡單，就如同你的飛機(左右)不平衡，那如何飛上天空呢？船也一樣，(左右)不平衡的船是無法航行的。同樣地，人們首先必須要先達到(左右)平衡。", "註一：錫呂毗濕奴是駐在臍輪的神祇，此譯文談及臍輪的一個重點。 註二：Shri Mataji 在許多談話中都提過：幻海的十大宗師所談的都是正法，目的就是要協助人類獲致平衡，而就平衡就是為下一步做準備，即為中脈的昇進及自覺做準備。 註三： 1994-08-28。"]}, {"num": "9-12", "catTitle": "臍輪，幻海", "catNum": 9, "title": "最偉大的導師", "paragraphs": ["今天我們來慶祝導師普祭，我們所擁有的最偉大的導師(the greatest Guru)是\"愛\"------自然而然的愛(Sahaj love)，它是我們內在的導師，它會教導我們、以各種方式來引導我們，這內在的愛會帶領我們到真正的領會與理解。這一部分我們不必到任何大學或任何學校去學習，它是我們內在非常重要的一部分，它會自行來運作及表現它自己，就像光一樣表現出來。我們可以辨識出這種(內在有愛的)人，因為他們是完全被喚醒、點亮的人。他們散發出光，且經由這光來看整個世界，在他們的眼中，這世界是非常純真且單純的。", "註一： 2004-07-04。"]}, {"num": "9-13", "catTitle": "臍輪，幻海", "catNum": 9, "title": "摩訶拉希什米的力量與水的力量", "paragraphs": ["***說明：**在這個光明節普祭談話的中間，錫呂瑪塔吉從水的特性來談一個已得到摩訶拉希什米原理的人會有那些力量。摩訶拉希什米原理是屬於臍輪，而臍輪的元素就是水，所以從水的特性可以知道一個有摩訶拉希什米原理的人會有那些力量。*", "**譯文：**", "什麼是你內在 \"摩訶拉希什米原理\"(Mahalakshmi Principle)的力量呢？所謂力量是指你可以用這個力量來做一些事。", "首先，你有潔淨(purify)(他人)的能力。你是如何治療他人呢？是靠著潔淨對方吧！試著想你是如何潔淨對方？你是藉著談話來潔淨對方；藉著用手來接觸對方，你可以潔淨對方；藉著看著對方，你也可以潔淨對方。一個自覺的靈可以潔淨整個場域的氛圍。", "再來，(猶如水可以讓人解渴)，這個力量會消除靈性的飢渴，你有能力消解(quench)人們對靈性追求的渴望。這是一個很大的力量！因為一旦你給人自覺，這個人累世的追求就宣告結束了！", "另一個力量是什麼呢？你只需想想水！你可以滋養(nourish)他人。經由你的力量你可以給人們靈性的滋養，甚至你只是站在這裡，也會滋養他人。", "再來，正如水是一個溶劑，你可以消融(dissolve)人們的自我(ego)及非我(superego)，在得到自覺之後你就擁有這個能力。", "再者，你變成一個冷靜的人，你的人格特質變成冷靜(cool)，你有冷卻安定他人的效用，(猶如水一般。)", "另外一個是非常不凡的特質，即水可以散佈成最小的分子，可以抵達根部，它從根部進入。所以擁有摩訶拉希什米力量的你，可以知道每個人的深處根部，你可以知道他的問題是來自何處，你直搗這核心。事實上這就是覺知及智力受到啟發，所以你知道問題在那裡。可以說你(的覺知)如水一般擴散接近根部，然後輕易滲透進入(問題的)根部。譬如當你坐在某人旁邊，然後你告訴我：\"錫呂瑪塔吉，這個人就是背部有感染，他自己都不知道\"。你的覺知已滲入這個人內部，但他不知道。你已經滲透進入這個人，並感知最深處的問題之所在。覺知的水已流入這個人，這個神聖的水流入這個人，而且阻礙之處已被這個神聖的水所感知！ 所以你能知道這裡有感染、那裡有感染。這就是散佈滲透 (permeate)的力量。", "另一個(特性)就是水的閃耀(glisten)，所以得到自覺後，你的皮膚開始閃閃發亮，你的皮膚變成非常容光煥發。", "另一個重要的特性是反射(reflection)。一個看到你的人，(可能)從你身上看到他們自己的反射，有時他會嚇一跳。對我而言這時常發生，我其實不會有什麼惡意，但人們常不由自主的被我嚇到，因為他們看到了自己的影子。所以當他們看到得到自覺的你，他們也可能看到自己的影子。他們可能變得非常有攻擊性、對你非常不友善，只因為他們看到自己的影子。假如你是如同清澈的水，那麼你就可以看到他人的深處。假如你是一個清澈的瑜伽士，你就可以清楚地感覺 (他人)內在深處，你可以看透這個人的靈性。以上這些都是水的特質。.......", "水的力量也有其他的型態。當(淚)水從你的眼睛流出來，它表示你的慈悲、你的愛或你的情感。水是五個元素中唯一可以表現情感的，這也是一種水的力量。", "水也有其他的特質，物理學家知道水會形成水壓，即水會產生一種壓力。當一個霎哈嘉瑜伽士在場，毫無疑問會給其他人一種壓力，並不是他會咄咄逼人，而是會對其他人產生一種壓力。假如對方接受這種壓力，那麼他會從這位瑜伽士獲得一些益處。假如他不願意接收，那麼他會感覺被壓迫，或有一點被主導。......", "水是非常神聖的，在普祭中我們特別用這個東西(註：Shri Mataji手指旁邊的水瓶)來尊崇昆達里尼，這是表示昆達里尼是水瓶或水瓶座(Aquarius)時代的承載器。現在正是水瓶座的時代，所以水是非常重要的，而且水是上天神聖的愛(Divine Love)的承載器，也是最佳的承載器。現在正是水瓶座的時代，這正意味著昆達里尼是由神聖的水所構成的。", "註一： 1981-11-01。"]}, {"num": "10-1", "catTitle": "心輪", "catNum": 10, "title": "慈悲(Compassion)", "paragraphs": ["有一個故事是有關住在印度Maharashtra 的一個聖人。在那個時代人們用一種叫Kavad的容器來裝水，然後一路千里迢迢將水帶到Gujarat這地方，將水獻給供奉錫呂克里希納(Shri Krishna)的寺廟。這種(像朝山的)儀式被視為對錫呂克里希納很大的尊敬與順服(surrendering)。那個聖人也和一般人一樣用Kavad裝水，從Maharashtra 他住的村莊走了一個月才抵達寺廟的山腳下。在山腳下他看到一隻非常口渴、快要渴死的驢子，他就將水給驢子喝。", "旁人都說：\" 哇！你帶著水走了許多天，走了這麼多里路，就是為了將水獻給這山上的神祇，而現在你卻將水給的這隻驢子喝。\"", "他回答說：\"你們不知道神特地從山上下來接受我的水嗎？祂不希望我走上山去！\"", "你看，這就是聖人行事的態度，對一個已得到自覺的人，他的慈悲心應該要像這樣，有十分慷慨的本質。假如你不慷慨、表現出很吝嗇、總是擔心你的錢、總是想節省錢，那麼你不是一個成熟的霎哈嘉練習者，絕對不是！而且這些錢也不可能帶給你任何快樂。吝嗇是完全和靈(Spirit)的本質相反的，靈是非常慷慨大方的，它絕不會儘量去節省東西，或去欺騙他人，或去偷東西，這是毫無疑問的，因為這種人已無任何殘留的貪念(greed)。因為完全沒有任何貪念，所以這種自覺的靈不會有貪婪的行為，也會變得十分慷慨。", "註一： 2000-08-20，也參考1995-07-16。"]}, {"num": "10-2", "catTitle": "心輪", "catNum": 10, "title": "一個有關慈悲(Compassion)的故事", "paragraphs": ["練習者問: 請告訴我們, 如何來發展我們的慈悲關愛之心(compassion) ?", "Shri Mataji : 我來告訴你們一個我和 Gagangarh Maharaj 的故事. Gagangarh Maharaj 住在一個小山上, 他並不接見外人. 他是一個脾氣爆躁的知名修行者. 當我要去拜訪他時, 每一個練習者都問我: 為什麼要去見這位導師(Guru) ? 我答道: 我要去了解他的能量(vibration).", "我們沿著山路一直往上走, 當時雨勢非常大. 他是一位有非凡神力的修行者, 他也知道我要去拜訪. 停止這場大雨, 對他而言應不難, 但是傾盆大雨卻繼續不斷. 當我們抵達山洞時, 我全身都濕透了. 他坐在一個石頭上, 看起來非常生氣. 我對他笑笑, 坐了下來。", "過了一會兒, 他才轉身問我：", "\" Shri Mataji, 您為什麼不容許我讓這場大雨暫停呢 ? 您是為了消除我的自我(ego)嗎 ? \"", "我答道: \"不 ! 不 ! 我並未那樣做.\"", "他說: \"那您為何不停止那場大雨呢 ? 為什麼不容許我讓大雨暫停呢 ? 您看, 您全身都濕透了! \"", "我答道: \"我知道你是一位sanyasi (註一), 我也知道你為了我, 你早已買了一件莎麗. 但是我如何能接受 sanyasi 送我禮物呢 (註二) ? 這大雨弄溼我全身, 正好給我最佳的藉口來接受你的餽贈 ! \"", "說罷, 他怒氣全消, 俯身在我足下, 號啕大哭道 : \"Shri Mataji ! 這是何等的愛 ! \"", "我接著說: \"其實還有另一個理由. 這些雨水流經我的身體, 又流到這山上的每一寸土地, 明天你將可以享受滿山的青翠 ! 這是我帶給你的禮物.
